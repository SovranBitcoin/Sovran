plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}
// Vendored bitchat-android models use @Parcelize.
apply plugin: 'kotlin-parcelize'

group = 'expo.modules.bitchat'
version = '1.0.0'

android {
  namespace "expo.modules.bitchat"
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
    // bitchat-android floor: "API 26 for proper BLE support"
    // (BitChatVendor/gradle/libs.versions.toml)
    minSdkVersion 26
  }
  sourceSets {
    main {
      // Generated by scripts/sync-bitchat-android.js (postinstall) from the
      // BitChatVendor submodule. Gitignored — never edit in place.
      java.srcDirs += "${projectDir}/vendor-src"
      assets.srcDirs += "${projectDir}/vendor-assets"
    }
  }
  kotlinOptions {
    // Vendored sources use stdlib toHexString(), stable in the vendor's
    // Kotlin 2.2 but still experimental in the Expo toolchain's Kotlin.
    freeCompilerArgs += '-opt-in=kotlin.ExperimentalStdlibApi'
  }
}

// Versions match BitChatVendor/gradle/libs.versions.toml at the pinned commit.
dependencies {
  implementation 'androidx.core:core-ktx:1.16.0'
  implementation 'androidx.lifecycle:lifecycle-process:2.8.7'
  implementation 'androidx.security:security-crypto:1.1.0-beta01'
  implementation 'com.google.code.gson:gson:2.13.1'
  // Ed25519 packet signing + secp256k1 (NostrCrypto Schnorr/ECDH). The vendor
  // pins bcprov-jdk15on:1.70, but expo-updates already ships
  // bcprov-jdk15to18 (a different artifactId Gradle cannot conflict-resolve,
  // so jdk15on would duplicate every class) — depend on the same artifact.
  implementation 'org.bouncycastle:bcprov-jdk15to18:1.81'
  // NIP-44 XChaCha20-Poly1305 (NostrCrypto).
  implementation 'com.google.crypto.tink:tink-android:1.10.0'
  // Nostr relay WebSockets. RN 0.83 ships OkHttp 4.12.x, so versions align.
  implementation 'com.squareup.okhttp3:okhttp:4.12.0'
  implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
}
