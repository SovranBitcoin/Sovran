<title>Sovran Payment Forms</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: one narrow column, a phone-width form. Light only, hairlines instead of cards; black is the only accent. */
:root {
  --bg: #FFFFFF;
  --surface: #FFFFFF;
  --fg: #111111;
  --muted: #7A7A7A;
  --line: #F0F0F0;
  --accent: #111111;
  --accent-ink: #FFFFFF;
  --accent-soft: #F4F4F4;
  --ok: #1F7A4D;
  --ok-soft: #F2F8F4;
  --warn: #8A6A12;
  --warn-soft: #FBF6E6;
  --bad: #B03A2E;
  --bad-soft: #FBF1EF;
  --plane: #3B5A8C;
  --plane-soft: #F1F4F9;
  --f-display: "Geist", "Helvetica Neue", Arial, sans-serif;
  --f-body: "Geist", "Helvetica Neue", Arial, sans-serif;
  --f-mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r: 10px;
  color-scheme: light;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font: 15px/1.5 var(--f-body); }
.wrap { max-width: 560px; margin: 0 auto; padding-inline: 16px; padding-block: 20px 60px; display: grid; gap: 18px; }
h1 { font: 500 1.5rem/1.2 var(--f-display); margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
.wrap > * { min-width: 0; }
.lede { color: var(--muted); margin: 4px 0 0; max-width: 60ch; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }

/* top bar */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 12px; display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.seg { display: inline-flex; background: var(--accent-soft); border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
.seg button { font: 500 0.9rem var(--f-body); border: 0; background: transparent; color: var(--muted); padding: 7px 16px; border-radius: 999px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--fg); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
.plane { display: inline-flex; align-items: center; gap: 10px; cursor: pointer; font-weight: 500; font-size: 0.9rem; }
.plane input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.track { width: 46px; height: 26px; border-radius: 999px; background: var(--line); position: relative; transition: background .2s; }
.track::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: var(--surface); box-shadow: 0 1px 2px rgba(0,0,0,.25); transition: transform .2s; }
.plane input:checked + .track { background: var(--plane); }
.plane input:checked + .track::after { transform: translateX(20px); }
.plane input:focus-visible + .track { outline: 2px solid var(--accent); outline-offset: 2px; }
.netline { font-size: 0.82rem; color: var(--muted); display: flex; gap: 6px; align-items: center; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); }
body.offline .dot { background: var(--plane); }
.offline-note { display: none; background: var(--plane-soft); color: var(--plane); border-radius: var(--r); padding: 10px 14px; font-size: 0.9rem; }
body.offline .offline-note { display: block; }

/* steps */
ol.steps { list-style: none; margin: 0; padding: 0; display: grid; border-top: 1px solid var(--line); }
.step { border-bottom: 1px solid var(--line); }
.step[hidden] { display: none; }
.head { display: flex; align-items: center; gap: 12px; padding: 16px 0; width: 100%; background: none; border: 0; color: inherit; text-align: left; font: inherit; cursor: pointer; }
.head:disabled { cursor: default; }
.num { flex: none; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font: 500 0.72rem var(--f-mono); border: 1px solid var(--line); color: var(--muted); }
.step.active .num { border-color: var(--accent); color: var(--accent); }
.step.done .num { background: var(--fg); border-color: var(--fg); color: var(--bg); }
.htext { min-width: 0; flex: 1; display: grid; gap: 1px; }
.htitle, .hsum { display: block; }
.hsum:empty { display: none; }
.htitle { font: 500 1rem var(--f-display); }
.hsum { color: var(--muted); font-size: 0.88rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.edit { font-size: 0.82rem; color: var(--muted); }
.step:not(.done) .edit { display: none; }
.step.todo { opacity: 0.4; }
.body { padding: 0 0 20px 38px; display: none; gap: 14px; }
.step.active .body { display: grid; }
@media (max-width: 420px) { .body { padding-left: 16px; } }
.q { font-size: 0.9rem; color: var(--muted); margin: 0; }

/* amount */
.amount { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.amount input { font: 400 2.6rem/1 var(--f-mono); width: 100%; max-width: 11ch; border: 0; border-bottom: 2px solid var(--line); background: transparent; color: var(--fg); padding: 4px 0; font-variant-numeric: tabular-nums; }
.amount input:focus { outline: none; border-color: var(--accent); }
.unitseg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.unitseg button { border: 0; background: transparent; color: var(--muted); font: 600 0.85rem var(--f-mono); padding: 6px 12px; cursor: pointer; }
.unitseg button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
.conv { color: var(--muted); font-size: 0.88rem; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1px solid var(--line); background: var(--surface); color: var(--fg); border-radius: 999px; padding: 6px 12px; font: 400 0.85rem var(--f-body); cursor: pointer; }
.chip:hover { border-color: var(--accent); }
.chip small { color: var(--muted); font-family: var(--f-mono); }

/* choice cards */
.choices { display: grid; gap: 8px; }
.choice { display: flex; gap: 12px; align-items: flex-start; border: 1px solid var(--line); border-radius: var(--r); padding: 12px; cursor: pointer; background: var(--surface); }
.choice input { margin-top: 3px; accent-color: var(--accent); }
.choice:has(input:checked) { border-color: var(--accent); }
.choice:has(input:disabled) { cursor: not-allowed; opacity: 0.5; }
.choice.caution:has(input:not(:disabled)) { background: var(--warn-soft); border-color: var(--warn); }
.ctext { min-width: 0; display: grid; gap: 3px; }
.ctitle, .cdesc, .why { display: block; }
.ctitle { font-weight: 600; }
.cdesc { color: var(--muted); font-size: 0.86rem; }
.why { font-size: 0.82rem; color: var(--plane); font-weight: 500; }
.tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
.tag { font-size: 0.72rem; padding: 1px 7px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
.tag.good { color: var(--ok); border-color: var(--ok-soft); background: var(--ok-soft); }
.badge { font: 500 0.72rem var(--f-mono); padding: 2px 7px; border-radius: 999px; background: var(--ok-soft); color: var(--ok); margin-left: 6px; letter-spacing: .02em; }
.badge.down { background: var(--bad-soft); color: var(--bad); }

/* verdict panel */
.verdict { border-radius: 12px; padding: 12px 14px; font-size: 0.9rem; display: grid; gap: 8px; }
.verdict.ok { background: var(--ok-soft); color: var(--ok); }
.verdict.round { background: var(--warn-soft); color: var(--warn); }
.verdict.no { background: var(--bad-soft); color: var(--bad); }
.verdict .chips .chip { background: var(--surface); }

/* slider */
.slider { display: grid; gap: 6px; }
.slider input[type=range] { width: 100%; accent-color: var(--accent); }
.ticks { display: grid; grid-template-columns: repeat(6, 1fr); font-size: 0.72rem; color: var(--muted); text-align: center; }
.ticks span:first-child { text-align: left; } .ticks span:last-child { text-align: right; }
.lockout { font-weight: 600; }
fieldset { border: 0; margin: 0; padding: 0; display: grid; gap: 8px; min-width: 0; }
fieldset:disabled { opacity: 0.5; }
legend { font-size: 0.9rem; color: var(--muted); padding: 0; margin-bottom: 8px; }
input[type=text], textarea { width: 100%; font: 400 0.95rem var(--f-body); color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
textarea { font-family: var(--f-mono); font-size: 0.8rem; min-height: 70px; resize: vertical; }
input[type=text]:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: transparent; }
.row { display: flex; justify-content: space-between; gap: 12px; font-size: 0.9rem; }
.row span:first-child { color: var(--muted); }
.review { display: grid; gap: 6px; border-top: 1px dashed var(--line); padding-top: 10px; }
.cta { justify-self: stretch; border: 0; background: var(--accent); color: var(--accent-ink); font: 500 1rem var(--f-display); padding: 14px 22px; border-radius: 999px; cursor: pointer; }
.cta:disabled { background: var(--line); color: var(--muted); cursor: not-allowed; }
.next { justify-self: start; border: 1px solid var(--line); background: transparent; color: var(--fg); font: 600 0.9rem var(--f-body); padding: 8px 16px; border-radius: 10px; cursor: pointer; }
.next:disabled { opacity: .4; cursor: not-allowed; }
button:focus-visible, .choice:focus-within, .chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.done-msg { background: var(--ok-soft); color: var(--ok); padding: 12px 14px; border-radius: 12px; font-weight: 500; }
footer { color: var(--muted); font-size: 0.82rem; display: grid; gap: 6px; }
footer b { color: var(--fg); font-weight: 600; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
.switch select { font: 400 0.85rem var(--f-body); color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 4px 8px; max-width: 55%; }
/* From/Into mint control */
.mintpill { display: flex; align-items: center; gap: 8px; }
.mintpill .chip { display: inline-flex; align-items: center; gap: 6px; font-family: var(--f-mono); font-size: 0.8rem; }
.dd-opt:disabled { opacity: .45; cursor: not-allowed; }
.dd-opt[aria-selected="true"] { background: var(--accent-soft); }
/* Receipt: one column, hairlines, the amount is the only large type */
.receipt { display: grid; gap: 16px; }
.r-head { display: flex; gap: 12px; align-items: center; min-width: 0; }
.r-ic { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; border: 1px solid var(--line); flex: none; }
.r-who { display: grid; min-width: 0; }
.r-who b { font: 500 1.05rem var(--f-display); }
.r-sub { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.r-amt { font: 400 1rem var(--f-body); color: var(--muted); display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.r-amt .mono { font-size: 2.4rem; color: var(--fg); line-height: 1; }
.timeline { list-style: none; margin: 0; padding: 0 0 0 18px; display: grid; gap: 12px; position: relative; }
.timeline::before { content: ""; position: absolute; left: 4px; top: 6px; bottom: 6px; width: 1px; background: var(--line); }
.timeline li { display: grid; gap: 1px; position: relative; }
.timeline li::before { content: ""; position: absolute; left: -18px; top: 5px; width: 9px; height: 9px; border-radius: 50%; background: var(--bg); border: 1px solid var(--muted); }
.timeline li.done::before { background: var(--fg); border-color: var(--fg); }
.r-rows { margin: 0; border-top: 1px solid var(--line); }
.r-rows div { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 0.88rem; }
.r-rows dt { color: var(--muted); }
.r-rows dd { margin: 0; text-align: right; min-width: 0; overflow-wrap: anywhere; }
[hidden] { display: none !important; }
/* Timeline states: done (filled), active (ringed), fail (red), todo (muted, small) */
.tl-row { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
.timeline li.active::before { background: var(--bg); border: 2px solid var(--fg); width: 9px; height: 9px; left: -19px; top: 4px; }
.timeline li.fail::before { background: var(--bad); border-color: var(--bad); }
.timeline li.fail b { color: var(--bad); }
.timeline li.todo b { color: var(--muted); font-weight: 400; font-size: 0.9rem; }
.timeline li.todo::before { width: 7px; height: 7px; left: -17px; top: 6px; border-color: var(--line); }
.tl-act { justify-self: start; margin-top: 4px; }
.tl-demo { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding-top: 4px; border-top: 1px dashed var(--line); }
/* "Get paid by" tiles: a way per tile, with where it comes from or why it's off */
.tiles.method-tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.tile .sub { font: 400 0.72rem var(--f-body); color: var(--muted); line-height: 1.3; }
.tile:disabled { opacity: .45; cursor: not-allowed; }
/* Lock control: switch, then a segmented take-back period */
.lockbox { display: grid; gap: 8px; padding: 12px; border: 1px solid var(--line); border-radius: var(--r); }
.lock-head { display: flex; gap: 8px; align-items: center; font-size: 0.9rem; }
.lockseg-wrap { display: grid; gap: 6px; }
.lockseg { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 2px; padding: 3px; background: var(--accent-soft); border: 1px solid var(--line); border-radius: 999px; }
.lockseg button { border: 0; background: transparent; color: var(--muted); font: 500 0.8rem var(--f-mono); padding: 7px 0; border-radius: 999px; cursor: pointer; }
.lockseg button[aria-checked="true"] { background: var(--surface); color: var(--fg); box-shadow: 0 1px 2px rgba(0,0,0,.1); }
.lockseg button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
/* Token placeholder (same size as the QR) and the spent state */
.qr.qr-wait { background: repeating-linear-gradient(45deg, var(--accent-soft) 0 8px, var(--bg) 8px 16px); border-style: dashed; }
.token-spent { display: flex; gap: 8px; align-items: center; font-size: 0.88rem; color: var(--muted); padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--r); }
/* Balance cards are buttons: tap to make a mint primary */
button.bal { text-align: left; font: inherit; color: inherit; background: var(--surface); cursor: pointer; position: relative; }
button.bal[aria-pressed="true"] { border-color: var(--fg); box-shadow: inset 0 0 0 1px var(--fg); }
button.bal:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.bal-tag { font: 500 0.68rem var(--f-mono); color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
button.bal[aria-pressed="true"] .bal-tag { color: var(--fg); }
/* Top bar: settings (left), title, research (right) */
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.topbar h1 { font-size: 1.05rem; text-align: center; flex: 1; }
.iconbtn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-width: 40px; height: 40px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); border-radius: 999px; padding: 0 14px; font: 500 0.85rem var(--f-body); cursor: pointer; }
.iconbtn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
/* Sheets: settings slide in from the left, research from the right */
.sheet { position: fixed; inset: 0; z-index: 30; background: rgba(0, 0, 0, .28); display: flex; }
.sheet-panel { background: var(--bg); color: var(--fg); height: 100%; overflow: auto; padding: 0 16px 32px; display: grid; gap: 20px; align-content: start; width: min(440px, 100%); box-shadow: 0 0 40px rgba(0, 0, 0, .18); }
.sheet-panel.right { margin-left: auto; width: min(880px, 100%); }
.sheet-head { position: sticky; top: 0; z-index: 1; background: var(--bg); display: flex; justify-content: space-between; align-items: center; padding: 14px 0 10px; border-bottom: 1px solid var(--line); }
.sheet-head h2 { margin: 0; font: 500 1.05rem var(--f-display); }
/* Theme picker */
.themes { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.themes button { display: grid; justify-items: start; gap: 8px; padding: 10px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); color: var(--fg); font: 500 0.85rem var(--f-body); cursor: pointer; }
.themes button[aria-checked="true"] { border-color: var(--fg); box-shadow: inset 0 0 0 1px var(--fg); }
.sw { display: flex; gap: 4px; }
.sw i { width: 16px; height: 16px; border-radius: 50%; border: 1px solid rgba(127, 127, 127, .35); }
.sw i:nth-child(1) { background: var(--s1); } .sw i:nth-child(2) { background: var(--s2); } .sw i:nth-child(3) { background: var(--s3); }
.theme-paper { --s1: #FFFFFF; --s2: #111111; --s3: #3B5A8C; } .theme-ink { --s1: #0F0F10; --s2: #EDEDED; --s3: #86A3D9; }
.theme-sand { --s1: #F6F1E7; --s2: #2B2620; --s3: #8A5A2B; } .theme-sage { --s1: #F3F5F1; --s2: #1F2A22; --s3: #2F5D46; }
.theme-slate { --s1: #F4F6F9; --s2: #16202C; --s3: #1F3A5F; } .theme-dusk { --s1: #17141A; --s2: #EEE8F0; --s3: #E9C7A0; }
/* Themes: same tokens, different palettes */
:root[data-theme="ink"] { color-scheme: dark; --bg: #0F0F10; --surface: #17171A; --fg: #EDEDED; --muted: #8E8E93; --line: #232326; --accent: #EDEDED; --accent-ink: #0F0F10; --accent-soft: #1E1E22; --ok: #5FBF8A; --ok-soft: #14261C; --warn: #D6B04C; --warn-soft: #2A2414; --bad: #E26D5C; --bad-soft: #2B1714; --plane: #86A3D9; --plane-soft: #172031; }
:root[data-theme="sand"] { --bg: #F6F1E7; --surface: #FBF8F2; --fg: #2B2620; --muted: #857B6E; --line: #ECE5D7; --accent: #2B2620; --accent-ink: #FBF8F2; --accent-soft: #EFE7D8; --plane: #8A5A2B; --plane-soft: #F1E6D6; --ok-soft: #EEF2E6; --warn-soft: #F6EDD6; --bad-soft: #F6E6E1; }
:root[data-theme="sage"] { --bg: #F3F5F1; --surface: #FAFBF8; --fg: #1F2A22; --muted: #6F7B72; --line: #E6EAE3; --accent: #2F5D46; --accent-ink: #FFFFFF; --accent-soft: #E6ECE4; --plane: #2F5D46; --plane-soft: #E3EDE6; }
:root[data-theme="slate"] { --bg: #F4F6F9; --surface: #FFFFFF; --fg: #16202C; --muted: #6B7686; --line: #E9EDF2; --accent: #1F3A5F; --accent-ink: #FFFFFF; --accent-soft: #EAEFF5; --plane: #1F3A5F; --plane-soft: #E8EEF6; }
:root[data-theme="dusk"] { color-scheme: dark; --bg: #17141A; --surface: #1F1B23; --fg: #EEE8F0; --muted: #9A90A3; --line: #27222C; --accent: #E9C7A0; --accent-ink: #17141A; --accent-soft: #26212B; --ok: #7FC7A0; --ok-soft: #17281F; --warn: #E3BE6C; --warn-soft: #2B2415; --bad: #EE8272; --bad-soft: #2E1A18; --plane: #C9A6E8; --plane-soft: #241D2E; }
/* Tap to receive: a quiet row on the QR step; armed shows a soft pulse */
.tapbox { display: flex; gap: 12px; align-items: center; padding: 12px; border: 1px solid var(--line); border-radius: var(--r); }
.tap-ic { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; border: 1px solid var(--line); flex: none; }
.tapbox.armed .tap-ic { border-color: var(--fg); animation: tap-pulse 1.8s ease-out infinite; }
@keyframes tap-pulse { 0% { box-shadow: 0 0 0 0 rgba(127,127,127,.35); } 100% { box-shadow: 0 0 0 12px rgba(127,127,127,0); } }
@media (prefers-reduced-motion: reduce) { .tapbox.armed .tap-ic { animation: none; } }
.tap-text { display: grid; gap: 2px; flex: 1; min-width: 0; }
/* Scan button between Receive and Send */
.flow .bigtabs { grid-template-columns: 1fr auto 1fr; align-items: stretch; }
.scanbtn { width: 58px; border-radius: 14px; border: 1px solid var(--fg); background: var(--fg); color: var(--bg); display: grid; place-items: center; cursor: pointer; }
.scanbtn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
/* Scanner sheet: full height from the bottom */
.sheet-panel.scan { margin: 0 auto; width: min(560px, 100%); }
.viewfinder { position: relative; height: min(72vw, 320px); border-radius: 16px; background: #0b0b0c; display: grid; place-items: end center; padding: 16px; overflow: hidden; }
.viewfinder .hint { color: #bdbdbd; text-align: center; }
.vf-corners { position: absolute; inset: 22%; border-radius: 12px; background:
  linear-gradient(#fff, #fff) left top / 24px 2px no-repeat, linear-gradient(#fff, #fff) left top / 2px 24px no-repeat,
  linear-gradient(#fff, #fff) right top / 24px 2px no-repeat, linear-gradient(#fff, #fff) right top / 2px 24px no-repeat,
  linear-gradient(#fff, #fff) left bottom / 24px 2px no-repeat, linear-gradient(#fff, #fff) left bottom / 2px 24px no-repeat,
  linear-gradient(#fff, #fff) right bottom / 24px 2px no-repeat, linear-gradient(#fff, #fff) right bottom / 2px 24px no-repeat; }
.scan-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.scan-actions .iconbtn { height: 48px; }
.scan-examples { display: grid; gap: 8px; }
.scan-examples h2 { margin: 0; font-size: 0.82rem; font-weight: 500; }
/* Edit sits inside the summary card */
.mini .mini-edit { margin-left: auto; display: inline-flex; gap: 4px; align-items: center; font-size: 0.8rem; color: var(--muted); flex: none; }
.head:hover .mini .mini-edit { color: var(--fg); }
/* Picker headers with a close button */
.dd-head, .sim-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 4px 6px 6px; }
.x { border: 0; background: transparent; color: var(--muted); font-size: 0.95rem; width: 32px; height: 32px; border-radius: 50%; cursor: pointer; }
.x:hover { background: var(--accent-soft); color: var(--fg); }
/* Simulate panel: rows with switches, Done */
#nav-more { gap: 6px; font-size: 0.85rem; }
.simmenu { width: min(340px, calc(100vw - 32px)); }
.simmenu button[role="menuitemcheckbox"] { align-items: center; }
.mini-switch { width: 34px; height: 20px; border-radius: 999px; background: var(--line); position: relative; flex: none; transition: background .15s; }
.mini-switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: var(--surface); box-shadow: 0 1px 2px rgba(0,0,0,.25); transition: transform .15s; }
.simmenu button[aria-checked="true"] .mini-switch { background: var(--bad); }
.simmenu button[aria-checked="true"] .mini-switch::after { transform: translateX(14px); }
.sim-foot { display: flex; justify-content: space-between; padding: 6px; border-top: 1px solid var(--line); margin-top: 4px; }
@media (max-width: 520px) { #nav-more .sim-label { display: none; } }
/* Scanner sources: Camera / Paste / Photos */
.srcseg { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 2px; padding: 3px; background: var(--accent-soft); border-radius: 999px; }
.srcseg button { display: inline-flex; gap: 6px; align-items: center; justify-content: center; border: 0; background: transparent; color: var(--muted); font: 500 0.85rem var(--f-body); padding: 9px 0; border-radius: 999px; cursor: pointer; }
.srcseg button[aria-selected="true"] { background: var(--surface); color: var(--fg); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
.chip.wide.real { background: var(--tint); font-weight: 500; }
.chip.wide.fails-ex { color: var(--muted); }
#scan-msg:not(:empty) { padding: 10px 12px; border-radius: var(--r); background: var(--warn-soft); color: var(--warn); }
