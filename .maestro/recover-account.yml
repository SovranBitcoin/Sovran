- inputText: 'mirror'
- tapOn: 'Next'
- inputText: 'banner'
- tapOn: 'Next'
- inputText: 'attend'
- tapOn: 'Next'
- inputText: 'desert'
- tapOn: 'Next'
- inputText: 'cannon'
- tapOn: 'Next'
