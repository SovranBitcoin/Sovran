appId: com.sovranbitcoin
---
- launchApp

- runFlow:
    file: terms.yml

- startRecording:
    path: './.maestro/onboarding/create-account-video'
    label: 'Onboarding'

- assertVisible: 'Welcome to'
- assertVisible: 'Sovran'
- takeScreenshot:
    path: './.maestro/onboarding/create-account-step_1'
- tapOn: 'Next'

- assertVisible: 'BITCOIN THAT'
- assertVisible: 'FEELS LIKE CASH'
- takeScreenshot:
    path: './.maestro/onboarding/create-account-step_2'
- tapOn: 'Next'

- assertVisible: 'POWERED BY'
- assertVisible: 'NOSTR'
- takeScreenshot:
    path: './.maestro/onboarding/create-account-step_3'
- tapOn: 'Next'

- assertVisible: 'Create Sovran Profile'
- tapOn: 'Your public profile name'
- takeScreenshot:
    path: './.maestro/onboarding/create-account-step_4'
- inputText: 'Test'
- hideKeyboard
- takeScreenshot:
    path: './.maestro/onboarding/create-account-step_5'
- tapOn: 'Create Sovran Account'
- takeScreenshot:
    path: './.maestro/onboarding/create-account-step_6'

- assertVisible: 'Your Recovery Phrase'
- copyTextFrom:
    id: 'mnemonic-word-2'
- evalScript: ${output.word2 = maestro.copiedText}
- copyTextFrom:
    id: 'mnemonic-word-5'
- evalScript: ${output.word5 = maestro.copiedText}
- copyTextFrom:
    id: 'mnemonic-word-11'
- evalScript: ${output.word11 = maestro.copiedText}
- takeScreenshot:
    path: './.maestro/onboarding/create-account-step_5'
- tapOn: "I've written it down"
- takeScreenshot:
    path: './.maestro/onboarding/create-account-step_6'
- tapOn: "Yes, I've written it down"

- assertVisible: 'Verify your Recovery Phrase'
- tapOn: 'Enter word 3'
- inputText: ${output.word2}
- tapOn: 'Next'
- inputText: ${output.word5}
- tapOn: 'Next'
- inputText: ${output.word11}
- hideKeyboard
- takeScreenshot:
    path: './.maestro/onboarding/create-account-step_7'
- tapOn: 'Verify'
- takeScreenshot:
    path: './.maestro/onboarding/create-account-step_8'
- tapOn: 'Continue'

- assertVisible: 'Processing'
- assertVisible: 'Profile'
- takeScreenshot:
    path: './.maestro/onboarding/create-account-step_9'

- assertVisible: 'Add Mint'
- takeScreenshot:
    path: './.maestro/onboarding/create-account-step_10'
- tapOn:
    id: 'add-mint'
- takeScreenshot:
    path: './.maestro/onboarding/create-account-step_11'
- tapOn:
    id: 'add-mint-item-0'
- takeScreenshot:
    path: './.maestro/onboarding/create-account-step_12'
- tapOn:
    id: 'save-mints'

- assertVisible: 'Profile'
- takeScreenshot:
    path: './.maestro/onboarding/create-account-step_13'

- assertVisible: 'Loading sat...'
- takeScreenshot:
    path: './.maestro/onboarding/create-account-step_14'

- assertVisible: 'Complete'
- takeScreenshot:
    path: './.maestro/onboarding/create-account-step_15'
- tapOn: 'Complete'

- assertVisible: 'BTC'
- assertVisible: '0'
- takeScreenshot:
    path: './.maestro/onboarding/create-account-step_16'

- stopRecording
