name: Setup Sovran
description: >-
  Bun setup + workspace install shared by the Sovran CI gate workflows.
  Installs the bun workspace at the repo root (app + wallet + nostr + docs),
  optionally refreshes external @sovranbitcoin/* packages, and caches the Bun
  store. Merge and release gates use the frozen lockfile by default.

# The repo is checked out at the runner root (no path nesting), so the workspace
# root package.json / bun.lock live at the working directory. Install runs here.
# The Tests and Type Check gates then run their root script, which fans out over
# every workspace package; the app-only gates (lint, styling, glass headers,
# React Compiler, React Doctor) run with working-directory: app.
inputs:
  github-token:
    description: Token used to auth the @sovranbitcoin/* GitHub Packages fetch.
    required: true
  refresh-sovran-externals:
    description: Resolve @sovranbitcoin/* dependencies to their latest published versions before install.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version-file: package.json

    # Warm download cache keyed on the workspace lockfile. deps:sovran-latest
    # re-resolves the external @sovranbitcoin/* packages so the lock can drift
    # between runs; the restore-keys fallback reuses cached tarballs otherwise.
    # v2: purges stores poisoned by patch-package writing through bun's Linux
    # hardlink backend into ~/.bun/install/cache (why installs below force
    # --backend=copyfile).
    - name: Cache Bun store
      uses: actions/cache@v4
      with:
        path: ~/.bun/install/cache
        key: bun-store-v2-${{ runner.os }}-${{ hashFiles('bun.lock') }}
        restore-keys: |
          bun-store-v2-${{ runner.os }}-

    # wallet/nostr are in-repo workspace packages (no publish). The remaining
    # externals — @cashu/coco-* from npm, @sovranbitcoin/schemas +
    # coco-cashu-plugin-p2pk-import from GitHub Packages — resolve here.
    # SOVRAN_CI_TOKEN carries cross-repo GitHub Packages read; GITHUB_TOKEN is
    # the fallback. Only explicit compatibility jobs refresh external versions.
    # --backend=copyfile (also inside deps:sovran-latest) keeps node_modules
    # files as real copies: bun's Linux default hardlinks them to the global
    # store, so postinstall patch-package writes mutate the cached copies and
    # actions/cache persists the patched state — the next run's pristine patch
    # then fails to apply whenever a patch file has since been regenerated.
    - name: Install workspace (latest Sovran externals)
      if: inputs.refresh-sovran-externals == 'true'
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: |
        bun run deps:sovran-latest
        bun install --backend=copyfile

    # Bundle measurements must describe the checked-out commit, not a moving
    # dependency publish that happened after its lockfile was written.
    - name: Install workspace (locked dependencies)
      if: inputs.refresh-sovran-externals != 'true'
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: bun install --frozen-lockfile --backend=copyfile
