name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  APP_DIR: app

jobs:
  code-quality:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout app
        uses: actions/checkout@v6

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      # Lint, Type Check, Knip, and React Compiler coverage each run in their own
      # workflow so the README can carry a status badge per check. This workflow
      # is named for its blocking gate: the test suite.
      # Prettier remains a non-blocking formatting signal.
      - name: Setup Sovran
        uses: ./.github/actions/setup-sovran
        with:
          github-token: ${{ secrets.SOVRAN_CI_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Prettier Check
        working-directory: ${{ env.APP_DIR }}
        continue-on-error: true
        run: bun run pretty:check

      # Runs at the repo ROOT, not in app/: `test` runs the harness first, then
      # every remaining workspace. Their subprocess-heavy suites must not compete
      # for the same test deadlines. Pinning this to app/ is what left
      # wallet's 1183 vitest tests and nostr's 259 — the payment engine and the
      # Nostr data layer — running nowhere on a push, so a change to either
      # could break every one of its own tests and still merge green.
      - name: Test
        run: bun run test

      - name: Release controller and archive tests
        run: bun run test:release

      - name: Claims and copy consistency
        run: bun run copy:lint

      - name: Rebuild size and dependency ratchet
        run: bun run rebuild:metrics

      - name: Native smoke & e2e helper tests
        working-directory: ${{ env.APP_DIR }}
        run: bun run e2e:test

      - name: Validate asset sources, geometry and generated exports
        run: |
          bun run assets:check
          bun run assets:test
          test -z "$(git status --porcelain --untracked-files=all -- app/assets/brand)"
