name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  APP_DIR: sovran-app

jobs:
  code-quality:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout app
        uses: actions/checkout@v6
        with:
          path: ${{ env.APP_DIR }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: ${{ env.APP_DIR }}/package.json

      # The gates run entirely against published packages — @cashu/coco-* from
      # npm, @sovranbitcoin/* from GitHub Packages. SOVRAN_CI_TOKEN carries
      # cross-repo GitHub Packages read; GITHUB_TOKEN is the fallback. (No
      # coco/colada/schemas source checkout: nothing links it.)
      #
      # `deps:sovran-latest` re-resolves the @sovranbitcoin/* packages to their
      # newest published versions before install, so CI always validates against
      # the latest colada/nagg-ts/schemas without a manual bump. This is a
      # deliberate trade of lockfile determinism for always-on compatibility
      # signal: a breaking publish can red CI with no code change here — that is
      # the early warning, by design.
      - name: Install dependencies (latest Sovran packages)
        working-directory: ${{ env.APP_DIR }}
        env:
          GITHUB_TOKEN: ${{ secrets.SOVRAN_CI_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          bun run deps:sovran-latest
          # --ignore-scripts: the token is needed only to AUTH the
          # @sovranbitcoin/* registry fetch, not to run lifecycle code, so no
          # package install script executes while the secret is in scope
          # (build-pipeline-secret-boundary).
          bun install --ignore-scripts

      # Run the deferred install scripts with NO secret in scope: trusted
      # dependency scripts (e.g. @shopify/react-native-skia's install-skia) via
      # `bun pm trust`, then the first-party postinstall (patch-package, bitchat
      # patching, local-sibling linking). None of these need the registry token.
      - name: Run install scripts (no secrets in scope)
        working-directory: ${{ env.APP_DIR }}
        run: |
          bun pm trust --all
          bun run postinstall

      - name: Lint
        working-directory: ${{ env.APP_DIR }}
        run: bun run lint

      - name: Type Check
        working-directory: ${{ env.APP_DIR }}
        run: bun run type-check

      - name: Prettier Check
        working-directory: ${{ env.APP_DIR }}
        run: bun run pretty:check

      - name: Knip
        working-directory: ${{ env.APP_DIR }}
        run: bun run knip

      - name: Test
        working-directory: ${{ env.APP_DIR }}
        run: bun run test

  # Non-blocking signal job: runs `codereview/analyze-structure` and posts
  # the LLM-friendly summary as a sticky PR comment. The signal mirrors
  # what `npm run analyze-structure` (or the `audit/fix` scripts) consume
  # locally — top complexity hotspots, shallow modules, pass-through
  # suspects, hub-spoke patterns, churn-weighted hotspots, type-safety
  # debt, etc. Continues on failure so the structural report never blocks
  # a merge — it's review-time signal, not a gate.
  structural-health:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      packages: read
      pull-requests: write
    steps:
      - name: Checkout app
        uses: actions/checkout@v6
        with:
          # Full history needed for `--history` (churn × complexity,
          # temporal coupling, stale-file signals).
          fetch-depth: 0
          path: ${{ env.APP_DIR }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: ${{ env.APP_DIR }}/package.json

      - name: Install dependencies (latest Sovran packages)
        working-directory: ${{ env.APP_DIR }}
        env:
          GITHUB_TOKEN: ${{ secrets.SOVRAN_CI_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          bun run deps:sovran-latest
          # --ignore-scripts: the token is needed only to AUTH the
          # @sovranbitcoin/* registry fetch, not to run lifecycle code, so no
          # package install script executes while the secret is in scope
          # (build-pipeline-secret-boundary).
          bun install --ignore-scripts

      # Run the deferred install scripts with NO secret in scope: trusted
      # dependency scripts (e.g. @shopify/react-native-skia's install-skia) via
      # `bun pm trust`, then the first-party postinstall (patch-package, bitchat
      # patching, local-sibling linking). None of these need the registry token.
      - name: Run install scripts (no secrets in scope)
        working-directory: ${{ env.APP_DIR }}
        run: |
          bun pm trust --all
          bun run postinstall

      - name: Run analyze-structure
        working-directory: ${{ env.APP_DIR }}
        continue-on-error: true
        run: |
          bun run codereview/analyze-structure/index.mjs --llm --history \
            > analyze-output.txt 2>&1 || true

      - name: Post structural-health comment on PR
        continue-on-error: true
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- structural-health -->';
            const output = fs.readFileSync(`${process.env.APP_DIR}/analyze-output.txt`, 'utf8');
            // GitHub comment max body: 65,536 chars. Truncate if needed.
            const MAX = 60_000;
            const truncated = output.length > MAX
              ? output.slice(0, MAX) + '\n\n…[truncated]'
              : output;
            const body = `${marker}\n## Structural health\n\n\`\`\`\n${truncated}\n\`\`\``;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
