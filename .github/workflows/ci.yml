name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  APP_DIR: sovran-app

jobs:
  code-quality:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout app
        uses: actions/checkout@v6
        with:
          path: ${{ env.APP_DIR }}

      # Lint, Type Check, Knip, and React Compiler coverage each run in their own
      # workflow (lint.yml / type-check.yml / knip.yml / react-compiler.yml) so
      # the README can carry a status badge per check. This job keeps the gates
      # that don't need a dedicated badge: Prettier and the test suite.
      #
      # Prettier + Test are non-blocking signal (continue-on-error): they still
      # run and their output is visible in the job logs, but a failure does not
      # fail the CI check — same philosophy as the structural-health job below.
      - name: Setup Sovran
        uses: ./sovran-app/.github/actions/setup-sovran
        with:
          app-dir: ${{ env.APP_DIR }}
          github-token: ${{ secrets.SOVRAN_CI_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Prettier Check
        working-directory: ${{ env.APP_DIR }}
        continue-on-error: true
        run: bun run pretty:check

      - name: Test
        working-directory: ${{ env.APP_DIR }}
        continue-on-error: true
        run: bun run test

  # Non-blocking signal job: runs `codereview/analyze-structure` and posts
  # the LLM-friendly summary as a sticky PR comment. The signal mirrors
  # what `npm run analyze-structure` (or the `audit/fix` scripts) consume
  # locally — top complexity hotspots, shallow modules, pass-through
  # suspects, hub-spoke patterns, churn-weighted hotspots, type-safety
  # debt, etc. Continues on failure so the structural report never blocks
  # a merge — it's review-time signal, not a gate.
  structural-health:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      packages: read
      pull-requests: write
    steps:
      - name: Checkout app
        uses: actions/checkout@v6
        with:
          # Full history needed for `--history` (churn × complexity,
          # temporal coupling, stale-file signals).
          fetch-depth: 0
          path: ${{ env.APP_DIR }}

      - name: Setup Sovran
        uses: ./sovran-app/.github/actions/setup-sovran
        with:
          app-dir: ${{ env.APP_DIR }}
          github-token: ${{ secrets.SOVRAN_CI_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Run analyze-structure
        working-directory: ${{ env.APP_DIR }}
        continue-on-error: true
        run: |
          bun run codereview/analyze-structure/index.mjs --llm --history \
            > analyze-output.txt 2>&1 || true

      - name: Post structural-health comment on PR
        continue-on-error: true
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- structural-health -->';
            const output = fs.readFileSync(`${process.env.APP_DIR}/analyze-output.txt`, 'utf8');
            // GitHub comment max body: 65,536 chars. Truncate if needed.
            const MAX = 60_000;
            const truncated = output.length > MAX
              ? output.slice(0, MAX) + '\n\n…[truncated]'
              : output;
            const body = `${marker}\n## Structural health\n\n\`\`\`\n${truncated}\n\`\`\``;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
