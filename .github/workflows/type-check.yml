name: Type Check

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  APP_DIR: app

jobs:
  type-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout app
        uses: actions/checkout@v6

      - name: Setup Sovran
        uses: ./.github/actions/setup-sovran
        with:
          github-token: ${{ secrets.SOVRAN_CI_TOKEN || secrets.GITHUB_TOKEN }}

      # Runs at the repo ROOT: `type-check` fans out over every workspace package
      # (`bun run --filter '*'`), so this covers app (both platform passes),
      # wallet and nostr rather than app alone.
      - name: Type Check
        run: bun run type-check
