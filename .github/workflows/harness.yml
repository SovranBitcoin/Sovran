name: Task harness

# Stacked PRs need this check too. No branch/path filter: a required check must
# report a result even when the candidate only changes its documentation.
on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  harness:
    name: Harness tests and types
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: harness/.node-version
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - name: Install tooling from the committed lockfile
        run: bun install --filter @sovran/task-harness --frozen-lockfile --ignore-scripts --backend=copyfile
      - name: Type check
        run: bun run --cwd harness type-check
      - name: Controller integration tests
        run: bun run --cwd harness test
