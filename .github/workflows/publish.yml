name: Publish to GitHub Packages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - name: Read version from package.json
        id: ver
        run: echo "version=$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"

      - name: Check if this version is already published
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER="${{ steps.ver.outputs.version }}"
          PUBLISHED=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            "https://npm.pkg.github.com/@sovranbitcoin/nagg-ts" \
            | jq -r --arg v "$VER" '.versions[$v].version // empty')
          if [ "$PUBLISHED" = "$VER" ]; then
            echo "::notice::v$VER already on the registry; nothing to do."
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.check.outputs.should_publish == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun install --frozen-lockfile

      - name: Type-check
        if: steps.check.outputs.should_publish == 'true'
        run: bun run type-check

      - name: Test
        if: steps.check.outputs.should_publish == 'true'
        run: bun run test

      - name: Publish to GitHub Packages
        if: steps.check.outputs.should_publish == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun publish

      - name: Create and push git tag
        if: steps.check.outputs.should_publish == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          TAG="v${{ steps.ver.outputs.version }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "tag $TAG already exists locally, skipping create"
          else
            git tag "$TAG"
          fi
          git push origin "$TAG" || echo "tag already on remote"
