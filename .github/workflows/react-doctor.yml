name: React Doctor

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  APP_DIR: sovran-app

jobs:
  react-doctor:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout app
        uses: actions/checkout@v6
        with:
          path: ${{ env.APP_DIR }}

      - name: Setup Sovran
        uses: ./sovran-app/.github/actions/setup-sovran
        with:
          app-dir: ${{ env.APP_DIR }}
          github-token: ${{ secrets.SOVRAN_CI_TOKEN || secrets.GITHUB_TOKEN }}

      # Informational, non-blocking: react-doctor surfaces patterns we *might* be
      # getting wrong, but it is false-positive-heavy on this codebase, so its
      # findings are review signal — never a merge gate. continue-on-error keeps
      # the workflow (and its badge) green; the full report ships as an artifact.
      - name: React Doctor
        id: react-doctor
        continue-on-error: true
        working-directory: ${{ env.APP_DIR }}
        run: bun run react-doctor 2>&1 | tee react-doctor-report.txt

      - name: Upload React Doctor report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: react-doctor-report
          path: ${{ env.APP_DIR }}/react-doctor-report.txt
          if-no-files-found: warn
