name: React Doctor (Advisory)

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  APP_DIR: app

jobs:
  react-doctor:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout app
        uses: actions/checkout@v6

      - name: Setup Sovran
        uses: ./.github/actions/setup-sovran
        with:
          github-token: ${{ secrets.SOVRAN_CI_TOKEN || secrets.GITHUB_TOKEN }}

      # Advisory telemetry only: findings are heuristics and must never become
      # a merge gate or an autonomous-fix queue. This workflow is red only when
      # the scan itself cannot complete; the presence/count of findings cannot
      # fail it.
      - name: React Doctor scan
        working-directory: ${{ env.APP_DIR }}
        run: >-
          bun run react-doctor --json --json-out react-doctor-report.json
          --yes --no-color --blocking none

      - name: Upload React Doctor report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: react-doctor-report
          path: ${{ env.APP_DIR }}/react-doctor-report.json
          if-no-files-found: warn
