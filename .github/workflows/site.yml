name: Website

on:
  pull_request:
    paths:
      [
        "site/**",
        "copy/**",
        "press/**",
        "scripts/lib/phone-frame.mjs",
        "scripts/site-brand*",
        "app/assets/brand/source/symbol.svg",
        ".dockerignore",
        ".github/workflows/site.yml",
      ]
  push:
    branches: [main]
    paths:
      [
        "site/**",
        "copy/**",
        "press/**",
        "scripts/lib/phone-frame.mjs",
        "scripts/site-brand*",
        "app/assets/brand/source/symbol.svg",
        ".dockerignore",
        ".github/workflows/site.yml",
      ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  site:
    runs-on: ubuntu-24.04
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.5"
      - name: Install standalone site without the native workspace
        run: node site/scripts/install.mjs
      - name: Install local delivery test tools
        run: sudo apt-get update && sudo apt-get install -y nginx gettext-base
      - name: Lint reviewed copy and test claims rules
        run: |
          node copy/scripts/lint.mjs
          node --test copy/scripts/*.test.mjs
      - name: Build static site
        working-directory: site
        run: bun run build
      - name: Verify shared website branding
        run: node scripts/site-brand.mjs --check && node --test scripts/site-brand.test.mjs
      - name: Verify legal bytes and no-JavaScript delivery
        run: node scripts/legal.mjs --check-site
      - name: Test site and actual nginx routes
        working-directory: site
        run: bun run test
      - name: Build isolated public image
        run: docker build -f site/Dockerfile -t sovran-site .
      - name: Reject dependency drift
        run: git diff --exit-code -- package.json bun.lock site/package.json site/bun.lock
