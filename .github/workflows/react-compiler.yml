name: Compiler Bailout Budget

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  APP_DIR: app

jobs:
  react-compiler:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout app
        uses: actions/checkout@v6

      - name: Setup Sovran
        uses: ./.github/actions/setup-sovran
        with:
          github-token: ${{ secrets.SOVRAN_CI_TOKEN || secrets.GITHUB_TOKEN }}

      # Fails when a NEW function bails out of the React Compiler. The compiler
      # is the source of truth for memoization; a bailout means a function
      # renders unmemoized and a "redundant" manual memo we removed is now
      # actually missing. The eslint-plugin-react-compiler rule that would catch
      # this is dead under the repo's zod@4 override, so this is the gate.
      # Known bailouts are ratcheted in app/react-compiler-bailouts.json.
      - name: React Compiler coverage
        working-directory: ${{ env.APP_DIR }}
        run: bun run check:react-compiler
