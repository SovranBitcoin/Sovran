name: Knip

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  APP_DIR: app

jobs:
  knip:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout app
        uses: actions/checkout@v6

      - name: Setup Sovran
        uses: ./.github/actions/setup-sovran
        with:
          github-token: ${{ secrets.SOVRAN_CI_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Knip
        working-directory: ${{ env.APP_DIR }}
        run: bun run knip
