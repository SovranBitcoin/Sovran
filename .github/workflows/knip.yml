name: Knip

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  APP_DIR: app

jobs:
  knip:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout app
        uses: actions/checkout@v6

      - name: Setup Sovran
        uses: ./.github/actions/setup-sovran
        with:
          github-token: ${{ secrets.SOVRAN_CI_TOKEN || secrets.GITHUB_TOKEN }}

      # knip is workspace-aware: config lives at the repo root and analyzes the
      # app/wallet/nostr/docs members together, so run it at the checkout root.
      - name: Knip
        run: bun run knip
