          "section": "Never Ship > hard stop at a boundary",
          "reason": "Clamping with Math.min/Math.max is sanctioned in some recipes and a bug in others; the chunk cannot distinguish them."
        },
        {
          "section": "Haptics > never the only feedback",
          "reason": "Requires knowing whether a paired visual exists elsewhere in the component or screen."
        },
        {
          "section": "Screen transitions > Android formSheet caveats",
          "reason": "The three-detent cap requires counting array entries, and the header/nested-stack caveat spans files."
        },
        {
          "section": "Hard Rules > feel judged on a release build; Output section",
          "reason": "Verification workflow and response formatting are process rules about the author, not the code."
        }
      ]
