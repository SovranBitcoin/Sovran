    {
      "id": "skill/principle-type-system-discipline",
      "kind": "skill",
      "origin": "./.agents/skills/principle-type-system-discipline",
      "path": ".agents/skills/principle-type-system-discipline/SKILL.md",
      "scope": "",
      "hash": "353bdf4fa7a31b2b08d75724516518a620e19980e7eb39baf104109cf570bcc9",
      "rules": [
        {
          "id": "skill/principle-type-system-discipline/boolean-flag-with-optional-companion",
          "section": "The patterns > Make illegal states unrepresentable",
          "instructions": "Does `hunk` add a type, interface, struct, or class field set containing a boolean flag alongside an optional/nullable field that encodes the same fact (e.g. `completed: boolean` plus `completedAt?: Date`, `isPaid: boolean` plus `paidAt: Date | null`), instead of deriving the boolean or modelling the variants as a tagged union?",
          "criteria": {
            "true": "The added fields include a boolean status flag and, in the same type, an optional or nullable field whose presence is exactly what the flag claims (timestamp, reason, result, error), so `flag: true` with the companion absent compiles.",
            "false": "Only the optional field is added (boolean derived from it), only the boolean is added, the variants are modelled as a discriminated union with a `kind`/`type` tag, the companion field is required rather than optional, or the boolean and the optional field describe unrelated facts."
          },
          "appliesTo": [],
          "when": "(boolean|bool|Boolean)",
          "message": "A boolean flag beside an optional field that carries the same fact admits contradictory states like `completed: true` with no `completedAt`."
        },
        {
          "id": "skill/principle-type-system-discipline/brand-semantic-primitives",
          "section": "The patterns > Brand semantic primitives",
          "instructions": "Does `hunk` declare (not call, and not re-implement a signature fixed by an interface, an override or an external declaration) a positional parameter list in which two or more parameters of the same raw primitive type are identifiers, keys, secrets or measured quantities of different kinds that look alike at a call site (e.g. a pubkey and an event id that are both 64-hex strings, two different private keys, latitude and longitude, an API key and a bearer token), or three or more adjacent same-primitive parameters of different meaning, so a transposed call would compile and not fail at first use?",
          "criteria": {
            "true": "An added signature is called positionally and takes look-alike parameters of the same unbranded primitive type that stand for distinct domain concepts or distinct entity ids, so callers can transpose them silently; a named-field object parameter or a branded type would make the swap a compile error.",
            "false": "The same-typed parameters are interchangeable values of one concept (e.g. `x, y` of a size, items of a list, a numeric pair with no identity); they are two values of the same kind in different roles (from/to, source/destination, own/peer, previous/next), which a brand cannot separate; they are a (key, value), (identifier, payload) or (recipient, message) pair in which at most one is an identity; the values look nothing alike at a call site (a URL and a hex id) or a swap fails at first use; a single object, props or record parameter with named fields is used, destructured or not, or the language requires argument labels; the parameters use branded intersections, newtypes, value classes or opaque types, or have distinct types; the function is the validating constructor that turns raw primitives into the typed value; the signature implements or overrides an interface member declared elsewhere; or it is a test fixture builder."
          },
          "appliesTo": [],
          "message": "Two same-typed primitive parameters meaning different identifiers can be swapped at a call site without the compiler noticing."
        },
        {
          "id": "skill/principle-type-system-discipline/no-type-checker-escape-hatch",
          "section": "The patterns > Don't lie to the type system",
          "instructions": "Does `hunk` add an escape hatch that bypasses the type checker — an `any` annotation, a `as SomeType` / `<SomeType>x` assertion, a non-null `!` assertion, a `@ts-ignore`/`@ts-expect-error`, or an `asserts x is T` assertion function — instead of validating or narrowing the value?",
          "criteria": {
            "true": "Added lines introduce `any`, a type assertion to a more specific type, a non-null assertion on a possibly-absent value, a checker-suppressing comment, or a hand-written assertion function used in place of a real check.",
            "false": "The chunk uses `as const`, `satisfies`, widening to `unknown`, a real type guard returning `value is T` backed by visible field checks, or narrowing via `typeof`/`instanceof`/discriminant checks; or no such construct is added."
          },
          "appliesTo": [
            "**/*.ts",
            "**/*.tsx",
            "**/*.mts",
            "**/*.cts"
          ],
          "when": "(\\bany\\b|\\bas\\s+[A-Z_]|<[A-Z][A-Za-z0-9_]*>|!\\.|!\\)|!;|ts-ignore|ts-expect-error|asserts )",
          "message": "A cast or assertion that bypasses the checker is a latent runtime crash rather than a proof."
        },
        {
          "id": "skill/principle-type-system-discipline/parse-external-data-at-boundary",
          "section": "The patterns > External data is untyped until parsed",
          "instructions": "Does `hunk` take external input — `JSON.parse`, `response.json()`, `process.env`, a request body, IPC message, CLI args, config file, or database row — and give it a specific typed shape by cast or annotation without a validating parse (schema parse or explicit field checks) in the visible code?",
          "criteria": {
            "true": "Added code labels raw external data with a domain type (e.g. `JSON.parse(raw) as Config`, `const body: CreateUser = await req.json()`, `process.env.PORT as number`) with no validation of that data visible in the chunk.",
            "false": "The external value is passed through a schema parser (zod/valibot/io-ts/pydantic/serde) or a hand-written validator, it is kept as `unknown`/`string`/raw and validated before use, or the chunk does not consume external input."
          },
          "appliesTo": [],
          "when": "(JSON\\.parse|\\.json\\(\\)|process\\.env|req\\.(body|query|params)|readFileSync|argv|getenv|os\\.environ)",
          "message": "External input is being trusted as a typed model without a parse step, so malformed payloads surface as crashes later."
        },
        {
          "id": "skill/principle-type-system-discipline/exhaustive-variant-match",
          "section": "The patterns > Exhaustive matching is the compiler's job",
          "instructions": "Does `hunk` add a `switch` or `match` over a discriminated-union tag (`kind`, `type`, `variant`, enum case) whose `default`/`_`/`else` branch absorbs the remaining variants without an exhaustiveness check such as a `never`-typed binding, `assertNever`, or a compiler-checked total match?",
          "criteria": {
            "true": "An added switch/match dispatches on a union discriminant or enum and ends in a catch-all branch that returns a fallback value, logs, or throws a generic error, with no `never`-typed assignment or `assertNever`-style call proving all variants are handled.",
            "false": "The switch/match has no catch-all branch, its catch-all assigns the scrutinee to a `never`-typed variable or calls `assertNever`/`exhaustive`, or the value being matched is an open set such as arbitrary user input, HTTP method strings, or numbers rather than a closed sum type."
          },
          "appliesTo": [],
          "when": "(switch\\s*\\(|\\bmatch\\b|\\bcase\\b|default:)",
          "message": "A catch-all branch over a tagged union means adding a variant later compiles silently instead of failing the build."
        }
      ],
      "notChecked": [
        {
          "section": "The patterns > Derive types from authoritative schemas",
          "reason": "Deciding whether a declared type duplicates a shape owned by a protobuf, OpenAPI, GraphQL schema, migration, or token file requires reading that other file."
        },
        {
          "section": "The patterns > Types are constructions, not restrictions",
          "reason": "Judging whether an invariant is 'a construction away' (non-empty list, start+duration) is a design judgement about alternative representations not visible in the chunk."
        },
        {
          "section": "The patterns > Strengthen a type only where partiality appears",
          "reason": "Requires knowing whether anything would otherwise panic and whether the precision is load-bearing; subjective and dependent on call sites."
        },
        {
          "section": "The patterns > Exhaustive matching (language build flags)",
          "reason": "Enabling `-Wincomplete-patterns` or equivalent compiler settings is whole-repo build configuration, not visible in a code chunk."
        },
        {
          "section": "The patterns > External data is untyped until parsed (see boundary-discipline)",
          "reason": "Cross-reference to another skill about where validation lives; placement across boundaries is a cross-file concern."
        },
        {
          "section": "The tests",
          "reason": "Self-review prompts ('Can I write a comment explaining when this combination is valid?', 'Where did this `as` come from?') are heuristics for humans; their checkable content is already covered by the emitted rules."
        }
      ]
    },
    {
      "id": "skill/principle-model-the-domain",
      "kind": "skill",
      "origin": "./.agents/skills/principle-model-the-domain",
      "path": ".agents/skills/principle-model-the-domain/SKILL.md",
      "scope": "",
      "hash": "b8cf682539f24fcdfd53608d4fd51b29b5c7933a969d028048e2d9c2c27f7ba4",
      "rules": [
        {
          "id": "skill/principle-model-the-domain/branch-added-to-existing-chain",
          "section": "Model the Domain",
          "instructions": "Does `hunk` add a new `else if` / `elif` / equivalent branch onto an if/else chain that is already visible in the surrounding unchanged context lines, dispatching on the same value or kind as the existing branches?",
          "criteria": {
            "true": "Added lines extend an already-multi-branch conditional that dispatches on a type, kind, status, mode or name, e.g. a new `else if (kind === 'invoice')` appended to context lines already containing `if (kind === 'quote') ... else if (kind === 'order')`, or a new `case` added to a switch on the same discriminant where each case repeats the same domain rules.",
            "false": "A fresh standalone `if`/`else` written in this chunk; an early-return guard clause; a branch on an unrelated value from the surrounding chain; error/null handling; conditionals in a test, fixture or config file; or the chunk instead replaces the chain with a map, registry or union."
          },
          "appliesTo": [],
          "when": "else\\s+if|elif |\\bcase\\b|\\bwhen\\b|match\\s",
          "message": "Growing an existing if/else chain by one more branch is the sign that the domain wants a lookup table, registry or discriminated union instead."
        },
        {
          "id": "skill/principle-model-the-domain/second-boolean-for-same-state",
          "section": "Model the Domain",
          "instructions": "Does `hunk` add a boolean flag to a type, state object, class or component state that already holds another boolean describing the same lifecycle or status, so the two must be kept in sync?",
          "criteria": {
            "true": "A new boolean field/prop/state variable is added next to visible existing booleans covering the same phase of one thing, e.g. adding `isFailed` where `isLoading`/`isLoaded` already exist, or adding `hasSubmitted` alongside `isSubmitting`, such that some combinations of the flags are meaningless.",
            "false": "The added boolean describes an independent concern from the existing ones; it is the first boolean on that object; it is a derived/computed getter rather than stored state; the chunk replaces the booleans with a single status enum or state machine; or the file is a test, fixture or config file."
          },
          "appliesTo": [],
          "when": "boolean|\\bbool\\b|useState\\(|is[A-Z]|has[A-Z]|should[A-Z]|did[A-Z]|= (true|false|True|False)",
          "message": "A second boolean that must stay in sync with the first encodes invalid states; a state machine or single status value would make them unrepresentable."
        },
        {
          "id": "skill/principle-model-the-domain/loose-params-instead-of-model",
          "section": "Model the Domain",
          "instructions": "Does `hunk` add or widen a function signature so that it takes a group of related primitive values as separate parameters, when an adjacent signature in the same chunk already passes that same group of values?",
          "criteria": {
            "true": "A new or edited signature spells out related primitives individually, e.g. `createOrder(userId, userName, userEmail, planId, planPrice)`, and the same cluster of values also appears spelled out in another signature or call visible in the chunk, instead of one typed object/model.",
            "false": "The parameters are unrelated to each other, the function takes one or two arguments, the values are already grouped into an object/struct/dataclass, the signature is a thin adapter over an external API's shape, or the file is a test, fixture or config file."
          },
          "appliesTo": [],
          "when": "function |def |func |=>|\\bfn \\b|public |private |const \\w+ = \\(",
          "message": "Threading the same group of related primitives as separate parameters repeats a shape assumption that a typed object would own."
        }
      ],
      "notChecked": [
        {
          "section": "Model the Domain > Reach for structures like these",
          "reason": "Choosing a queue, cache, index, graph, normalized collection or reducer for the data access pattern is a design judgement about the whole feature; a single chunk does not reveal the access pattern that would justify it."
        },
        {
          "section": "Model the Domain > Temporal decomposition / phase-named modules",
          "reason": "Detecting that modules are split by load/validate/transform/save and repeat the same domain rules across steps requires seeing multiple files at once."
        },
        {
          "section": "Model the Domain > Module organized around one body of domain knowledge",
          "reason": "Whether a module owns one body of domain knowledge or a sequence of steps is a whole-file, cross-file ownership judgement, not visible in one hunk."
        },
        {
          "section": "Model the Domain > Branching spread across files",
          "reason": "Branching repeated across files is by definition cross-file; the classifier sees only one chunk."
        },
        {
          "section": "Model the Domain > Do not force an abstraction",
          "reason": "Subjective taste: judging whether an abstraction adds indirection without removing branches, or whether the existing shape is 'already clear, local, and unlikely to grow', cannot be decided literally from a chunk and would fire on legitimate boring code."
        },
        {
          "section": "Model the Domain > Why (accidental complexity)",
          "reason": "Rationale prose, not an actionable per-chunk condition."
        }
      ]
    },
    {
      "id": "skill/react-native-testing",
      "kind": "skill",
      "origin": "./.agents/skills/react-native-testing",
      "path": ".agents/skills/react-native-testing/SKILL.md",
      "scope": "",
      "hash": "3a21ff79dbb1dfc72896f61ec59952800f764690bcb702a336e4f4605533be15",
      "rules": [
        {
          "id": "skill/react-native-testing/no-destructuring-render",
          "section": "Rules > Use screen",
          "instructions": "Does `hunk` destructure query functions (e.g. `getByText`, `getByRole`, `queryBy*`, `findBy*`) from the return value of `render(...)` or `renderAsync(...)` instead of using `screen`?",
          "criteria": {
            "true": "A line like `const { getByText, getByRole } = render(<Component />)` (or `renderAsync`) where queries are pulled off the render result, including calling `render(...).getByText(...)`.",
            "false": "`render(<Component />)` followed by `screen.getByText(...)`; destructuring only non-query helpers such as `rerender`, `unmount`, or `result` from `renderHook`."
          },
          "appliesTo": [
            "**/*.test.*",
            "**/*.spec.*",
            "**/__tests__/**"
          ],
          "when": "render\\s*\\(|renderAsync\\s*\\(",
          "message": "Queries destructured from `render()` bypass the `screen` object the guide requires."
        },
        {
          "id": "skill/react-native-testing/queryby-only-for-non-existence",
          "section": "Rules > Query variants",
          "instructions": "Does `hunk` use a `queryBy*` result for anything other than a non-existence check — e.g. `expect(screen.queryByX(...)).toBeOnTheScreen()` or passing a `queryBy*` result to an interaction?",
          "criteria": {
            "true": "A `queryBy*` result asserted to exist (`toBeOnTheScreen()`, `toBeVisible()`, `toBeTruthy()`, `not.toBeNull()`) or handed to `fireEvent`/`userEvent`.",
            "false": "`expect(screen.queryByText('Error')).not.toBeOnTheScreen()` or `.toBeNull()`; `queryAllBy*` used to count elements; `getBy*`/`findBy*` used where the element must exist."
          },
          "appliesTo": [
            "**/*.test.*",
            "**/*.spec.*",
            "**/__tests__/**"
          ],
          "when": "query(All)?By",
          "message": "`queryBy*` is reserved for non-existence checks; asserting presence with it fails unhelpfully."
        },
        {
          "id": "skill/react-native-testing/getby-for-non-existence",
          "section": "Anti-Patterns > Wrong query variant",
          "instructions": "Does `hunk` assert non-existence on a `getBy*`/`getAllBy*` query, e.g. `expect(screen.getByText('Error')).not.toBeOnTheScreen()`?",
          "criteria": {
            "true": "A `getBy*` or `getAllBy*` call inside an `expect(...)` followed by `.not.toBeOnTheScreen()`, `.not.toBeVisible()`, `.toBeNull()` or similar negative existence assertion.",
            "false": "Negative existence checks written with `queryBy*`; `getBy*` used with positive assertions."
          },
          "appliesTo": [
            "**/*.test.*",
            "**/*.spec.*",
            "**/__tests__/**"
          ],
          "when": "get(All)?By",
          "message": "`getBy*` throws before the negative assertion runs, so the test fails instead of reporting cleanly."
        },
        {
          "id": "skill/react-native-testing/redundant-null-check-on-getby",
          "section": "Anti-Patterns > Wrong assertions",
          "instructions": "Does `hunk` assert `.not.toBeNull()`, `.toBeTruthy()`, or `.toBeDefined()` on the result of a `getBy*`/`getAllBy*` query?",
          "criteria": {
            "true": "Code like `const el = screen.getByText('Hello'); expect(el).not.toBeNull();` or `expect(screen.getByRole('button')).toBeTruthy()`.",
            "false": "`expect(screen.getByText('Hello')).toBeOnTheScreen()`; null/truthy checks on `queryBy*` results or on non-query values such as mock return values."
          },
          "appliesTo": [
            "**/*.test.*",
            "**/*.spec.*",
            "**/__tests__/**"
          ],
          "when": "get(All)?By",
          "message": "`getBy*` already throws when nothing matches, so a null/truthy check asserts nothing."
        },
        {
          "id": "skill/react-native-testing/findby-over-waitfor-getby",
          "section": "Rules > Async queries",
          "instructions": "Does `hunk` add a `waitFor` whose callback's only assertion is on a `getBy*`/`getAllBy*` query result, instead of using `findBy*`?",
          "criteria": {
            "true": "`await waitFor(() => { expect(screen.getByText('Loaded')).toBeOnTheScreen(); })` — the callback just queries for an element that will appear.",
            "false": "`expect(await screen.findByText('Loaded')).toBeOnTheScreen()`; a `waitFor` callback asserting something other than element presence, e.g. on a mock (`expect(onSave).toHaveBeenCalled()`) or on element state/content of an already-present element; `waitForElementToBeRemoved`."
          },
          "appliesTo": [
            "**/*.test.*",
            "**/*.spec.*",
            "**/__tests__/**"
          ],
          "when": "waitFor",
          "message": "`waitFor` wrapping a `getBy*` query should be a `findBy*` query."
        },
        {
          "id": "skill/react-native-testing/no-side-effects-in-waitfor",
          "section": "Rules > waitFor",
          "instructions": "Does `hunk` add a `waitFor` callback that performs a side-effect such as `fireEvent.*`, `user.press/type/clear/...`, or `userEvent` calls inside it?",
          "criteria": {
            "true": "`await waitFor(() => { fireEvent.press(...); expect(...)... })` or any interaction call within the `waitFor` callback body.",
            "false": "The interaction happens before `waitFor` and only assertions appear inside the callback."
          },
          "appliesTo": [
            "**/*.test.*",
            "**/*.spec.*",
            "**/__tests__/**"
          ],
          "when": "waitFor",
          "message": "A side-effect inside `waitFor` re-runs on every retry."
        },
        {
          "id": "skill/react-native-testing/one-assertion-per-waitfor",
          "section": "Rules > waitFor",
          "instructions": "Does `hunk` add a `waitFor` callback whose body contains more than one `expect(...)` statement, or a `waitFor` with an empty callback body?",
          "criteria": {
            "true": "`await waitFor(() => { expect(a)...; expect(b)...; })` with two or more `expect` calls in the callback, or `await waitFor(() => {})` with nothing in the body.",
            "false": "Exactly one `expect` inside the `waitFor` callback, with any further assertions placed after the `await waitFor(...)` call."
          },
          "appliesTo": [
            "**/*.test.*",
            "**/*.spec.*",
            "**/__tests__/**"
          ],
          "when": "waitFor",
          "message": "Multiple assertions in one `waitFor` make retries and failures ambiguous."
        },
        {
          "id": "skill/react-native-testing/no-act-around-rntl-calls",
          "section": "Rules > Don't wrap in act()",
          "instructions": "Does `hunk` call `render`, `rerender`, `fireEvent.*` or a `userEvent` method imported from `@testing-library/react-native` inside an `act(...)` callback?",
          "criteria": {
            "true": "`act(() => { render(<Component />); })`, `act(() => { fireEvent.press(button); })`, or `await act(async () => { await user.press(button); })`, where `render`, `fireEvent` or the user come from `@testing-library/react-native`.",
            "false": "`act()` used around a function returned by a hook from `renderHook` that triggers a state update (e.g. `act(() => { result.current.increment(); })`); `render`/`fireEvent`/`userEvent` called directly without `act`; `act` around `react-test-renderer` APIs (`TestRenderer.create`, `renderer.update`, `renderer.unmount`), which do not wrap themselves; `act` around a directly invoked prop callback (`node.props.onPress()`), a store update, a timer advance or a captured listener; or a file-local helper that happens to be named `render` but is not the RNTL import."
          },
          "appliesTo": [
            "**/*.test.*",
            "**/*.spec.*",
            "**/__tests__/**"
          ],
          "when": "\\bact\\s*\\(",
          "message": "`render`, `fireEvent` and `userEvent` already wrap themselves in `act()`."
        },
        {
          "id": "skill/react-native-testing/no-manual-cleanup",
          "section": "Rules > Don't call cleanup()",
          "instructions": "Does `hunk` add a call to RNTL's `cleanup()` (e.g. inside `afterEach`)?",
          "criteria": {
            "true": "`afterEach(() => { cleanup(); })` or any direct `cleanup()` invocation from `@testing-library/react-native`.",
            "false": "No `cleanup()` call; the file imports from `@testing-library/react-native/pure`, where manual cleanup is required; unrelated cleanup helpers such as `jest.clearAllMocks()`."
          },
          "appliesTo": [
            "**/*.test.*",
            "**/*.spec.*",
            "**/__tests__/**"
          ],
          "when": "cleanup",
          "message": "RNTL cleans up automatically after each test; a manual `cleanup()` is redundant."
        },
        {
          "id": "skill/react-native-testing/prefer-userevent-over-fireevent",
          "section": "Anti-Patterns > fireEvent instead of userEvent",
          "instructions": "Does `hunk` add a `fireEvent.press(...)` or `fireEvent.changeText(...)` call (or the `fireEventAsync` equivalents) where `userEvent` supports the interaction?",
          "criteria": {
            "true": "New lines calling `fireEvent.press(button)` or `fireEvent.changeText(input, 'text')`.",
            "false": "`await user.press(...)` / `await user.type(...)` via `userEvent.setup()`; `fireEvent` used for events userEvent does not support, such as `fireEvent(element, 'blur')`, `fireEvent(element, 'layout')`, or firing on a composite (non-host) element."
          },
          "appliesTo": [
            "**/*.test.*",
            "**/*.spec.*",
            "**/__tests__/**"
          ],
          "when": "fireEvent",
          "message": "`fireEvent.press`/`changeText` skip the full interaction sequence that `userEvent` simulates."
        },
        {
          "id": "skill/react-native-testing/no-raw-prop-assertions",
          "section": "Anti-Patterns > Wrong assertions",
          "instructions": "In a test that renders with `@testing-library/react-native`, does `hunk` take a host element returned by an RNTL query (`getBy*`, `queryBy*`, `findBy*`) and assert on its raw `.props` (e.g. `expect(button.props['aria-disabled']).toBe(true)` or `expect(el.props.style.backgroundColor)...`) where an RNTL matcher could express the same check?",
          "criteria": {
            "true": "An `expect(...)` whose subject is `<element>.props.<something>` or `<element>.props['<something>']` for an element returned by an RNTL query, where a matcher such as `toBeDisabled()`, `toHaveStyle()`, `toHaveTextContent()`, `toHaveDisplayValue()`, `toHaveAccessibilityValue()` or `toHaveProp(name, value)` exists.",
            "false": "Assertions using those matchers; a tree from `react-test-renderer` (`TestRenderer.create`, `root.find*`, `toJSON()`), where RNTL matchers are not registered; `.props` read on a mocked component or a composite component instance whose received props are the contract under test; a prop with no matcher (class names, object identity, SVG or graphics attributes, animated props); an assertion on a value derived from a prop (flattened, parsed, a method called on it) or a scan of the whole props object (a leak check, a JSON payload); a test whose purpose is the raw accessibility-prop payload a native harness reads; or `.props` used only to find a node or to invoke a callback."
          },
          "appliesTo": [
            "**/*.test.*",
            "**/*.spec.*",
            "**/__tests__/**"
          ],
          "when": "\\.props",
          "message": "Asserting on raw `.props` instead of RNTL matchers couples the test to internals."
        },
        {
          "id": "skill/react-native-testing/no-unsafe-apis",
          "section": "Anti-Patterns > Using UNSAFE_root",
          "instructions": "Does `hunk` use an `UNSAFE_` RNTL API such as `UNSAFE_root`, `UNSAFE_getByType`, `UNSAFE_queryByProps`, or manually walk the tree with `.findAll(...)`?",
          "criteria": {
            "true": "Any reference to `UNSAFE_root`, `UNSAFE_getByType`/`UNSAFE_getAllByType`, `UNSAFE_getByProps`/`UNSAFE_queryByProps`, or `root.findAll((node) => node.props...)`.",
            "false": "Standard queries (`screen.getByRole`, `getByTestId`, `within(...)`) or `screen.root`/`screen.container`."
          },
          "appliesTo": [
            "**/*.test.*",
            "**/*.spec.*",
            "**/__tests__/**"
          ],
          "when": "UNSAFE_|findAll",
          "message": "`UNSAFE_*` APIs traverse internals instead of querying the rendered output."
        },
        {
          "id": "skill/react-native-testing/prefer-aria-props",
          "section": "Rules > Prefer ARIA props",
          "instructions": "Does `hunk` add `accessibilityRole`, `accessibilityLabel`, or `accessibilityState` props instead of the ARIA equivalents `role`, `aria-label`, and `aria-disabled`/`aria-checked`/`aria-selected`/`aria-busy`/`aria-expanded`?",
          "criteria": {
            "true": "JSX such as `<Pressable accessibilityRole=\"button\" accessibilityLabel=\"Submit\">` or `accessibilityState={{ disabled: true }}`.",
            "false": "`role=\"button\"`, `aria-label=\"Submit\"`, `aria-disabled`, `aria-checked`; legacy props with no ARIA equivalent such as `accessibilityHint`, `accessibilityElementsHidden`, or `importantForAccessibility`."
          },
          "appliesTo": [
            "**/*.tsx",
            "**/*.jsx"
          ],
          "when": "accessibilityRole|accessibilityLabel=|accessibilityState",
          "message": "Legacy `accessibility*` props are used where ARIA-compatible props exist."
        }
      ],
      "notChecked": [
        {
          "section": "Version Detection / Forgetting to await (v14)",
          "reason": "Whether `render`/`fireEvent`/`act` must be awaited depends on the `@testing-library/react-native` version in package.json, which the classifier cannot see from a single chunk."
        },
        {
          "section": "Using removed APIs (v14)",
          "reason": "`renderAsync`, `fireEventAsync`, `concurrentRoot` and `update()` are valid in v13 and removed in v14; deciding requires knowing the installed version."
        },
        {
          "section": "Query Priority",
          "reason": "Deciding that `getByRole`/`getByLabelText` would work instead of `getByTestId` or `getByText` requires seeing the component under test, which is a different file."
        },
        {
          "section": "Fake Timers",
          "reason": "`jest.useFakeTimers()` with `userEvent` is a recommendation about file-level setup, often in a shared jest setup file outside the chunk."
        },
        {
          "section": "Custom Render",
          "reason": "Provider-wrapping helpers are a structural suggestion, not a verifiable pass/fail condition in one chunk."
        },
        {
          "section": "*ByRole Quick Reference > accessibility elements",
          "reason": "Knowing whether a queried `View` has `accessible={true}` requires the component source, not the test chunk."
        },
        {
          "section": "Assertions (Jest Matchers) table / API reference tables",
          "reason": "Reference material listing available matchers and query options; descriptive, not a rule."
        }
      ]
    },
    {
      "id": "agents-md/root",
      "kind": "agents-md",
      "origin": "./AGENTS.md",
      "path": "AGENTS.md",
      "scope": "",
      "hash": "8943ef4bf69e6767fcd83f19df3907e228749ac3c6dd6bceae704849d3a7e946",
      "rules": [
        {
          "id": "agents-md/root/packages-never-import-app",
          "section": "Layout and ownership > Import flow",
          "message": "A package under `wallet/` or `nostr/` may now depend on the app layer, breaking the `app → wallet → nostr` import direction.",
          "instructions": "Does `hunk` add an import in a `wallet/` or `nostr/` file that resolves to the app (e.g. `@/…`, a path containing `app/`, Expo navigation such as `expo-router`/`@react-navigation/*`, or an app store)?",
          "criteria": {
            "true": "An added import line in a wallet/ or nostr/ file pulls in `@/…`, an `app/` path, `expo-router`, `@react-navigation/*`, or an app-level store/context.",
            "false": "Added imports stay within the same package, other packages lower in the chain (`nostr` from `wallet`), or third-party libraries unrelated to the app and Expo navigation; or the file is not under `wallet/` or `nostr/`."
          },
          "appliesTo": [
            "wallet/**",
            "nostr/**"
          ],
          "when": "^\\+.*\\b(import|require)\\b"
        },
        {
          "id": "agents-md/root/cross-package-subpath-imports",
          "section": "Layout and ownership > Import flow",
          "message": "Reaching into another package's internals bypasses its declared subpath entry points.",
          "instructions": "Does `hunk` add an import that reaches into another workspace package's internal source (e.g. `../../wallet/src/...`, `nostr/src/...`) instead of a declared subpath such as `wallet/react`?",
          "criteria": {
            "true": "An added import path traverses into another package's `src` directory or otherwise targets internal files of `wallet`/`nostr` rather than the package name or a declared subpath.",
            "false": "Added imports use the package name or a declared subpath (`wallet/react`, `nostr`, `@sovranbitcoin/schemas`), or stay inside the importing package."
          },
          "appliesTo": [],
          "when": "^\\+.*(from|require)\\s*\\(?\\s*['\"]"
        },
        {
          "id": "agents-md/root/app-alias-imports",
          "section": "Layout and ownership > Import flow",
          "message": "App code is expected to import through the `@/…` alias rather than parent-directory traversal.",
          "instructions": "Does `hunk` add an import in an `app/` file that uses parent-directory traversal (`../`) instead of the `@/…` alias?",
          "criteria": {
            "true": "An added import specifier in a file under `app/` starts with `../` (one or more levels) for shared app code.",
            "false": "Added imports use `@/…`, a package name or subpath, or a same-directory `./` specifier; or the file is not under `app/`."
          },
          "appliesTo": [
            "app/**"
          ],
          "when": "^\\+.*['\"]\\.\\./"
        },
        {
          "id": "agents-md/root/actionable-control-testid",
          "section": "Native testability",
          "message": "An actionable control without a stable semantic `testID` cannot be driven by the JSON native harness.",
          "instructions": "Does `hunk` add an actionable control (e.g. `Pressable`, `TouchableOpacity`, `Touchable*`, `Button`, `Switch`, `TextInput`) without a `testID` prop on it?",
          "criteria": {
            "true": "A newly added interactive element is rendered with no `testID` prop (and none is spread in via visible props).",
            "false": "The added control carries a `testID` (literal or via visible props/spread), the added JSX is non-interactive presentation, or the file is a test, story or fixture."
          },
          "appliesTo": [
            "app/**/*.tsx"
          ],
          "when": "^\\+.*<(Pressable|Touchable[A-Za-z]*|Button|Switch|TextInput)\\b"
        },
        {
          "id": "agents-md/root/actionable-control-accessible-label",
          "section": "Native testability",
          "message": "An actionable control with no accessible label is unusable by assistive tech and by the harness.",
          "instructions": "Does `hunk` add an actionable control (e.g. `Pressable`, `TouchableOpacity`, `Button`, icon-only button) that has no accessible label — neither `accessibilityLabel`/`aria-label` nor visible text content?",
          "criteria": {
            "true": "A newly added interactive element wraps only an icon or image, or has no children, and no `accessibilityLabel`/`aria-label` prop is present.",
            "false": "The added control has an `accessibilityLabel`/`aria-label`, or renders visible text that serves as its label; or the added JSX is non-interactive; or the file is a test, story or fixture."
          },
          "appliesTo": [
            "app/**/*.tsx"
          ],
          "when": "^\\+.*<(Pressable|Touchable[A-Za-z]*|Button)\\b"
        },
        {
          "id": "agents-md/root/e2e-wait-for-state-not-time",
          "section": "Native testability > Scenarios",
          "message": "A time-based wait in a scenario makes it flaky; scenarios must wait for state.",
          "instructions": "Does `hunk` add, to a declarative E2E scenario (a list of steps the harness executes), a step whose only effect is to let a fixed duration pass (a `sleep`/`delay`/`pause`/`wait` step expressed in milliseconds or seconds) before the next step, where an observable state could be awaited instead?",
          "criteria": {
            "true": "An added scenario step waits for a duration — a `sleep`, `delay`, `pause` or `waitMs` step — instead of asserting or awaiting a state condition.",
            "false": "Added steps wait for a state condition (element visible, probe value, text present); the code implements the harness, a driver or a step interpreter, including the interpreter of a delay step; a sleep is the polling interval inside a loop that exits on a condition or deadline; a timer enforces a timeout (`setTimeout` plus reject or abort, a `Promise.race` deadline); the code injects latency as the behaviour under test; it is a unit test of harness code; or the added lines contain no wait at all."
          },
          "appliesTo": [
            "**/e2e/**",
            "**/scenarios/**"
          ]
        },
        {
          "id": "agents-md/root/e2e-no-retry-mutations",
          "section": "Native testability > Scenarios",
          "message": "Retrying a send, publish or delete in a scenario can duplicate an irreversible action.",
          "instructions": "Does `hunk` repeat, on failure or until a condition holds, an E2E action that creates a new irreversible effect each time it runs — tapping a send, pay, publish or delete control, or building and submitting a new payment, event or deletion per attempt?",
          "criteria": {
            "true": "An added scenario step or helper wraps a send/publish/delete action in a retry, `retries`/`attempts` count, or loop that performs the action again on failure.",
            "false": "The repeated action only navigates, opens a menu, row or tab, reads or polls; the repeat is gated on a value proving the previous attempt did not land; the loop re-delivers one artifact built once outside the loop whose identity (event id, token, revision) makes re-delivery idempotent; it is host-side transport plumbing; it is a test asserting a scenario's shape; the words send, publish, delete or retries appear only in an identifier, selector id, title or comment; or no retry construct is added."
          },
          "appliesTo": [
            "**/e2e/**",
            "**/scenarios/**"
          ]
        },
        {
          "id": "agents-md/root/no-editing-installed-packages",
          "section": "Patches and vendored code",
          "message": "Editing installed dependency files instead of using `bun patch` means the change will be lost on reinstall.",
          "instructions": "Does `hunk` modify a file inside `node_modules` directly instead of going through a committed `bun patch` patch file?",
          "criteria": {
            "true": "Added or changed lines live in a path under `node_modules/`.",
            "false": "The change is a `.patch` file under `app/patches`, a lockfile entry, or any file outside `node_modules/`."
          },
          "appliesTo": [
            "**/node_modules/**"
          ]
        },
        {
          "id": "agents-md/root/vendored-code-provenance",
          "section": "Patches and vendored code",
          "message": "Vendored code without its upstream revision, license and refresh command cannot be refreshed or audited.",
          "instructions": "Does `hunk` add vendored upstream source without recording its upstream revision, license and refresh command beside it?",
          "criteria": {
            "true": "A new vendored file (under a vendor/vendored directory) is added with no header comment or adjacent note stating upstream revision/commit, license and the refresh command.",
            "false": "The added vendored file carries a provenance header with revision, license and refresh command, or the added lines are the provenance record itself, or the file is not vendored upstream code."
          },
          "appliesTo": [
            "**/vendor/**",
            "**/vendored/**",
            "**/third_party/**"
          ]
        }
      ],
