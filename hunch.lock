        },
        {
          "section": "Native testability > CANONICAL_PAGES and PAGE_ROUTES",
          "reason": "Verifying a route is registered needs the registry file, a different file from the route being changed."
        },
        {
          "section": "Native testability > E2EAccessibilityProbe",
          "reason": "Deciding that some state has no visible native node and therefore needs a probe requires understanding the rendered tree beyond the hunk."
        },
        {
          "section": "Native testability > scenario coverage and both platforms",
          "reason": "Whether a scenario exists for a surface, and whether it ran on iOS and Android, is cross-file and execution-time information."
        },
        {
          "section": "Working in the repo > budgets and suppressions",
          "reason": "Judging whether raising a budget or suppression has a 'concrete reason and evidence' depends on justification that lives outside the diff."
        },
        {
          "section": "Patches and vendored code > patch documentation",
          "reason": "A patch's purpose, test and removal trigger are recorded in `app/patches/README.md`, a different file from the `.patch` itself."
        },
        {
          "section": "Layout and ownership > path ownership table",
          "reason": "Deciding whether code sits with 'the owner of its meaning' (Coco packages for wallet state, `@sovranbitcoin/schemas` for wire contracts) is a subjective, repo-wide placement judgement."
        },
        {
          "section": "Skills > selection and installation",
          "reason": "Which skill to load and running `manage.py check`/`link` are agent-process rules with no code artifact to review."
        },
        {
          "section": "Working in the repo > Metro bundles and E2E safety",
          "reason": "Building both platform bundles and never running funded E2E scenarios against a real wallet are execution-time actions, not visible in code."
        }
      ]
    },
    {
      "id": "doc/docs/review/contributor-conventions",
      "kind": "doc",
      "origin": "./docs/review/contributor-conventions.md",
      "path": "docs/review/contributor-conventions.md",
      "scope": "",
      "hash": "7c95f17ab4992b25d5013ad41f7f4dca413bea708355e4b785c41c498700ee3b",
      "rules": [
        {
          "id": "doc/docs/review/contributor-conventions/errors-keep-structured",
          "section": "errors/structured",
          "message": "A caught error may lose its cause, code or status before non-UI code reacts to it.",
          "instructions": "Does `hunk` catch or receive an error and pass it on in a lossy form — a string (`String(err)`, `err.message`, a template string), a boolean, `null`/`undefined`, or a new generic `Error` without `{ cause }` — to a caller, store or return value that non-UI code relies on to understand the failure?",
          "criteria": {
            "true": "A catch block (or error callback) converts the error into a string, boolean, null/undefined, or throws/returns `new Error('...')` without `{ cause }`, and that value is returned, stored or passed to non-UI logic.",
            "false": "The error is rethrown, wrapped with `cause`, returned as a typed error / Result / discriminated union, or logged with the error object; the string is produced at a UI edge purely for display (screen error text, toast, status label); the catch is a documented best-effort path (cache read, telemetry, cleanup, feature detection) whose result decides nothing."
          },
          "appliesTo": [],
          "when": "catch\\s*[({]|\\.catch\\(|new Error\\("
        },
        {
          "id": "doc/docs/review/contributor-conventions/errors-not-for-decisions",
          "section": "errors/not-for-decisions",
          "message": "A retry, refund or payment decision may be driven by matching human-readable error text.",
          "instructions": "Does `hunk` decide retry, refund, balance, proof state, spent status or payment recovery by matching an error message or other human-readable text (`msg.includes('…')`, a regex over `err.message`, comparing display copy), outside a single named error-classifier function?",
          "criteria": {
            "true": "Control flow that retries, refunds, marks paid/spent, releases proofs or recovers a payment branches on `err.message`/text matching (`includes`, `match`, `startsWith`, `toLowerCase().indexOf`).",
            "false": "Branching on typed data (`instanceof`, `err.code`, HTTP `status`, NUT error codes, a discriminated `kind`); a single named classifier function (e.g. `classifyRedeemError`) that checks codes first and falls back to message patterns only for code-less libraries, whose callers branch on its typed result; message matching used only to pick display text or log detail."
          },
          "appliesTo": [],
          "when": "\\.message|includes\\(|\\.match\\(|toLowerCase\\("
        },
        {
          "id": "doc/docs/review/contributor-conventions/payments-uncertain-outcomes",
          "section": "payments/uncertain-outcomes",
          "message": "A timeout or cancellation may be recorded as a definite payment or delivery outcome.",
          "instructions": "Does `hunk` treat a timeout, abort, cancellation, lost connection, or relay/mint acceptance as proof that a payment or message definitely failed, succeeded or was delivered — marking it failed, refunded, paid or delivered, or releasing its proofs?",
          "criteria": {
            "true": "On a timeout/abort/cancel/disconnect path, the code sets a terminal state (`status = 'failed'`, `markPaid`, `refund`, `setDelivered`) or returns proofs to the wallet; or relay acceptance is recorded as `delivered`.",
            "false": "Unknown outcomes stay pending/unknown and are reconciled later by checking quote or proof state; a definitive mint or protocol answer (paid quote, spent-proof check, explicit error code) decides the state; relay acceptance is recorded as sent or accepted rather than delivered."
          },
          "appliesTo": [],
          "when": "[Tt]imeout|[Aa]bort|[Cc]ancel|[Dd]isconnect|[Dd]elivered|[Rr]elay"
        },
        {
          "id": "doc/docs/review/contributor-conventions/async-owner-scope",
          "section": "async/owner-scope",
          "message": "A late async result may land on a newer request, generation or profile.",
          "instructions": "Does `hunk` start async work (fetch, await chain, subscription or timer) and then write its result into shared, profile or component state without any check that the profile, request, generation or mounted component that started it is still current?",
          "criteria": {
            "true": "After an `await` or in a promise/subscription callback, the code writes to a store, context or component state with no AbortSignal check, request/generation id comparison, `cancelled` flag or profile-id check, in a context where the input can change while in flight.",
            "false": "The write is guarded by an AbortSignal, request/generation id, a `cancelled` flag from effect cleanup, or a profile-id check; the write is keyed by the input that started it (`cache[pubkey] = result`); the state is identity-independent and last-writer-wins is harmless; the work runs once for the app lifetime."
          },
          "appliesTo": [],
          "when": "await |\\.then\\(|useEffect|subscribe\\("
        },
        {
          "id": "doc/docs/review/contributor-conventions/async-cleanup",
          "section": "async/cleanup",
          "message": "A subscription, timer or background promise may be left running or its failure silently swallowed.",
          "instructions": "Does `hunk` start a subscription, listener, interval, timeout or background promise that is never torn down, or silently swallow a failure — a `void` promise doing visible network, storage or wallet work with no `.catch`, or an empty `catch {}` with no comment saying why ignoring it is safe?",
          "criteria": {
            "true": "A `setInterval`/`setTimeout`/`addEventListener`/`subscribe` is created with no matching clear/remove/unsubscribe or effect cleanup, or a `void somePromise()` doing network/storage/wallet work has no `.catch`, or a `catch {}`/`catch { }` body is empty and uncommented.",
            "false": "Effects return cleanup that unsubscribes or clears; the promise has `.catch(...)` or try/catch inside the async body; `void` on calls that cannot reject or handle their own errors (haptics, loggers, navigation, `preventAutoHideAsync`); an empty catch with a comment explaining why the failure is expected and harmless; module-level singletons meant to live for the app lifetime."
          },
          "appliesTo": [],
          "when": "setInterval|setTimeout|addEventListener|subscribe\\(|void |catch\\s*\\{"
        },
        {
          "id": "doc/docs/review/contributor-conventions/net-transport",
          "section": "net/transport",
          "message": "A screen-local network call may bypass the domain transport and run without cancellation or a deadline.",
          "instructions": "Does `hunk` call `fetch(`, `axios`, `XMLHttpRequest` or `new WebSocket(` from a screen, component, hook or feature module instead of a transport module, or make a network request with neither an AbortSignal nor a bounded timeout?",
          "criteria": {
            "true": "A raw `fetch`/`axios`/`XMLHttpRequest`/`new WebSocket` appears in a screen, component, hook or feature file, or a request is issued without any `signal` or timeout.",
            "false": "The file is itself the transport/client module for one service (apiClient, safeFetch, a `*Client.ts` or `api.ts`) and threads a signal or timeout through; the request goes through such a module; e2e or test-harness code; `fetch` of a local `file://` or bundled asset."
          },
          "appliesTo": [],
          "when": "fetch\\(|axios|XMLHttpRequest|new WebSocket"
        },
        {
          "id": "doc/docs/review/contributor-conventions/net-retries",
          "section": "net/retries",
          "message": "A side-effecting operation may be repeated, or retried without a bound.",
          "instructions": "Does `hunk` retry — via a loop, backoff helper or re-invocation after failure — an operation with side effects (payment, melt, mint, swap, send, publish or other write that may already have happened), or retry anything without a bound on attempts?",
          "criteria": {
            "true": "A retry loop / `retry(...)` / recursive re-invocation wraps a melt, mint, swap, send, pay or publish call, or a retry has no maximum attempt count.",
            "false": "Bounded retries of idempotent reads (GETs, quote or proof-state checks, metadata fetches) with backoff; bounded re-preparation of an operation not yet executed; reconciling a failed side effect by checking persisted or mint state; resending the same already-signed Nostr event."
          },
          "appliesTo": [],
          "when": "[Rr]etry|[Rr]etries|backoff|attempt"
        },
        {
          "id": "doc/docs/review/contributor-conventions/input-parse-at-boundary",
          "section": "input/parse-at-boundary",
          "message": "Untrusted input may be cast instead of validated at the boundary.",
          "instructions": "Does `hunk` take untrusted input — a network or relay response, `JSON.parse` output, storage read, QR, clipboard or NFC data, or a native callback payload — and use it through a TypeScript cast (`as T`, `as unknown as T`) or unchecked property access instead of validating it with a Zod schema or a dedicated protocol decoder?",
          "criteria": {
            "true": "A response body, `JSON.parse(...)`, storage read or scanned payload is cast with `as SomeType` / `as unknown as` or has its fields read directly, with no `.parse`/`.safeParse` or protocol decoder applied.",
            "false": "The input is validated by a Zod schema or a protocol library decoder with typed output (`getDecodedToken`, `nip19.decode`, a bolt11 decoder); the value comes from an SDK that already validated it; casts of trusted in-process values or this app's own typed stores; route params used as plain string identifiers; `unknown` narrowed with explicit `typeof` checks on every field read."
          },
          "appliesTo": [],
          "when": "JSON\\.parse|as unknown as|as [A-Z]|getItem\\(|\\.json\\(\\)"
        },
        {
          "id": "doc/docs/review/contributor-conventions/input-structure-not-trust",
          "section": "input/structure-not-trust",
          "message": "A successful schema parse may be treated as a verified signature, authorization or spendability.",
          "instructions": "Does `hunk` treat a successful schema parse or shape check as proof that a Nostr event signature is valid, that an action is authorized, or that Cashu proofs are spendable — acting on the parsed data without a separate signature, permission or proof-state check?",
          "criteria": {
            "true": "After `.parse`/`.safeParse` succeeds, the code treats the event as authentic, grants an action, or spends/credits proofs, with no `verifyEvent`, permission check or mint proof-state check visible.",
            "false": "Signatures, permissions or proof states are checked separately; the parsed data is only displayed or stored as unverified."
          },
          "appliesTo": [],
          "when": "safeParse|\\.parse\\(|[Ss]ignature|[Vv]erify"
        },
        {
          "id": "doc/docs/review/contributor-conventions/money-exact",
          "section": "money/exact",
          "message": "An amount that decides a payment may be computed with floating-point or coerced input.",
          "instructions": "Does `hunk` compute an amount that decides what is paid, sent, minted or received (sats, msats, proof amounts, fees, invoice amounts) using floating-point BTC math, `toFixed`, `Math.round`/`floor`/`ceil` of fractional values or `parseFloat`, or by silently coercing invalid, negative, NaN or fractional input into a valid amount?",
          "criteria": {
            "true": "A value passed to a pay/send/mint/melt call or stored as a proof/fee amount is produced by `parseFloat`, `toFixed`, BTC↔sat float division/multiplication, rounding of a fractional value, or an `|| 0` / clamp that turns invalid or negative input into a spendable number.",
            "false": "Integer arithmetic on sat or msat integers; conversions for display only (fiat labels, formatted strings, charts); rounding inside a fiat estimate that never decides what is paid; input validation that rejects invalid values; `Math.ceil` of an integer division used for fee reserves in integer sats."
          },
          "appliesTo": [],
          "when": "toFixed|parseFloat|Math\\.(round|floor|ceil)|1e8|100000000"
        },
        {
          "id": "doc/docs/review/contributor-conventions/time-unit-in-names",
          "section": "time/units",
          "message": "A duration or timestamp name may not state its unit.",
          "instructions": "Does `hunk` declare a variable, constant, field or parameter holding a numeric duration or timestamp whose name does not state its unit (e.g. `timeout`, `createdAt`, `expiry`, `delay`, `ttl`, `interval`)?",
          "criteria": {
            "true": "A new numeric time-valued declaration is named without a unit suffix, such as `const timeout = 5000`, `createdAt: number`, `expiry`, `delay`, `ttl`.",
            "false": "Names carry the unit (`timeoutMs`, `createdAtSec`, `ttlSeconds`, `STALE_MS`); Nostr protocol field names (`created_at`, `since`, `until`); `Date` objects; option names fixed by a library or wire format (`setTimeout(fn, delayMs)`, `{ timeout }` passed to an external API, `staleTime` in React Query options)."
          },
          "appliesTo": [],
          "when": "[Tt]imeout|[Dd]elay|[Ee]xpir|[Tt]tl|createdAt|updatedAt|[Ii]nterval"
        },
        {
          "id": "doc/docs/review/contributor-conventions/time-seconds-ms-mix",
          "section": "time/units",
          "message": "Nostr seconds may be mixed with JavaScript milliseconds without conversion.",
          "instructions": "Does `hunk` compare or combine a Nostr seconds value (`created_at`, `since`, `until`) with a millisecond value (`Date.now()`, a `*Ms` field) without an explicit ×1000 or ÷1000 conversion?",
          "criteria": {
            "true": "An expression subtracts, compares or assigns a `created_at`/`since`/`until` seconds value against `Date.now()` or a millisecond value with no visible conversion factor.",
            "false": "The conversion is explicit (`created_at * 1000`, `Math.floor(Date.now() / 1000)`) or happens once at the boundary; both sides use the same unit."
          },
          "appliesTo": [],
          "when": "created_at|\\bsince\\b|\\buntil\\b|Date\\.now\\(\\)"
        },
        {
          "id": "doc/docs/review/contributor-conventions/secrets-storage",
          "section": "secrets/storage",
          "message": "A signing secret may be placed outside secure storage.",
          "instructions": "Does `hunk` put a mnemonic, seed, private key, nsec or other signing secret anywhere other than secure storage (expo-secure-store or the key vault module) — a Zustand store, AsyncStorage or MMKV, route params, a URL, a testID, a fixture or a log?",
          "criteria": {
            "true": "A value named or clearly holding a mnemonic/seed/privkey/nsec/signing secret is written to a store's state, AsyncStorage/MMKV, a navigation param, a URL, a `testID` or a log call.",
            "false": "Only public keys, npubs, key ids, pairing metadata without secrets, or opaque references are stored; secrets pass in memory to signing or into SecureStore."
          },
          "appliesTo": [],
          "when": "mnemonic|seed|nsec|privateKey|privkey|secretKey"
        },
        {
          "id": "doc/docs/review/contributor-conventions/secrets-logs",
          "section": "secrets/logs",
          "message": "A log may include secret or sensitive payload data.",
          "instructions": "Does `hunk` log (via `log.*`, `console.*`, a logger, analytics or an error report) a value that is or contains seed words, a private key, Cashu proofs or an encoded token, a Lightning invoice, DM plaintext, a PIN, raw NFC bytes, or a URL carrying credentials?",
          "criteria": {
            "true": "A logging call passes a mnemonic, private key, `proofs`, an encoded cashu token, a bolt11 invoice, decrypted message content, a PIN, NFC byte payload, or a credential-bearing URL.",
            "false": "Logs record only counts, amounts, ids, hashes, short fingerprints, mint URLs, states or error codes."
          },
          "appliesTo": [],
          "when": "console\\.|log\\.(debug|info|warn|error)|logger\\."
        },
        {
          "id": "doc/docs/review/contributor-conventions/secrets-randomness",
          "section": "secrets/randomness",
          "message": "Security-relevant randomness may come from a non-cryptographic source.",
          "instructions": "Does `hunk` use `Math.random`, a time-based value or hand-rolled cryptography to produce a security-relevant value (keys, secrets, nonces, blinding factors, proof secrets, auth tokens, pairing codes)?",
          "criteria": {
            "true": "`Math.random()` or `Date.now()`-derived bytes feed a key, secret, nonce, blinding factor, proof secret, token or pairing code, or crypto primitives are implemented by hand.",
            "false": "`Math.random` for jitter, animation, UI keys, sampling or placeholders; randomness from expo-crypto, `crypto.getRandomValues`, or @noble/@scure libraries."
          },
          "appliesTo": [],
          "when": "Math\\.random"
        },
        {
          "id": "doc/docs/review/contributor-conventions/mock-isolation",
          "section": "mock/isolation",
          "message": "Mock Mode data may leak into real stores, caches, persistence or network actions.",
          "instructions": "Does `hunk` let Mock Mode, demo or fake data flow into Coco, transaction stores, Nostr or query caches, or persisted storage, or let it trigger a real publish, zap or payment?",
          "criteria": {
            "true": "Mock/demo/fake values are written into a persisted or shared store or query cache, or a mock-gated path calls a real publish, zap or pay function.",
            "false": "Mock data stays in presentation-only memory gated by the mock flag; test fixtures and e2e harness code."
          },
          "appliesTo": [],
          "when": "[Mm]ock|demo|fake"
        },
        {
          "id": "doc/docs/review/contributor-conventions/arch-payment-logic-in-app",
          "section": "arch/owner",
          "message": "Payment sequencing may be living in `app/` instead of `wallet/`.",
          "instructions": "Does this file under `app/` implement payment sequencing, proof selection, mint/melt/swap orchestration or payment retries rather than calling a wallet API?",
          "criteria": {
            "true": "Code in `app/` selects proofs, orders mint/melt/swap steps, or retries/reconciles a payment itself.",
            "false": "UI that calls a wallet API and renders the result; device I/O, native bridges and screen glue; files outside `app/`."
          },
          "appliesTo": [
            "app/**"
          ],
          "when": "melt|mint|swap|proofs|[Pp]ayment"
        },
        {
          "id": "doc/docs/review/contributor-conventions/arch-domain-imports-app",
          "section": "arch/owner",
          "message": "A domain package may be importing app modules, navigation or app stores.",
          "instructions": "Does this file under `wallet/` or `nostr/` import an app module, Expo Router/navigation, or an app store?",
          "criteria": {
            "true": "An added import in `wallet/**` or `nostr/**` resolves to `app/…`, `expo-router`, `@react-navigation/*`, or an app-level store.",
            "false": "Imports are limited to the domain package, shared libraries or third-party SDKs."
          },
          "appliesTo": [
            "wallet/**",
            "nostr/**"
          ],
          "when": "^\\+.*import"
        },
        {
          "id": "doc/docs/review/contributor-conventions/arch-grab-bag-module",
          "section": "arch/owner",
          "message": "A generic utils/helpers module may be accumulating unrelated concerns.",
          "instructions": "Does `hunk` add functions covering unrelated concerns to a module named `utils`, `helpers`, `misc` or `common`?",
          "criteria": {
            "true": "New exports in a `utils`/`helpers`/`misc`/`common` file address different, unrelated domains (e.g. a date formatter next to a wallet calculation).",
            "false": "A focused single-purpose module in `app/shared/lib` or `app/shared/hooks` with one clear purpose (a formatter, the logger, a cache factory, a color helper, `useDebouncedValue`)."
          },
          "appliesTo": [
            "**/utils.ts",
            "**/utils/**",
            "**/helpers.ts",
            "**/helpers/**",
            "**/misc.ts",
            "**/common.ts"
          ]
        },
        {
          "id": "doc/docs/review/contributor-conventions/arch-caller-flag-switch",
          "section": "arch/owner",
          "message": "A shared function's behaviour may be switched by caller-specific flags.",
          "instructions": "Does `hunk` add a parameter or flag to a shared function whose value names a specific caller, screen or feature and switches the function's behaviour (e.g. `isFromSendScreen`, `mode: 'settings' | 'onboarding'`, `caller`)?",
          "criteria": {
            "true": "A shared helper branches on a boolean or string option that identifies which caller invoked it.",
            "false": "Parameters describe data or behaviour rather than callers; separate functions per concern; variants chosen by domain-meaningful enums."
          },
          "appliesTo": [],
          "when": "[Ff]rom[A-Z]|isFor|caller|mode\\s*[:=]"
        },
        {
          "id": "doc/docs/review/contributor-conventions/naming-verbs",
          "section": "naming/verbs",
          "message": "A function's leading verb may contradict what its body does.",
          "instructions": "Does `hunk` define a function whose leading verb contradicts its visible body: `get*` that is async or performs network/storage I/O; `fetch*` that performs no network read; `load*` that reads the network; `build*`/`compute*` with side effects; `format*` returning something other than display text; `parse*` that does not decode text or unknown input?",
          "criteria": {
            "true": "A defined function's name and its visible body disagree, e.g. `async function getProfile()` calling `fetch`, or `buildX()` writing to a store.",
            "false": "The body matches the verb; `get*` returning a cached or in-memory value synchronously; React hooks (`use*`); names imposed by an interface, library or protocol; the body isn't visible in the hunk."
          },
          "appliesTo": [],
          "when": "(function|const)\\s+(get|fetch|load|build|compute|format|parse)[A-Z]"
        },
        {
          "id": "doc/docs/review/contributor-conventions/naming-protocol-values",
          "section": "naming/protocol",
          "message": "A protocol value may be named too generically to show its kind and encoding.",
          "instructions": "Does `hunk` declare a new variable, field, parameter or prop holding a protocol value under a bare generic name — `token`, `secret`, `pubkey`, `quote`, `invoice` — where nothing nearby makes its kind and encoding clear, or add a new regex for Nostr, Cashu or Lightning identifiers instead of reusing `protocolIds`?",
          "criteria": {
            "true": "A new declaration uses a bare `token`/`secret`/`pubkey`/`quote`/`invoice` name with no type or container clarifying encoding, or a new regex literal matches npub/nsec/note/cashu/lnbc identifiers.",
            "false": "Names state meaning (`cashuTokenEncoded`, `nostrPubkeyHex`, `mintQuoteId`, `lnInvoiceBolt11`); names scoped by their container (`quote.id` on a `MintQuote`, `event.pubkey`); field names fixed by a protocol, SDK or wire format; destructured SDK fields; reuse of `protocolIds`."
          },
          "appliesTo": [],
          "when": "token|secret|pubkey|quote|invoice|npub|lnbc"
        },
        {
          "id": "doc/docs/review/contributor-conventions/native-tabs-static-triggers",
          "section": "skill/expo-router/native-tabs-static-triggers",
          "message": "A runtime-varying set of NativeTabs triggers remounts the navigator and loses state.",
          "instructions": "Does `hunk` render `NativeTabs.Trigger` elements whose set can change at runtime — conditional rendering (`cond && <NativeTabs.Trigger>`, a ternary) or mapping over an array derived from state, props or runtime data?",
          "criteria": {
            "true": "A `NativeTabs.Trigger` is wrapped in `&&`/ternary on runtime state, or produced by `.map` over state-, prop- or hook-derived data.",
            "false": "A literal list of triggers, triggers using the `hidden` prop, or mapping over a module-level constant array whose set cannot change at runtime."
          },
          "appliesTo": [
            "**/*.tsx"
          ],
          "when": "NativeTabs"
        },
        {
          "id": "doc/docs/review/contributor-conventions/native-tab-icon-md-prop",
          "section": "skill/expo-router/native-tab-icon-md-prop",
          "message": "A NativeTabs icon with only an SF Symbol may not show up on Android.",
          "instructions": "Does `hunk` add a NativeTabs trigger icon that has an `sf` prop but no `md`, `src`, `drawable` or `xcasset` alternative?",
          "criteria": {
            "true": "An `<Icon sf=\"…\" />` (or equivalent NativeTabs icon) is added with no Android-side prop.",
            "false": "The icon has an Android alternative (`md`, `src`, `drawable`, `xcasset`), or the NativeTabs branch sits behind an iOS-only capability check with another tab bar serving Android."
          },
          "appliesTo": [
            "**/*.tsx"
          ],
          "when": "sf=|NativeTabs"
        },
        {
          "id": "doc/docs/review/contributor-conventions/prefer-native-modal-presentation",
          "section": "skill/expo-router/prefer-native-modal-presentation",
          "message": "Screen-like content may be presented in a React Native Modal instead of a modal route.",
          "instructions": "Does `hunk` add a React Native `<Modal>` (from 'react-native') to present screen-like content — a page with its own data, deep link or back-stack entry — instead of a route with `presentation: \"modal\"` or `\"formSheet\"`?",
          "criteria": {
            "true": "A `<Modal>` from react-native is added wrapping a full screen with its own fetching/navigation-like content.",
            "false": "A route with `presentation: \"modal\"` or `\"formSheet\"`; a transient dialog or prompt (one short field with Cancel/Save, a confirmation) over the current screen editing unsaved in-memory draft state; no Modal added."
          },
          "appliesTo": [
            "**/*.tsx"
          ],
          "when": "<Modal"
        },
        {
          "id": "doc/docs/review/contributor-conventions/stacks-in-layout-files",
          "section": "skill/expo-router/stacks-defined-in-layout-files",
          "message": "A Stack navigator outside a `_layout` file won't be wired into file-based routing correctly.",
          "instructions": "Does `hunk` render a `<Stack>` navigator (with children, `screenOptions`, or bare) in a file that is not a `_layout` file, where nothing in the hunk shows the component is a layout used by `_layout` files?",
          "criteria": {
            "true": "A non-`_layout` file returns `<Stack>` as a navigator.",
            "false": "A `<Stack>` in a `_layout` file; a shared layout component documented as rendered by `_layout` files as their default export; screen files only using `Stack.Screen`, `Stack.Toolbar`, `Stack.SearchBar` or similar sub-components to configure themselves."
          },
          "appliesTo": [
            "**/*.tsx"
          ],
          "when": "<Stack"
        },
        {
          "id": "doc/docs/review/contributor-conventions/prefer-native-tabs",
          "section": "skill/expo-router/prefer-native-tabs",
          "message": "A JS tab navigator may be used where NativeTabs would give a native tab bar.",
          "instructions": "Does `hunk` add a JS tab navigator (`Tabs` from `expo-router` or `@react-navigation/bottom-tabs`) as the only tab bar?",
          "criteria": {
            "true": "`<Tabs>` from expo-router or bottom-tabs is rendered with no NativeTabs branch present.",
            "false": "The layout renders NativeTabs where supported and uses JS `Tabs` only as a fallback; headless tabs from `expo-router/ui` in a `.web.tsx` file."
          },
          "appliesTo": [
            "**/*.tsx"
          ],
          "when": "<Tabs|bottom-tabs"
        },
        {
          "id": "doc/docs/review/contributor-conventions/ui-read-states",
          "section": "ui/read-states",
          "message": "A failed read may render as an empty result, or existing rows may vanish while refreshing.",
          "instructions": "Does `hunk` render an async-loaded list or value so that a failed or unavailable read shows the same UI as a genuinely empty result, or so that rows already on screen are replaced by a spinner, skeleton or empty state while refreshing or after a refresh fails?",
          "criteria": {
            "true": "The render branches only on `isLoading`/empty with no separate error branch, so an error path falls through to the empty state; or `isFetching`/`isRefetching` swaps existing data for a spinner or skeleton.",
