          "when": "isLoading|isError|isPending|isFetching|[Ee]mpty"
        },
        {
          "id": "doc/docs/review/contributor-conventions/ui-unknown-values",
          "section": "ui/unknown-values",
          "message": "An unknown value may be displayed as 0, or an image fallback shown before load state is known.",
          "instructions": "Does `hunk` display an unknown or not-yet-loaded count, total or amount as `0` (`count ?? 0` or `|| 0` feeding rendered text), or show an image fallback (initials, placeholder avatar) before the image source is known to be missing or failed?",
          "criteria": {
            "true": "A `?? 0` / `|| 0` on a possibly-unloaded count or amount is rendered into text, or a fallback avatar renders whenever the URL is falsy without any load/error state check.",
            "false": "Unknown values stay `undefined` and render a placeholder, skeleton or dash; `?? 0` used in arithmetic that is not displayed, or for values zero by definition when absent; avatars driven by `avatarStateFor` or an equivalent load-state check."
