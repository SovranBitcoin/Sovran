        {
          "id": "doc/docs/review/contributor-conventions/copy-sentences",
          "section": "copy/sentences",
          "message": "UI text may be assembled from fragments or English plural suffixes.",
          "instructions": "Does `hunk` build user-visible text by appending an English plural ending (`\"reply\" + (n === 1 ? \"\" : \"s\")`) or by concatenating separately written fragments of one sentence with `+` or across adjacent text nodes?",
