            "instructions": "BIP-39. Requirement: the wordlist used to decode a mnemonic must be the one it was generated from; the same words in a different language's list decode to different entropy, and only the checksum will show it. Does the code in `hunk` decode a mnemonic against a hardcoded or guessed wordlist without confirming the language, or mix words from different lists in one sentence? Answer false if `hunk` does not select a wordlist.",
