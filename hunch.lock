    {
      "id": "skill/codebase-design",
      "kind": "skill",
      "origin": "./.agents/skills/codebase-design",
      "path": ".agents/skills/codebase-design/SKILL.md",
      "scope": "",
      "hash": "ed4a1837af02ce111aa6613e9a04e3bbcc07e7732fe0c613cda2b6035404b8d6",
      "rules": [
        {
          "id": "skill/codebase-design/accept-dependencies-dont-create-them",
          "section": "Designing for testability > Accept dependencies, don't create them",
          "instructions": "Does `hunk` add a function or method that holds decision or domain logic and, inside that same body, constructs a new concrete client, gateway, connection or repository for an external service (e.g. `new StripeGateway()`, `new SomeHttpClient(token)`), which the logic then uses, with no parameter, option or overridable default through which a caller or test could pass a substitute?",
          "criteria": {
            "true": "Added code mixes branching or domain logic with constructing a new external-service dependency in the same body, so a test must patch a module, prototype or global to exercise the logic.",
            "false": "The dependency is passed in as a parameter or constructor argument, or supplied as an overridable default; the code is itself the adapter, driver or transport that implements a port or wraps a platform primitive (`fetch`, `fs`, a socket, a spawned process) and is what callers inject; the instance comes from an accessor returning a shared or memoised app-scoped instance rather than a new one, whatever the accessor is called (`buildX()`, `createX()`, `getX()`); the function's returned product is the constructed object (a factory, a server starter); the body is a composition root — app bootstrap, a React provider, a CLI or script `main`; or the constructed value is a plain in-memory value object, error or data structure."
          },
          "appliesTo": [],
          "when": "new\\s+[A-Z]\\w*\\s*\\(|createClient|createPool|\\.connect\\(",
          "message": "Constructing a dependency inside the function instead of accepting it makes the module untestable across its seam."
        },
        {
          "id": "skill/codebase-design/return-results-dont-mutate-inputs",
          "section": "Designing for testability > Return results, don't produce side effects",
          "instructions": "Does `hunk` add an exported function or public method that returns nothing and reports a computed value by assigning to, or deleting from, an object, array or map that its caller owns and will keep using, so callers must copy the argument first or read the answer back out of it?",
          "criteria": {
            "true": "The added exported function has no return value and its result is a change to a caller-owned argument (e.g. `cart.total -= discount`, evicting entries from a map the caller passed in), where the computed result could have been returned instead.",
            "false": "The added function returns the computed result; it is not exported and the structure it edits is a local accumulator, working buffer or builder that its caller created and then returns; the mutation is the module's intended side effect at an I/O seam (persisting, writing, emitting, rendering); the object is a draft handed over by a framework, store or transaction callback (a rehydrate or migrate hook, `update(record => …)`, an immer-style producer); it is a setter, reducer, event handler, interpreter scope or stack, or an in-memory cache the module owns; or no new function is added."
          },
          "appliesTo": [],
          "message": "A function that mutates its argument instead of returning a result is harder to test through its interface."
        },
        {
          "id": "skill/codebase-design/no-pass-through-wrapper",
          "section": "Principles > The deletion test",
          "instructions": "Does `hunk` add an exported function, component or public method that callers could replace by calling another function or component of this codebase they can already import, with exactly the same arguments — nothing bound, fixed, reordered, projected or parsed, no closure or instance state supplied, and the result returned unchanged?",
          "criteria": {
            "true": "A newly added public/exported function, method or component is a same-signature alias of another exported one in this codebase, such as `export function b(x) { return a(x) }` or a component that renders one other component with identical props.",
            "false": "The delegation adds behaviour (mapping, defaults, validation, error translation, retries); an argument is bound, fixed or derived, or transformed before the call (`f(x.field)`, `f(g(x))`); two or more calls are composed; the target is private to the module, class or closure, or is a store or singleton the wrapper resolves; the target is a third-party, framework or platform API, so the wrapper is the single point of dependency or a test seam; the name or signature is dictated by a framework, plugin or native-binding registration; it is an adapter implementing a port at a seam; it is a re-export or deprecation shim; or it is a type-level declaration rather than an implementation."
          },
          "appliesTo": [],
          "message": "A pass-through wrapper adds interface without adding behaviour, making the module shallower."
        },
        {
          "id": "skill/codebase-design/tests-assert-through-interface",
          "section": "Deepening > Testing strategy: replace, don't layer",
          "instructions": "Does `hunk` add a test assertion that reaches state which is not part of the subject's exported or declared type — it needs a cast to `any`/`unknown`, bracket access to a private, `#` or underscore-prefixed member of the subject, or an import from a file the package does not export — rather than an observable outcome of its interface?",
          "criteria": {
            "true": "An added test asserts on internals, such as `expect((svc as any)._cache)`, reaching into `instance['privateField']`, or asserting on a value imported from a module's internal implementation file, rather than on a return value, thrown error, or effect visible at the interface.",
            "false": "Added tests assert on return values, thrown errors, or effects observable through the module's interface (including through a test adapter or in-memory stand-in at a declared seam); they read a property declared on the subject's public return type or exported interface, whatever it is named (`cache`, `pending`, `ref.current`); they read another module's state through that module's exported API; they inspect the arguments a mock or fake received at a declared seam; they use a library's own test helper (neverthrow `_unsafeUnwrap`); or the hunk adds no assertions."
          },
          "appliesTo": [
            "**/*.test.*",
            "**/*.spec.*",
            "**/tests/**",
            "**/test/**",
            "**/*_test.*",
            "**/*_spec.*"
          ],
          "message": "A test that inspects internal state will break on refactors that do not change behaviour."
        },
        {
          "id": "skill/codebase-design/no-test-only-public-surface",
          "section": "Deepening > Seam discipline > Internal seams vs external seams",
          "instructions": "Does `hunk` add a public/exported member that exists only so tests can reach inside the module (e.g. `__setInternalForTesting`, `resetStateForTests`, `_getInternals`, or an exported field commented as test-only)?",
          "criteria": {
            "true": "A newly exported function, method, or property is named or documented as being for tests only (`ForTesting`, `ForTests`, `__test`, `visibleForTesting`) and its purpose is to set or read implementation internals.",
            "false": "The added export is part of the module's real interface used by production callers; it is a dependency injected through a constructor or parameter at a declared seam; it lives inside a test file or test helper module; or it is an in-memory adapter intended as a second adapter at the seam."
          },
          "appliesTo": [],
          "when": "[Tt]est(ing|s)?\\b|__test|[Vv]isibleForTesting",
          "message": "Exposing an internal seam through the public interface for tests enlarges the interface callers must learn."
        }
      ],
      "notChecked": [
        {
          "section": "Glossary / Rejected framings",
          "reason": "Terminology discipline (say 'seam' not 'boundary', avoid 'API', 'component', 'service') applies to design prose and naming judgement; enforcing it on code chunks would fire constantly on legitimate uses."
        },
        {
          "section": "Deep vs shallow / Depth as leverage",
          "reason": "Judging whether a module is deep or shallow requires weighing interface size against hidden behaviour across the whole module and its callers, which is not visible in one chunk."
        },
        {
          "section": "Principles > One adapter means a hypothetical seam",
          "reason": "Deciding whether a newly introduced port has two justified adapters requires looking across files for other implementations."
        },
        {
          "section": "Principles > The interface is the test surface",
          "reason": "Whether a test crosses the module's intended seam depends on the module's overall shape, not on a single chunk."
        },
        {
          "section": "Deepening > Dependency categories",
          "reason": "Classifying a dependency as in-process, local-substitutable, remote-but-owned, or true external requires repo-wide and deployment knowledge."
        },
        {
          "section": "Deepening > Testing strategy: replace, don't layer",
          "reason": "'Delete the old shallow-module unit tests' is a cross-file migration concern; the classifier cannot see whether superseding tests exist elsewhere."
        },
        {
          "section": "Design It Twice > Process",
          "reason": "Process guidance about framing the problem space, spawning sub-agents, and presenting comparisons; not a property of code."
        },
        {
          "section": "Designing for testability > Small surface area",
          "reason": "Requires counting methods and parameters and comparing against alternatives, which the classifier cannot do."
        },
        {
          "section": "Relationships",
          "reason": "Definitional model of the vocabulary; states no reviewable condition on code."
        }
      ]
    },
    {
      "id": "skill/expo-router",
      "kind": "skill",
      "origin": "./.agents/skills/expo-router",
      "path": ".agents/skills/expo-router/SKILL.md",
      "scope": "",
      "hash": "e299a703812166506958fa1067ddfab786d958396a74b331f08e954f555f607a",
      "rules": [
        {
          "id": "skill/expo-router/no-direct-react-navigation-import",
          "section": "Library Preferences",
          "instructions": "Does `hunk` add an import from a `@react-navigation/*` package (e.g. `@react-navigation/native`, `/core`, `/elements`, `/routers`) rather than from `expo-router/react-navigation`?",
          "criteria": {
            "true": "An added line imports or requires any `@react-navigation/...` module, including type-only imports of things like `Theme` or `NavigationContainer`.",
            "false": "Imports come from `expo-router`, `expo-router/react-navigation`, `expo-router/stack`, or `expo-router/unstable-native-tabs`; or the hunk only removes such an import."
          },
          "appliesTo": [
            "**/*.ts",
            "**/*.tsx",
            "**/*.js",
            "**/*.jsx"
          ],
          "when": "@react-navigation",
          "message": "Importing `@react-navigation/*` directly instead of `expo-router/react-navigation` can pull in a mismatched copy of React Navigation."
        },
        {
          "id": "skill/expo-router/prefer-color-over-platformcolor",
          "section": "Library Preferences",
          "instructions": "Does `hunk` add a use of `PlatformColor` (or `DynamicColorIOS` wrapping a semantic system color) for a semantic color instead of `Color` from `expo-router`?",
          "criteria": {
            "true": "An added line calls `PlatformColor(...)` to obtain a native semantic color for styling.",
            "false": "The hunk uses `Color` from `expo-router`, literal hex/rgba values, theme tokens, or `DynamicColorIOS` with explicit light/dark hex values as shown for tab tint colors."
          },
          "appliesTo": [
            "**/*.ts",
            "**/*.tsx"
          ],
          "when": "PlatformColor",
          "message": "Raw `PlatformColor` is used instead of `Color` from `expo-router`, losing type safety and automatic light/dark adaptation."
        },
        {
          "id": "skill/expo-router/no-colocation-in-app-dir",
          "section": "Routes > File Conventions",
          "instructions": "Does `hunk` add a file under the `app` directory that is a shared component, utility, type, constant or hook module rather than a route, i.e. it has no default-exported component?",
          "criteria": {
            "true": "A new file under `app/` (not `_layout`, not a `+`-prefixed special file) contains only named exports such as helpers, types, constants or reusable components, with no `export default` component.",
            "false": "The file is a route or `_layout` file with a default-exported component, is an Expo Router special file (`+not-found`, `+html`, `+native-intent`), lives outside `app/` (e.g. `components/`, `utils/`), or the hunk is a partial edit where the default export is simply not in view."
          },
          "appliesTo": [
            "**/app/**/*.ts",
            "**/app/**/*.tsx"
          ],
          "message": "Non-route modules in the `app` directory are treated as routes by Expo Router."
        },
        {
          "id": "skill/expo-router/no-parenthesized-route-file",
          "section": "Routes > File Conventions",
          "instructions": "Is the file under review a route file whose base name is wrapped in parentheses, such as `(home).tsx`, instead of a directory `(home)/index.tsx`?",
          "criteria": {
            "true": "The path under `app/` ends in a file like `(group).tsx` / `(group).js`.",
            "false": "Parentheses appear only on a directory segment (`app/(home)/index.tsx`), or the file name has no parentheses."
          },
          "appliesTo": [
            "**/app/**/*.ts",
            "**/app/**/*.tsx",
            "**/app/**/*.js",
            "**/app/**/*.jsx"
          ],
          "message": "A route file named `(foo).tsx` is not a valid Expo Router route; it must be `(foo)/index.tsx`."
        },
        {
          "id": "skill/expo-router/prefer-native-tabs",
          "section": "Native Tabs",
          "instructions": "Does `hunk` add a tab navigator using `Tabs` / `Tabs.Screen` from `expo-router` instead of `NativeTabs` from `expo-router/unstable-native-tabs`?",
          "criteria": {
            "true": "Added JSX renders `<Tabs>` or `<Tabs.Screen>` with options like `tabBarIcon` or `tabBarBadge`, or imports `Tabs` from `expo-router`.",
            "false": "The hunk uses `NativeTabs` / `NativeTabs.Trigger`, uses headless tabs from `expo-router/ui` in a `.web` layout file, or only removes the JS `Tabs` usage."
          },
          "appliesTo": [
            "**/*.tsx",
            "**/*.jsx"
          ],
          "when": "<Tabs[\\s>/]|Tabs\\.Screen|tabBarIcon|tabBarBadge",
          "message": "JS `Tabs` from `expo-router` is used where `NativeTabs` gives the native tab bar."
        },
        {
          "id": "skill/expo-router/native-tab-icon-missing-md",
          "section": "Native Tabs > Icon Component",
          "instructions": "Does `hunk` add a NativeTabs tab icon that sets `sf` but no `md` prop?",
          "criteria": {
            "true": "An added `<NativeTabs.Trigger.Icon ... />` (or standalone `<Icon ... />` in a NativeTabs trigger) has an `sf` prop and no `md` prop.",
            "false": "The icon also passes `md`, or it uses `src`/`xcasset`/`drawable` or `NativeTabs.Trigger.VectorIcon` instead of `sf`, or the file is an iOS-only `.ios.tsx` variant."
          },
          "appliesTo": [
            "**/*.tsx"
          ],
          "when": "sf=",
          "message": "A tab icon with only `sf` will not render on Android without the `md` Material Symbol prop."
        },
        {
          "id": "skill/expo-router/stack-navigator-outside-layout",
          "section": "Stack",
          "instructions": "Does `hunk` render a `<Stack>` navigator element in a file that is not a `_layout` file?",
          "criteria": {
            "true": "Added JSX renders the `<Stack>` (or `<Stack>...</Stack>`) navigator in a screen/component file whose name is not `_layout.tsx`.",
            "false": "The file is a `_layout` file; or the hunk only uses per-screen children such as `<Stack.Screen>`, `<Stack.Title>`, `<Stack.SearchBar>`, `<Stack.Toolbar>` or `<Stack.Header>` without rendering the navigator itself."
          },
          "appliesTo": [
            "**/*.tsx",
            "**/*.jsx"
          ],
          "when": "<Stack[\\s>]",
          "message": "A `<Stack>` navigator rendered outside a `_layout` file will not define the navigation stack correctly."
        },
        {
          "id": "skill/expo-router/dynamic-native-tab-triggers",
          "section": "Native Tabs > Conditional Tabs",
          "instructions": "Does `hunk` render `NativeTabs.Trigger` children dynamically — via `.map()` over runtime data or a conditional `{cond && <NativeTabs.Trigger .../>}` — instead of a static list?",
          "criteria": {
            "true": "Added JSX builds NativeTabs triggers from an array with `.map(...)`, or wraps a trigger in a `&&` / ternary that can change after the first render.",
            "false": "Triggers are written out statically, including ones that use the `hidden={...}` prop for conditional tabs, or the `hidden` prop on `NativeTabs` itself to hide the whole bar."
          },
          "appliesTo": [
            "**/*.tsx"
          ],
          "when": "NativeTabs",
          "message": "Adding or removing `NativeTabs.Trigger` elements at runtime remounts the navigator and loses navigation state."
        },
        {
          "id": "skill/expo-router/unstable-settings-initial-route-name",
          "section": "Route Settings",
          "instructions": "Does `hunk` add `initialRouteName` inside an `unstable_settings` export instead of `anchor`?",
          "criteria": {
            "true": "An added line sets `initialRouteName:` within an exported `unstable_settings` object.",
            "false": "The settings object uses `anchor` (including the per-segment form `index: { anchor: \"index\" }`), or `initialRouteName` appears somewhere unrelated to `unstable_settings`."
          },
          "appliesTo": [
            "**/*.ts",
            "**/*.tsx"
          ],
          "when": "initialRouteName",
          "message": "`initialRouteName` was renamed to `anchor` in Expo Router v4 and no longer takes effect."
        },
        {
          "id": "skill/expo-router/bottom-accessory-internal-state",
          "section": "Native Tabs > Bottom Accessory",
          "instructions": "Does `hunk` define the component rendered inside `NativeTabs.BottomAccessory` with its own `useState`/`useReducer` state rather than receiving it via props, context or an external store?",
          "criteria": {
            "true": "A component visibly used as a child of `<NativeTabs.BottomAccessory>` declares its own `useState`/`useReducer` for the accessory's shared state.",
            "false": "The accessory component takes the state as props or reads it from context/an external store (state lifted to the layout or a store), or the hunk does not show the accessory component's body."
          },
          "appliesTo": [
            "**/*.tsx"
          ],
          "when": "BottomAccessory",
          "message": "Two instances of a bottom accessory render at once, so state held inside it will diverge between them."
        },
        {
          "id": "skill/expo-router/prefer-modal-route-over-custom-modal",
          "section": "Navigation > Modal",
          "instructions": "Does `hunk` add a custom modal built with React Native's `Modal` component instead of presenting a route with `presentation: \"modal\"` or `\"formSheet\"`?",
          "criteria": {
            "true": "Added code imports `Modal` from `react-native` (or renders `<Modal visible={...}>`) to present a screen-level overlay.",
            "false": "The hunk configures a route via `<Stack.Screen options={{ presentation: \"modal\" | \"formSheet\" }} />`, or `Modal` refers to an unrelated identifier such as a route/component name."
          },
          "appliesTo": [
            "**/*.tsx",
            "**/*.jsx"
          ],
          "when": "Modal",
          "message": "A hand-built modal is used where a route with `presentation: \"modal\"` or `\"formSheet\"` is preferred."
        },
        {
          "id": "skill/expo-router/toolbar-parts-inside-stack-toolbar",
          "section": "Recommendations",
          "instructions": "Does `hunk` render a `Stack.Toolbar.*` sub-component (e.g. `Stack.Toolbar.Button`, `Stack.Toolbar.Menu`, `Stack.Toolbar.Spacer`, `Stack.Toolbar.View`, `Stack.Toolbar.SearchBarSlot`) that is not inside an enclosing `<Stack.Toolbar>` element in this chunk?",
          "criteria": {
            "true": "A component or JSX fragment returns bare `Stack.Toolbar.Button`/`Stack.Toolbar.Menu`/etc. (e.g. wrapped only in `<>...</>`) with no `<Stack.Toolbar>` ancestor visible, so it is meant to be dropped into a toolbar from another component.",
            "false": "The sub-components sit inside a visible `<Stack.Toolbar ...>` (including nested `Stack.Toolbar.MenuAction` inside `Stack.Toolbar.Menu` inside the toolbar), or the extracted component itself returns `<Stack.Toolbar>` wrapping them."
          },
          "appliesTo": [
            "**/*.tsx",
            "**/*.jsx"
          ],
          "when": "Stack\\.Toolbar\\.",
          "message": "Stack.Toolbar.* elements rendered outside a Stack.Toolbar will not appear."
        },
        {
          "id": "skill/expo-router/header-spacer-needs-width",
          "section": "Components > Spacer / Limitations",
          "instructions": "Does `hunk` add a `<Stack.Toolbar.Spacer />` with no `width` prop inside a `Stack.Toolbar` whose `placement` is `\"left\"` or `\"right\"`?",
          "criteria": {
            "true": "A spacer without `width` appears inside a toolbar explicitly placed in the header (`placement=\"left\"` or `placement=\"right\"`).",
            "false": "The spacer has a `width` prop, or it is inside a bottom toolbar (`placement=\"bottom\"` or no `placement`, where flexible spacers are intended), or the surrounding placement is not visible."
          },
          "appliesTo": [
            "**/*.tsx",
            "**/*.jsx"
          ],
          "when": "Stack\\.Toolbar\\.Spacer",
          "message": "A header Spacer without an explicit width has no size."
        },
        {
          "id": "skill/expo-router/toolbar-view-child-explicit-size",
          "section": "Components > View",
          "instructions": "Does `hunk` add a `<Stack.Toolbar.View>` whose inline child element's `style` lacks an explicit `width` and `height`?",
          "criteria": {
            "true": "The child of `Stack.Toolbar.View` is an inline element (e.g. `<View style={{ justifyContent: \"center\" }}>`) whose style sets neither `width` nor `height` explicitly.",
            "false": "The child's style sets explicit `width` and `height`, or the child is a custom component whose internal styles are not in this chunk."
          },
          "appliesTo": [
            "**/*.tsx",
            "**/*.jsx"
          ],
          "when": "Stack\\.Toolbar\\.View",
          "message": "A Stack.Toolbar.View child without explicit width and height may not lay out."
        },
        {
          "id": "skill/expo-router/toolbar-view-single-child",
          "section": "Components > View",
          "instructions": "Does `hunk` give `<Stack.Toolbar.View>` more than one child element?",
          "criteria": {
            "true": "`Stack.Toolbar.View` wraps two or more sibling elements (e.g. a fragment or several adjacent JSX elements).",
            "false": "`Stack.Toolbar.View` wraps exactly one element, which may itself contain nested children."
          },
          "appliesTo": [
            "**/*.tsx",
            "**/*.jsx"
          ],
          "when": "Stack\\.Toolbar\\.View",
          "message": "Stack.Toolbar.View expects a single child element."
        },
        {
          "id": "skill/expo-router/no-bottom-toolbar-in-layout",
          "section": "Limitations",
          "instructions": "In this layout file, does `hunk` add a `Stack.Toolbar` with `placement=\"bottom\"` or with no `placement` prop (which defaults to bottom)?",
          "criteria": {
            "true": "A `<Stack.Toolbar>` in a `_layout` file either sets `placement=\"bottom\"` or omits `placement` entirely.",
            "false": "The toolbar sets `placement=\"left\"` or `placement=\"right\"`, or no `Stack.Toolbar` is added here."
          },
          "appliesTo": [
            "**/_layout.tsx",
            "**/_layout.jsx"
          ],
          "when": "Stack\\.Toolbar",
          "message": "placement=\"bottom\" toolbars only work in screen components, not layout files."
        },
        {
          "id": "skill/expo-router/badge-header-placement-only",
          "section": "Limitations",
          "instructions": "Does `hunk` use `Stack.Toolbar.Badge` inside a `Stack.Toolbar` whose `placement` is `\"bottom\"` or omitted?",
          "criteria": {
            "true": "A badge is added inside a toolbar with `placement=\"bottom\"` or with no `placement` prop (defaulting to bottom).",
            "false": "The badge is inside a toolbar with `placement=\"left\"` or `placement=\"right\"`, or the enclosing toolbar's placement is not visible."
          },
          "appliesTo": [
            "**/*.tsx",
            "**/*.jsx"
          ],
          "when": "Stack\\.Toolbar\\.Badge",
          "message": "Stack.Toolbar.Badge only works with placement \"left\" or \"right\"."
        },
        {
          "id": "skill/expo-router/applezoom-single-child",
          "section": "Apple Zoom Transitions > Targeted Zoom with Link.AppleZoom",
          "instructions": "Does `hunk` give `<Link.AppleZoom>` more than one child element?",
          "criteria": {
            "true": "`Link.AppleZoom` wraps two or more sibling elements (e.g. an image plus a caption, or a fragment of siblings).",
            "false": "`Link.AppleZoom` wraps exactly one element, which may have nested children of its own."
          },
          "appliesTo": [
            "**/*.tsx",
            "**/*.jsx"
          ],
          "when": "Link\\.AppleZoom\\b",
          "message": "Link.AppleZoom accepts only a single child element."
        }
      ],
      "notChecked": [
        {
          "section": "Code Style > File names",
          "reason": "kebab-case and 'no special characters' are pure path/regex checks, and a hunk cannot tell a newly added file from an edit to a pre-existing one, so it would fire on every unrelated change in such a file."
        },
        {
          "section": "Code Style > Removing old route files",
          "reason": "Requires knowing the whole route tree before and after a restructure; not decidable from one hunk."
        },
        {
          "section": "Code Style > Path aliases",
          "reason": "Depends on tsconfig alias configuration that is not visible, and 'prefer aliases' is a soft preference."
        },
        {
          "section": "Routes > Route matching \"/\"",
          "reason": "Whole-repo property: needs the full `app` directory listing."
        },
        {
          "section": "Library Preferences > Stack import path",
          "reason": "Guidance is internally inconsistent — the top-level text says `expo-router/stack` while the form-sheet and toolbar references import `Stack` from `expo-router`."
        },
        {
          "section": "Behavior > Prefer Stack.SearchBar",
          "reason": "Conflicts with the search reference, which documents `headerSearchBarOptions` and a `useSearch` hook using `navigation.setOptions`; no single-hunk criterion separates the sanctioned cases."
        },
        {
          "section": "Navigation > Link Previews and Context Menus",
          "reason": "'Whenever possible' / 'frequently' is subjective; a link without a preview is not itself a defect."
        },
        {
          "section": "Native Tabs > Trigger name must match route name",
