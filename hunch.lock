          "level": "error",
          "question": {
            "kind": "noul",
            "instructions": "BIP-39. Requirement: software must compute the checksum of an imported mnemonic against a wordlist and warn the user if it is invalid, because the conversion to a seed itself accepts any words and silently produces a different wallet. Does the code in `hunk` accept a user-supplied mnemonic and convert it to a seed without validating its checksum, or validate only that the words are in the list? Answer false if `hunk` does not import a user-supplied mnemonic.",
            "message": "BIP-39: verify an imported mnemonic's checksum and warn on failure; a typo otherwise opens an empty wallet.",
            "criteria": {
              "true": "An imported mnemonic is converted to a seed with no checksum verification or warning.",
              "false": "The checksum is verified or the user is warned, or the hunk does not import a mnemonic."
            },
            "threshold": 0.7,
            "files": [
              "**/*.ts",
              "**/*.tsx",
              "**/*.js",
              "**/*.jsx",
