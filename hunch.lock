      "id": "skill/typescript-best-practices",
      "kind": "skill",
      "origin": "./.agents/skills/typescript-best-practices",
      "path": ".agents/skills/typescript-best-practices/SKILL.md",
      "scope": "",
      "hash": "939669a962c074b6e2654782b55fd08fe89732fd738e81d453e1bbd0e99fc73a",
      "rules": [
        {
          "id": "skill/typescript-best-practices/unknown-over-any",
          "section": "`unknown` over `any`",
          "instructions": "Does `hunk` add a value, parameter, property, return type, generic argument, or cast typed as `any` (including `any[]`, `Promise<any>`, `as any`, `<any>`)?",
          "criteria": {
            "true": "An added line declares or asserts a type of `any` in any position, e.g. `function handle(input: any)`, `const x = data as any`, `Record<string, any>`, `catch (e: any)` used as a typed value.",
            "false": "Added code uses `unknown` (and narrows it), a concrete type, or an inferred type; `any` only appears in removed (`-`) lines, in a comment, or inside an unchanged context line."
          },
          "appliesTo": [
            "**/*.ts",
            "**/*.tsx"
          ],
          "when": "\\bany\\b",
          "message": "Using `any` disables type checking; external data should be `unknown` and narrowed."
        },
        {
          "id": "skill/typescript-best-practices/no-unearned-as-cast",
          "section": "No `as` casts",
          "instructions": "In code that runs outside a test, does `hunk` take a value that enters the program untyped — the result of `JSON.parse`, `res.json()`, a storage read, a route or deep-link param, a native-module, websocket or IPC payload, a caught error, or a parameter declared `unknown`/`any` — and use `as T` (or a generic `parse<T>()` helper that does so) to claim concrete required fields that no visible code checked, or cast a library's return value to a type that contradicts the one the library declares?",
          "criteria": {
            "true": "An added line asserts a domain type with required, non-`unknown` fields onto unchecked outside data, e.g. `const user = data as User`, `JSON.parse(raw) as Config`, `(await res.json()) as ApiResponse`, `event.data as Message`, `(err as Error).message`; or it re-types a library value against its declared type so that a field reads as a different primitive.",
            "false": "The cast is `as const`; the cast is the final step of a visible validation/parse function that already checked the fields; the cast applies a brand right after a validation check (`return input as AgentId` following an `isUUID` check); the visible code narrows with a discriminant, `in`, `typeof`/`instanceof`, or a schema `parse` instead of casting; the cast only widens, or targets `Record<string, unknown>` or an all-optional/all-`unknown` shape whose fields are each narrowed before use; the cast is to the raw input type of a decoder that is called on it next; the operand already has a static type from a library or this codebase and the cast bridges two such typings, re-parameterises a generic, indexes with `keyof typeof`, or views a `require()` or constructor result through an interface; the value is a literal or object built in the same file; or the cast builds a test double, a partial or deliberately invalid fixture, a mock (`as jest.Mock`, `mock.calls`), or a value the surrounding test then asserts on."
          },
          "appliesTo": [
            "**/*.ts",
            "**/*.tsx"
          ],
          "when": "\\bas\\s+[A-Za-z_$]",
          "message": "An `as` cast on unvalidated data can crash at runtime; narrow or parse instead."
        },
        {
          "id": "skill/typescript-best-practices/satisfies-over-as",
          "section": "`satisfies` over `as`",
          "instructions": "Does `hunk` add an object or array literal annotated with an `as SomeType` assertion instead of `satisfies SomeType`?",
          "criteria": {
            "true": "An added line writes a literal followed by a type assertion, e.g. `const config = { theme: \"dark\", cols: 3 } as Config;` or `const routes = [...] as Route[];`.",
            "false": "The literal uses `satisfies`, a plain type annotation (`const config: Config = {...}`), `as const`, or no assertion at all."
          },
          "appliesTo": [
            "**/*.ts",
            "**/*.tsx"
          ],
          "when": "\\}\\s*as\\s+[A-Za-z_$]|\\]\\s*as\\s+[A-Za-z_$]",
          "message": "`as` on an object literal widens literal types; `satisfies` validates without widening."
        },
        {
          "id": "skill/typescript-best-practices/exhaustive-switch-never",
          "section": "Exhaustiveness",
          "instructions": "Does `hunk` add a `switch` over a discriminant property (`.kind`, `.type`, `.tag`) whose `default` arm does not assign the switched value to a `never`-typed local (`const _exhaustive: never = x;`)?",
          "criteria": {
            "true": "An added switch on `s.kind`/`x.type`/`t.tag` has no `default` arm at all, or a `default` arm that only throws, returns a fallback, or breaks without a `const _exhaustive: never = …` assignment.",
            "false": "The default arm contains `const _exhaustive: never = <switched value>;` (returned or `void`-ed); the switch is over a non-discriminant value such as a raw string key, an event name, or a number; or the default arm is outside the visible lines."
          },
          "appliesTo": [
            "**/*.ts",
            "**/*.tsx"
          ],
          "when": "switch\\s*\\(",
          "message": "A discriminant switch without a `never` default won't fail to compile when a new variant is added."
        },
        {
          "id": "skill/typescript-best-practices/discriminated-union-over-optional-bag",
          "section": "Discriminated unions",
          "instructions": "Does `hunk` add a type or interface that models mutually exclusive states as a boolean/status flag alongside optional payload fields instead of a union with a literal discriminant?",
          "criteria": {
            "true": "An added declaration looks like `type DiffState = { loading: boolean; diff?: GitDiff; error?: string }` — a flag field plus optional fields that are only valid in some states.",
            "false": "The added type is a union whose members each carry a literal discriminant (`kind`/`type`/`tag`); the optional fields are genuinely independent settings (e.g. config options) rather than alternative states; or no new type declaration is added."
          },
          "appliesTo": [
            "**/*.ts",
            "**/*.tsx"
          ],
          "when": "(type|interface)\\s+[A-Za-z_$]",
          "message": "A boolean flag plus optional fields lets contradictory states exist; model variants with a `kind` discriminant."
        },
        {
          "id": "skill/typescript-best-practices/brand-shape-convention",
          "section": "Branded types",
          "instructions": "Does `hunk` add a branded primitive type using a brand marker other than `& { readonly __brand: \"X\" }` (e.g. `_brand`, `__type`, `[BrandSymbol]`, a non-readonly brand, or an enum-based tag)?",
          "criteria": {
            "true": "An added type intersects a primitive with a marker property that is not `readonly __brand: \"<Name>\"`, such as `type AgentId = string & { _brand: 'AgentId' }` or `string & { readonly __type: 'AgentId' }`.",
            "false": "The added brand matches `& { readonly __brand: \"X\" }`; the hunk only uses an already-declared branded type; or no branded type is declared."
          },
          "appliesTo": [
            "**/*.ts",
            "**/*.tsx"
          ],
          "when": "brand|Brand|__type\\b",
          "message": "A non-standard brand shape diverges from the `readonly __brand: \"X\"` convention."
        },
        {
          "id": "skill/typescript-best-practices/lying-type-guard",
          "section": "Type guards",
          "instructions": "Does `hunk` add a function returning a type predicate (`x is T`) whose visible body does not actually verify the properties or discriminant the predicate claims?",
          "criteria": {
            "true": "An added predicate returns `true`, a truthiness check, or only a partial check unrelated to the claimed type, e.g. `function isUser(x: unknown): x is User { return typeof x === 'object' && x !== null; }`.",
            "false": "The body checks the discriminant or each claimed property (`return s.kind === 'circle'`, field-by-field `typeof` checks, `arr.length > 0` for `NonEmpty<T>`), or delegates to a schema's `safeParse`/`is` result."
          },
          "appliesTo": [
            "**/*.ts",
            "**/*.tsx"
          ],
          "when": "\\bis\\s+[A-Za-z_$][A-Za-z0-9_$<>\\[\\]]*\\s*[\\{;]",
          "message": "A type predicate whose body doesn't verify the claimed shape hides bugs behind a safe-looking name."
        },
        {
          "id": "skill/typescript-best-practices/type-guard-naming",
          "section": "Type guards",
          "instructions": "Does `hunk` add a function returning a type predicate (`x is T`) whose name does not start with `is` or `has`?",
          "criteria": {
            "true": "An added predicate function is named e.g. `checkUser`, `validCircle`, `ensureNonEmpty` while its return type is `arg is T`.",
            "false": "The predicate is named `isX`/`hasX`, or the added function has no `arg is T` return type."
          },
          "appliesTo": [
            "**/*.ts",
            "**/*.tsx"
          ],
          "when": "\\bis\\s+[A-Za-z_$][A-Za-z0-9_$<>\\[\\]]*\\s*[\\{;]",
          "message": "Type guards should be named `isX` or `hasX`."
        },
        {
          "id": "skill/typescript-best-practices/no-non-null-assertion",
          "section": "Simplest total type",
          "instructions": "Does `hunk` add a non-null assertion (`!`) on a possibly-absent value, such as `arr.at(0)!`, `arr[0]!`, `map.get(k)!`, or `maybe!.field`?",
          "criteria": {
            "true": "An added line uses the postfix `!` operator to assert non-null/non-undefined, e.g. `return sessions.at(0)!;`.",
            "false": "The added code strengthens the input type (`NonEmpty<T>`), widens the result to `| undefined`, or narrows with an explicit check; `!` only appears as logical negation (`!x`, `!==`) or in removed lines."
          },
          "appliesTo": [
            "**/*.ts",
            "**/*.tsx"
          ],
          "when": "\\w!\\s*[.);,\\]]|\\]!|\\)!",
          "message": "A `!` assertion smuggles partiality past the compiler; strengthen the type or return `| undefined`."
        },
        {
          "id": "skill/typescript-best-practices/no-console-log",
          "section": "Structured telemetry",
          "instructions": "Does `hunk` add a `console.log`/`console.debug`/`console.info` call in non-test, non-script production code?",
          "criteria": {
            "true": "An added line calls `console.log(...)` (or `console.debug`/`console.info`) inside application or library source.",
            "false": "The call is in a test, fixture, example, or CLI/dev-script file; the logging goes through the repository's structured logger; or the hunk only removes such calls."
          },
          "appliesTo": [
            "**/*.ts",
            "**/*.tsx"
          ],
          "when": "console\\.(log|debug|info)",
          "message": "`console.log` in shipped code should be a structured logger diagnostic with debuggable context."
        }
      ],
      "notChecked": [
        {
          "section": "Schemas before guards",
          "reason": "Requires knowing which runtime schema library and existing schemas the repository already uses — cross-file knowledge the classifier cannot see."
        },
        {
          "section": "Schema-derived types",
          "reason": "Deciding that a new interface duplicates a generated `.proto`/OpenAPI/GraphQL/DB type requires reading the generated module in another file."
        },
        {
          "section": "Constructive modeling",
          "reason": "Judging whether a chosen representation makes the illegal state unconstructable (non-empty, even length, start+duration) is a design judgement over the whole type, not a single visible condition."
        },
        {
          "section": "Simplest total type",
          "reason": "The 'don't strengthen everything' half needs weighing every operation on the value across call sites; only the `!` tell is checkable and is emitted separately."
        },
        {
          "section": "Boundary validation",
          "reason": "Determining where data crosses in, whether validation already happened upstream, and whether a deep re-validation is redundant requires the whole call chain."
        },
        {
          "section": "Boundary validation > Wire formats",
          "reason": "`ignoreUnknownFields` and versioned-blob parsing depend on repo-specific wire/persistence helpers not visible in a chunk."
        },
        {
          "section": "Narrowing hierarchy",
          "reason": "Ranking whether a better narrowing mechanism was available needs the full type declaration of the narrowed value, usually in another file; the concrete tail case (`as`) is covered by the cast rule."
        },
        {
          "section": "Object args",
          "reason": "Requires counting positional parameters and judging whether the call site is a hot path (per-frame render, tokenizer, parser)."
        },
        {
          "section": "Real tests",
          "reason": "Whether something 'can be run locally' versus must be mocked, and whether UI was verified in a running build, is a process and environment judgement."
        },
        {
          "section": "Header — Apply the type-system-discipline principle skill first",
          "reason": "Pointer to another skill document, not a checkable code condition."
        }
      ]
