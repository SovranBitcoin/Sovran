          "appliesTo": [],
          "when": "\\.shape|\\.\\.\\.|z\\.object|extend\\(",
          "message": "Spreading a loose/strict object's shape into `z.object` silently strips unknown keys."
        },
        {
          "id": "doc/docs/review/contributor-conventions/zod-pick-omit-on-refined",
          "section": "zod/v4-api",
          "instructions": "Does `hunk` call `.pick`, `.omit` or `.partial` on a schema that has a `.refine`/`.superRefine`/`.check` applied?",
          "criteria": {
            "true": "The chain or the referenced schema visibly carries a refinement and then `.pick`, `.omit` or `.partial` is applied to it.",
            "false": "These methods are applied to an unrefined object schema, with refinement added afterwards."
