          "appliesTo": [],
          "when": "rejectUnauthorized|NODE_TLS|certificate|\\bTLS\\b|insecure|allowInsecure|http://",
          "message": "TLS or certificate verification is being bypassed for mint traffic."
        },
        {
          "id": "doc/docs/review/contributor-conventions/fake-trusted-mint-record",
          "section": "wallet/mint-trust",
          "instructions": "Does a failure branch in `hunk` write to the wallet's mint or trust state — create a fake or placeholder mint record, or mark a mint trusted/added — when the mint-info or network call failed?",
          "criteria": {
            "true": "A catch or failure branch inserts a mint entry with stub values into wallet or persisted state, or sets a trusted/added flag, despite the failed fetch.",
            "false": "Mint-info failures surface as an error or leave the mint in an unknown/unverified state; a transient display row or view-model (the URL shown as the name, a zero balance) for a mint the wallet already holds; a trust lookup that fails closed (`.catch(() => false)`)."
          },
          "appliesTo": [],
          "when": "mintInfo|mint_info|getInfo|trusted|addMint|catch|placeholder|fallback",
          "message": "A placeholder trusted-mint record hides a network or mint-info failure."
        },
        {
          "id": "doc/docs/review/contributor-conventions/flow-reuses-payment-context",
          "section": "wallet/fresh-flow",
          "instructions": "Does `hunk` start a new Send, Receive, scan or NFC flow that reads a previous recipient, amount, unit or mint from shared or persisted state instead of clearing the payment context?",
          "criteria": {
            "true": "Flow entry initialises its fields from a shared store or persisted payment context left over from an earlier flow, with no reset/clear at entry.",
            "false": "The flow clears or resets payment context on entry; values are prefilled from explicit new input such as a scanned request, deep link or the user picking a contact."
          },
          "appliesTo": [],
          "when": "recipient|paymentContext|PaymentContext|reset|clear|scan|NFC|nfc|amount|\\bmint\\b",
          "message": "A new payment flow can inherit the previous flow's recipient, amount, unit or mint."
        },
        {
          "id": "doc/docs/review/contributor-conventions/offline-send-awaits-network",
          "section": "wallet/fresh-flow",
          "instructions": "Does `hunk` make an offline send (NFC, nearPay, local token transfer) await a network fetch before completing?",
          "criteria": {
            "true": "The offline send path awaits a mint/rate/info request or other network call on its critical path.",
            "false": "The offline send uses locally available data; network calls happen outside the offline path or are fire-and-forget."
          },
          "appliesTo": [],
          "when": "nfc|NFC|nearPay|offline|await\\s+fetch|apiClient|fetch\\(",
          "message": "An offline send path waits on a network fetch."
        },
        {
          "id": "doc/docs/review/contributor-conventions/cta-shouldshow-impure",
          "section": "cta/pure-eligibility",
          "instructions": "Does a `shouldShow` or eligibility function in `hunk` await, perform a network/storage read, call `Date.now()`/`new Date()` instead of the injected clock, or cause a side effect?",
          "criteria": {
            "true": "The eligibility function is `async`/awaits, calls fetch or an API client, reads the ambient clock directly, or mutates state, logs or navigates.",
