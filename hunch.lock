            "instructions": "BIP-39. Requirement: the 64-byte PBKDF2 output is the seed passed to BIP-32 master key generation; the mnemonic's own entropy is a separate, shorter value used only to build the words. Does the code in `hunk` confuse the two, for example feeding the raw mnemonic entropy or the mnemonic string straight into the BIP-32 master key derivation instead of the PBKDF2 seed? Answer false if `hunk` does not connect a mnemonic to BIP-32 key generation.",
            "message": "BIP-39: the BIP-32 seed is the 64-byte PBKDF2 output, not the mnemonic's entropy.",
            "criteria": {
              "true": "Something other than the 64-byte PBKDF2 output is used as the BIP-32 seed.",
              "false": "The PBKDF2 seed is used, or the hunk does not connect a mnemonic to key generation."
            },
            "threshold": 0.7,
