  "sources": [
    {
      "id": "skill/codebase-design",
      "kind": "skill",
      "origin": "./.agents/skills/codebase-design",
      "path": ".agents/skills/codebase-design/SKILL.md",
      "scope": "",
      "hash": "ed4a1837af02ce111aa6613e9a04e3bbcc07e7732fe0c613cda2b6035404b8d6",
      "rules": [
        {
          "id": "skill/codebase-design/inject-dependencies-not-construct",
          "section": "Designing for testability > Accept dependencies, don't create them",
          "message": "The function builds its own concrete dependency, so tests can't swap in a fake adapter.",
          "instructions": "Does `hunk` add code inside a function or method body that directly constructs a concrete I/O or external-service dependency (e.g. `new StripeGateway()`, `new HttpClient()`, `new PrismaClient()`, `new S3Client()`) that the function then uses, instead of receiving it as a parameter or constructor argument?",
          "criteria": {
            "true": "An added line like `const gateway = new StripeGateway();` inside `processOrder(order)`, or `const db = new Pool(config)` inside a business-logic function that then queries it.",
            "false": "The dependency is passed in (`function processOrder(order, paymentGateway)`), built in a constructor from injected arguments, created in a composition root/main/factory/DI wiring file, or the constructed object is plain data or pure in-process logic (e.g. `new Map()`, `new Date()`, value objects)."
          },
          "appliesTo": [],
          "when": "new\\s+[A-Z]\\w*(Client|Gateway|Service|Repository|Repo|Api|Connection|Pool|Adapter|Sdk)\\b"
        },
        {
          "id": "skill/codebase-design/return-results-not-mutate-args",
          "section": "Designing for testability > Return results, don't produce side effects",
          "message": "The function mutates its argument instead of returning a result, making it harder to test.",
          "instructions": "Does `hunk` add a function whose purpose is to compute a value but which instead writes that value into one of its own input parameters (e.g. `cart.total -= discount`) and returns nothing?",
          "criteria": {
            "true": "`function applyDiscount(cart): void { cart.total -= discount; }` — a computation delivered by assigning to a property of a parameter with a void return.",
            "false": "The function returns the computed value (`calculateDiscount(cart): Discount`), returns a new object, or the mutation is to the object's own state in a method (`this.x = ...`), a builder, or an explicitly in-place utility whose purpose is mutation."
          },
          "appliesTo": []
        },
        {
          "id": "skill/codebase-design/tests-assert-through-interface",
          "section": "Deepening > Testing strategy: replace, don't layer",
          "message": "The test reaches past the module's interface into internal state, so it will break on internal refactors.",
          "instructions": "Does `hunk` add test code that reads, asserts on, or stubs a module's private/internal members (e.g. `obj['_cache']`, `(svc as any).internalMap`, `obj.#field`, spying on a private helper method) rather than asserting on outcomes observable through the module's public interface?",
          "criteria": {
            "true": "`expect((repo as any)._rows.length).toBe(1)`, `jest.spyOn(service as any, 'privateHelper')`, or asserting on an underscore-prefixed field in a test.",
            "false": "The test calls public methods/functions and asserts on their return values, thrown errors, or effects visible through injected adapters (e.g. an in-memory fake)."
          },
          "appliesTo": [
            "**/*.test.*",
            "**/*.spec.*",
            "**/test/**",
            "**/tests/**",
            "**/__tests__/**",
            "**/*_test.*",
            "**/test_*.py"
          ],
          "when": "as any|\\['_|\\._[a-zA-Z]|#[a-zA-Z]|spyOn|private"
        },
        {
          "id": "skill/codebase-design/no-internal-seams-exposed-for-tests",
          "section": "Deepening > Seam discipline",
          "message": "An internal seam is being exposed through the module's interface only so tests can use it.",
          "instructions": "Does `hunk` add a public export, public member, or parameter that is explicitly marked or named as existing only for tests (e.g. `@VisibleForTesting`, `// exported for testing`, `export const __test__`, `_internalForTests`, `testOnly`) in non-test source code?",
          "criteria": {
            "true": "`export { parseRow as _parseRowForTests }`, `// exposed for testing` above a newly public method, or `@VisibleForTesting public void resetCache()`.",
            "false": "Test files themselves, or public additions that are genuine parts of the interface with no test-only marking or naming."
          },
          "appliesTo": []
        }
      ],
      "notChecked": [
        {
          "section": "Glossary",
          "reason": "Terms like 'seam' vs 'boundary' are for design discussions, not something to check in code hunks."
        },
        {
          "section": "Deep vs shallow / Principles > Deletion test",
          "reason": "Whether a module is deep or just passes calls through depends on its callers and the rest of the codebase, and is a matter of judgement."
        },
        {
          "section": "Designing for testability > Small surface area",
          "reason": "This means counting methods and parameters and judging a trade-off, which one hunk can't settle."
        },
        {
          "section": "Principles / Seam discipline > One adapter means a hypothetical seam",
          "reason": "You need to see every adapter across the repo to know how many exist."
        },
        {
          "section": "Deepening > Dependency categories",
          "reason": "This is advice for classifying dependencies at design time. It depends on the project's infrastructure and on which test stand-ins exist."
        },
        {
          "section": "Deepening > Replace, don't layer (delete old unit tests)",
          "reason": "Knowing whether older tests are now redundant means looking at test coverage across files."
        },
        {
          "section": "Design It Twice",
          "reason": "These are process steps for sub-agent design exploration, not properties of code."
        },
        {
          "section": "Rejected framings",
          "reason": "These describe vocabulary and philosophy, not checkable code patterns."
        }
      ]
    },
    {
      "id": "skill/expo-router",
      "kind": "skill",
      "origin": "./.agents/skills/expo-router",
      "path": ".agents/skills/expo-router/SKILL.md",
      "scope": "",
      "hash": "266033e294f0a324cce200b5ffcbe057ce67d0b91c284c4a854f11692cc63f09",
      "rules": [
        {
          "id": "skill/expo-router/no-non-route-files-in-app-dir",
          "section": "Routes",
          "message": "Components, types, or utilities placed in the app directory may be treated as routes.",
          "instructions": "Does `hunk` add a file under the `app/` directory that is a shared component, type definition, hook, or utility module and not a route or `_layout` file that default-exports a screen component?",
          "criteria": {
            "true": "A new file like `app/components/card.tsx`, `app/utils/format.ts`, `app/types.ts`, or an app/ file that only has named exports of helpers, hooks, or types and no default-exported screen.",
            "false": "Route files or `_layout.tsx` files under app/ that default-export a component, special files like `+not-found.tsx`, or any file outside app/."
          },
          "appliesTo": [
            "**/app/**"
          ]
        },
        {
          "id": "skill/expo-router/use-expo-router-color-not-platformcolor",
          "section": "Library Preferences",
          "message": "Raw PlatformColor is not type-safe and may not adapt to light/dark mode like expo-router's Color.",
          "instructions": "Does `hunk` add a use of `PlatformColor(...)` for native semantic colors where `Color` from `expo-router` should be used?",
          "criteria": {
            "true": "Added code such as `color: PlatformColor('label')` or `import { PlatformColor } from 'react-native'`.",
            "false": "Code that uses `Color` from `expo-router`, or does not use PlatformColor."
          },
          "appliesTo": [
            "**/*.ts",
            "**/*.tsx",
            "**/*.js",
            "**/*.jsx"
          ],
          "when": "PlatformColor"
        },
        {
          "id": "skill/expo-router/no-direct-react-navigation-imports",
          "section": "Library Preferences",
          "message": "Importing @react-navigation/* directly bypasses expo-router/react-navigation, which SDK 56+ requires.",
          "instructions": "Does `hunk` add an import from a `@react-navigation/*` package (e.g. `@react-navigation/native`, `/core`, `/elements`, `/routers`) instead of `expo-router/react-navigation`?",
          "criteria": {
            "true": "`import { ThemeProvider } from '@react-navigation/native'` or `import { useTheme } from '@react-navigation/core'` added.",
            "false": "Imports from `expo-router/react-navigation`, or no @react-navigation imports added."
          },
          "appliesTo": [
            "**/*.ts",
            "**/*.tsx",
            "**/*.js",
            "**/*.jsx"
          ],
          "when": "@react-navigation/"
        },
        {
          "id": "skill/expo-router/use-anchor-not-initialroutename",
          "section": "Route Structure > Route Settings",
          "message": "`initialRouteName` was renamed to `anchor` in Expo Router v4 and may no longer take effect.",
          "instructions": "Does `hunk` add `initialRouteName` in an `unstable_settings` export instead of `anchor`?",
          "criteria": {
            "true": "`export const unstable_settings = { initialRouteName: 'index' }` added.",
            "false": "`unstable_settings` uses `anchor`, or the hunk doesn't touch unstable_settings."
          },
          "appliesTo": [
            "**/*.tsx",
            "**/*.ts",
            "**/*.jsx",
            "**/*.js"
          ],
          "when": "initialRouteName"
        },
        {
          "id": "skill/expo-router/use-header-large-title-enabled",
          "section": "Common route structure",
          "message": "`headerLargeTitle` is deprecated; SDK 56+ uses `headerLargeTitleEnabled`.",
          "instructions": "Does `hunk` add the screen option `headerLargeTitle` (not `headerLargeTitleEnabled`, `headerLargeTitleShadowVisible`, or `headerLargeTitleStyle`)?",
          "criteria": {
            "true": "`options={{ headerLargeTitle: true }}` or `screenOptions={{ headerLargeTitle: true }}` added.",
            "false": "Uses `headerLargeTitleEnabled`, or only other headerLargeTitle* options."
          },
          "appliesTo": [
            "**/*.tsx",
            "**/*.jsx",
            "**/*.ts",
            "**/*.js"
          ],
          "when": "headerLargeTitle\\b"
        },
        {
          "id": "skill/expo-router/stacks-defined-in-layout-files",
          "section": "Stack",
          "message": "A Stack navigator defined outside a `_layout.tsx` file won't be wired into file-based routing correctly.",
          "instructions": "Does `hunk` add a `<Stack>` navigator element (opening `<Stack` with children or `screenOptions`, or a bare `<Stack />`) in a file whose name is not `_layout.tsx`/`_layout.*`?",
          "criteria": {
            "true": "In `app/home.tsx` or `components/nav.tsx`: `return <Stack screenOptions={...}><Stack.Screen name=\"a\" /></Stack>`.",
            "false": "A `<Stack>` navigator in a `_layout` file, or a screen file that only uses `Stack.Screen`, `Stack.Title`, `Stack.Toolbar`, `Stack.SearchBar`, or similar sub-components to configure itself."
          },
          "appliesTo": [
            "**/*.tsx",
            "**/*.jsx"
          ],
          "when": "<Stack[\\s/>]"
        },
        {
          "id": "skill/expo-router/prefer-native-modal-presentation",
          "section": "Modal",
          "message": "A custom modal component may be used where a native Stack modal route would work better.",
          "instructions": "Does `hunk` add a React Native `<Modal>` component (from 'react-native') to present screen content instead of a route with `presentation: \"modal\"` or `\"formSheet\"`?",
          "criteria": {
            "true": "`import { Modal } from 'react-native'` and `<Modal visible={open}>...</Modal>` added to show a screen-like view.",
            "false": "`<Stack.Screen name=\"modal\" options={{ presentation: 'modal' }} />`, or no Modal component added."
          },
          "appliesTo": [
            "**/*.tsx",
            "**/*.jsx"
          ],
          "when": "<Modal\\b"
        },
        {
          "id": "skill/expo-router/prefer-native-tabs",
          "section": "Tabs",
          "message": "JS Tabs from expo-router may be used instead of NativeTabs, which gives a native tab bar.",
          "instructions": "Does `hunk` add a JS tab navigator (`Tabs` imported from `expo-router` or `@react-navigation/bottom-tabs`, rendered as `<Tabs>`/`<Tabs.Screen>`) instead of `NativeTabs` from `expo-router/unstable-native-tabs`?",
          "criteria": {
            "true": "`import { Tabs } from 'expo-router'` and `<Tabs><Tabs.Screen name=\"index\" options={{ tabBarIcon: ... }} /></Tabs>` added.",
            "false": "Uses `NativeTabs` from `expo-router/unstable-native-tabs`, or headless tabs from `expo-router/ui` in a `.web.tsx` file."
          },
          "appliesTo": [
            "**/*.tsx",
            "**/*.jsx"
          ],
          "when": "Tabs"
        },
        {
          "id": "skill/expo-router/native-tabs-static-triggers",
          "section": "Tabs > Rules",
          "message": "Adding or removing tab triggers at runtime remounts the navigator and loses state.",
          "instructions": "Does `hunk` render `NativeTabs.Trigger` elements dynamically, via conditional rendering (`cond && <NativeTabs.Trigger>`, ternary) or by mapping over an array?",
          "criteria": {
            "true": "`{isAdmin && <NativeTabs.Trigger name=\"admin\">...}` or `{tabs.map(t => <NativeTabs.Trigger name={t.name} />)}` added.",
            "false": "A static list of `NativeTabs.Trigger` elements, including ones that use the `hidden` prop."
          },
          "appliesTo": [
            "**/*.tsx",
            "**/*.jsx"
          ],
          "when": "NativeTabs\\.Trigger"
        },
        {
          "id": "skill/expo-router/search-tab-last",
          "section": "Tabs > Rules",
          "message": "A search-role tab that isn't last can't combine with the search bar properly.",
          "instructions": "Does `hunk` show a `NativeTabs.Trigger` with `role=\"search\"` followed by another `NativeTabs.Trigger` sibling inside the same `NativeTabs`?",
          "criteria": {
            "true": "`<NativeTabs.Trigger name=\"(search)\" role=\"search\" />` followed by `<NativeTabs.Trigger name=\"settings\">`.",
            "false": "The search-role trigger is the last trigger, or no search-role trigger is visible in the hunk."
          },
          "appliesTo": [
            "**/*.tsx",
            "**/*.jsx"
          ],
          "when": "role=[\"']search"
        },
        {
          "id": "skill/expo-router/native-tab-icon-md-prop",
          "section": "Tabs > Common Issues",
          "message": "A NativeTabs icon with only an SF Symbol may not show up on Android.",
          "instructions": "Does `hunk` add a `NativeTabs.Trigger.Icon` (or `<Icon>`) that has an `sf` prop but no `md` prop (and no `src`, `drawable`, or `xcasset` alternative)?",
          "criteria": {
            "true": "`<NativeTabs.Trigger.Icon sf=\"house.fill\" />` with no `md`.",
            "false": "`<NativeTabs.Trigger.Icon sf=\"house.fill\" md=\"home\" />`, or icons using `src`/VectorIcon."
          },
          "appliesTo": [
            "**/*.tsx",
            "**/*.jsx"
          ],
          "when": "sf="
        },
        {
          "id": "skill/expo-router/toolbar-view-single-child",
          "section": "Components > View",
          "message": "Stack.Toolbar.View with more than one direct child may not render correctly.",
          "instructions": "Does `hunk` add a `<Stack.Toolbar.View>` element that directly contains more than one child element?",
          "criteria": {
            "true": "`<Stack.Toolbar.View><Text>A</Text><Text>B</Text></Stack.Toolbar.View>` with two sibling children directly inside.",
            "false": "`<Stack.Toolbar.View>` wrapping exactly one element (e.g. one `<View>` or one custom component), or hunks without Stack.Toolbar.View."
          },
          "appliesTo": [
            "**/*.tsx",
            "**/*.jsx"
          ],
          "when": "Stack\\.Toolbar\\.View"
        },
        {
          "id": "skill/expo-router/toolbar-view-child-explicit-size",
          "section": "Components > View",
          "message": "A Stack.Toolbar.View child without explicit width and height may lay out incorrectly in the toolbar.",
          "instructions": "Does `hunk` add a `<Stack.Toolbar.View>` whose direct child is an inline element (e.g. `<View>`) whose visible `style` lacks an explicit numeric `width` or `height`?",
          "criteria": {
            "true": "`<Stack.Toolbar.View><View style={{ justifyContent: \"center\" }}>…</View></Stack.Toolbar.View>` – no width/height on the child.",
            "false": "The child has `style={{ width: 70, height: 32, … }}`, or the child is a custom component whose styles are not visible in the hunk."
          },
          "appliesTo": [
            "**/*.tsx",
            "**/*.jsx"
          ],
          "when": "Stack\\.Toolbar\\.View"
        },
        {
          "id": "skill/expo-router/header-toolbar-spacer-width",
          "section": "Components > Spacer",
          "message": "A Spacer in a header toolbar without an explicit width will not work.",
          "instructions": "Does `hunk` add a `<Stack.Toolbar.Spacer />` without a `width` prop inside a `<Stack.Toolbar placement=\"left\">` or `<Stack.Toolbar placement=\"right\">`?",
          "criteria": {
            "true": "`<Stack.Toolbar placement=\"right\"> … <Stack.Toolbar.Spacer /> …` with no width.",
            "false": "Header spacer with `width={16}`, or a Spacer in a bottom toolbar (placement=\"bottom\" or no placement)."
          },
          "appliesTo": [
            "**/*.tsx",
            "**/*.jsx"
          ],
          "when": "Stack\\.Toolbar\\.Spacer"
        },
        {
          "id": "skill/expo-router/toolbar-items-inside-toolbar",
          "section": "Recommendations",
          "message": "Stack.Toolbar.* items rendered outside a Stack.Toolbar element (e.g. from a separate component) will not work.",
          "instructions": "Does `hunk` add a component or JSX fragment that renders `Stack.Toolbar.Button`, `Stack.Toolbar.Menu`, `Stack.Toolbar.MenuAction`, `Stack.Toolbar.Spacer`, or `Stack.Toolbar.View` elements that are not enclosed by a `<Stack.Toolbar>` element within that same component's JSX?",
          "criteria": {
            "true": "`function Buttons() { return <><Stack.Toolbar.Button …/><Stack.Toolbar.Button …/></>; }` then used as `<Stack.Toolbar><Buttons /></Stack.Toolbar>`.",
            "false": "A component returning `<Stack.Toolbar>…<Stack.Toolbar.Button/>…</Stack.Toolbar>`, or edits to items that sit inside a visible Stack.Toolbar."
          },
          "appliesTo": [
            "**/*.tsx",
            "**/*.jsx"
          ],
          "when": "Stack\\.Toolbar\\.(Button|Menu|MenuAction|Spacer|View)"
        },
        {
          "id": "skill/expo-router/no-bottom-toolbar-in-layout",
          "section": "Limitations",
          "message": "A bottom Stack.Toolbar in a layout file will not work; it only works inside screen components.",
          "instructions": "Does `hunk` add a `<Stack.Toolbar>` with `placement=\"bottom\"` or with no `placement` prop (which defaults to bottom) in this layout file?",
          "criteria": {
            "true": "In `app/_layout.tsx`: `<Stack.Toolbar placement=\"bottom\">` or `<Stack.Toolbar>` with no placement.",
            "false": "`<Stack.Toolbar placement=\"left\">` or `placement=\"right\"` in the layout."
          },
          "appliesTo": [
            "**/_layout.tsx",
            "**/_layout.jsx",
            "**/_layout.js",
            "**/_layout.ts"
          ],
          "when": "Stack\\.Toolbar"
        },
        {
          "id": "skill/expo-router/toolbar-badge-header-only",
          "section": "Limitations",
          "message": "Stack.Toolbar.Badge does not work in a bottom toolbar.",
          "instructions": "Does `hunk` add a `Stack.Toolbar.Badge` inside a `<Stack.Toolbar>` that has `placement=\"bottom\"` or no `placement` prop?",
          "criteria": {
            "true": "`<Stack.Toolbar placement=\"bottom\"> … <Stack.Toolbar.Badge …/>`.",
            "false": "Badge inside `<Stack.Toolbar placement=\"left\">` or `\"right\"`, or enclosing toolbar not visible."
          },
          "appliesTo": [
            "**/*.tsx",
            "**/*.jsx"
          ],
          "when": "Stack\\.Toolbar\\.Badge"
        },
        {
          "id": "skill/expo-router/apple-zoom-single-child",
          "section": "Apple Zoom Transitions > Targeted Zoom",
          "message": "Link.AppleZoom accepts only a single child element.",
          "instructions": "Does `hunk` add a `<Link.AppleZoom>` element that directly contains more than one child element?",
          "criteria": {
            "true": "`<Link.AppleZoom><Image …/><Text>Caption</Text></Link.AppleZoom>`.",
            "false": "`<Link.AppleZoom>` wrapping exactly one element such as a single `<Image>`."
          },
          "appliesTo": [
            "**/*.tsx",
            "**/*.jsx"
          ],
          "when": "Link\\.AppleZoom"
        }
      ],
      "notChecked": [
        {
          "section": "Code Style",
          "reason": "Kebab-case and no special characters in file names are path naming checks a linter or regex does exactly, and routing syntax like [id], (group), _layout, and +not-found adds exceptions."
        },
        {
          "section": "Code Style",
          "reason": "Removing old route files after a restructure can only be checked across files or the whole repo."
        },
        {
          "section": "Code Style",
          "reason": "Configuring tsconfig path aliases and preferring them in refactors needs project config and refactor context, and it's a preference."
        },
        {
          "section": "Routes",
          "reason": "Making sure some route matches \"/\" needs a view of the whole repo."
        },
        {
          "section": "Route Structure",
          "reason": "The rule against naming a route `(foo).tsx` is a file-path pattern that a regex checks exactly."
        },
        {
          "section": "Behavior",
          "reason": "Preferring Stack.SearchBar is a soft preference, and the search reference itself uses headerSearchBarOptions."
        },
        {
          "section": "Link / Link Previews / Context Menus",
          "reason": "Adding Link.Preview and context menus 'whenever possible' is subjective encouragement."
        },
        {
          "section": "Stack",
          "reason": "The import path for Stack ('expo-router/stack' vs 'expo-router') is inconsistent across the skill's examples."
        },
        {
          "section": "Tabs > Rules",
          "reason": "Matching trigger names to route names, and having a trigger for each tab, needs the route file structure."
        },
        {
          "section": "Tabs > SDK Compatibility",
          "reason": "Which Icon/Label/Badge syntax is right depends on the project's SDK version, which a hunk doesn't show."
        },
        {
          "section": "Tabs > Conditional Tabs",
          "reason": "Whether `hidden` toggles after the initial render depends on runtime behavior."
        },
        {
          "section": "Stacks and Tabs Structure",
          "reason": "Nesting Stacks inside tabs and hiding the header on the tab layout are about structure across several files."
        },
        {
          "section": "Form Sheets",
          "reason": "Sheet screen content using flex:1 depends on how the route is configured in another file."
        },
        {
          "section": "Tabs > Limitations",
          "reason": "The maximum of 5 tabs on Android needs counting."
        },
        {
          "section": "Submitting Feedback",
          "reason": "This is a process instruction for agents, not a property of the code."
        },
        {
          "section": "Mail inbox example / Placement / Components (props lists)",
          "reason": "Reference API documentation, not a rule; TypeScript checks prop names."
        },
        {
          "section": "Components > Menu (palette with dividers)",
          "reason": "Depends on design intent (whether dividers are wanted), which the hunk doesn't show."
        },
        {
          "section": "Recommendations > extract complex headers to a component",
          "reason": "Deciding what counts as a 'complex' header is subjective."
        },
        {
          "section": "Limitations > iOS only",
          "reason": "Platform targeting depends on project config, which lives in other files."
        },
        {
          "section": "Zoom Transitions > Prefer Link.AppleZoomTarget over alignmentRect",
          "reason": "Needs to know whether the target is available as a component on the destination screen, which is in another file."
        },
        {
          "section": "Zoom Transitions > Best Practices (avoid sheets/popovers, hidden nav bar, mismatched aspect ratios, skinny rows)",
          "reason": "Needs the destination screen's configuration or visual/layout judgment across files."
        },
        {
          "section": "Zoom Transitions > Tips (close button, unstable_dismissalBoundsRect for zoomable scroll views)",
          "reason": "Needs knowledge of the destination screen, which is in another file, and the gesture setup."
        },
        {
          "section": "Zoom Transitions > requirements (iOS 18+, SDK 55+, Stack only)",
          "reason": "The SDK version and navigator type are set in other files."
        }
      ]
    },
    {
      "id": "agents-md/root",
      "kind": "agents-md",
      "origin": "./AGENTS.md",
      "path": "AGENTS.md",
      "scope": "",
      "hash": "2f165c9d8b3c75d34d61cf1563a1f0da6c2ab2145a0d049ac8f21f8a703d0aec",
      "rules": [
        {
          "id": "agents-md/root/no-app-imports-from-packages",
          "section": "Layout and ownership",
          "message": "The wallet or nostr package may now depend on the app, breaking the app → wallet → nostr import direction.",
          "instructions": "Does `hunk` add an import or require in the wallet/ or nostr/ package that pulls from the app (e.g. `@/…`, `app/…`, a relative path into `app/`), from Expo navigation (`expo-router`, `@react-navigation/*`), or from app stores?",
          "criteria": {
