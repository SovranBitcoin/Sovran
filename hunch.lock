            "instructions": "BIP-39 mnemonics. Requirement: the initial entropy ENT must be a multiple of 32 bits and between 128 and 256 bits, giving 12, 15, 18, 21 or 24 words. Does the code in `hunk` generate or accept a BIP-39 mnemonic from an entropy length outside that range or not a multiple of 32 bits, for example 64 bits or a word count that is not one of the five? Answer false if `hunk` does not generate or validate mnemonic length.",
            "message": "BIP-39: ENT is 128-256 bits in multiples of 32, i.e. 12, 15, 18, 21 or 24 words.",
            "criteria": {
