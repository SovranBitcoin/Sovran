    {
      "id": "skill/expo-animation",
      "kind": "skill",
      "origin": "./.agents/skills/expo-animation",
      "path": ".agents/skills/expo-animation/SKILL.md",
      "scope": "",
      "hash": "b5dde1e9f87bbe92b7b93f9e835c377942f5a5c6777c9998628ba6fa4bd04210",
      "rules": [
        {
          "id": "skill/expo-animation/no-core-animated",
          "section": "Hard Rules > Reanimated, not core Animated",
          "instructions": "Does `hunk` animate using React Native's core `Animated` API — e.g. `new Animated.Value(...)`, `Animated.timing(...)`, `Animated.spring(...)`, `Animated.event(...)`, or `Animated` imported from `'react-native'`?",
          "criteria": {
            "true": "The added code imports `Animated` (or `Easing`) from `'react-native'` and drives motion with `Animated.Value`/`Animated.timing`/`Animated.spring`/`Animated.event`.",
            "false": "`Animated` comes from `'react-native-reanimated'` (`Animated.View`, `Animated.ScrollView`, `Animated.FlatList`), or no animation API is used."
          },
          "appliesTo": [
            "**/*.ts",
            "**/*.tsx",
            "**/*.js",
            "**/*.jsx",
            "**/*.mjs",
            "**/*.cjs"
          ],
          "when": "\\bAnimated\\b|LayoutAnimation|useNativeDriver",
          "message": "Core `Animated` can't be driven from the UI thread by a gesture and only supports transform/opacity with `useNativeDriver`."
        },
        {
          "id": "skill/expo-animation/no-panresponder",
          "section": "Never Ship",
          "instructions": "Does `hunk` add a gesture built with `PanResponder` (e.g. `PanResponder.create`, `panHandlers`) instead of `Gesture.Pan()` from react-native-gesture-handler?",
          "criteria": {
            "true": "The added code creates or wires up a `PanResponder`.",
            "false": "Gestures use `Gesture.Pan()`/`GestureDetector` or gesture-handler v3 hooks, or there is no gesture code."
          },
          "appliesTo": [
            "**/*.ts",
            "**/*.tsx",
            "**/*.js",
            "**/*.jsx",
            "**/*.mjs",
            "**/*.cjs"
          ],
          "when": "PanResponder|panHandlers|onMoveShouldSetResponder",
          "message": "`PanResponder` runs on the JS thread and drops frames; gesture-handler's `Gesture.Pan()` runs on the UI thread."
        },
        {
          "id": "skill/expo-animation/no-setstate-in-gesture-or-scroll",
          "section": "Keep it off the JS thread",
          "instructions": "Does `hunk` call a React state setter (a `useState` setter, `setState`, or a store dispatch) inside a gesture callback (`onBegin`/`onStart`/`onUpdate`/`onChange`/`onActivate`) or a scroll handler (`onScroll`, `useAnimatedScrollHandler`)?",
          "criteria": {
            "true": "A `setX(...)`/`setState(...)` call appears inside a continuous gesture or scroll handler body.",
            "false": "State is only set in `Pressable` `onPressIn`/`onPressOut`/`onPress` (twice per press, explicitly sanctioned), in `onLayout`, or in `onEnd`/`onFinalize`; continuous updates go to a shared value plus `useAnimatedStyle`."
          },
          "appliesTo": [
            "**/*.ts",
            "**/*.tsx",
            "**/*.js",
            "**/*.jsx",
            "**/*.mjs",
            "**/*.cjs"
          ],
          "when": "onUpdate|onChange|onScroll|useAnimatedScrollHandler|onActivate|onBegin|onGestureEvent|onEnd\\(",
          "message": "A React render per frame from a gesture or scroll handler is the biggest cause of jank in RN."
        },
        {
          "id": "skill/expo-animation/no-runonjs",
          "section": "Never Ship",
          "instructions": "Does `hunk` use `runOnJS(fn)(...)` to call back into the React Native runtime instead of `scheduleOnRN(fn, ...args)` from `react-native-worklets`?",
          "criteria": {
            "true": "The added code imports or calls `runOnJS`.",
            "false": "Calls back to the RN runtime use `scheduleOnRN`, or there is no cross-runtime call."
          },
          "appliesTo": [
            "**/*.ts",
            "**/*.tsx",
            "**/*.js",
            "**/*.jsx",
            "**/*.mjs",
            "**/*.cjs"
          ],
          "when": "runOnJS|runOnUI",
          "message": "`runOnJS` is deprecated in Reanimated 4; `scheduleOnRN` is the replacement."
        },
        {
          "id": "skill/expo-animation/no-schedule-on-rn-per-frame",
          "section": "Keep it off the JS thread",
          "instructions": "Does `hunk` call `scheduleOnRN` (or otherwise invoke an RN-runtime function such as a haptic) inside a gesture `onUpdate` or a scroll handler, rather than in `onEnd` or a `useAnimatedReaction` threshold?",
          "criteria": {
            "true": "`scheduleOnRN(...)` or a `Haptics.*` call appears in the body of `onUpdate`/`useAnimatedScrollHandler`/`onScroll`.",
            "false": "The call is in `onEnd`/`onFinalize`/`onDeactivate`, in an animation completion callback, or inside a `useAnimatedReaction` that fires on a threshold crossing."
          },
          "appliesTo": [
            "**/*.ts",
            "**/*.tsx",
            "**/*.js",
            "**/*.jsx",
            "**/*.mjs",
            "**/*.cjs"
          ],
          "when": "scheduleOnRN|runOnJS|Haptics\\.|onUpdate|onScroll",
          "message": "Scheduling back to the RN runtime inside `onUpdate` or a scroll handler fires 60–120× per second."
        },
        {
          "id": "skill/expo-animation/shared-value-get-set",
          "section": "Keep it off the JS thread",
          "instructions": "Does `hunk` read or write a Reanimated shared value through `.value` instead of `.get()` / `.set()`?",
          "criteria": {
            "true": "A value created by `useSharedValue` (or a shared value prop) is accessed as `x.value` or assigned with `x.value = ...`.",
            "false": "Shared values use `.get()` / `.set()`, or the `.value` belongs to something else entirely (event payload, DOM/input value, ref object, animated node from another library)."
          },
          "appliesTo": [
            "**/*.ts",
            "**/*.tsx",
            "**/*.js",
            "**/*.jsx",
            "**/*.mjs",
            "**/*.cjs"
          ],
          "when": "\\.value\\b|useSharedValue|useDerivedValue",
          "message": "Direct `.value` access is the form the React Compiler can't see through; `get`/`set` is the compiler-safe way."
        },
        {
          "id": "skill/expo-animation/no-shared-value-in-render",
          "section": "Keep it off the JS thread",
          "instructions": "Does `hunk` read or write a shared value in the component's render body or JSX (e.g. `translateY.get()` inside JSX or `x.set(...)` at the top level of the component), rather than inside a worklet, handler, or effect?",
          "criteria": {
            "true": "A `useSharedValue` value is read or written in the render path — inline in JSX, in a plain style object, or in a statement at the component body's top level.",
            "false": "All shared-value access is inside `useAnimatedStyle`, a gesture/scroll handler, `useAnimatedReaction`, an event callback, or a `useEffect`."
          },
          "appliesTo": [
            "**/*.ts",
            "**/*.tsx",
            "**/*.js",
            "**/*.jsx",
            "**/*.mjs",
            "**/*.cjs"
          ],
          "when": "useSharedValue|useDerivedValue|\\.get\\(\\)|\\.set\\(|\\.value\\b",
          "message": "A shared value read during render is a snapshot that never updates, and a write during render replays on re-render."
        },
        {
          "id": "skill/expo-animation/no-layout-property-animation",
          "section": "Pick the properties",
          "instructions": "Does `hunk` animate a layout property (`height`, `width`, `margin`, `padding`, `flex`, `top`, `left`, `right`, `bottom`, `gap`) — via `useAnimatedStyle`, `transitionProperty`, or keyframes — on an element that is not absolutely positioned and childless?",
          "criteria": {
            "true": "An animated style, transition, or keyframe drives one of those layout properties on a normal in-flow element.",
            "false": "Only `transform` and `opacity` (or colors) are animated; or the animated element is `position: 'absolute'` with no children — the sanctioned tab-pill / progress-fill exception."
          },
          "appliesTo": [
            "**/*.ts",
            "**/*.tsx",
            "**/*.js",
            "**/*.jsx",
            "**/*.mjs",
            "**/*.cjs"
          ],
          "when": "useAnimatedStyle|transitionProperty|animationName|withTiming|withSpring|withDecay|withSequence",
          "message": "Animating layout properties re-runs Yoga every frame for the node and its siblings."
        },
        {
          "id": "skill/expo-animation/no-blur-intensity-or-elevation",
          "section": "Pick the properties",
          "instructions": "Does `hunk` bind an animated value to a `BlurView`'s `intensity` prop (through `animatedProps`, `useAnimatedProps`, an animated style or a transition) or to a view's `elevation`, on a code path that renders on Android, instead of crossfading the opacity of a static pre-blurred or pre-shadowed layer?",
          "criteria": {
            "true": "`intensity` or `elevation` of a rendered view is driven by a shared value, animated props, animated style, transition or keyframe, and nothing in `hunk` keeps that path off Android.",
            "false": "`intensity`/`elevation` are static constants, or the effect is achieved by animating the `opacity` of a static layer; the animated `BlurView` is rendered only when a platform or capability check excludes Android, and Android gets an opacity-animated static layer instead; a shared value that is animated but that `hunk` does not bind to an `intensity` or `elevation` prop, whatever it is named."
          },
          "appliesTo": [
            "**/*.ts",
            "**/*.tsx",
            "**/*.js",
            "**/*.jsx",
            "**/*.mjs",
            "**/*.cjs"
          ],
          "when": "BlurView|[Bb]lur|intensity|elevation|shadow",
          "message": "Animating `BlurView` intensity or Android `elevation` re-renders the blur/shadow every frame."
        },
        {
          "id": "skill/expo-animation/no-entering-on-virtualized-row",
          "section": "List entrances",
          "instructions": "Does `hunk` put an `entering` layout animation on a row rendered by a virtualized list (inside `renderItem`, or on the item component of `FlatList`/`FlashList`/`SectionList`)?",
          "criteria": {
            "true": "An `entering={...}` prop is attached to the element returned from `renderItem` or to a row inside a virtualized list.",
            "false": "`entering` is on a list container, a screen, or rows produced by a plain `.map()`; or reflow uses `itemLayoutAnimation` instead."
          },
          "appliesTo": [
            "**/*.tsx",
            "**/*.jsx"
          ],
          "when": "entering=|exiting=|renderItem|FlatList|FlashList|SectionList|LegendList",
          "message": "Rows are recycled, so an `entering` animation re-fires whenever a row scrolls back into view and the list flickers."
        },
        {
          "id": "skill/expo-animation/no-ease-in-on-ui",
          "section": "Timing or spring > Easing",
          "instructions": "Does `hunk` use an ease-in curve for a UI animation — `Easing.in(...)`, `Easing.ease` used as ease-in, or a `'ease-in'` timing-function string?",
          "criteria": {
            "true": "An animation's easing is `Easing.in(...)` or `'ease-in'`.",
            "false": "Easing is ease-out, ease-in-out, linear, `Easing.bezier(0.23, 1, 0.32, 1)`, `Easing.out(...)`, or another explicit custom bezier."
          },
          "appliesTo": [
            "**/*.ts",
            "**/*.tsx",
            "**/*.js",
            "**/*.jsx",
            "**/*.mjs",
            "**/*.cjs"
          ],
          "when": "Easing\\.|ease-in|easing|TimingFunction",
          "message": "`ease-in` starts slow and delays the exact moment the user is watching."
        },
        {
          "id": "skill/expo-animation/no-cubic-bezier-string",
          "section": "Timing or spring > Easing",
          "instructions": "Does `hunk` pass a raw `'cubic-bezier(...)'` string as a Reanimated `transitionTimingFunction` / `animationTimingFunction` instead of `cubicBezier(...)` from `react-native-reanimated`?",
          "criteria": {
            "true": "A timing-function is written as a `'cubic-bezier(...)'` string literal in a Reanimated style.",
            "false": "The timing function uses `cubicBezier(...)` (CSS styles) or `Easing.bezier(...)` (`withTiming`/`.easing()`), or the string belongs to web CSS, not a Reanimated style."
          },
          "appliesTo": [
            "**/*.ts",
            "**/*.tsx",
            "**/*.js",
            "**/*.jsx",
            "**/*.mjs",
            "**/*.cjs"
          ],
          "when": "cubic-bezier|[Tt]imingFunction|Easing\\.bezier",
          "message": "Reanimated rejects raw `'cubic-bezier(...)'` strings in CSS animation styles."
        },
        {
          "id": "skill/expo-animation/no-scale-zero-entrance",
          "section": "Pick the properties",
          "instructions": "Does `hunk` add an entrance animation that starts from `scale: 0` (a scale shared value or keyframe initialised at 0)?",
          "criteria": {
            "true": "An entrance animates scale from 0 (e.g. `useSharedValue(0)` driving scale, `transform: [{ scale: 0 }]` as the initial/from state, or a `0%` keyframe with scale 0).",
            "false": "The entrance starts from 0.9–0.97 combined with `opacity: 0`, or the 0 value drives something other than an entrance scale."
          },
          "appliesTo": [
            "**/*.ts",
            "**/*.tsx",
            "**/*.js",
            "**/*.jsx",
            "**/*.mjs",
            "**/*.cjs"
          ],
          "when": "[Ss]cale|ZoomIn|entering=|withSpring|withTiming",
          "message": "Nothing appears from nothing — entrances should start at scale 0.9–0.97 with opacity 0."
        },
        {
          "id": "skill/expo-animation/spring-designer-params",
          "section": "Timing or spring",
          "instructions": "Does `hunk` configure `withSpring` (or a spring layout animation) with `stiffness`, `damping`, or `mass` instead of `duration` and `dampingRatio`?",
          "criteria": {
            "true": "A spring config object contains `stiffness`, `damping`, or `mass`.",
            "false": "The spring config uses `duration` and `dampingRatio` (optionally `velocity`, `overshootClamping`, `reduceMotion`)."
          },
          "appliesTo": [
            "**/*.ts",
            "**/*.tsx",
            "**/*.js",
            "**/*.jsx",
            "**/*.mjs",
            "**/*.cjs"
          ],
          "when": "withSpring|stiffness|dampingRatio|damping|\\bmass\\b|SpringConfig",
          "message": "Springs should use Apple's `duration` + `dampingRatio` form, not mass/stiffness/damping."
        },
        {
          "id": "skill/expo-animation/spring-velocity-handoff",
          "section": "Timing or spring",
          "instructions": "In a gesture's `onEnd`/`onDeactivate`/`onFinalize`, does `hunk` settle a shared value with `withSpring` without passing the gesture event's `velocity`?",
          "criteria": {
            "true": "`withSpring(target, { duration, dampingRatio })` is called from a gesture end handler with no `velocity` field.",
            "false": "The spring config includes `velocity: e.velocityX/e.velocityY`, or the spring is not driven by a gesture (state change, mount, effect)."
          },
          "appliesTo": [
            "**/*.ts",
            "**/*.tsx",
            "**/*.js",
            "**/*.jsx",
            "**/*.mjs",
            "**/*.cjs"
          ],
          "when": "onEnd|onDeactivate|onFinalize|velocity|withSpring|withDecay",
          "message": "A spring settled without the gesture's velocity leaves a visible seam when the finger releases."
        },
        {
          "id": "skill/expo-animation/gesture-start-context",
          "section": "Recipes > Bottom sheet",
          "instructions": "Does `hunk`'s pan `onUpdate` set a shared value directly from `event.translationX`/`translationY` without adding a start offset captured in `onStart`/`onActivate`?",
          "criteria": {
            "true": "`onUpdate` writes something like `y.set(e.translationY)` with no stored context/offset added.",
            "false": "`onUpdate` adds a value captured in `onStart`/`onActivate` (e.g. `context.get() + e.translationY`), or the handler is not a pan update."
          },
          "appliesTo": [
            "**/*.ts",
            "**/*.tsx",
            "**/*.js",
            "**/*.jsx",
            "**/*.mjs",
            "**/*.cjs"
          ],
          "when": "translationX|translationY|onStart\\(|onBegin\\(|Gesture\\.Pan|savedOffset",
          "message": "Without capturing the current value on start, grabbing an element mid-animation teleports it."
        },
        {
          "id": "skill/expo-animation/dismissal-uses-velocity",
          "section": "Never Ship",
          "instructions": "Does `hunk` decide a dismissal/commit in a gesture end handler from travelled distance alone, with no use of velocity or a projected resting position?",
          "criteria": {
            "true": "The `onEnd`/`onDeactivate` branch compares only the current translation/offset against a threshold and never references `velocityX`/`velocityY` or a projection of them.",
            "false": "The decision uses velocity or `project(e.velocityX/Y)` (velocity **or** distance), or the handler makes no commit/dismiss decision."
          },
          "appliesTo": [
            "**/*.ts",
            "**/*.tsx",
            "**/*.js",
            "**/*.jsx",
            "**/*.mjs",
            "**/*.cjs"
          ],
          "when": "onEnd|onDeactivate|onFinalize|[Tt]hreshold|THRESHOLD|velocity|dismiss",
          "message": "A distance-only threshold makes a quick flick fail to dismiss."
        },
        {
          "id": "skill/expo-animation/interpolate-clamp",
          "section": "Recipes > Collapsing header",
          "instructions": "Does `hunk` call `interpolate(...)` on a value driven by a scroll offset, a gesture translation, a navigator or drawer progress, or a spring or decay animation, without passing `Extrapolation.CLAMP` (or an explicit extrapolation config)?",
          "criteria": {
            "true": "An `interpolate(value, input, output)` call whose input can leave the input range — a scroll offset, drag position, drawer or navigator progress, spring or decay value — omits the extrapolation argument.",
            "false": "`Extrapolation.CLAMP` (or an explicit extrapolate config) is passed, or `interpolateColor`/a non-positional input is used; the input shared value is, as `hunk` shows, only ever assigned `withTiming` towards the endpoints of the input range with a non-overshooting easing, so it cannot leave that range."
          },
          "appliesTo": [
            "**/*.ts",
            "**/*.tsx",
            "**/*.js",
            "**/*.jsx",
            "**/*.mjs",
            "**/*.cjs"
          ],
          "when": "interpolate|Extrapolat",
          "message": "Without `Extrapolation.CLAMP` the value keeps being driven past the input range and the effect inverts."
        },
        {
          "id": "skill/expo-animation/gesture-memoized",
          "section": "Recipes > Setup conventions",
          "instructions": "Does `hunk` construct a `Gesture.Pan()`/`Gesture.Tap()`/`Gesture.*()` builder inside a component body without wrapping it in `useMemo`?",
          "criteria": {
            "true": "A gesture builder chain is assigned to a local variable in render with no `useMemo` wrapper.",
            "false": "The gesture is wrapped in `useMemo`, defined at module scope, or created with a gesture-handler v3 hook (`usePanGesture` etc.) that manages its own identity."
          },
          "appliesTo": [
            "**/*.ts",
            "**/*.tsx",
            "**/*.js",
            "**/*.jsx",
            "**/*.mjs",
            "**/*.cjs"
          ],
          "when": "Gesture\\.|GestureDetector|useMemo",
          "message": "A gesture rebuilt on every render can reattach the recognizer and drop a drag mid-flight."
        },
        {
          "id": "skill/expo-animation/layout-builder-not-inline",
          "section": "Recipes > List entrances, Toast",
          "instructions": "Does `hunk` build a layout-animation chain inline in JSX (e.g. `entering={FadeInDown.duration(250).delay(40)}` or `itemLayoutAnimation={LinearTransition.duration(200)}`) instead of a builder defined at module scope or in `useMemo`?",
          "criteria": {
            "true": "A chained layout-animation builder call appears directly inside an `entering`/`exiting`/`itemLayoutAnimation` JSX prop.",
            "false": "The prop references a constant defined at module scope or a `useMemo` result, or passes the bare builder (`entering={FadeIn}`) with no chained calls."
          },
          "appliesTo": [
            "**/*.tsx",
            "**/*.jsx"
          ],
          "when": "entering=|exiting=|itemLayoutAnimation|LayoutAnimationConfig|FadeIn|FadeOut|SlideIn|Layout\\b",
