          "id": "doc/docs/review/contributor-conventions/verb-contradicts-body",
          "section": "naming/verbs",
          "message": "A function's leading verb may not match what its body does (e.g. `get*` doing network I/O).",
          "instructions": "Does `hunk` define a function whose leading verb contradicts its visible body: `get*` that is async or does network/storage I/O, `fetch*` that performs no network read, `load*` that reads the network instead of local persistence, `build*`/`compute*` with side effects its caller can observe (state or store mutation, persistence, network, navigation, mutating an argument), `format*` returning something other than display text, or `parse*` that decodes nothing?",
          "criteria": {
