          "message": "System chrome height may be hard-coded or safe-area padding applied twice.",
          "instructions": "Does `hunk` hard-code a tab-bar, footer, header or home-indicator height (a numeric padding, margin or offset standing in for that chrome), or add `useSafeAreaInsets()` padding inside a screen that `Screen` or `useScreenInsets` already pads?",
          "criteria": {
