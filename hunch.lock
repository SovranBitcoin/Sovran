      ],
      "notChecked": [
        {
          "section": "Intro — \"Every rule here was reproduced against the installed package versions … when a dependency is upgraded, re-check the rules\"",
          "reason": "Process guidance for maintainers of the doc, not a property of any code chunk."
        },
        {
          "section": "persist/migrate-total (d) — migrate \"can throw on malformed input\"",
          "reason": "Whether a migrate step can throw on arbitrary stored input needs knowledge of the parsers it calls; overlaps the defensive-parsing exception and would fire on most migrates."
        },
        {
          "section": "state/subscribe-listener (c) — missing `fireImmediately: true` or an explicit initial call",
          "reason": "Requires judging whether the listener \"must also run for the value already in the store\", which is intent the chunk does not state."
        },
        {
          "section": "async/inflight-map (b) — `finally` delete without an identity check `if (map.get(k) === p)`",
          "reason": "Conditioned on the map also being cleared, invalidated or overwritten elsewhere, which is usually outside the reviewed chunk."
        },
        {
          "section": "persist/partialize-allowlist — \"all 56 existing `partialize` calls do this\"",
          "reason": "Repository-wide count; the classifier cannot verify totals across files."
        },
        {
          "section": "react/render-mutation — `toSorted` / `toReversed` \"only once Hermes support is confirmed — the app has 0 uses today\"",
          "reason": "Depends on runtime support status and a repo-wide usage count, not on the chunk."
        },
        {
          "section": "react/render-clock — \"files listed in `react-compiler-bailouts.json` are not exempt\"",
          "reason": "Cross-file lookup into a config listing; the classifier cannot read that file."
        }
      ]
    },
    {
      "id": "doc/docs/review/conventions-typescript",
      "kind": "doc",
      "origin": "./docs/review/conventions-typescript.md",
      "path": "docs/review/conventions-typescript.md",
      "scope": "",
      "hash": "9a127a19da3c4ef16f1c78bfebaa66646e6ccad9224b8a3cf3e72b4ae4036236",
      "rules": [
        {
          "id": "doc/docs/review/conventions-typescript/unused-result",
          "section": "errors/unused-result",
          "instructions": "Does `hunk` call, as a bare statement (`save(x);`, `await publish(x);`, `void respond(x);`, or inside an `await Promise.all(` over such calls), a function that the hunk itself shows returns a neverthrow `Result`/`ResultAsync` — via its signature, an `ResultAsync.from*`/`ok(`/`err(` body, or a sibling call site using `.isErr()`/`.match(` — so the returned Result is never read?",
          "criteria": {
            "true": "The returned Result value is discarded: the call is a statement on its own, or prefixed only with `await`/`void`, with no assignment, no `return`, and no `.match(`/`.isErr()`/`.isOk()`/`.mapErr(`/`.orElse(`/`._unsafeUnwrap()` consuming it.",
            "false": "The Result is returned, assigned and then checked, or consumed by `.match(`, `.isErr()`/`.isOk()`, a `.mapErr(` that logs or reports, `.orElse(`, or `._unsafeUnwrap()` in a test; `void` on a chain ending in a `.mapErr(`/`.orElse(` handler that logs or surfaces the error; a documented best-effort path (telemetry, cleanup, cache warm-up) with a comment saying the failure is deliberately ignored; the callee's return type is not visible in the hunk."
          },
          "appliesTo": [
            "**/*.ts",
            "**/*.tsx"
          ],
          "when": "Result|\\bok\\(|\\berr\\(|neverthrow|isOk|isErr",
          "message": "A neverthrow Result computed here is dropped, so its error is silently lost."
        },
        {
          "id": "doc/docs/review/conventions-typescript/safe-promise-can-reject",
          "section": "errors/safe-promise-can-reject",
          "instructions": "Does `hunk` pass to `ResultAsync.fromSafePromise(` a promise that can visibly reject — a `fetch`, SDK, storage, crypto or native-module call, an `async` function whose body the hunk shows containing `throw` or an un-caught `await`, or a `.then(` chain with no `.catch(`?",
          "criteria": {
            "true": "The argument to `ResultAsync.fromSafePromise(` is a call or async body the hunk shows can throw or reject and that has no internal try/catch or `.catch(`.",
            "false": "The wrapped promise cannot reject by construction — a function documented or typed as returning `Promise<Result<…>>` that catches internally, `Promise.resolve(value)`, a timer promise, or a promise already ending in `.catch(`; or `ResultAsync.fromPromise(p, mapError)` / `ResultAsync.fromThrowable(fn, mapError)` is used instead."
          },
          "appliesTo": [
            "**/*.ts",
            "**/*.tsx"
          ],
          "when": "fromSafePromise|fromPromise|ResultAsync",
          "message": "A promise that can reject is wrapped in `fromSafePromise`, so the rejection bypasses every handler and becomes unhandled."
        },
        {
          "id": "doc/docs/review/conventions-typescript/result-callback-throws",
          "section": "errors/result-callback-throws",
          "instructions": "Does `hunk` put a `throw`, or a call that visibly throws on bad input (`JSON.parse(`, `new URL(`, `BigInt(`, `decodeURIComponent(`, a cashu-ts or nostr-tools decoder, a zod `.parse(`), inside the callback of `.map(`, `.mapErr(`, `.andThen(`, `.orElse(`, `.andThrough(` or `.match(` on a neverthrow `Result`/`ResultAsync`, with no try/catch inside that callback?",
          "criteria": {
            "true": "A combinator callback on a neverthrow value contains an unguarded `throw` or a known-throwing call, and the callback has no try/catch around it.",
            "false": "The throwing call is wrapped with `Result.fromThrowable(fn, mapError)()` or `ResultAsync.fromThrowable` and chained with `.andThen(`; the callback returns `err(…)` instead of throwing; the callback is `async` and passed to `ResultAsync.fromPromise(…, mapError)`; the combinator is `.andTee(`; `.map(`/`.match(` on arrays, zod or other non-neverthrow values; test files."
          },
          "appliesTo": [
            "**/*.ts",
            "**/*.tsx"
          ],
          "when": "\\.(map|mapErr|andThen|orElse|andThrough|match|unwrapOr)\\(",
          "message": "A throw inside a neverthrow combinator callback escapes a function that promises a Result."
        },
        {
          "id": "doc/docs/review/conventions-typescript/spread-undefined-clobbers-default",
          "section": "types/spread-undefined-clobbers-default",
          "instructions": "Does `hunk` build a config, policy or options object by spreading a caller-supplied object with optional properties over defaults (`{ ...DEFAULTS, ...opts }`, `Object.assign({}, defaults, opts)`) and then read the merged fields as always defined, or build such an argument from possibly-undefined values (`fn({ timeoutMs: props.timeoutMs })`) for a callee the hunk shows merging that way?",
          "criteria": {
            "true": "A defaults object is merged with a caller-supplied optional-property object by spread or `Object.assign`, and the merged fields are subsequently used without any `undefined` handling.",
            "false": "Each field is merged with `??` (`timeoutMs: opts.timeoutMs ?? DEFAULTS.timeoutMs`); the override is validated or stripped of `undefined` first (zod schema with defaults, a `definedOnly`/`omitUndefined` helper); the override's fields are all required in its type; the merged fields are typed `T | undefined` and readers handle `undefined`; React style or props spreads where `undefined` means \"unset\"."
          },
          "appliesTo": [
            "**/*.ts",
            "**/*.tsx"
          ],
          "when": "\\.\\.\\.|Object\\.assign",
          "message": "An explicit `undefined` in the override object can overwrite a default while the merged type still claims the field is defined."
        },
        {
          "id": "doc/docs/review/conventions-typescript/stale-after-await",
          "section": "narrowing/stale-after-await",
          "instructions": "Does `hunk` null-check a mutable property path (`ref.current`, `this.x`, a static field, `session.quote`, `useStore.getState().x`, a module-level `let`) and then, after an `await` in the same function, dereference that same path again without re-checking it and without having captured it in a `const` before the `await`?",
          "criteria": {
            "true": "The same mutable path is guarded before an `await` and dereferenced directly after that `await` with no fresh check and no `const` capture.",
            "false": "The value is captured in a local `const` before the `await` and used through that local; the path is re-checked or accessed with `?.` after the `await`; the owner is visibly immutable for the function's lifetime (a `const` local, a `readonly` field assigned only in the constructor, a parameter object nothing else holds); no `await`, `yield` or callback boundary sits between the check and the use."
          },
          "appliesTo": [
            "**/*.ts",
            "**/*.tsx"
          ],
          "when": "await|\\.then\\(",
          "message": "A narrowed mutable path is dereferenced after an await, where the owner may have been reset."
        },
        {
          "id": "doc/docs/review/conventions-typescript/prototype-key-lookup",
          "section": "input/prototype-key-lookup",
          "instructions": "Does `hunk` index a plain-object lookup table (object literal or `Record<string, …>` constant) with a string authored by someone outside this project — a mint-supplied unit, method, NUT number or state, a relay or event field, a route or deep-link param, a field of a remote JSON document, user text — and trust the result through `TABLE[key] ?? fallback`, `TABLE[key] || fallback`, `if (TABLE[key])`, `key in TABLE`, or by rendering or calling it?",
          "criteria": {
            "true": "A string that a user, mint, relay, other app or remote document controls indexes a plain object table and the result is used via `??`, `||`, truthiness, `in`, rendering or invocation, with no own-property or type check.",
            "false": "Membership checked with `Object.hasOwn(TABLE, key)` or `Object.prototype.hasOwnProperty.call` before the read; the table is a `Map`, `Set`, or null-prototype object (`Object.create(null)`); the key was already validated against a closed union (zod enum, a registry guard such as `isFiatUnit`, a `switch` over literals); the key is a protocol identifier whose format cannot equal an inherited member name — a hex pubkey or event id, a digits-only string, a URL, a single character — validated or produced as such; the key is produced by this app's own code (enum-like constant, `Object.keys` of the same table), or read from a file or artefact this project's own tooling wrote — origin is judged by who authors the value, not by whether it travelled as JSON; a `typeof value === 'string'` or other exact type check on the result before use."
          },
          "appliesTo": [
            "**/*.ts",
            "**/*.tsx"
          ],
          "message": "Indexing a plain-object table with an external string can return an inherited member like `constructor` or `toString`."
        },
        {
          "id": "doc/docs/review/conventions-typescript/all-with-side-effects",
          "section": "async/all-with-side-effects",
          "instructions": "Does `hunk` pass to `Promise.all(` operations with side effects that may already have happened when one rejects — payments, melts, mints, swaps, sends, publishes, deletes, storage or database writes — where each outcome matters to what the caller records, retries or shows?",
          "criteria": {
            "true": "`Promise.all(` wraps mutating operations whose individual success or failure the caller needs, and the mapped callbacks do not catch their own failures.",
            "false": "`Promise.allSettled(` with every result inspected; each mapped operation catches its own failure inside the callback and returns a typed outcome (per-item try/catch, a neverthrow `Result`), so `Promise.all` cannot reject; `Promise.all` over reads only (fetches, queries, cache or storage reads, dynamic imports); operations that are all-or-nothing by design and rolled back together; test files."
          },
          "appliesTo": [
            "**/*.ts",
            "**/*.tsx"
          ],
          "when": "Promise\\.all|allSettled|Promise\\.any",
          "message": "`Promise.all` over side-effecting writes loses every outcome but the first rejection."
        },
        {
          "id": "doc/docs/review/conventions-typescript/shared-in-place",
          "section": "mutation/shared-in-place",
          "instructions": "Does `hunk` call `.sort(`, `.reverse(`, `.splice(`, `.fill(`, `.copyWithin(`, `.push(`, `.pop(`, `.shift(` or `.unshift(` on — or assign to or `delete` a property of — a value the enclosing function did not create and was not handed in order to mutate: a function parameter, a component prop, a hook, selector, query or `getState()` result, an imported or module-level constant, or a property of one of those?",
          "criteria": {
            "true": "A mutating array method, property assignment or `delete` targets a parameter, prop, hook/selector/store result, or imported/module-level value that the enclosing function did not construct — most clearly an imported constant, or one mutated through an `as` cast that widens its literal or readonly type.",
            "false": "The receiver is a fresh copy or freshly built value in the same function (`[...items].sort(…)`, `items.slice().reverse()`, `items.map(…).sort(…)`, `.filter(…)`, `Array.from(…)`, `Object.keys(…)`, a local `const out = []` pushed to); `toSorted`/`toReversed`/`toSpliced`/`with`; an Immer draft, or the argument of an updater or producer callback passed to the owning store's `update`/`set`/`produce`, whatever it is named; a parameter whose documented purpose — in its name (`out`, `acc`, `draft`, `result`), its JSDoc or the file header — is to be mutated in place; a module's own mutable context, session or cursor object threaded through its private helpers so that they can maintain it (`ctx.stack.push(…)`); a class mutating its own private field; store files; mutation during render."
          },
          "appliesTo": [
            "**/*.ts",
            "**/*.tsx"
          ],
          "when": "\\.(sort|reverse|splice|fill|copyWithin|push|pop|shift|unshift)\\(|\\bdelete\\s|Object\\.assign",
          "message": "An in-place mutation on a value the function does not own changes the caller's, store's or cache's data."
        },
        {
          "id": "doc/docs/review/conventions-typescript/empty-aggregate",
          "section": "math/empty-aggregate",
          "instructions": "Does `hunk` call `Math.max(...list)` or `Math.min(...list)` with only a spread argument, or `.reduce(fn)` with no initial value, on an array that can be empty at runtime when the call executes — a filtered or mapped list, a store or query result, wire data, a function parameter — with no length check shown before it?",
          "criteria": {
            "true": "A spread-only `Math.max`/`Math.min`, or a `reduce` without an initial value, runs on a list the hunk does not show to be non-empty and does not guard for emptiness.",
            "false": "A preceding `if (list.length === 0) return …` or `list.length ? … : …` ternary in the same function; a literal non-spread operand that bounds the result (`Math.max(0, ...list)`, `Math.min(cap, ...list)`); `reduce` with an initial value; a non-empty tuple type (`[T, ...T[]]`); a list the hunk shows being built with at least one element; a call that sits inside a `for…of`, `.map` or `.forEach` body iterating that same list, so it cannot run when the list is empty."
          },
          "appliesTo": [
            "**/*.ts",
            "**/*.tsx"
          ],
          "when": "Math\\.(max|min)\\(|\\.reduce\\(|\\[0\\]|\\.at\\(",
          "message": "An aggregate over a possibly-empty list yields `Infinity` or throws at runtime."
        },
        {
          "id": "doc/docs/review/conventions-typescript/invalid-date",
          "section": "time/invalid-date",
          "instructions": "Does `hunk` construct a `Date` (or call `Date.parse`) from a value that comes from outside the app — a relay or mint field, an API response, a deep link, persisted or user-entered text — and then compare, subtract, store, `.toISOString()` or format it, without first checking `Number.isNaN(date.getTime())` or validating the input with a schema or finite-number check?",
          "criteria": {
            "true": "An externally-sourced value is passed to `new Date(` / `Date.parse(` and the result is used in a comparison, arithmetic, storage or formatting with no validity check and no prior schema/finite-number validation.",
            "false": "The input is a finite number the hunk shows being validated (`Number.isFinite`, `z.number().int()`); `new Date()` / `Date.now()` / a timestamp produced by this app; the result goes straight into the shared `formatDate`/`formatRelative` helpers; an explicit validity check before use; tests and fixtures."
          },
          "appliesTo": [
            "**/*.ts",
            "**/*.tsx"
          ],
          "when": "new Date\\(|Date\\.parse\\(|getTime\\(|toISOString|Intl\\.DateTimeFormat|format",
          "message": "A Date built from external input may be Invalid, making every expiry comparison false and formatting throw."
        },
        {
          "id": "doc/docs/review/conventions-typescript/nan-passes-guard",
          "section": "money/nan-passes-guard",
          "instructions": "Does `hunk` take an amount, fee, limit or balance that arrives from outside the function's own arithmetic — an event or machine-context field, a route or deep-link param, a parsed payload, user input, a store field — and let it continue into a quote, send, melt, mint or other payment step when the only checks on it are a bare `typeof x === 'number'` or comparisons written in the rejecting direction (`if (amount <= 0) return …`, `if (amount > max) return …`, `amount < min || amount > max`), which are all false for `NaN`, with no `Number.isSafeInteger`, `Number.isInteger`, `Number.isFinite` or schema check (`z.number().int().positive()`, `z.int()`) on that value anywhere in the hunk?",
          "criteria": {
            "true": "A money-deciding value that enters from outside is admitted into a payment step by rejecting comparisons or a bare `typeof === 'number'` check, and no finite/integer/schema validation of that value appears in the hunk.",
            "false": "The value was already parsed by a zod number schema or came from an SDK amount type (cashu-ts amounts, `amountToNumber` of a validated amount); the guard is an acceptance test that `NaN` fails (`if (!(amount > 0 && amount <= max)) return …`, `if (amount != null && amount > 0) { … }`), including rejecting range checks nested inside such a test, or is preceded by `Number.isSafeInteger`/`Number.isFinite`; a later exact-match or set-membership acceptance that `NaN` and fractions fail; values the function computed itself from validated inputs or module constants (deltas, remainders, suggestion targets) and loop or bookkeeping conditions on them; a helper that only labels, filters or ranks candidates for display and sends nothing; a `typeof` check on a value that is only displayed; range checks on non-money values that cannot be `NaN` (array indices, lengths, enum ordinals); display-only code."
          },
          "appliesTo": [],
          "when": "amount|Amount|\\bsats\\b|Sats|balance|Balance|Number\\(|parseInt|parseFloat|isNaN|isFinite|isInteger",
          "message": "An amount guard written only as rejecting comparisons lets `NaN`, `Infinity` or fractions through as valid."
        },
        {
          "id": "doc/docs/review/conventions-typescript/exhaustive-else",
          "section": "types/exhaustive-else",
          "instructions": "Does `hunk` map ONE variable that ranges over a closed set of three or more literal values (a `kind`, `type`, `status`, `state`, `phase`, `mode` or unit compared with `===` against string literals) to results arm by arm — with an `if`/`else if` chain, a run of early returns or a nested ternary — so that the final `else`, fall-through or last arm produces the result that belongs to one specific unnamed member (a label, a colour, a state, a verdict such as `'finalized'` or `'deny'`, `true` for refund) rather than a genuinely neutral fallback?",
          "criteria": {
            "true": "An if/else-if chain, run of early returns or nested ternary over the string-literal members of one variable ends in a branch whose result is specific to one remaining member (the colour for success, the text for the last status) instead of a neutral value, so a member added later silently receives it.",
            "false": "A `switch`, or a lookup table typed `Record<Union, …>` / `satisfies Record<Union, …>`, over the union; a final branch that assigns to `never`, calls `assertNever`, throws, or returns a neutral value correct for future members (`null`, `undefined`, the input unchanged or echoed, \"unknown\"); a two-member union or boolean; a comparison against ONE literal whose `else` really means \"everything else\" (`unit === 'sat' ? … : …`); values that are open strings from the wire rather than a closed union; a ladder of guards over several different variables or conditions whose fall-through is the default or least-privileged outcome (`'ask'`, deny, not allowed); guards that skip an action for certain states and otherwise perform the same generic action for every remaining state; a final arm that handles absence (`undefined` or `null`) rather than a literal member; a discriminator the same function computes a few lines earlier with its own ternary or if-chain, so the set of values and the mapping are edited together."
          },
          "appliesTo": [
            "**/*.ts",
            "**/*.tsx"
          ],
          "when": "\\belse\\b|\\?",
          "message": "A final `else` standing for one union member will silently absorb members added later."
        },
        {
          "id": "doc/docs/review/conventions-typescript/shared-empty-readonly",
          "section": "types/shared-empty-readonly",
          "instructions": "Does `hunk` declare a module-level constant array, object, `Map` or `Set` that serves as a shared empty or default value — returned from a selector, hook or function, or used after `??` — with a mutable type (`const EMPTY: string[] = []`, `const EMPTY_AMOUNTS: Record<string, number[]> = {}`, `new Map<…>()`) rather than a read-only one?",
          "criteria": {
            "true": "A module-level empty/default collection constant handed out to consumers is declared with a mutable type and is not frozen or `as const`.",
            "false": "The constant is typed `readonly T[]`, `ReadonlyArray<T>`, `Readonly<Record<…>>`, `ReadonlyMap`/`ReadonlySet`, declared `as const`, or wrapped in `Object.freeze(`; a module-level collection that is deliberately mutable state owned by that module (a cache, registry, listener set) and is not handed out as a fallback; constants inside tests and fixtures."
          },
          "appliesTo": [
            "**/*.ts",
            "**/*.tsx"
          ],
          "when": "=\\s*\\[\\]|=\\s*\\{\\}|new (Map|Set)|EMPTY|Object\\.freeze",
          "message": "A shared module-level empty fallback with a mutable type can be corrupted for every consumer."
        },
        {
          "id": "doc/docs/review/conventions-typescript/optional-call-noop",
          "section": "async/optional-call-noop",
          "instructions": "Does `hunk` invoke a wallet, payment, persistence or publish operation through optional chaining (`await machine?.startReceive(…)`, `manager?.wallet.send(…)`, `void store?.save(…)`) and then continue as if it ran — advancing a flow, returning success, clearing state or navigating — with no branch for the owner being `undefined`?",
          "criteria": {
            "true": "A state-changing operation is called with `?.` and the following code proceeds unconditionally, with no prior guard on the owner and no check of the call's result for `undefined`.",
            "false": "The missing owner is handled first (`if (!machine) return err(notReady)`) or the optional call's result is checked for `undefined`; optional calls to callbacks and UI affordances where absence means \"nothing to do\" (`onClose?.()`, `ref.current?.focus()`, `sheetRef.current?.dismiss()`, `controller?.abort()`, `subscription?.remove()`); teardown and cleanup paths."
          },
          "appliesTo": [
            "**/*.ts",
            "**/*.tsx"
          ],
          "when": "\\?\\.",
          "message": "An optionally-chained operation may never run, yet the code after it reports success."
        },
        {
          "id": "doc/docs/review/conventions-typescript/global-test",
          "section": "regex/global-test",
          "instructions": "Does `hunk` call `.test(` or `.exec(` on a regular expression carrying the `g` or `y` flag that outlives the call — a module-level or imported constant, a class field, a `useRef`/`useMemo` value — or add the `g` flag to a shared pattern the hunk shows being used with `.test(`?",
          "criteria": {
            "true": "A persistent `g`- or `y`-flagged regex is used with `.test(`/`.exec(`, or the `g` flag is added to a shared pattern that the hunk shows `.test(` being called on.",
            "false": "The pattern used with `.test(` has no `g`/`y` flag; the regex literal is created inline at the call site each time; `g`-flagged patterns used only with `replace`, `replaceAll`, `matchAll` or `split`; an `exec` loop that deliberately iterates matches and resets `lastIndex = 0` (or runs to `null`) before reuse."
          },
          "appliesTo": [
            "**/*.ts",
            "**/*.tsx"
          ],
          "when": "\\.test\\(|\\.exec\\(|new RegExp|/[gimsuy]*g",
          "message": "`.test`/`.exec` on a shared `g`-flagged regex is stateful and alternates results for the same input."
        },
        {
          "id": "doc/docs/review/conventions-typescript/replace-first-only",
          "section": "strings/replace-first-only",
          "instructions": "Does `hunk` call `.replace(` with a string (not regex) first argument in a case where every occurrence is meant to change — removing or swapping separators, whitespace, commas, dashes, slashes, zero-width or control characters, or normalising an amount, identifier, URL, testID or key?",
          "criteria": {
            "true": "`.replace('x', …)` is given a string pattern that can occur more than once in the input and the intent is to strip or normalise all of them.",
            "false": "`.replaceAll(` or a regex with the `g` flag is used; a single prefix, suffix or sigil that can occur only once or only matters at the start (`hex.replace('#', '')`, `handle.replace('@', '')`, `uri.replace('nostr:', '')`, a scheme or file extension); replacing a unique placeholder in a template the code owns."
          },
          "appliesTo": [
            "**/*.ts",
            "**/*.tsx"
          ],
          "when": "\\.replace\\(|replaceAll",
          "message": "`.replace` with a string pattern changes only the first occurrence, leaving the rest in place."
        }
      ],
      "notChecked": [
        {
          "section": "Preamble — \"Anything a lint rule can decide is deliberately absent\"",
          "reason": "Framing prose about scope and tooling (tsc --strict, enabled lint rules, TS 5.9/neverthrow 8 versions); states no reviewable code condition."
        },
        {
          "section": "Cross-references to state/shape and react/render-mutation",
          "reason": "Pointers to other convention documents; the excluded cases are already stated as exceptions in mutation/shared-in-place rather than as rules here."
        }
      ]
    },
    {
      "id": "doc/docs/review/conventions-async-tests",
      "kind": "doc",
      "origin": "./docs/review/conventions-async-tests.md",
      "path": "docs/review/conventions-async-tests.md",
      "scope": "",
      "hash": "a002fbced5c1c442db22ae9538b921ae04e90e62e3f147d2e41e8c1ab4837d0b",
      "rules": [
        {
          "id": "doc/docs/review/conventions-async-tests/race-loser-unhandled",
          "section": "async/race-loser",
          "instructions": "Does `hunk` add a `Promise.race([` between real work and a timeout/fallback where the timer is never cleared once the work wins, or the losing work is neither cancelled nor prevented from writing state, storing a result or resolving a flow after the race is decided?",
          "criteria": {
            "true": "A new `Promise.race([...])` pairs an operation with a `setTimeout`-based deadline, and the timeout id is never cleared, or the slower side still calls a setter/persist/resolve when it eventually settles.",
            "false": "The timer is cleared in `finally`; the loser is cancelled via `AbortController` or `task.cancelAsync()`; its late result is dropped by a generation / `isStaleGeneration` / `cancelled` check; the deadline comes from `timeoutSignal` / `combineSignals` passed into `fetchJson` or `safeFetch`; a `setTimeout(resolve, 0)` yield with no deadline meaning; a payment whose late result is reconciled rather than ignored."
          },
          "appliesTo": [],
          "when": "Promise\\.race|Promise\\.any|timeout|Timeout",
          "message": "The losing side of a `Promise.race` may keep running and write state or fire timers after the race is decided."
        },
        {
          "id": "doc/docs/review/conventions-async-tests/signal-not-forwarded",
          "section": "async/signal-dropped",
          "instructions": "Does `hunk` define or change a function that accepts `signal`, `AbortSignal` or `RequestControls` and then call `fetchJson`, `safeFetch`, a facade method or another signal-accepting function without forwarding that signal?",
          "criteria": {
            "true": "The function signature or options object takes `signal` / `AbortSignal` / `RequestControls`, and an awaited call inside it that has a signal parameter is invoked without it.",
            "false": "The signal is forwarded to every awaited call that accepts one; the inner call cannot take a signal (a native module, a Coco manager call) and its result is checked against the signal before use; the function takes no signal at all."
          },
          "appliesTo": [],
          "when": "signal|AbortSignal|AbortController|RequestControls|cancel|Cancel",
          "message": "A cancellation signal the function accepts is not passed to the calls it awaits, so callers cannot actually cancel the work."
        },
        {
          "id": "doc/docs/review/conventions-async-tests/signal-unchecked-after-await",
          "section": "async/signal-dropped",
          "instructions": "Does `hunk` add code in a signal-accepting function that, after an `await`, writes state or starts the next network step without checking `signal.aborted` / `throwIfAborted()` or an equivalent guard?",
          "criteria": {
            "true": "After an `await` inside a function that received `signal`/`AbortSignal`, the added code calls a setter, persists, or issues the next request with no abort/generation/cancelled check in between.",
            "false": "The post-await write is guarded by `signal.aborted`, `throwIfAborted()`, `isAbortError`, a generation id or a `cancelled` flag; a payment effect that must run to completion once started, with only its UI updates gated."
          },
          "appliesTo": [],
          "when": "signal|AbortSignal|AbortController|RequestControls|cancel|Cancel|aborted",
          "message": "State is written or the next network step starts after an await without re-checking whether the signal was aborted."
        },
        {
          "id": "doc/docs/review/conventions-async-tests/guard-before-await",
          "section": "async/guard-before-await",
          "instructions": "Does `hunk` guard an async action against re-entry with a flag that is set only after the first `await`, or that lives in React state (`if (busy) return; setBusy(true)`) or a Zustand field read from a render closure rather than in storage that updates immediately?",
          "criteria": {
            "true": "An async handler checks a guard and sets it via `setState`/`setBusy`/a store setter read from a render closure, or sets the guard only after an `await` has already happened.",
            "false": "A `useRef`, module variable or machine field checked and set in the same synchronous block before any `await`; `useSingleFlight` / `useKeyedSingleFlight` or the shared `Pressable` / `Button`; React state used only to render the disabled/busy look while a ref or state machine is the actual guard."
          },
          "appliesTo": [],
          "when": "(busy|Busy|inFlight|isRunning|loading|Loading|submitting|Submitting|locked|Locked|posting|Posting|sending|Sending|pending|Pending)",
          "message": "A re-entrancy guard taken after the first await or held in React state does not block the second concurrent invocation."
        },
        {
          "id": "doc/docs/review/conventions-async-tests/guard-released-on-every-path",
          "section": "async/guard-released-on-every-path",
          "instructions": "Does `hunk` set a busy, in-flight, locked or posting flag before awaited work and clear it with plain statements after the `await` (or in only some branches), so a thrown error or an early `return` between set and clear leaves the flag set?",
          "criteria": {
            "true": "The flag is set to true before an `await`, and the corresponding reset happens in ordinary trailing statements or inside only some branches, with no `finally`, while an early `return` or a potentially throwing call sits between.",
            "false": "The release is in a `finally` block; every exit path visibly clears the flag and the awaited calls return `Result` values and cannot throw; a stale-generation path that deliberately leaves the newer generation's flag untouched; a flag owned by a state machine whose transitions release it."
          },
          "appliesTo": [],
          "when": "(busy|Busy|inFlight|InFlight|locked|Locked|posting|Posting|isRunning|submitting|Submitting|loading|Loading)",
          "message": "A busy flag cleared only on the happy path can stay set forever after a throw or early return."
        },
        {
          "id": "doc/docs/review/conventions-async-tests/guard-covers-effect",
          "section": "async/guard-covers-effect",
          "instructions": "Does `hunk` pass a handler to `useSingleFlight`, `useKeyedSingleFlight`, the shared `Pressable` / `Button`, or a hand-written busy guard, where the handler starts a pay, send, melt, mint, publish or other side effect with `void …`, an un-awaited call or a `.then(` chain it does not return, or releases the guard before the operation's pending record is durably written?",
          "criteria": {
            "true": "Inside a guarded handler, the main side effect is launched with `void fn()`, a bare un-awaited call or a `.then(...)` chain that is not returned, so the handler resolves first.",
            "false": "The handler awaits or returns the effect's promise; the effect is handed to an owner with its own re-entry guard (a payment machine event, `publishEvent`'s in-flight map); the detached work is not the guarded effect (haptics, logging, navigation, analytics)."
          },
          "appliesTo": [],
          "when": "useSingleFlight|useKeyedSingleFlight|onPress|onSubmit|void\\s|inFlight|busy|Busy",
          "message": "The single-flight guard is released while the detached effect it was meant to protect is still running."
        },
        {
          "id": "doc/docs/review/conventions-async-tests/coco-listener-async",
          "section": "async/coco-listeners",
          "instructions": "Does `hunk` register a Coco manager listener (`manager.on(`, `manager.once(`, an `on('proofs:saved' | 'history:updated' | 'mint-op:…' | 'melt-op:…' | 'send:…' | 'receive-op:…' | 'mint:…')` handler) whose callback is an `async` function awaiting network, storage, database or Nostr work, or that can throw without catching and logging the failure itself?",
          "criteria": {
            "true": "The registered handler is declared `async` and awaits I/O inside, or returns a promise of such work, or performs a call that can throw with no internal `try/catch` that logs.",
            "false": "A synchronous handler that updates in-memory state; a handler that detaches its async work and handles its failure (`void load()`, `void (async () => { try … catch … })()`, a `.catch(` that logs through the logger); work that must finish before the operation continues and is documented as such."
          },
          "appliesTo": [],
          "when": "\\.(on|once)\\(|addListener\\(|\\.off\\(|emitter|Emitter",
          "message": "An async Coco listener stalls the wallet operation that emitted the event, and a throw from it is silently swallowed."
        },
        {
          "id": "doc/docs/review/conventions-async-tests/unbounded-fanout",
          "section": "async/unbounded-fanout",
          "instructions": "Does `hunk` start one network, relay, mint or database request per element of a list whose size the user or the network controls (contacts, follows, relays, events, proofs, history entries, discovered mints) with `list.map(async …)` / `Promise.all` / `allSettled` and no chunking, slicing or concurrency limit?",
          "criteria": {
            "true": "A `Promise.all`/`allSettled` over `someList.map(async …)` issues a request per element, where the list comes from user data or a network response and there is no `slice`, chunk loop or concurrency pool visible.",
            "false": "Lists bounded by design (the user's trusted mints, a fixed relay set, a page capped by a schema `.max()` or a `slice(0, N)`); chunked loops; a bulk endpoint taking the whole list in one request; work behind a queue or pool that limits concurrency; no per-element request."
          },
          "appliesTo": [],
          "when": "Promise\\.all|allSettled|\\.map\\(async|for await|forEach\\(async",
          "message": "One request per element of a user- or network-sized list opens as many concurrent sockets as the list is long."
        },
        {
          "id": "doc/docs/review/conventions-async-tests/sleep-ignores-cancel",
          "section": "async/sleep-ignores-cancel",
          "instructions": "Does `hunk` add a polling, retry or backoff loop that waits with `await new Promise((r) => setTimeout(r, …))` or a `sleep`/`delay` helper and then performs network, wallet or state work without re-checking an `AbortSignal`, generation id, `isActive()` callback or mounted/focused flag after each wake-up?",
          "criteria": {
            "true": "A loop awaits a bare timer promise or `sleep(...)`/`delay(...)` and, on the next iteration, fetches, writes state or calls the wallet with no cancellation/generation/mounted check after the wait.",
            "false": "The loop checks cancellation after every wait and before every effect; a bounded loop inside a wallet operation that must finish regardless of the screen and writes only to its own operation's record; test code; tooling under `app/codereview` and `app/scripts`."
          },
          "appliesTo": [],
          "when": "setTimeout|setInterval|sleep\\(|delay\\(|backoff|poll|Poll|while\\s*\\(",
          "message": "A poll or backoff loop can keep doing work after its owner cancelled, because cancellation is never re-checked after the wait."
        },
        {
          "id": "doc/docs/review/conventions-async-tests/check-then-act",
          "section": "async/check-then-act",
          "instructions": "Does `hunk` read a balance, proof list, quote or operation state, active mint, unit or profile into a local, `await` something, and then spend, select, send, persist or decide using the pre-await value with no re-read, no lock or single-flight held across both steps, and no generation check?",
          "criteria": {
            "true": "A value read before an `await` is used after that `await` to spend, select proofs, send, persist or branch, and the chunk shows no re-read, lock, or staleness check in between.",
            "false": "The check and act happen inside one Coco or wallet operation that owns the lock (proof reservation, `sendLocked`, a prepared operation); the value is re-read or re-validated after the `await`; the snapshot is the deliberate identity of the flow, compared by `isStaleGeneration` or a profile-id check; display-only values."
          },
          "appliesTo": [],
          "when": "await|\\.then\\(",
          "message": "A balance, proof set or quote read before an await may be stale when it is spent or persisted afterwards."
        },
        {
          "id": "doc/docs/review/conventions-async-tests/intent-before-effect",
          "section": "async/intent-before-effect",
          "instructions": "Does `hunk` perform an irreversible effect (melt, swap, send, token hand-off over NFC/BLE/Nostr, mint-quote payment) and only afterwards create the persisted record that identifies the operation, or create that record with a fire-and-forget write that is not awaited before the effect starts?",
          "criteria": {
            "true": "The irreversible call happens first and the `await`ed persist/insert of the operation record follows it, or the record write before the effect is un-awaited (`void save(...)`, a floating promise).",
            "false": "A pending or prepared record is awaited before the effect and updated after it; the effect runs inside a Coco operation that journals itself; records that are pure presentation (toasts, optimistic rows) whose loss costs nothing; idempotent reads."
          },
          "appliesTo": [],
          "when": "melt|Melt|mint|Mint|swap|Swap|send|Send|receive|Receive|payment|Payment|proof|Proof|quote|Quote|invoice|Invoice|publish|nfc|NFC",
          "message": "An irreversible payment effect recorded only afterwards cannot be reconciled if the app dies mid-flight."
        },
        {
          "id": "doc/docs/review/conventions-async-tests/catch-cannot-catch-result",
          "section": "errors/catch-cannot-catch-result",
          "instructions": "Does `hunk` wrap a call that returns `Result`, `ResultAsync` or `Promise<Result>` (`fetchJson`, facade reads, `openExternalUrl`, effects built with `ResultAsync.fromThrowable`) in `try/catch` and put the user-visible or state-changing failure handling only in the `catch`, with no `isErr()` / `match` branch on the returned value?",
          "criteria": {
            "true": "A Result-returning call sits inside `try`, the `catch` shows the error toast / sets error state, and the returned value is used without an `isErr()`, `isOk()` or `match` check.",
            "false": "The result is checked with `isErr`/`match` and the `try/catch` exists for other throwing statements in the same block; a `catch` that only guards programmer errors and rethrows; the wrapped calls genuinely reject (Coco manager calls, cashu-ts, native modules)."
          },
          "appliesTo": [],
          "when": "try\\s*\\{|catch\\s*[({]|Result",
          "message": "Failure handling placed in a `catch` around a Result-returning call is dead code and the failure flows on down the happy path."
        },
        {
          "id": "doc/docs/review/conventions-async-tests/one-error-channel",
          "section": "errors/one-error-channel",
          "instructions": "Does `hunk` add or change a function whose declared return type is `Result<…>`, `ResultAsync<…>` or `Promise<Result<…>>` whose body can still throw or reject — a `throw` statement, or a throwing call (`JSON.parse`, `new URL`, `BigInt(`, a decoder, an awaited SDK or native call) not inside `try/catch` or a `fromThrowable` / `fromPromise` wrapper?",
          "criteria": {
            "true": "A function annotated `Result`/`ResultAsync`/`Promise<Result<…>>` contains an unguarded `throw`, or calls `JSON.parse`, `new URL`, `BigInt(`, a decoder or an awaited SDK/native call outside any `try`/`fromThrowable`/`fromPromise`.",
            "false": "The whole body is inside `try/catch` returning `err(…)`; every throwing call is wrapped; throws that signal programmer error only (`assertNever`, invariant checks on in-process values); functions that do not declare a `Result` return type."
          },
          "appliesTo": [],
          "when": "Result|ResultAsync|throw\\s|neverthrow",
          "message": "A function declared to return a `Result` can still throw, so callers written against its signature miss that failure."
        },
        {
          "id": "doc/docs/review/conventions-async-tests/default-hides-failure",
          "section": "errors/default-hides-failure",
          "instructions": "Does `hunk` turn the failure of a read of a balance, amount, proof or transaction list, trust or permission flag, or backup/consent status into an ordinary value with `.unwrapOr(0 | [] | false | '' | {})`, `.orElse(() => ok(default))`, `.match(v => v, () => default)` or `isErr() ? default : value`, where that value is then shown, persisted or used for a decision?",
          "criteria": {
            "true": "A Result from such a read is collapsed to a neutral-looking default that is then rendered, stored or branched on, with no distinct unavailable state.",
            "false": "The default is a distinct \"unavailable\" state, `undefined` or `null` the UI renders as a placeholder; presentational fallbacks (an npub falling back to hex, an optional icon, a display label); the error is logged and the caller still receives a failure signal by another field."
          },
          "appliesTo": [],
          "when": "unwrapOr|orElse|\\.match\\(|isErr\\(\\)|\\?\\?|\\|\\||catch",
          "message": "Collapsing an `Err` into 0, `[]` or `false` makes \"could not read\" indistinguishable from \"empty\"."
        },
        {
          "id": "doc/docs/review/conventions-async-tests/non-error-throwables",
          "section": "errors/non-error-throwables",
          "instructions": "Does `hunk` handle a caught value or rejected promise so that a non-`Error` throwable is dropped or flattened by accident — `if (e instanceof Error) { … }` with no `else`, `(e as Error).message`, `e.message` on `unknown`, or `e instanceof Error ? e.message : String(e)` feeding a value that code (not just display) relies on?",
          "criteria": {
            "true": "The catch path narrows to `Error` with no non-Error branch, casts the caught value to `Error` to read `.message`, or `String(e)`s it into a value used for logic, classification or storage.",
            "false": "The value goes through a house normaliser that keeps object fields (`errField`, `redactError`, `toError`, a named `classify*` reading `code`/`status`/`type`); the non-Error branch is handled explicitly (`typeof e === 'object' && e !== null && 'type' in e`); the string is only for display or as a log message alongside the error object; abort detection through `isAbortError`; a catch that discards detail on purpose for secrecy (a provider error may disclose credentials) and sends every value it does not recognise to a fixed, safe output."
          },
          "appliesTo": [],
          "when": "catch\\s*[({]|instanceof Error|\\bunknown\\b|throw\\s",
          "message": "A caught value that is not an `Error` is dropped or flattened to `\"[object Object]\"`, losing its fields."
        },
        {
          "id": "doc/docs/review/conventions-async-tests/serialized-error",
          "section": "errors/serialized-error",
          "instructions": "Does `hunk` serialise, persist or clone an `Error` (or an object holding a caught error under `error`, `cause`, `lastError`) with `JSON.stringify`, object spread, `structuredClone`, a Zustand `persist` field, AsyncStorage/SQLite text or a Nostr/HTTP payload, and later rely on its `message`, `name`, `cause`, `status` or `instanceof`?",
          "criteria": {
            "true": "A caught error or error-bearing object is passed through `JSON.stringify`, spread, `structuredClone` or written to persisted/transport storage, and the same code reads `message`/`name`/`cause`/`status` or checks `instanceof` on the round-tripped value.",
            "false": "The error is first mapped to a plain typed record (`{ kind, code, status, message }`) or through `errField` / `redactError`; the error object is passed to the logger itself; a fixed string code is stored instead of the error."
          },
          "appliesTo": [],
          "when": "JSON\\.stringify|structuredClone|persist|lastError|String\\(|\\.message|toString",
          "message": "A serialised or cloned `Error` loses its message, name, cause and prototype."
        },
        {
          "id": "doc/docs/review/conventions-async-tests/error-subclass-name",
          "section": "errors/subclass-name",
          "instructions": "Does `hunk` declare `class … extends Error` without assigning `name` (`this.name = '…'`, a `name` class field or `override readonly name`), or check an error by `err.name === '…'` / `constructor.name` against a class that does not set it?",
          "criteria": {
            "true": "A new or changed `class X extends Error` body contains no `name` assignment or field, or a comparison uses `err.name`/`constructor.name` against such a class.",
            "false": "The constructor or a class field sets `name` to the class's literal name; test doubles; classes only ever matched with `instanceof` inside the same module and never logged or classified by name."
          },
          "appliesTo": [],
          "when": "extends Error|constructor\\.name|\\.name\\s*===|\\.name\\s*=|instanceof",
          "message": "An `Error` subclass that never sets `name` reports `\"Error\"`, so name-based classifiers miss it."
        },
        {
          "id": "doc/docs/review/conventions-async-tests/aggregate-causes",
          "section": "errors/aggregate-causes",
          "instructions": "Does `hunk` catch, log, map or classify the rejection of `Promise.any(` (or a Coco emit/restore error documented as an `AggregateError`) using only `.message` or the error itself, without reading `.errors`?",
          "criteria": {
            "true": "The rejection handler for `Promise.any` or a documented aggregate reads only `.message` / passes the bare error to classification, and `.errors` is never inspected.",
            "false": "`.errors` is logged or mapped (duck-typed on `Array.isArray(e.errors)`); the rejection is only turned into a user-facing \"could not send\" with the aggregate passed to the logger as the error object."
          },
          "appliesTo": [],
          "when": "Promise\\.any|AggregateError|\\.errors\\b|\\bcause\\b|allSettled",
          "message": "Handling an `AggregateError` by message alone loses every per-relay or per-handler cause."
        },
        {
          "id": "doc/docs/review/conventions-async-tests/status-before-body",
          "section": "net/status-before-body",
          "instructions": "Does `hunk` call `.json()`, `.text()`, `.arrayBuffer()` or `.blob()` on a `fetch` / `safeFetch` response, or pass the body to a parser, before checking `response.ok` or `response.status` on that path?",
          "criteria": {
            "true": "A response from `fetch`/`safeFetch` has its body read or parsed with no preceding `res.ok` / `res.status` check on that code path.",
            "false": "`fetchJson`, which checks `res.ok` first; reading a known-failed response's body to extract a typed protocol error (a NUT `code`, an LNURL `{ status: 'ERROR' }`) inside a guarded parse; endpoints whose contract is a 200 with an in-band status field validated by a schema; streaming handlers that checked the status before opening the stream."
          },
          "appliesTo": [],
          "when": "fetch\\(|\\.json\\(\\)|\\.text\\(\\)|arrayBuffer\\(\\)|\\.blob\\(\\)|\\.ok\\b|\\.status\\b",
          "message": "Parsing a response body before checking the status can hide a 4xx/5xx or treat an error body as data."
        },
        {
          "id": "doc/docs/review/conventions-async-tests/url-unencoded-interpolation",
          "section": "net/url-composition",
          "instructions": "Does `hunk` interpolate or concatenate a value that comes from user input, a relay, a mint, a QR code, a deep link or route params into a URL path or query string without `encodeURIComponent` or `URL.searchParams`?",
          "criteria": {
            "true": "A template literal or concatenation builds a request URL with a variable segment or query value that is not passed through `encodeURIComponent` or `searchParams.set`.",
            "false": "Values already validated as hex ids, numbers or enum members (`protocolIds`, a Zod-parsed integer `limit`); use of `encodeURIComponent` / `searchParams.set`; module constants; `nostr/src/transport.ts`, which normalises base and path itself."
          },
          "appliesTo": [],
          "when": "https?://|new URL\\(|searchParams|\\burl\\b|Url|URL|`\\$\\{|encodeURI",
          "message": "An untrusted value interpolated into a URL can rewrite the path or query."
        },
        {
          "id": "doc/docs/review/conventions-async-tests/url-host-string-match",
          "section": "net/url-composition",
          "instructions": "Does `hunk` decide whether a URL belongs to an allowed host or origin using `startsWith(` / `includes(` on the URL string instead of comparing `new URL(x).origin` or `.host`?",
          "criteria": {
            "true": "An allow-list or ownership check compares a URL string with `startsWith`/`includes` against a host or domain rather than parsing it and comparing `origin`/`host`.",
            "false": "The check parses with `new URL` and compares `.origin`/`.host`; scheme checks such as `startsWith('https://')` that gate transport only and are followed by a `new URL` host check where the host matters."
          },
          "appliesTo": [],
          "when": "startsWith\\(|includes\\(|endsWith\\(|hostname|\\bhost\\b|origin",
          "message": "Deciding a URL's host with `startsWith`/`includes` on the raw string can be fooled by a crafted URL."
        },
        {
          "id": "doc/docs/review/conventions-async-tests/url-base-path-dropped",
          "section": "net/url-composition",
          "instructions": "Does `hunk` join a path onto a mint or server base with `new URL('/…', base)` or `new URL('…', baseWithoutTrailingSlash)`, which drops the base's own path?",
          "criteria": {
            "true": "A request URL is built as `new URL(...)` with a relative/absolute path against a configurable mint or server base, so a base path such as `/api/v1` would be discarded.",
            "false": "The base and path are normalised explicitly (trailing slash handled, path concatenated) as `nostr/src/transport.ts` does; the base is a module constant with no path."
          },
          "appliesTo": [],
          "when": "new URL\\(|baseUrl|BASE_URL|\\bbase\\b|resolve\\(",
          "message": "`new URL('/path', base)` drops any path the base URL carried."
        },
        {
          "id": "doc/docs/review/conventions-async-tests/numeric-strings",
          "section": "input/numeric-strings",
          "instructions": "Does `hunk` convert an untrusted string or bigint from an app user or a remote party — text typed in the app, a route param, a relay tag, a mint or LNURL response field, a BOLT11 section, a token amount — into an amount, count, timestamp or index with `Number(`, unary `+`, `parseInt(` or `parseFloat(`, without first checking a digits-only pattern (or `typeof` for non-strings) and `Number.isSafeInteger` on the result?",
          "criteria": {
            "true": "A value from app input, a route param or a network/protocol field is coerced with `Number(`/`+x`/`parseInt(`/`parseFloat(` and used as an amount, count, timestamp or index with no digits-only validation and no `Number.isSafeInteger` check.",
            "false": "The value passes a Zod schema enforcing `int()`, bounds and safe range; `amountToNumber` in `wallet/src/amount.ts` or `amount-actions`; `parseInt(x, 10)` of values that are digits by construction (a `\\d+` regex capture, `Platform.Version`); command-line flags or environment values an operator passes to a developer-run tool, where a bad number only degrades that operator's own output; display-only numbers; BigInt arithmetic that never narrows to `number`."
          },
          "appliesTo": [],
          "when": "Number\\(|parseInt\\(|parseFloat\\(|\\+\\+|BigInt\\(|toFixed",
          "message": "Untrusted text converted with `Number`/`parseInt` can yield a silently wrong amount, count or index."
        },
        {
          "id": "doc/docs/review/conventions-async-tests/async-assertion-settled",
          "section": "tests/async-assertion-settled",
          "instructions": "Does a Jest test in `hunk` create an `expect(promise).rejects…` or `.resolves…` assertion, or put `expect(…)` inside a `.then(` / `.catch(` / `forEach(async` callback, that is neither awaited, returned, nor stored in a variable awaited before the test ends?",
          "criteria": {
            "true": "A `.rejects`/`.resolves` assertion appears as a bare statement with no `await`/`return` and no later `await` of a stored handle, or `expect` sits in a `.then`/`.catch`/`forEach(async` callback the test never waits on.",
            "false": "`await expect(p).rejects…`; `return expect(…)`; the fake-timer idiom `const assertion = expect(p).rejects.toThrow(…); await jest.advanceTimersByTimeAsync(…); await assertion;`; Vitest and Bun test files, whose runners wait for pending assertions."
          },
          "appliesTo": [
            "**/__tests__/**",
            "**/__mocks__/**",
            "**/test/**",
            "**/tests/**",
            "**/*.test.*",
            "**/*.spec.*",
            "**/*-test.*",
            "**/*_test.*"
          ],
          "when": "\\.rejects|\\.resolves|\\.then\\(|forEach\\(async|expect\\(",
          "message": "An un-awaited async assertion lets the test pass and blames the failure on a later test."
        },
        {
          "id": "doc/docs/review/conventions-async-tests/assertion-always-runs",
          "section": "tests/assertion-always-runs",
          "instructions": "Does a test in `hunk` place all assertions for a behaviour inside a `catch` block, an event or subscription callback, or an `if` branch, with no `expect.assertions(n)` / `expect.hasAssertions()`, no `.rejects` form and no unconditional assertion forcing that path to have run?",
          "criteria": {
            "true": "Every `expect` for the behaviour under test is nested in a `catch`, a callback passed to the code under test, or a conditional, and the test has no assertion count guard and no unconditional assertion proving the path was taken.",
            "false": "The Result-narrowing idiom where an unconditional assertion precedes the branch (`expect(result.isOk()).toBe(true); if (result.isOk()) …`); callbacks whose invocation is asserted separately (`expect(onEvent).toHaveBeenCalledTimes(1)`); `await expect(fn()).rejects…`; `expect.assertions(n)` / `expect.hasAssertions()` present."
          },
          "appliesTo": [
            "**/__tests__/**",
            "**/__mocks__/**",
            "**/test/**",
            "**/tests/**",
            "**/*.test.*",
            "**/*.spec.*",
            "**/*-test.*",
            "**/*_test.*"
          ],
          "when": "expect\\(|assert",
          "message": "Assertions that live only inside a catch, callback or branch prove nothing when that path never runs."
        },
        {
          "id": "doc/docs/review/conventions-async-tests/throw-assertion-on-async",
          "section": "tests/throw-assertion-on-async",
          "instructions": "Does a test in `hunk` assert `expect(() => asyncFn(…)).not.toThrow()`, `expect(asyncFn).not.toThrow()` or `expect(async () => …).toThrow(…)` for a function that is `async` or returns a promise or `ResultAsync`?",
          "criteria": {
            "true": "A `toThrow`/`not.toThrow` assertion wraps a call to an async function, an `async` arrow, or a promise/`ResultAsync`-returning function.",
            "false": "`await expect(asyncFn()).rejects.toThrow(…)` / `.resolves`; `not.toThrow` on genuinely synchronous calls (an unsubscribe function, `JSON.stringify`, a synchronous emitter); Result-returning functions asserted through `isOk`/`isErr`."
          },
          "appliesTo": [
            "**/__tests__/**",
            "**/__mocks__/**",
            "**/test/**",
            "**/tests/**",
            "**/*.test.*",
            "**/*.spec.*",
            "**/*-test.*",
            "**/*_test.*"
          ],
          "when": "toThrow|rejects|async",
          "message": "`toThrow` / `not.toThrow` on an async function can never fail, so the assertion tests nothing."
        },
        {
          "id": "doc/docs/review/conventions-async-tests/fake-timers-with-promises",
          "section": "tests/fake-timers-with-promises",
          "instructions": "Does a test in `hunk` drive code that awaits between timers (retry or backoff loops, polling, a timeout raced against a request, `setTimeout` inside an `async` function) with `advanceTimersByTime(`, `runAllTimers()` or `runOnlyPendingTimers()` instead of the `…Async` variants, or expect `setSystemTime(` to fire pending timers?",
          "criteria": {
            "true": "A synchronous `advanceTimersByTime(`, `runAllTimers()` or `runOnlyPendingTimers()` drives code whose chain contains an `await` between timers, or `setSystemTime(` is used expecting timers to fire.",
            "false": "`await jest.advanceTimersByTimeAsync(…)` / `vi.advanceTimersByTimeAsync(…)` / `runAllTimersAsync()`; a synchronous advance wrapped in `act(() => …)` whose only consumer is a timer callback setting React state with no promise in the chain; debounce and animation timers with synchronous callbacks."
          },
          "appliesTo": [
            "**/__tests__/**",
            "**/__mocks__/**",
            "**/test/**",
            "**/tests/**",
            "**/*.test.*",
            "**/*.spec.*",
            "**/*-test.*",
            "**/*_test.*"
          ],
          "when": "advanceTimersByTime\\(|runAllTimers\\(|runOnlyPendingTimers\\(|setSystemTime\\(|useFakeTimers|advanceTimers",
          "message": "Synchronous timer advances never run the promise continuations between timers, so the code under test stops after its first step."
        },
        {
          "id": "doc/docs/review/conventions-async-tests/restore-global-fakes",
          "section": "tests/restore-global-fakes",
          "instructions": "Does a test in `hunk` install fake timers, `setSystemTime`, `spyOn(Date | Math | console | global, …)` or assign `global.fetch` / `Date.now`, and restore it only with statements at the end of the test body, only with `clearAllMocks()`, or — when `hunk` shows the file's setup and teardown hooks — not at all?",
          "criteria": {
            "true": "The fake or spy is installed inside a test body and the restore is a trailing statement (skipped if an assertion throws), is only `clearAllMocks()`, or `hunk` shows the enclosing `describe` with its hooks and none of them restores it.",
            "false": "Restoration in `afterEach` / `afterAll` / a `try … finally` (`useRealTimers()`, `restoreAllMocks()`, `mockRestore()`, reassigning the saved original); a file-level `beforeEach(useFakeTimers)` paired with `afterEach(useRealTimers)`; spies created by a helper that registers its own cleanup; `hunk` is a window into a longer test file and simply shows no restore — file-level hooks may sit outside it, so their absence is not evidence."
          },
          "appliesTo": [
            "**/__tests__/**",
            "**/__mocks__/**",
            "**/test/**",
            "**/tests/**",
            "**/*.test.*",
            "**/*.spec.*",
            "**/*-test.*",
            "**/*_test.*"
          ],
          "when": "useFakeTimers|setSystemTime|spyOn\\(|global\\.|globalThis\\.|Date\\.now|mockRestore|restoreAllMocks",
          "message": "Fake timers or a patched global left unrestored leak into the following tests in the file."
        },
        {
          "id": "doc/docs/review/conventions-async-tests/singleton-state-reset",
          "section": "tests/singleton-state-reset",
          "instructions": "Does a test in `hunk` write to a module-level singleton — `useXStore.setState(…)`, a store action, a module cache, an in-flight map, a registered Coco/Nostr listener — in a way another test in the file can observe (the same key, an asserted initial value, a size or eviction assertion), without a `beforeEach` / `afterEach` in the visible file that resets it, or assert a starting value that only holds when an earlier test ran (or did not run) first?",
          "criteria": {
            "true": "A test mutates a shared store, module cache, in-flight map or global listener registry that other tests also read and no reset hook for it is visible, or it asserts an initial value that depends on a previous test.",
            "false": "`beforeEach(() => useXStore.setState(initial, true))`, a store `reset()` action or `getInitialState()`; state created inside the test (a fresh manager, a store factory, a new `Map`); `jest.isolateModules` / `vi.resetModules` with the module re-imported afterwards; each test writes under its own key that no other test reads or writes, so no test can observe another's write."
          },
          "appliesTo": [
            "**/__tests__/**",
            "**/__mocks__/**",
            "**/test/**",
            "**/tests/**",
            "**/*.test.*",
            "**/*.spec.*",
            "**/*-test.*",
            "**/*_test.*"
          ],
          "when": "setState\\(|\\.on\\(|[Cc]ache|new Map\\(|getState\\(|beforeEach|afterEach|resetModules",
          "message": "Module-singleton state written by one test survives into the next, so the file only passes in its current order."
        },
        {
          "id": "doc/docs/review/conventions-async-tests/reset-modules-reimport",
          "section": "tests/reset-modules-reimport",
          "instructions": "Does a test in `hunk` call `jest.resetModules()` / `vi.resetModules()` (or `isolateModules`) and then keep using a binding imported at the top of the file for the module under test, or for a collaborator whose state or mock it sets up or asserts on?",
          "criteria": {
            "true": "After the reset, the test calls or asserts on a symbol that came from a top-level `import` of the module under test or a stateful collaborator, with no `require(…)` / `await import(…)` re-acquisition.",
            "false": "The module under test and every stateful collaborator are re-acquired after the reset with `require(…)` / `await import(…)`; only pure constants, types and test helpers come from top-level imports."
          },
          "appliesTo": [
            "**/__tests__/**",
            "**/__mocks__/**",
            "**/test/**",
            "**/tests/**",
            "**/*.test.*",
            "**/*.spec.*",
            "**/*-test.*",
            "**/*_test.*"
          ],
          "when": "resetModules\\(|isolateModules|\\bimport\\(|\\brequire\\(",
          "message": "After `resetModules()` a top-level import still points at the old instance, so setup and assertion can target different modules."
        },
        {
          "id": "doc/docs/review/conventions-async-tests/renderer-inside-act",
          "section": "tests/renderer-inside-act",
          "instructions": "Does a test in `hunk` call `TestRenderer.create(`, `renderer.update(`, `renderer.unmount(` or a state-changing prop callback (`props.onPress()`, `props.onChangeText()`) outside `act(…)` / `await act(async …)` and then assert on `toJSON()`, `root.findAll…` results, or the absence of an element?",
          "criteria": {
            "true": "A `react-test-renderer` create/update/unmount or a prop callback invocation sits outside any `act` wrapper, and the test then inspects `toJSON()`, `findAll`/`findByType` results or asserts something is missing.",
            "false": "The call is inside `act` or `await act(async …)`; `@testing-library/react-native` `render`, `fireEvent`, `renderHook`, which wrap `act` themselves; a test whose stated purpose is observing the pre-flush state."
          },
          "appliesTo": [
            "**/__tests__/**",
            "**/__mocks__/**",
            "**/test/**",
            "**/tests/**",
            "**/*.test.*",
            "**/*.spec.*",
            "**/*-test.*",
            "**/*_test.*"
          ],
          "when": "TestRenderer|renderer\\.(create|update|unmount)|\\.create\\(|\\bact\\(|render\\(",
          "message": "A tree created outside `act` renders nothing under React 19, so absence assertions pass vacuously."
        }
      ],
      "notChecked": [
        {
          "section": "Preamble — cross-document references",
          "reason": "The intro points at rules that live in the TypeScript and state convention docs (dropped Result, combinator-throw, `fromSafePromise`, `Promise.all`, in-flight maps); they are compiled from those documents, not this one."
        },
        {
          "section": "Preamble — provenance note",
          "reason": "\"Every rule here was reproduced by running code against the installed versions\" is documentation about the doc itself, not a code condition."
        },
        {
          "section": "async/guard-covers-effect — durable pending record",
          "reason": "The clause about releasing the guard before the pending record is durably written needs the persistence layer's behaviour across files; only the detached-effect half is checkable in one chunk and is kept in the emitted rule."
        }
      ]
    }
