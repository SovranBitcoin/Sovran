          "id": "doc/docs/review/contributor-conventions/persist-fallbacks",
          "section": "persist/fallbacks",
          "message": "A default or catch may turn invalid data into valid-looking money, consent or trust.",
          "instructions": "Does `hunk` use a schema `.default()`/`.catch()`, a migration fallback, or a `??`/`||` default that turns missing or invalid money amounts, credentials, consent/terms acceptance, backup-verified status, or trust (trusted mints, allowed signers, granted permissions) into a valid-looking or privileged value, or make an unknown enum value fall back to a privileged member?",
          "criteria": {
            "true": "A default supplies `true` for accepted/verified/trusted, a nonzero balance, a credential, or a privileged enum member when the stored value is missing or invalid.",
            "false": "Fallbacks to neutral or least-privileged values (`false`, `\"ask\"`, empty lists, `undefined`, not-accepted); fallbacks for presentational preferences (theme, sort order, UI toggles, display units)."
          },
          "appliesTo": [
            "**/stores/**/*.{ts,tsx}",
            "**/*[Ss]tore.{ts,tsx}",
            "**/persist/**/*.ts",
            "**/{cache,caches}/**/*.ts",
            "**/*[Cc]ache.ts"
          ],
          "when": "\\.default\\(|\\.catch\\(|\\?\\?|\\|\\|"
        },
        {
          "id": "doc/docs/review/contributor-conventions/persist-profile-scope",
          "section": "persist/scope",
          "message": "Identity-dependent data may be stored globally instead of per profile.",
          "instructions": "Does `hunk` keep identity-dependent data (derived from the active profile's keys, wallet, contacts, DMs, follows or viewer-specific feeds) in a global, unscoped store or cache?",
          "criteria": {
            "true": "A global store or cache holds balances, proofs, contacts, DMs, follows or viewer-specific feed data without profile scoping.",
            "false": "Profile-scoped stores (under `stores/profile`, or created per profile or pubkey); global stores holding identity-independent data (mint metadata, relay info, public profiles, theme, app settings)."
          },
          "appliesTo": [
            "**/stores/**/*.{ts,tsx}",
            "**/*[Ss]tore.{ts,tsx}",
            "**/persist/**/*.ts",
            "**/{cache,caches}/**/*.ts",
            "**/*[Cc]ache.ts"
          ],
          "when": "[Cc]ontacts|[Ff]ollows|[Dd]ms?|[Bb]alance|[Pp]roofs|[Ff]eed"
        },
        {
          "id": "doc/docs/review/contributor-conventions/cache-key-completeness",
          "section": "persist/scope",
          "message": "A cache key may omit an input that changes the result.",
          "instructions": "Does `hunk` build a cache or query key that leaves out an input the result depends on (viewer pubkey, tier, filters, cursor, mint, unit)?",
          "criteria": {
            "true": "A key array or string omits a variable that the fetcher uses (e.g. keyed only by id while the fetcher also uses the viewer pubkey or filters).",
            "false": "Cache keys include every varying input."
          },
          "appliesTo": [
            "**/stores/**/*.{ts,tsx}",
            "**/*[Ss]tore.{ts,tsx}",
            "**/persist/**/*.ts",
            "**/{cache,caches}/**/*.ts",
            "**/*[Cc]ache.ts"
          ],
          "when": "[Kk]ey"
        },
        {
          "id": "doc/docs/review/contributor-conventions/state-one-authority",
          "section": "state/one-authority",
          "message": "Data copied between stores can drift from its owner.",
          "instructions": "Does `hunk` copy data from one store, cache or query into another store via an effect or a mirroring subscription, or keep a separate copy of balances, proofs or Nostr entities that can drift from their owner?",
          "criteria": {
            "true": "An effect or subscription reads one store/query and writes the same data into another store, or a second store field duplicates balances, proofs or Nostr entities owned elsewhere.",
            "false": "Values derived on read (selectors, memoized derivations); a store that is the single owner; caches filled by their own fetcher; drafts intentionally initialised once from a store value; e2e state mirrors that only expose state to the test harness."
          },
          "appliesTo": [
            "**/stores/**/*.{ts,tsx}",
            "**/*[Ss]tore.{ts,tsx}",
            "**/persist/**/*.ts",
            "**/{cache,caches}/**/*.ts",
            "**/*[Cc]ache.ts"
          ],
          "when": "subscribe\\(|useEffect|set\\("
        },
        {
          "id": "doc/docs/review/contributor-conventions/state-immutable-updates",
          "section": "state/shape",
          "message": "Store state may be mutated in place instead of updated immutably.",
          "instructions": "Does `hunk` mutate store state in place — `state.items.push(x)`, `state.byId[k] = v`, `.splice`, `.sort` on state — outside an Immer producer?",
          "criteria": {
            "true": "A `set`/action body mutates the existing state object or its arrays directly without Immer.",
            "false": "Immutable updates (spread, `map`, `filter`) or Immer producers."
          },
          "appliesTo": [
            "**/stores/**/*.{ts,tsx}",
            "**/*[Ss]tore.{ts,tsx}",
            "**/persist/**/*.ts",
            "**/{cache,caches}/**/*.ts",
            "**/*[Cc]ache.ts"
          ],
          "when": "\\.push\\(|\\.splice\\(|state\\.[A-Za-z]+\\[|\\.sort\\("
        },
        {
          "id": "doc/docs/review/contributor-conventions/state-falsy-defaults",
          "section": "state/shape",
          "message": "A meaningful 0, false or empty string may be dropped by a truthy check or `||` default.",
          "instructions": "Does `hunk` drop a meaningful `0`, `false` or `\"\"` through a truthy check or `||` default on a store value (e.g. `value || fallback` where 0 or false is valid)?",
          "criteria": {
            "true": "`x || default` or `if (x)` gates a numeric amount, count or boolean setting where 0/false is a legitimate value.",
            "false": "`??` and explicit `=== undefined` checks; truthy checks on values where 0, false or \"\" are genuinely invalid (ids, URLs, keys)."
          },
          "appliesTo": [
            "**/stores/**/*.{ts,tsx}",
            "**/*[Ss]tore.{ts,tsx}",
            "**/persist/**/*.ts",
            "**/{cache,caches}/**/*.ts",
            "**/*[Cc]ache.ts"
          ],
          "when": "\\|\\|"
        },
        {
          "id": "doc/docs/review/contributor-conventions/state-clock-injection",
          "section": "state/clock",
          "message": "A freshness helper reading the clock itself is untestable and can disagree with itself.",
          "instructions": "Does `hunk` decide freshness, expiry or TTL by reading `Date.now()` or `new Date()` inside the freshness helper instead of taking a `nowMs` parameter?",
          "criteria": {
            "true": "A function that computes staleness/expiry calls `Date.now()` internally rather than receiving `nowMs`.",
            "false": "Freshness helpers take `nowMs`; the clock is read once at the top of an action or effect and passed down; timestamps recorded for bookkeeping (`updatedAtMs: Date.now()`)."
          },
          "appliesTo": [
            "**/stores/**/*.{ts,tsx}",
            "**/*[Ss]tore.{ts,tsx}",
            "**/persist/**/*.ts",
            "**/{cache,caches}/**/*.ts",
            "**/*[Cc]ache.ts"
          ],
          "when": "Date\\.now\\(\\)|new Date\\("
        },
        {
          "id": "doc/docs/review/contributor-conventions/cache-freshness-not-validity",
          "section": "state/clock",
          "message": "Cache freshness may be treated as proof that a quote is valid or proofs are unspent.",
          "instructions": "Does `hunk` treat a cache entry being fresh or not expired as proof that a quote is still valid or that proofs are unspent, skipping a mint check?",
          "criteria": {
            "true": "A staleness/TTL check gates spending proofs or reusing a quote without any mint proof-state or quote-state call.",
            "false": "Quote and proof validity checked against the mint; freshness used only to decide whether to refetch display data."
          },
          "appliesTo": [
            "**/stores/**/*.{ts,tsx}",
            "**/*[Ss]tore.{ts,tsx}",
            "**/persist/**/*.ts",
            "**/{cache,caches}/**/*.ts",
            "**/*[Cc]ache.ts"
          ],
          "when": "[Ss]tale|[Ff]resh|[Ee]xpir|[Pp]roofs|[Qq]uote"
        },
        {
          "id": "doc/docs/review/contributor-conventions/nostr-facade",
          "section": "nostr/facade",
          "message": "A screen or feature module may build its own Nostr read path instead of using the facade.",
          "instructions": "Does `hunk`, in a screen, hook or feature module outside `nostr/`, build its own chain of Nostr read sources (Nagg, then Primal, then relays), open relay connections or pools directly, or call Nagg, Primal or relay clients directly for reads the facade provides?",
          "criteria": {
            "true": "Code outside `nostr/` instantiates a relay pool / `SimplePool`, opens a relay connection, or calls Nagg/Primal clients with a fallback chain for reads.",
            "false": "Reads go through the Nostr facade; the file is part of `nostr/` or its tier implementations; publishing through the app publish module."
          },
          "appliesTo": [
            "**/{nostr,relay,relays,feed,threads,contacts,composer,profile,profiles,notifications,dm,dms,zap,zaps}/**/*.{ts,tsx}",
            "**/*{Nostr,Relay,Nip,Npub,Nagg,Primal,Zap,GiftWrap,Giftwrap}*.{ts,tsx}"
          ],
          "when": "Nagg|Primal|SimplePool|relayPool|[Rr]elay"
        },
        {
          "id": "doc/docs/review/contributor-conventions/signed-event-integrity",
          "section": "nostr/signed-events",
          "message": "A mutated event is no longer the one that was signed, so verification or republish can silently break.",
          "instructions": "Does `hunk` change a signed Nostr event's `content`, `tags`, `created_at`, `pubkey` or `id` and still store or treat that object as the verified signed event, or retry a publish by rebuilding/re-signing the event instead of resending the same signed event?",
          "criteria": {
            "true": "A signed event object is mutated (fields reassigned, spread with overrides, decorated with display data) and then verified, cached or published as the signed event; a publish retry path calls a sign/build function again instead of resending the stored event.",
            "false": "The raw signed event is kept untouched and display data is derived into a separate object; retries resend the stored signed event; a brand-new event is being built and signed for the first time."
          },
          "appliesTo": [
            "nostr/**/*.{ts,tsx}",
            "**/{nostr,relay,relays,feed,threads,contacts,composer,profile,profiles,notifications,dm,dms,zap,zaps}/**/*.{ts,tsx}",
            "**/*{Nostr,Relay,Nip,Npub,Nagg,Primal,Zap,GiftWrap,Giftwrap}*.{ts,tsx}"
          ],
          "when": "(sign|verif|created_at|publish|\\bsig\\b)"
        },
        {
          "id": "doc/docs/review/contributor-conventions/delivery-states-collapsed",
          "section": "nostr/delivery",
          "message": "Relay acceptance may be reported to the user as delivery.",
          "instructions": "Does `hunk` collapse optimistic, signed, relay-accepted, delivered and failed into fewer states — for example setting `delivered`, `sent: true` or an equivalent success state because a relay answered OK, or marking a message failed because some relays timed out?",
          "criteria": {
            "true": "A relay OK/accept callback sets a delivered or sent status; a relay timeout or partial rejection sets a failed status; a state enum is reduced so accepted and delivered are the same value.",
            "false": "Relay OK is recorded as an `accepted` state distinct from delivered; the separate optimistic/signed/accepted/delivered/failed states are preserved."
          },
          "appliesTo": [
            "nostr/**/*.{ts,tsx}",
            "**/{nostr,relay,relays,feed,threads,contacts,composer,profile,profiles,notifications,dm,dms,zap,zaps}/**/*.{ts,tsx}",
            "**/*{Nostr,Relay,Nip,Npub,Nagg,Primal,Zap,GiftWrap,Giftwrap}*.{ts,tsx}"
          ],
          "when": "(deliver|sent|ack|accepted|status|\\bok\\b|OK)"
        },
        {
          "id": "doc/docs/review/contributor-conventions/live-subscription-alone",
          "section": "nostr/live",
          "message": "A live subscription alone can drop events across a reconnect or replay duplicates.",
          "instructions": "Does `hunk` open a live Nostr subscription and rely on it alone — with no `since`/cursor catch-up query after reconnect or resume, or no dedupe of incoming events by event id?",
          "criteria": {
            "true": "A subscription is opened and its events are appended to state with no `since`/cursor-based catch-up on reconnect or resume, or with no seen-id set / id-keyed map guarding duplicates.",
            "false": "The live subscription is paired with a since/cursor catch-up and incoming events are deduped by id; a one-shot query rather than a live subscription."
          },
          "appliesTo": [
            "nostr/**/*.{ts,tsx}",
            "**/{nostr,relay,relays,feed,threads,contacts,composer,profile,profiles,notifications,dm,dms,zap,zaps}/**/*.{ts,tsx}",
            "**/*{Nostr,Relay,Nip,Npub,Nagg,Primal,Zap,GiftWrap,Giftwrap}*.{ts,tsx}"
          ],
          "when": "(subscribe|subscription|onevent|onEvent|REQ)"
        },
        {
          "id": "doc/docs/review/contributor-conventions/dm-plaintext-leaves-device",
          "section": "nostr/private-dms",
          "message": "Private keys or decrypted DM content may leave the device or land in unencrypted storage.",
          "instructions": "Does `hunk` send a private key or decrypted DM plaintext to Nagg or any server, decrypt DMs somewhere other than on the device, or persist decrypted DM content without encryption?",
          "criteria": {
            "true": "Decrypted message text or a private key is put in a request body, query string, header or analytics payload; decrypted DM content is written to AsyncStorage, a plain DB column or a persisted store without encryption.",
            "false": "Only encrypted payloads, ciphertext and metadata leave the device; decrypted content stays in memory or in encrypted storage (SecureStore / encrypted DB)."
          },
          "appliesTo": [
            "nostr/**/*.{ts,tsx}",
            "**/{nostr,relay,relays,feed,threads,contacts,composer,profile,profiles,notifications,dm,dms,zap,zaps}/**/*.{ts,tsx}",
            "**/*{Nostr,Relay,Nip,Npub,Nagg,Primal,Zap,GiftWrap,Giftwrap}*.{ts,tsx}"
          ],
          "when": "(decrypt|plaintext|privateKey|private_key|nsec|nip0?4|nip44|seal|giftWrap|gift_wrap)"
        },
        {
          "id": "doc/docs/review/contributor-conventions/wallet-engine-in-app",
          "section": "wallet/engine-owns",
          "message": "Wallet engine logic in app code can diverge from the wallet's own state machine.",
          "instructions": "Does `hunk`, in a file under `app/`, implement wallet engine logic itself — selecting proofs, sequencing mint, melt or swap steps, retrying payments, or reconciling history — rather than triggering a `wallet/` action or machine event and rendering its state?",
          "criteria": {
            "true": "App-layer code picks or splits proofs, chains mint/melt/swap calls in sequence, loops to retry a payment, or recomputes/reconciles transaction history locally.",
            "false": "App code dispatches one wallet or Coco API call or machine event per user action and renders the resulting state; the code only displays wallet state."
          },
          "appliesTo": [
            "app/**"
          ],
          "when": "(proof|mint|melt|swap|quote|invoice|retry|history)"
        },
        {
          "id": "doc/docs/review/contributor-conventions/cancel-assumes-rollback",
          "section": "wallet/cancel",
          "message": "Leaving a payment screen may be treated as if the payment itself stopped or was refunded.",
          "instructions": "Does `hunk` treat leaving or cancelling a payment screen (unmount cleanup, back, a cancel button, an AbortSignal) as having stopped or refunded the underlying payment — marking it cancelled or refunded, releasing its proofs, or clearing its pending record — without a wallet API confirming the rollback?",
          "criteria": {
            "true": "An unmount/cleanup, back handler, cancel press or abort path sets status to cancelled/refunded, unreserves or frees proofs, or deletes the pending transaction record with no confirming wallet rollback call.",
            "false": "Cancelling only stops UI updates, unsubscribes or ignores late results; the rollback goes through a wallet API that confirms it, or rolls back a prepared but unexecuted operation."
          },
          "appliesTo": [
            "wallet/**/*.{ts,tsx}",
            "**/{cashu,wallet,payment,payments,mint,mints,send,receive,transactions,nfc,nearPay,melt,swap,balance,proofs}/**/*.{ts,tsx}",
            "**/*{Wallet,Payment,Mint,Melt,Send,Receive,Proof,Token,Invoice,Amount,Balance,Cashu,Lightning,Onchain}*.{ts,tsx}"
          ],
          "when": "(cancel|abort|unmount|goBack|useEffect|onDismiss|AbortSignal)"
        },
        {
          "id": "doc/docs/review/contributor-conventions/lock-and-constraints-dropped",
          "section": "wallet/locks",
          "message": "A recipient lock or payment-request constraint may be silently dropped, making funds bearer-spendable or unpayable.",
          "instructions": "Does `hunk` send an unlocked bearer token when a P2PK or NUT-10 lock was requested or failed, or build a payment that drops the payment request's lock, allowed-mint list or unit?",
          "criteria": {
            "true": "A catch/fallback path produces a plain token after locking fails; the lock pubkey, allowed mints or unit from a payment request is omitted or ignored when constructing the send.",
            "false": "Lock failures abort the send with an error; the request's lock, mint list and unit are passed through and honoured."
          },
          "appliesTo": [
            "wallet/**/*.{ts,tsx}",
            "**/{cashu,wallet,payment,payments,mint,mints,send,receive,transactions,nfc,nearPay,melt,swap,balance,proofs}/**/*.{ts,tsx}",
            "**/*{Wallet,Payment,Mint,Melt,Send,Receive,Proof,Token,Invoice,Amount,Balance,Cashu,Lightning,Onchain}*.{ts,tsx}"
          ],
          "when": "(p2pk|P2PK|NUT-?10|nut10|lock|pubkey|allowedMints|mints|unit)"
        },
        {
          "id": "doc/docs/review/contributor-conventions/mint-trust-bypass",
          "section": "wallet/mint-trust",
          "message": "A network failure may be hidden behind a bypassed TLS check or a fabricated trusted-mint record.",
          "instructions": "Does `hunk` bypass TLS or certificate verification, or insert a fake/placeholder trusted-mint record (or mark a mint trusted or added) in order to hide a network or mint-info failure?",
          "criteria": {
            "true": "Code sets `rejectUnauthorized: false`, disables certificate validation, or a mint-info error path writes a stub mint entry / sets trusted or added to true.",
            "false": "Mint-info and network failures surface as errors or leave the mint in an unknown/untrusted state; certificates are validated normally."
          },
          "appliesTo": [
            "wallet/**/*.{ts,tsx}",
            "**/{cashu,wallet,payment,payments,mint,mints,send,receive,transactions,nfc,nearPay,melt,swap,balance,proofs}/**/*.{ts,tsx}",
            "**/*{Wallet,Payment,Mint,Melt,Send,Receive,Proof,Token,Invoice,Amount,Balance,Cashu,Lightning,Onchain}*.{ts,tsx}"
          ],
          "when": "(tls|TLS|certificate|rejectUnauthorized|NODE_TLS|trusted|mintInfo|mint_info|addMint)"
        },
        {
          "id": "doc/docs/review/contributor-conventions/stale-flow-context",
          "section": "wallet/fresh-flow",
          "message": "A new payment flow may inherit the previous flow's recipient, amount, unit or mint, or block offline sends on the network.",
          "instructions": "Does `hunk` start a new Send, Receive, scan or NFC flow that reuses a previous flow's recipient, amount, unit or mint from shared or persisted state instead of clearing the payment context, or make an offline send await a network fetch?",
          "criteria": {
            "true": "A flow entry point reads leftover recipient/amount/unit/mint out of a shared or persisted store without resetting it, or an offline/local send path awaits a fetch or mint call before proceeding.",
            "false": "The flow resets/clears payment context at entry; values are prefilled from explicit new input such as a scanned request, deep link or contact pick; the network call belongs to an online flow."
          },
          "appliesTo": [
            "wallet/**/*.{ts,tsx}",
            "**/{cashu,wallet,payment,payments,mint,mints,send,receive,transactions,nfc,nearPay,melt,swap,balance,proofs}/**/*.{ts,tsx}",
            "**/*{Wallet,Payment,Mint,Melt,Send,Receive,Proof,Token,Invoice,Amount,Balance,Cashu,Lightning,Onchain}*.{ts,tsx}"
          ],
          "when": "(recipient|amount|scan|nfc|NFC|reset|clear|offline|send|receive)"
        },
        {
          "id": "doc/docs/review/contributor-conventions/cta-impure-eligibility",
          "section": "cta/pure-eligibility",
          "message": "A CTA that awaits, uses wall-clock time or causes side effects in eligibility becomes untestable and can flicker.",
          "instructions": "Does a CTA `shouldShow` or eligibility function in `hunk` await / return a promise, read the network, call `Date.now()` or `new Date()` instead of the injected clock, or perform a side effect (store write, analytics, navigation)?",
          "criteria": {
            "true": "`shouldShow` is declared `async`, awaits a fetch or query, reads `Date.now()`/`new Date()` directly, or mutates state inside the eligibility check.",
            "false": "The eligibility function is a pure synchronous predicate over the injected context and the injected clock."
          },
          "appliesTo": [
            "app/shared/lib/cta/**",
            "app/shared/blocks/Cta*",
            "app/features/backup/**",
            "app/app/(prompt-flow)/**"
          ],
          "when": "(shouldShow|eligib|Eligib)"
        },
        {
          "id": "doc/docs/review/contributor-conventions/cta-security-nag-escape",
          "section": "cta/security-nags",
          "message": "A security or backup prompt may be escapable, or backup may be marked done without verification.",
          "instructions": "Does `hunk` make a security or backup prompt's primary action dismiss or snooze it, give a blocking CTA a dismiss/close/back escape, or mark the backup verified because the recovery phrase was revealed or viewed?",
          "criteria": {
            "true": "The primary button handler calls dismiss/snooze/hide; a CTA marked blocking renders a close button or enables back/hardware-back dismissal; revealing or viewing the seed sets a `backupVerified`/`backedUp` flag.",
            "false": "The primary action performs the backup or verification; verification requires the user to confirm words; a completed-backup screen whose button closes the finished flow; a non-blocking CTA dismissed through a secondary action."
          },
          "appliesTo": [
            "app/shared/lib/cta/**",
            "app/shared/blocks/Cta*",
            "app/features/backup/**",
            "app/app/(prompt-flow)/**"
          ],
          "when": "(dismiss|snooze|blocking|backup|Backup|verified|recovery|mnemonic|seed)"
        },
        {
          "id": "doc/docs/review/contributor-conventions/screen-local-header-morph",
          "section": "ui/headers",
          "message": "A screen-local header animation or multi-row navigation title breaks the shared header contract.",
          "instructions": "Does `hunk` build a screen-local header morph/collapse animation or place multi-row controls inside a navigation title, instead of using the `Screen` gradient chrome, `useIdentityHeader` handoff and measured `stickyContent`?",
          "criteria": {
            "true": "A screen defines its own scroll-driven header collapse/morph animation, or a `headerTitle`/navigation title option renders a stack of multiple rows of controls.",
            "false": "The screen uses `Screen`, `useIdentityHeader` and `stickyContent`; a single-row title or a header action button; non-header UI."
          },
          "appliesTo": [
