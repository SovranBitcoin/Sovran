          "appliesTo": [],
          "when": "reveal|Reveal|recoveryPhrase|seedPhrase|mnemonic|verified|backedUp|backup|Backup",
          "message": "Revealing the recovery phrase marks the backup verified without the user confirming it."
        },
        {
          "id": "doc/docs/review/contributor-conventions/hand-written-unit-vocabulary",
          "section": "units/registry",
          "instructions": "Does `hunk` hand-write a unit vocabulary — a `'sat' | 'usd' | …` union, a `['SAT','USD',…]` list, a symbol/label/name/flag/decimals map keyed by unit, a run of `unit === 'usd' || unit === 'eur' || …` comparisons, a cast to such a union, or an inline unit-label ternary — instead of importing or deriving it from `wallet/units`?",
          "criteria": {
            "true": "New code enumerates two or more unit values in a union, array, object map or comparison chain, or casts to such a union, without using `SWITCHABLE_UNITS`, `FIAT_UNITS`, `ACCOUNT_UNITS`, `SwitchableUnit`, `FiatUnit`, `AccountUnit`, `unitDefinition`, `unitSymbol`, `unitMinorDecimals`, `isFiatUnit` or `accountUnitLabel`.",
            "false": "The registry file itself or `app/shared/lib/cashu/unitPresentation.ts`; a table typed `Record<SwitchableUnit | FiatUnit, …>`; a comparison against ONE specific unit for behaviour that belongs to that unit; protocol unit strings passed through untouched; test fixtures and e2e scenarios; rate codes derived from `FIAT_UNITS`."
          },
          "appliesTo": [],
          "when": "['\"](sat|sats|usd|SAT|USD|btc|BTC)['\"]|\\bunit\\b|Unit\\b|currency|Currency",
          "message": "A currency/unit vocabulary is hand-written instead of derived from the unit registry."
        },
        {
          "id": "doc/docs/review/contributor-conventions/restates-owned-values",
          "section": "types/derive",
          "instructions": "Does `hunk` declare a literal union, interface, array or lookup table that restates values already owned by an `as const` object/array, a zod schema, or a library type, instead of deriving them with `typeof X[number]`, `keyof typeof X`, `z.infer`, `Pick`, `Omit`, `Parameters` or `ReturnType`?",
          "criteria": {
            "true": "The new declaration lists keys or members that are visibly also defined by another declaration in the chunk (an `as const` object/array or a zod schema) rather than deriving from it.",
            "false": "The declaration is the owner of those values; it is derived with `typeof`/`keyof`/`z.infer`/`Pick`/`Omit`; wire types generated from or validated by a schema; test fixtures."
          },
          "appliesTo": [],
          "when": "as const|z\\.(object|enum|literal|union)|\\b(type|interface)\\s|Record<",
          "message": "A type or table restates values another declaration owns, so the two can drift."
        },
        {
          "id": "doc/docs/review/contributor-conventions/record-string-key-for-union",
          "section": "types/derive",
          "instructions": "Does `hunk` index a fixed literal lookup table (`TABLE[expr]`) with an expression whose static type is a declared literal union or enum, while the table is typed `Record<string, …>` or with an index signature, or cast the key to a union (`unit as 'usd' | 'eur'`) without handling a miss — so that adding a union member compiles with no entry?",
          "criteria": {
            "true": "A table whose keys are members of a known union is declared `Record<string, …>` or indexed with a cast key, so a missing entry does not fail to compile.",
            "false": "The table is typed `Record<Union, …>` or `satisfies Record<Union, …>`; an `as const satisfies Record<string, V>` object whose literal keys are themselves the owner of the union (`keyof typeof TABLE`); a deliberately partial table typed `Partial<Record<Union, …>>` with a handled miss; keys genuinely arbitrary strings (parsed input, a wire or third-party value, user text) with the miss handled; an object added to or deleted from at runtime, or a data map or accumulator rather than a fixed table; `Record<string, unknown>` used as the generic JSON-object type; `Object.keys(x) as (keyof typeof x)[]`; test or test-harness code."
          },
          "appliesTo": [],
          "when": "Record<|\\sas\\s+['\"]|\\[key:|Partial<",
          "message": "A lookup keyed by a known union is typed loosely, so a new member compiles with no entry."
        },
        {
          "id": "doc/docs/review/contributor-conventions/boolean-instead-of-union",
          "section": "types/illegal-states",
          "instructions": "Does `hunk` add or extend a type that models mutually exclusive states as a boolean plus optional fields, or as several booleans that must stay in sync (`{ loading; data?; error? }`, `completed` plus `completedAt?`, `isPaid` and `isFailed`), where a discriminated union would make the bad combinations unrepresentable?",
          "criteria": {
            "true": "A new or extended type or state shape pairs a status boolean with optional payload fields, or adds a second boolean that can contradict an existing one.",
            "false": "Independent flags that can be true or false in any combination; props of a presentational component; wire or persisted shapes owned by another system; a boolean derived from a single source rather than stored beside it."
          },
          "appliesTo": [],
          "when": "boolean|is[A-Z]\\w*\\??:|has[A-Z]\\w*\\??:|\\?:",
          "message": "Mutually exclusive states are modelled as booleans plus optional fields, allowing contradictory combinations."
        },
        {
          "id": "doc/docs/review/contributor-conventions/zod-callback-throws",
          "section": "zod/callbacks-dont-throw",
          "instructions": "Does `hunk` `throw` inside a `.refine`, `.superRefine`, `.check`, `.transform` or `z.preprocess` callback, or call something there that throws on bad input (`JSON.parse`, `new URL`, `BigInt(…)`, a decoder) without a try/catch that reports an issue?",
          "criteria": {
            "true": "A zod callback contains a `throw`, or calls `JSON.parse`, `new URL`, `BigInt` or a decoder on the parsed value with no surrounding try/catch — including when an earlier non-aborting check on the same schema appears to guarantee validity.",
            "false": "The callback returns `false`, adds an issue via `ctx`, or returns `z.NEVER`; the throwing call is wrapped in try/catch that reports an issue."
          },
          "appliesTo": [],
          "when": "\\.refine|\\.superRefine|\\.check\\(|\\.transform|z\\.preprocess|\\.pipe\\(",
          "message": "A throw inside a zod refinement or transform escapes `safeParse` instead of becoming an issue."
