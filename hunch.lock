          "id": "doc/docs/review/contributor-conventions/copy-truncation",
          "section": "copy/truncation",
          "message": "A critical value may be shortened by slicing or shrunk to fit rather than truncated for display only.",
          "instructions": "Does `hunk` shorten an amount, fee, recipient, npub or pubkey, mint URL or host, invoice, token or recovery step with string slicing (`slice`, `substring`, a truncate helper), disable font scaling or use `adjustsFontSizeToFit` to fit such a value, or copy, sign, submit or compare a shortened value?",
