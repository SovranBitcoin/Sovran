          "appliesTo": [],
          "when": "blocking|dismiss|onClose|BackHandler|gestureEnabled|dismissible|\\bcta\\b|Cta|CTA",
          "message": "A blocking CTA gains a dismiss, close or back escape."
        },
        {
          "id": "doc/docs/review/contributor-conventions/reveal-marks-backup-verified",
          "section": "cta/security-nags",
          "instructions": "Does `hunk` set backup verified/complete as a result of the recovery phrase being revealed or viewed?",
          "criteria": {
            "true": "A reveal/view handler or effect sets `backupVerified`, `backedUp`, `backupComplete` or similar.",
            "false": "Verification is set only after the user confirms the words; reveal only toggles visibility state."
