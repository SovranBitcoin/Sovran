          "appliesTo": [],
          "when": "dismiss|snooze|remindLater|primary|onPress|\\bcta\\b|Cta|CTA|prompt",
          "message": "A security or backup prompt's primary action dismisses or snoozes it instead of doing the work."
        },
        {
          "id": "doc/docs/review/contributor-conventions/cta-blocking-escape",
          "section": "cta/security-nags",
          "instructions": "Does `hunk` give a blocking CTA or prompt a dismiss/close button, a back handler or a swipe-to-close escape?",
          "criteria": {
            "true": "A CTA marked blocking/required gets a close or dismiss control, an enabled hardware back handler, or a dismissible modal/sheet configuration.",
