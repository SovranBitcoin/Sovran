          "id": "doc/docs/review/contributor-conventions/ui-shared-parts",
          "section": "ui/shared-parts",
          "message": "A local replacement may be used instead of a shared UI primitive or theme token.",
          "instructions": "Does `hunk` introduce a local replacement for a shared UI part: a third-party or inline SVG icon instead of the `Icon` registry, `ActivityIndicator` or a hand-rolled spinner instead of `Spinner`, a custom checkmark instead of `SelectableCheck`, a hard-coded `fontFamily` string instead of the `Text` primitive's weight props, or a hard-coded hex/rgb UI color where a semantic theme token exists?",
          "criteria": {
            "true": "Added JSX uses `ActivityIndicator`, an icon imported from a third-party icon package or inline `<Svg>`, a hand-drawn checkmark, a literal `fontFamily`, or a literal `#rrggbb`/`rgb(...)` for UI surface/text color.",
            "false": "Uses `Icon`, `Spinner`, `SelectableCheck`, `Button`, `Text` and `useThemeColor` or semantic tokens; colors that are data or artwork (wallpapers, brand marks, extracted colors, chart palettes, QR); black/white scrims, shadows and overlays over media; `transparent`; the shared primitive implementations themselves; design-system catalogue and stress screens under `features/settings`."
