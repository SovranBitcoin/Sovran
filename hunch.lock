          },
          "appliesTo": [],
          "when": "shouldShow|eligib|Eligib|\\bcta\\b|Cta|CTA|prompt",
          "message": "A CTA eligibility check is async, reads the network, or uses the ambient clock instead of the injected one."
        },
        {
          "id": "doc/docs/review/contributor-conventions/cta-primary-action-dismisses",
          "section": "cta/security-nags",
          "instructions": "Does `hunk` make a security or backup prompt's primary action dismiss, snooze or defer the prompt?",
          "criteria": {
            "true": "The primary/confirm button handler calls dismiss, snooze, `markSeen`, remind-later or simply closes the security or backup prompt.",
            "false": "The primary action starts or completes the backup/verification; dismissal is only on a secondary action of a non-blocking CTA."
