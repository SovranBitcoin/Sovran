        {
          "id": "doc/docs/review/contributor-conventions/ui-block-margins",
          "section": "ui/block-margins",
          "message": "A stackable block setting its own vertical margin makes spacing depend on its parent.",
          "instructions": "Does `hunk` define a component rendering one self-contained block for screens to stack (card, notice, banner, QR block, selector, copy row) whose outermost element sets its own top or bottom margin (`mt-*`, `mb-*`, `my-*`, `marginTop`, `marginBottom`, `marginVertical`)?",
