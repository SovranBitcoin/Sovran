          "appliesTo": [],
          "when": "paymentRequest|PaymentRequest|creqA|allowedMints|\\bmints\\b|\\bunit\\b|amount",
          "message": "A payment request's lock, allowed-mint list or unit constraint is dropped when building the payment."
        },
        {
          "id": "doc/docs/review/contributor-conventions/tls-check-bypass",
          "section": "wallet/mint-trust",
          "instructions": "Does `hunk` disable or bypass TLS/certificate verification (e.g. `rejectUnauthorized: false`, trusting all certificates, allowing plain `http` for a mint)?",
          "criteria": {
            "true": "Code sets a flag or handler that accepts unverified certificates, or downgrades a mint URL to an unverified/insecure transport.",
            "false": "Normal HTTPS requests with default verification."
