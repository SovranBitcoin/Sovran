            "**/__mocks__/**",
            "**/test/**",
            "**/tests/**",
            "**/*.test.*",
            "**/*.spec.*",
            "**/*-test.*",
            "**/*_test.*"
          ],
          "when": "expect\\(|assert",
          "message": "The test only checks that something was called or defined, not the observable outcome."
        },
        {
          "id": "doc/docs/review/contributor-conventions/test-mirrors-implementation",
          "section": "tests/assert-outcomes",
          "instructions": "Is the expected side of an assertion in `hunk` produced by the code under test itself on the same input, by a helper the implementation calls, by a constant imported from the implementation, or by a line-for-line copy of its formula — so that a bug in the implementation would change both sides equally — instead of stating a literal?",
          "criteria": {
            "true": "The expectation is built from the function under test, a helper it uses, or a copy of its formula, rather than a literal.",
            "false": "Expected values are literals or fixtures independent of the implementation; an independent oracle that could disagree (a naive reference model in a property test, a different library, a differently structured derivation); invariance, round-trip or metamorphic assertions comparing two runs or two inputs; a relation between several outputs stated as a law; the function under test used only to build a later step's input; a generated artifact compared to its canonical source file."
          },
          "appliesTo": [
            "**/__tests__/**",
            "**/__mocks__/**",
            "**/test/**",
            "**/tests/**",
            "**/*.test.*",
            "**/*.spec.*",
            "**/*-test.*",
            "**/*_test.*"
          ],
          "when": "expect\\(|assert",
          "message": "The expected value is computed the same way as the code under test, so the test cannot fail."
        },
        {
          "id": "doc/docs/review/contributor-conventions/test-mocks-owned-logic",
          "section": "tests/assert-outcomes",
          "instructions": "Does a test in `hunk` add a `jest.mock`/`vi.mock` for a module this repository owns (`@/…`, `wallet`, `nostr`) that holds deterministic plain logic — a pure function, parser, mapper, formatter or state machine — whose real output would otherwise flow into the behaviour under test?",
          "criteria": {
            "true": "A new mock replaces an owned pure-logic module that the module under test could run for real — most clearly when the fake re-implements the real function, or an assertion expects the fake's return value or call arguments.",
            "false": "Mocks of system boundaries (network and network clients such as `apiClient`, native modules, SecureStore, AsyncStorage, time, randomness, the logger); an owned module whose only job is to produce a non-deterministic value (an id, clock or random helper), which is the time and randomness boundary; a store, hook or provider mocked to keep a component render test off the wallet, coco or native runtime; mocks of heavy UI primitives in a render test of something else; a stub that only cuts an import graph, where `hunk` shows the mocked function is never reached by the tested paths and no assertion depends on it; existing mocks the hunk does not add."
          },
          "appliesTo": [
            "**/__tests__/**",
            "**/__mocks__/**",
            "**/test/**",
            "**/tests/**",
            "**/*.test.*",
            "**/*.spec.*",
            "**/*-test.*",
            "**/*_test.*"
          ],
          "when": "jest\\.mock|vi\\.mock|mockImplementation|spyOn",
          "message": "A repo-owned module holding plain logic is mocked, so the test no longer exercises it."
        }
      ],
      "notChecked": [
        {
          "section": "Preamble",
          "reason": "Precedence of repo instructions/ADRs and 'use lint/type checks for deterministic requirements' is process guidance, not a per-hunk code condition."
        },
        {
          "section": "arch/owner (d) grab-bag modules",
          "reason": "Deciding that a `utils`/`helpers`/`misc` file 'mixes unrelated concerns' needs the whole module, and the allowed single-purpose shared module looks identical in one chunk."
        },
        {
          "section": "arch/owner (e) caller-switched helpers",
          "reason": "Requires seeing all call sites to know a flag is caller-specific rather than a genuine parameter."
        },
        {
          "section": "arch/owner (b) Nostr transport outside nostr/",
          "reason": "Covered by the nostr/facade rule; emitting both would double-fire on the same hunk."
        },
        {
          "section": "time/units (Nostr seconds vs JS milliseconds)",
          "reason": "Detecting a missing seconds→ms conversion requires knowing the unit of values defined in other files."
        },
        {
          "section": "time/units (persisting formatted labels)",
          "reason": "Whether a stored string is a formatted time label rather than a raw timestamp usually needs the schema and write site together."
        },
        {
          "section": "persist/scope (cache-key completeness)",
          "reason": "Judging that a cache key omits a varying input requires knowing every input the fetcher depends on, which is outside the chunk."
        },
        {
          "section": "state/shape (interleaving set calls)",
          "reason": "Requires reasoning about concurrent execution across multiple actions, not visible in a single hunk."
        },
        {
          "section": "state/clock (cache freshness as proof of quote/proof validity)",
          "reason": "Needs the mint-check path in other modules to tell whether freshness is standing in for verification."
        },
        {
          "section": "a11y/controls (accessibilityRole and accessibilityState)",
          "reason": "Shared wrappers commonly supply role and state via props, so a chunk-level check fires mostly on compliant components; the name and testID parts are checked instead."
        },
        {
          "section": "Links to hunch.config.ts and contracts.md",
          "reason": "Cross-file references; the classifier cannot follow indirection."
        },
        {
          "section": "ui/headers",
          "reason": "Points at an external header-contract.md and asks for identity continuity across iOS/Android — indirection and cross-file/visual judgement a single chunk cannot settle."
        },
        {
          "section": "zod/v4-api > intersections with transformed keys",
          "reason": "Deciding whether two intersected schemas have overlapping transformed keys needs both schema definitions, usually in other files."
        },
        {
          "section": "zod/v4-api > z.record(EnumSchema, …) exhaustiveness",
          "reason": "Whether some enum keys may legitimately be absent is not visible in the chunk."
        },
        {
          "section": "ui/glass-surfaces > isInteractive on non-controls",
          "reason": "Requires judging whether the glass surface is itself a control, which is subjective from one chunk."
        },
        {
          "section": "motion/gesture-handoff > offset capture and distance-only dismiss decisions",
          "reason": "Needs the whole gesture object and its start/update/end callbacks plus knowledge of available velocity fields; too easily misread from a partial hunk."
        },
        {
          "section": "wallet/engine-owns > one action per user action",
          "reason": "Counting API calls per user action and knowing what wallet/ exposes is a cross-file, counting judgement."
        },
        {
          "section": "units/registry > registry ownership",
          "reason": "Confirming that `wallet/src/units/registry.ts` remains the single declaration site is a whole-repo property."
        }
      ]
    },
    {
      "id": "doc/docs/review/conventions-zod",
      "kind": "doc",
      "origin": "./docs/review/conventions-zod.md",
      "path": "docs/review/conventions-zod.md",
      "scope": "",
      "hash": "bc37b6eb2e9ed1d288c49cb9e6e01ec51f9feeecf3cd208f7ad03274be8e3529",
      "rules": [
        {
          "id": "doc/docs/review/conventions-zod/money-integer-schema",
          "section": "money/integer-schema",
          "instructions": "Does `hunk` declare a schema field for a payable amount (`amount`, `sats`, `msat`, `fee`, `reserve`, `balance`, `total`, a proof or quote amount) as `z.number()` — alone or with only `.positive()`, `.nonnegative()`, `.min(…)` or `.max(…)` — without `.int()`, `z.int()` or the shared `Sats` primitive, or as `z.union([z.number(), z.string()])` that the hunk or the schema's consumer then compares, adds or sends as an amount with no integer check?",
          "criteria": {
            "true": "An amount-bearing schema field is `z.number()` (optionally with range refinements only), or a number|string union whose value is then used arithmetically or to decide a payment with no integer check.",
            "false": "Uses `Sats`, `CountInt`, `z.number().int()` or `z.int()`; the field is a fiat rate, price, score, percentage, latency or other display-only float; a loose read of a third-party history row only displayed or logged and re-validated before deciding a payment; a serialised SDK amount kept as `number | string` on a row that is only logged or forwarded; bigint or decimal-string amounts validated by a digit regex."
          },
          "appliesTo": [],
          "when": "z\\.number|z\\.int|z\\.bigint|amount|Amount|\\bsats\\b|Sats|msat|balance|fee|Fee",
          "message": "A payable amount typed as `z.number()` accepts fractions, negatives and unsafe integers."
        },
        {
          "id": "doc/docs/review/conventions-zod/coerce-beyond-number",
          "section": "zod/coerce-beyond-number",
          "instructions": "Does `hunk` add `z.coerce.string()`, `z.coerce.bigint()` or `z.coerce.date()` to a schema that parses network, relay, storage, route or QR input?",
          "criteria": {
            "true": "A schema for externally-sourced input gains `z.coerce.string()`, `z.coerce.bigint()` or `z.coerce.date()`.",
            "false": "The coercion follows a schema that already proved the value is a well-formed non-empty string (`z.string().regex(…).pipe(z.coerce.bigint())`); `z.iso.datetime()` or an integer epoch schema is used instead; the file is a test or fixture; only `z.coerce.number()` (outside this rule) appears."
          },
          "appliesTo": [],
          "when": "z\\.coerce|coerce\\.",
          "message": "`z.coerce.string/bigint/date` manufactures a value from `null`, `''` or an object instead of rejecting it."
        },
        {
          "id": "doc/docs/review/conventions-zod/url-scheme",
          "section": "zod/url-scheme",
          "instructions": "Does `hunk` add `z.url()` or `z.string().url()` with no `protocol` option for a mint URL, relay URL, media/upload server, image or avatar URL, LNURL callback, deep-link target, or any URL later passed to `fetch`, `Linking.openURL`, a WebView or an `Image`?",
          "criteria": {
            "true": "A fetched, opened, rendered or stored URL field is declared with `z.url()` / `z.string().url()` and no `protocol` option (a later `.refine` inspecting the protocol still counts).",
            "false": "Uses `HttpUrl`/`WebSocketUrl` from `@sovranbitcoin/schemas`, `z.url({ protocol: /^https?$/ })`, `/^https$/`, `/^wss?$/` with a `.max(…)`, or `z.httpUrl()`; the schema is a generic QR/clipboard classifier meant to accept arbitrary URI schemes whose output is re-checked before being fetched or opened."
          },
          "appliesTo": [],
          "when": "z\\.url|\\.url\\(|new URL\\(|https?://|protocol|scheme",
          "message": "A URL schema with no protocol constraint accepts `javascript:`, `data:` and `file:` targets."
        },
        {
          "id": "doc/docs/review/conventions-zod/url-identity-normalise",
          "section": "zod/url-identity",
          "instructions": "Does `hunk` use the output of a `z.url(…)` schema as an identity — a record or Map key, a persisted mint/relay/server URL, a dedupe or equality comparison, a trust or allow-list entry — without `normalize: true`, a `.trim()`/normalising transform, or one of the app's normalisers (`normalizeMintUrlKey`, `normalizeMintUrl`, `normalizeRelayUrl`, `normalizeMediaServer`, `stripTrailingSlashes`)?",
          "criteria": {
            "true": "A URL validated by `z.url(…)` is stored, keyed, compared or allow-listed in its raw parsed form.",
            "false": "The value is normalised before it is stored, compared or keyed; the schema uses `z.url({ normalize: true, … })`; the URL is only displayed or handed once to `fetch`/`new WebSocket`."
          },
          "appliesTo": [],
          "when": "z\\.url|\\.url\\(|new URL\\(|normali[sz]e|canonical",
          "message": "A `z.url()` output used as a key or identity is not canonical, so equivalent URLs can diverge."
        },
        {
          "id": "doc/docs/review/conventions-zod/url-protocol-regex-strictness",
          "section": "zod/url-identity",
          "instructions": "Does `hunk` add `z.url({ protocol: X })` where `X` is a regex other than the exact `/^https?$/` (for example `/^wss$/`, `/^https$/`) and rely on it to reject schemeless-authority forms like `wss:relay.example` or `https:/host`?",
          "criteria": {
            "true": "A protocol regex other than `/^https?$/` is the only guard on the URL's shape.",
            "false": "The protocol regex is exactly `/^https?$/`; the schema pairs the protocol regex with an explicit `^[a-z]+://` check or a normaliser that rejects the form."
          },
          "appliesTo": [],
          "when": "protocol|z\\.url|\\.url\\(|wss?:|https?:",
          "message": "Only the exact `/^https?$/` protocol regex makes Zod require `://`, so other regexes accept `wss:relay.example`."
        },
        {
          "id": "doc/docs/review/conventions-zod/hex-ids",
          "section": "zod/hex-ids",
          "instructions": "Does `hunk` declare a schema field for a Nostr event id, pubkey, signature, P2PK key or hash (`id`, `eventId`, `pubkey`, `peer`, `author`, `sig`, `sha256`, `x`) on relay, network, route, QR or persisted input as `z.string()`, `z.string().max(…)`, `z.string().length(64)` or another length-only check with no charset constraint, or as `z.hex()` with no length, so that the value is used without its hex format ever being checked?",
          "criteria": {
            "true": "An id/pubkey/sig/hash field is a bare or length-only string, or `z.hex()` without a length, and nothing in `hunk` checks its hex format before it is used.",
            "false": "Uses `Hex64`, `Hex128`, `Sha256Hex`, `HexOrNpub`, `NostrPubkeyHexSchema`/`NostrEventIdSchema`, `z.string().refine(isNostrPubkeyHex)`, `z.hash('sha256')` or `z.hex().length(64)`; the field is an opaque non-Nostr id (operation id, quote id, UUID) bounded with `.max(…)`; a loose upstream envelope whose events are signature-verified before use; the same function passes the parsed field through a hex predicate (`isNostrPubkeyHex`, a 64-hex regex) before any use, dropping or nulling it on failure."
          },
          "appliesTo": [],
          "when": "z\\.string|z\\.hex|hex|Hex|pubkey|Pubkey|\\bsig\\b|digest|sha256|[Ii]d\\b",
          "message": "A Nostr id, pubkey, signature or digest validated without a hex charset accepts arbitrary strings."
        },
        {
          "id": "doc/docs/review/conventions-zod/nostr-event-schema-bounds",
          "section": "nostr/event-schema-bounds",
          "instructions": "Does `hunk` add or edit a schema for a raw Nostr event or tag in which `created_at` is `z.number()` without `.int()`, `content` or a tag element is `z.string()` without `.max(…)`, or `tags` is `z.array(z.array(z.string()))` without `.max(…)` on both levels?",
          "criteria": {
            "true": "A raw-event schema leaves `created_at` non-integer, or `content`/tag strings or tag arrays without size caps.",
            "false": "Every level is bounded (`z.array(z.array(z.string().max(n)).max(m)).max(k)`, `content: z.string().max(n)`, `created_at: z.int()`); the schema describes an event the app itself just built and signed; the module documents a transport-level size limit enforced before parsing; tests and fixtures."
          },
          "appliesTo": [],
          "when": "created_at|\\btags\\b|\\bcontent\\b|\\bkind\\b|\\bpubkey\\b|\\bsig\\b|NostrEvent|z\\.object",
          "message": "An unbounded field in a raw Nostr event schema lets a relay push an arbitrarily large payload into state."
        },
        {
          "id": "doc/docs/review/conventions-zod/nostr-tag-tuple-rest",
          "section": "nostr/event-schema-bounds",
          "instructions": "Does `hunk` model a Nostr tag as a `z.tuple([...])` without `.rest(…)`?",
          "criteria": {
            "true": "A tag schema is a fixed-length `z.tuple([...])` with no `.rest(…)`, so `['e', id, relay, marker]` fails.",
            "false": "The tuple has `.rest(z.string().max(n))`; the tag is modelled as a bounded string array; the tuple describes something the app itself constructs, not a received tag."
          },
          "appliesTo": [],
          "when": "z\\.tuple|\\btags\\b|rest\\(",
          "message": "A fixed tuple rejects real Nostr tags that carry extra elements with `too_big`."
        },
        {
          "id": "doc/docs/review/conventions-zod/input-size-caps",
          "section": "input/size-caps",
          "instructions": "Does `hunk` add, to a schema that parses a network or relay response, a route or deep-link param, a QR/NFC/BLE/clipboard payload, or a persisted blob, a `z.string()` with no `.max(…)`/`.length(…)`/bounded-quantifier `.regex(…)`, a `z.array(…)` with no `.max(…)`, or a `z.record(…)` with neither a bounded key schema nor a size check?",
          "criteria": {
            "true": "A string, array or record field in an externally-fed schema has no size bound.",
            "false": "`z.enum`, `z.literal` or a length-limited format schema (`Hex64`, `Bolt11`, `LightningAddress`, `HttpUrl`); the house `.max(2048)` for URLs or a comparable named limit; fields of a schema that only parses constants the module owns; a documented transport-level byte limit enforced before the parse; a tolerant helper with a cap; tests and fixtures."
          },
          "appliesTo": [],
          "when": "z\\.string|z\\.array|z\\.record|\\.max\\(|\\.min\\(",
          "message": "An uncapped string, array or record from untrusted input can carry megabytes into state and storage."
        },
        {
          "id": "doc/docs/review/conventions-zod/cap-before-expensive-check",
          "section": "zod/cap-before-expensive-check",
          "instructions": "Does `hunk` chain, on a string from untrusted input, a `.regex(…)` with nested or overlapping quantifiers or a `.refine`/`.superRefine` that decodes, hashes, bech32/base64-decodes or `JSON.parse`s the value, after a `.max(…)`/`.length(…)` that lacks `{ abort: true }`, or with no length check before it at all?",
          "criteria": {
            "true": "An expensive check follows a non-aborting length cap, or has no preceding cap.",
            "false": "`.max(n, { abort: true })` precedes the expensive check; the regex is linear-time, anchored and bounded (`/^[a-f0-9]{64}$/`); the predicate is cheap (`isNostrPubkeyHex`, a `startsWith`); a `.pipe(…)` whose first schema carries the cap; length is checked by the caller before `safeParse`."
          },
          "appliesTo": [],
          "when": "\\.refine|\\.superRefine|\\.regex\\(|\\.check\\(|\\.transform",
          "message": "Zod runs later checks even after `.max()` fails, so an expensive regex or decoder still sees the huge input."
        },
        {
          "id": "doc/docs/review/conventions-zod/union-order",
          "section": "zod/union-order",
          "instructions": "Does `hunk` add or reorder a `z.union([...])` in which an earlier object member's required keys are a subset of a later member's, or in which an earlier member can never fail — it ends in `.catch(…)`, is a `z.coerce.*`, `z.unknown()`/`z.any()`, or an object whose keys are all optional?",
          "criteria": {
            "true": "An earlier union member subsumes or can never fail before a later, narrower member.",
            "false": "Members are mutually exclusive by a literal tag, by primitive type (`z.union([z.number(), z.string()])`) or by disjoint required keys; the most specific member is first with a comment; members are `z.strictObject`; the permissive member is deliberately last as a fallback."
          },
          "appliesTo": [],
          "when": "z\\.union|z\\.discriminatedUnion|\\.or\\(",
          "message": "A broad union member listed first wins and silently strips the narrower member's fields."
        },
        {
          "id": "doc/docs/review/conventions-zod/tagged-union",
          "section": "zod/tagged-union",
          "instructions": "Does `hunk` add a `z.union([...])` whose members are all objects carrying the same key as a `z.literal` or single-value `z.enum` (`ok`, `type`, `kind`, `status`, `transport`) instead of `z.discriminatedUnion('<key>', [...])`?",
          "criteria": {
            "true": "All members share a literal-valued discriminator key but the union is `z.union`.",
            "false": "Members have no common literal key; error-body schemas matched by shape because upstreams disagree; a member that is itself a union or a primitive; the tag lives at a nested path; a persisted or list item where an unknown tag must degrade per entry via tolerant helpers or a per-item parse."
          },
          "appliesTo": [],
          "when": "z\\.union|z\\.discriminatedUnion|z\\.literal",
          "message": "A plain union of literal-tagged objects reports a pathless `invalid_union` and tries every member."
        },
        {
          "id": "doc/docs/review/conventions-zod/catch-shared-mutable-fallback",
          "section": "zod/shared-fallback-reference",
          "instructions": "Does `hunk` pass an array or object to `.catch(` by value — `.catch([])`, `.catch({})`, `.catch({ … })`, or `.catch(SOME_CONSTANT)` where the constant holds an array or object?",
          "criteria": {
            "true": "`.catch(` receives a literal array/object, or a constant whose declaration or type shows it is an array or object, rather than a factory.",
            "false": "A factory (`.catch(() => [])`, `.catch(() => ({}))`); primitives, `undefined` or `null`; a constant that is a string, number, boolean or enum member (`.catch(DEFAULT_MODE)` where `DEFAULT_MODE = 'relaxed'`); a frozen (`Object.freeze`) or provably never-mutated fallback."
          },
          "appliesTo": [],
          "when": "\\.catch\\(|\\.default\\(",
          "message": "`.catch([])` returns the same array or object on every fallback, making it shared mutable state."
        },
        {
          "id": "doc/docs/review/conventions-zod/default-nested-container",
          "section": "zod/shared-fallback-reference",
          "instructions": "Does `hunk` pass `.default(` an object or array that itself contains nested arrays or objects (`.default({ items: [] })`, `.default(DEFAULTS)`)?",
          "criteria": {
            "true": "A `.default(` value is a container with nested containers inside it, or a referenced constant object.",
            "false": "A factory (`.default(() => ({ items: [] }))`); `.prefault(…)`; primitives; flat `.default([])`/`.default({})`; a frozen default."
          },
          "appliesTo": [],
          "when": "\\.default\\(|\\.catch\\(|\\.prefault\\(",
          "message": "`.default()` clones only one level, so nested arrays or objects in the default are shared between parses."
        },
        {
          "id": "doc/docs/review/conventions-zod/persist-additive-fields",
          "section": "persist/additive-fields",
          "instructions": "Does `hunk` add a field to a schema passed to `persistConfig({ schema })` (or to a row schema inside it) that is required when the key is absent — no `.optional()`, `.default(…)`, `.catch(…)` or `.nullish()`, including a field that is only `.nullable()` — without a `version` bump whose `migrate` fills the field?",
          "criteria": {
            "true": "A new persisted-schema field is required (or merely `.nullable()`) and no version bump plus migrate appears with it.",
            "false": "The field is `.optional()`, `.nullish()`, `.default(v)`, `.nullable().default(null)` or `.catch(v)` with a neutral value; the row sits inside `tolerantArray`/`tolerantRecord` where dropping old rows is stated as intended; the change includes a `version` bump and a `migrate` writing the field; a brand-new store with no shipped blobs."
          },
          "appliesTo": [],
          "when": "persist|partialize|migrate|z\\.object|storage",
          "message": "A required new field in a persisted schema makes every previously written blob fail to parse."
        },
        {
          "id": "doc/docs/review/conventions-zod/custom-needs-predicate",
          "section": "zod/custom-needs-predicate",
          "instructions": "Does `hunk` add `z.custom<T>()` with no validator function?",
          "criteria": {
            "true": "`z.custom<T>()` is called with no predicate argument.",
            "false": "`z.custom<T>(predicate, message)` with a real type guard (e.g. `NostrPubkeyHexSchema`); tests."
          },
          "appliesTo": [],
          "when": "z\\.custom|z\\.instanceof|z\\.unknown",
          "message": "`z.custom<T>()` without a validator accepts every value while claiming the type."
        },
        {
          "id": "doc/docs/review/conventions-zod/brand-without-validation",
          "section": "zod/custom-needs-predicate",
          "instructions": "Does `hunk` add a `.brand<…>()` (or a branded `z.custom`) to a schema that carries no charset, length, format or predicate check behind the brand?",
          "criteria": {
            "true": "A brand is applied to a schema with no `.regex`, `.length`, `.max`, format or `.refine` validation.",
            "false": "The brand follows a `.regex`/`.refine`/format check in the same schema; tests."
          },
          "appliesTo": [],
          "when": "\\.brand|[Bb]randed",
          "message": "`.brand<…>()` adds a type but no runtime check, so the brand is unearned."
        },
        {
          "id": "doc/docs/review/conventions-zod/branded-id-as-cast",
          "section": "zod/custom-needs-predicate",
          "instructions": "Does `hunk` create a branded or protocol id value with an `as` cast (`value as NostrPubkeyHex`, `as Hex64`) on data that did not pass the branded schema or its type guard?",
          "criteria": {
            "true": "An `as` cast produces a branded id from unvalidated data.",
            "false": "The cast sits inside the single constructor or guard that owns the brand (`protocolIds.ts`) or in a `.transform` directly after the validating check (`nip46Uri.ts` `PubkeyHexSchema`); the value provably came from the branded schema; tests."
          },
          "appliesTo": [],
          "when": "\\bas\\s+[A-Z]|\\bbrand",
          "message": "An `as` cast to a branded protocol id bypasses the validation the brand promises."
        },
        {
          "id": "doc/docs/review/conventions-zod/use-parsed-output",
          "section": "zod/use-parsed-output",
          "instructions": "Does `hunk` use `schema.safeParse(x).success` or `parseWith(...)(x).isOk()` only as a boolean gate and then read, store, spread or send the original `x`, where the schema is an object schema or contains a `.transform`, `.toLowerCase()`, `.trim()`, `.default`, `.catch`, `.pipe`, a codec or a brand?",
          "criteria": {
            "true": "The parse result is discarded except for its success flag and the raw value is used downstream.",
            "false": "The code continues with `result.data` or the `Result` value; the schema validates a primitive with no transforming step and is used as a plain predicate (`LightningAddress.safeParse(v).success`); the raw value is kept deliberately and verbatim (a signed Nostr event, a token string) with display data derived from `.data`; tests."
          },
          "appliesTo": [],
          "when": "safeParse|\\.parse\\(|isOk\\(\\)|\\.success",
          "message": "Using the raw input after a successful parse keeps stripped keys and skips transforms."
        },
        {
          "id": "doc/docs/review/conventions-zod/infer-direction",
          "section": "zod/infer-direction",
          "instructions": "Does `hunk` type a value that is written, sent, serialised or passed to `.parse`/`.safeParse` with `z.infer<typeof S>`/`z.output<typeof S>` where `S` contains a type-changing `.transform`, `.pipe`, `z.coerce.*` or codec, or re-parse with `S` a value `S` already produced?",
          "criteria": {
            "true": "An input-side value is typed with `z.infer`/`z.output` of a transforming schema, or a parsed output is parsed again by the same schema.",
            "false": "The schema's input and output types are identical; writers use `z.input<typeof S>` and readers `z.infer`; only idempotent string normalisers (`.trim()`, `.toLowerCase()`) are involved; `z.codec` with `.encode` handles the reverse direction; the second parse uses a different, narrower schema."
          },
          "appliesTo": [],
          "when": "z\\.infer|z\\.output|z\\.input|\\.transform",
          "message": "`z.infer` is the output type, so a value fed into a transforming schema is typed in the wrong direction."
        },
        {
          "id": "doc/docs/review/conventions-zod/loose-output-containment",
          "section": "zod/loose-output-containment",
          "instructions": "Does `hunk` spread the output of a `z.looseObject`/`.passthrough()`/`.catchall()` parse of network, relay, QR or deep-link data after trusted fields in an object literal, merge it with `Object.assign`, or write the whole parsed object into a persisted store, a query cache or AsyncStorage?",
          "criteria": {
            "true": "A loosely-parsed external object is spread over trusted fields, `Object.assign`ed, or persisted wholesale.",
            "false": "Named fields are picked (`{ mintUrl: parsed.mintUrl }`); the parsed object is spread first and trusted fields after it; a strip-mode `z.object` view is applied before the spread or write; in-memory pass-through of a protocol object whose unknown fields must survive verbatim, bounded by the transport size; persisted rows that are loose by house convention and written only by the app's own `partialize`."
          },
          "appliesTo": [],
          "when": "looseObject|passthrough|catchall|\\.\\.\\.|z\\.object",
          "message": "Spreading a loose-parsed object lets the sender's unknown keys overwrite trusted fields or reach storage."
        },
        {
          "id": "doc/docs/review/conventions-zod/record-lookup",
          "section": "zod/record-lookup",
          "instructions": "Does `hunk` index the output of a `z.record(z.string(), …)` (or a map typed `Record<string, T>`) with a key that comes from a relay, route param, deep link, QR or other external input and use the result without an `undefined` check, or test membership with `key in record` / truthiness instead of `Object.hasOwn(record, key)`?",
          "criteria": {
            "true": "An externally-supplied key indexes a record and the result is used unguarded, or membership is tested with `in`/truthiness.",
            "false": "`record[key]?.…`, an explicit `=== undefined` guard, or `Object.hasOwn`; the key is validated as `Hex64`, an npub or an `HttpUrl`; iteration via `Object.entries`/`Object.keys`; the collection is a `Map`."
          },
          "appliesTo": [],
          "when": "z\\.record|Record<|\\[[A-Za-z_$][\\w.$]*\\]",
          "message": "A `z.record` lookup by an external key can be `undefined` or an inherited `Object.prototype` member."
        },
        {
          "id": "doc/docs/review/conventions-zod/per-item-containment",
          "section": "input/per-item-containment",
          "instructions": "Does `hunk` parse a list from relays or a third-party upstream (Primal, mempool, BTC Map, mint directories, LNURL services) with `z.array(StrictItemSchema)` inside the response schema, or drop invalid items inside a schema `.transform`/`.catch` on such a list without counting or logging the rejects?",
          "criteria": {
            "true": "An upstream list is parsed all-or-nothing, or items are silently filtered out inside a transform/catch with no reject count or log.",
            "false": "An outer loop `safeParse`s each item and logs a reject count; all-or-nothing parsing of our own nagg contract; `tolerantArray`/`tolerantRecord` for persisted blobs; item fields made individually tolerant with `.optional().catch(undefined)`."
          },
          "appliesTo": [],
          "when": "z\\.array|\\.map\\(|safeParse|\\.parse\\(",
          "message": "One malformed item from an upstream list rejects the whole response instead of just that item."
        },
        {
          "id": "doc/docs/review/conventions-zod/route-param-non-string",
          "section": "routes/param-schemas",
          "instructions": "Does `hunk` give a schema passed to `useRouteParams` a field that is not string-based — `z.number()`, `z.int()`, `z.boolean()`, `z.array(…)`, `z.object(…)` — or a `z.coerce.*` field, or a `.catch(…)` that rewrites an invalid param into a valid one?",
          "criteria": {
            "true": "A `useRouteParams` schema field is non-string, coercing, or carries a `.catch(…)` default for an invalid param.",
            "false": "`z.string().max(n)`, `z.enum([...])`, `Hex64`/npub schemas; numbers as `z.string().regex(/^[0-9]{1,16}$/)` then `.transform(Number).pipe(z.int()…)`; flags via `z.stringbool()` or an explicit enum; `.optional()` for absent params."
          },
          "appliesTo": [],
          "when": "useRouteParams|useLocalSearchParams|useGlobalSearchParams|SearchParams|RouteParams|params",
          "message": "A non-string or coercing route-param field can never match, or turns a bad param into a valid one."
        },
        {
          "id": "doc/docs/review/conventions-zod/route-json-param-unbounded",
          "section": "routes/param-schemas",
          "instructions": "Does `hunk` `JSON.parse` a route or deep-link param without validating the result against a bounded inner schema?",
          "criteria": {
            "true": "A route param's JSON payload is parsed and used without a bounded schema behind it.",
            "false": "The JSON is `safeParse`d against a bounded inner schema (`EntrySchema`) after a `.max(…)` on the param string."
          },
          "appliesTo": [],
          "when": "useRouteParams|useLocalSearchParams|useGlobalSearchParams|SearchParams|RouteParams|JSON\\.parse",
          "message": "A JSON-carrying route param parsed without a bounded inner schema accepts attacker-shaped payloads."
        },
        {
          "id": "doc/docs/review/conventions-zod/recursive-depth",
          "section": "zod/recursive-depth",
          "instructions": "Does `hunk` add a recursive schema (`z.lazy(() => …)` or a getter returning the enclosing schema) that parses network, relay, QR, deep-link or persisted data without a depth bound, a raw-text size cap, or a `try/catch` around the parse?",
          "criteria": {
            "true": "A recursive schema parses external data with no depth bound, no preceding byte cap and no guard around the parse.",
            "false": "The schema is unrolled to a fixed depth; the raw input is capped to a byte length before `JSON.parse`; the recursion covers data the app built itself; the parse is wrapped so a `RangeError` becomes a `ParseError` result."
          },
          "appliesTo": [],
          "when": "z\\.lazy|[Rr]ecursive|get\\s+\\w+\\(\\)",
          "message": "A recursive schema can throw `RangeError` out of `safeParse` on deeply nested input."
        },
        {
          "id": "doc/docs/review/conventions-zod/partial-defaults",
          "section": "zod/partial-defaults",
          "instructions": "Does `hunk` derive an update, patch or settings-override schema with `.partial()` (or `.pick(…).partial()`) from a schema whose fields carry `.default(…)`/`.catch(…)`, and then merge the parsed result over existing state (`{ ...current, ...parsed }`, `set(parsed)`)?",
          "criteria": {
            "true": "A `.partial()`-derived patch schema retains field defaults and its result is merged over existing state.",
            "false": "The patch schema is declared without defaults; omitted keys are removed before the merge; the base schema has no `.default`/`.catch` fields; a lenient read of an upstream object where filling defaults is the intent and nothing is merged over stored state."
          },
          "appliesTo": [],
          "when": "\\.partial\\(|\\.default\\(|patch|Patch|merge",
          "message": "`.partial()` keeps field defaults, so an omitted patch key overwrites stored state with the default."
        },
        {
          "id": "doc/docs/review/conventions-zod/enum-source",
          "section": "zod/enum-source",
          "instructions": "Does `hunk` build a `z.enum(…)` from `Object.keys(X)`, a non-`as const` array variable, a `.map(…)` result, or anything cast to `[string, ...string[]]`?",
          "criteria": {
            "true": "The enum's members come from a computed or untyped string array rather than literals or an `as const` source.",
            "false": "`z.enum(['a','b'])` literals; an `as const` array or object passed directly; a TypeScript `enum`; an array whose declared element type is already the literal union (`readonly AccountUnit[]`); `.extract`/`.exclude`/`.options` of an existing enum; a genuinely dynamic vocabulary where `string` is the honest type."
          },
          "appliesTo": [],
          "when": "z\\.enum|z\\.nativeEnum|Object\\.keys|as const",
          "message": "A `z.enum` built from `Object.keys` or a non-`as const` array infers `string`, disabling exhaustiveness downstream."
        }
      ],
      "notChecked": [
        {
          "section": "persist/caps-match-writers",
          "reason": "Requires comparing a persisted schema's bound with the store's write path elsewhere in the change (and capacity tests in another file); not decidable from one chunk."
        },
        {
          "section": "Preamble — re-check rules when a dependency is upgraded",
          "reason": "Process guidance about maintaining the convention doc, not a property of a code chunk."
        },
        {
          "section": "Preamble — rules reproduced against installed package versions",
          "reason": "Process/verification requirement, not reviewable from a diff."
        }
      ]
    },
    {
      "id": "doc/docs/review/conventions-react-native",
      "kind": "doc",
      "origin": "./docs/review/conventions-react-native.md",
      "path": "docs/review/conventions-react-native.md",
      "scope": "",
      "hash": "c7e74137f7e59645f1ce38e656f4d38f3c71e0ce60a2d21a682077aafb43b327",
      "rules": [
        {
          "id": "doc/docs/review/conventions-react-native/row-local-state-recycling",
          "section": "lists/row-local-state",
          "instructions": "Does `hunk` add a `useState` or `useRef` holding item-specific state (expanded, selected, failed, loaded, measured size, pending action) inside a component rendered as a row of `List`/`FlashList`/`AnimatedFlashList`, without `useRecyclingState`/`useLayoutState` keyed on the item identity and without any reset keyed on the item?",
          "criteria": {
            "true": "A row component rendered by a `renderItem` (or a component clearly used as a list row) introduces `useState`/`useRef` whose value depends on which item is shown, with no `useRecyclingState(initial, [item.id])`, no store/map keyed by item id, and no effect resetting it on item identity change.",
            "false": "`useRecyclingState`/`useLayoutState` with the item identity in deps; state kept in a store or map keyed by item id; state reset in an effect keyed on item identity (the `Avatar` `imageStatus` pattern); state identical for every item (measured constant width, theme values); rows of `ScrollView` + `.map` or of a small keyed `FlatList`; components that are not list rows."
          },
          "appliesTo": [
            "**/*.tsx",
            "**/*.jsx"
          ],
          "when": "useState|useRef|renderItem|FlashList|FlatList",
          "message": "State held in a recycled FlashList row can show the previous item's value after reuse."
        },
        {
          "id": "doc/docs/review/conventions-react-native/key-inside-recycled-row",
          "section": "lists/key-inside-row",
          "instructions": "Does `hunk` put an item-derived `key` (e.g. `key={item.id}`) on the root element returned by a `renderItem` of `List`/`FlashList`, or key the children of a `.map()` inside a recycled row by item-derived ids instead of `useMappingHelper().getMappingKey(id, index)`?",
          "criteria": {
            "true": "A `renderItem` root element carries `key={item.id}` or similar, or a `.map()` inside a recycled row component uses item ids as React keys without `getMappingKey`.",
            "false": "`keyExtractor` on the list itself; `.map()` keys from `getMappingKey`; index keys for a fixed-length static `.map()` inside a row; keys inside `ScrollView` + `.map` content, `FlatList` rows, or components not rendered by a recycling list; a remount key with a comment saying the subtree must reset per item."
          },
          "appliesTo": [
            "**/*.tsx",
            "**/*.jsx"
          ],
          "when": "key=\\{|\\.map\\(|renderItem|keyExtractor",
          "message": "An item-derived `key` inside a recycled row forces a remount on every recycle."
        },
        {
          "id": "doc/docs/review/conventions-react-native/list-unique-keys",
          "section": "lists/unique-keys",
          "instructions": "Does `hunk` add a `List`/`FlashList` with no `keyExtractor`, or a `keyExtractor` returning a value that can repeat within the list — the array index, a pubkey/timestamp/title, or an id shared by merged sources — without the data being de-duplicated first?",
          "criteria": {
            "true": "A `List`/`FlashList` element is added with no `keyExtractor` prop, or its `keyExtractor` returns the index, a non-unique field, or an id that rows merged from several sources or several row types can share.",
            "false": "Keys from a unique entity id or a composite like `${kind}:${id}` unique across row types; data de-duplicated by id before reaching the list; static lists of module-level constants keyed by a unique constant field; section/header rows with their own namespaced key."
          },
          "appliesTo": [
            "**/*.tsx",
            "**/*.jsx"
          ],
          "when": "keyExtractor|FlashList|FlatList|SectionList|LegendList|<List[\\s>]",
          "message": "A missing or repeatable `keyExtractor` value breaks FlashList v2 scroll anchoring."
        },
        {
          "id": "doc/docs/review/conventions-react-native/end-reached-guard",
          "section": "lists/end-reached-guard",
          "instructions": "Does `hunk` pass an `onEndReached` or `onStartReached` handler that starts a page fetch without a visible check that a load is not already in flight and that more pages exist?",
          "criteria": {
            "true": "The handler (or the paginator function shown in the hunk) calls a fetch/load-more without checking an in-flight flag/ref and a has-more/cursor condition.",
            "false": "The handler or paginator returns early on `isLoadingMore`/`hasMore === false`/a cursor-in-flight ref; `onEndReached={hasMore ? loadMore : undefined}`; `fetchNextPage` guarded by `hasNextPage && !isFetchingNextPage`; handlers that only record analytics or advance a carousel."
          },
          "appliesTo": [],
          "when": "onEndReached|onStartReached|loadMore|fetchNextPage|pagina",
          "message": "`onEndReached` can fire on mount and repeatedly, so an unguarded fetch loads the same page many times."
        },
        {
          "id": "doc/docs/review/conventions-react-native/nested-same-axis-list",
          "section": "lists/nested-same-axis",
          "instructions": "Does `hunk` render a virtualized list — a component that takes `data` and `renderItem`, such as `FlashList`, `FlatList`, `SectionList` or the shared `List` wrapper around them — inside a `ScrollView`, `ScreenScrollView`, `BottomSheetScrollView` or another list's header/row that scrolls on the same axis, or give a vertical virtualized list a parent with no bounded height?",
          "criteria": {
            "true": "The hunk shows a vertical virtualized list nested inside a vertical scroll container (or a same-axis nesting), or a vertical virtualized list whose visible parent has no height bound and sizes to content.",
            "false": "A horizontal list inside a vertical scroller or the reverse; outer content moved into `ListHeaderComponent`/`ListFooterComponent`; a list with `scrollEnabled={false}` over a small bounded data set the hunk shows; the sheet-scroll injection used by `SectionAnchorList`; a component with `List` in its name that lays out static JSX children (a grouped-row container and its rows) rather than taking `data` and `renderItem` — it is not a virtualized list."
          },
          "appliesTo": [
            "**/*.tsx",
            "**/*.jsx"
          ],
          "when": "FlashList|FlatList|SectionList|ScrollView|LegendList|<List[\\s>]",
          "message": "A virtualized list inside a same-axis scroll container renders every row and loses virtualization."
        },
        {
          "id": "doc/docs/review/conventions-react-native/mvcp-top-anchored",
          "section": "lists/mvcp-top-anchored",
          "instructions": "Does `hunk` add a top-anchored `List`/`FlashList` whose `ListHeaderComponent` changes height after mount (measured header, sticky-tab spacer, header that loads content) or whose data is merged from several sources after first render, without `maintainVisibleContentPosition={{ disabled: true }}`?",
          "criteria": {
            "true": "A plain top-anchored list is added with a header whose height is measured or loaded after mount, or with data appended from multiple sources, and no `maintainVisibleContentPosition` disabling prop is present.",
            "false": "Chat, thread or feed lists that want anchoring (`startRenderingFromBottom`, `autoscrollToBottomThreshold`, prepended items); no header or a fixed-height header with data delivered in one piece; a list already passing a `{ disabled: true }` constant."
          },
          "appliesTo": [
            "**/*.tsx",
            "**/*.jsx"
          ],
          "when": "maintainVisibleContentPosition|ListHeaderComponent|FlashList|FlatList",
          "message": "Default `maintainVisibleContentPosition` can drift a top-anchored list away from the top on first paint."
        },
        {
          "id": "doc/docs/review/conventions-react-native/inline-slot-components",
          "section": "lists/inline-slot-components",
          "instructions": "Does `hunk` pass an inline function or a function declared in the component body to `ListHeaderComponent`, `ListFooterComponent`, `ListEmptyComponent`, `ItemSeparatorComponent`, `CellRendererComponent` or `renderScrollComponent`, where that function closes over props or state that change?",
          "criteria": {
            "true": "One of those slot props receives `() => <…/>` or a locally declared component function whose body reads changing props/state.",
            "false": "A React element is passed (`={header}` / `={<Header … />}`); the component is defined at module scope; the inline function closes over nothing that changes (a static separator); the prop is not a list slot."
          },
          "appliesTo": [
            "**/*.tsx",
            "**/*.jsx"
          ],
          "when": "ListHeaderComponent|ListFooterComponent|ListEmptyComponent|ItemSeparatorComponent|CellRendererComponent|renderScrollComponent|renderItem",
          "message": "An inline function in a list component slot remounts the slot whenever its closure changes."
        },
        {
          "id": "doc/docs/review/conventions-react-native/image-recycling-key",
          "section": "images/recycling-key",
          "instructions": "Does `hunk` render an `expo-image` `Image` (or the shared `Image` primitive) with a per-item remote `source` inside a `List`/`FlashList` row without a `recyclingKey` tied to that item's url or id?",
          "criteria": {
            "true": "An image inside a row component takes its `source` uri from the item and has no `recyclingKey` prop (or a `recyclingKey` that does not vary per item).",
            "false": "`recyclingKey={url}` or another per-item key; the shared `Avatar`/`MintIcon` components; bundled or static sources identical for every row; images outside recycled rows (screens, headers, `ScrollView` content, sheets)."
          },
          "appliesTo": [
            "**/*.tsx",
            "**/*.jsx"
          ],
          "when": "Image|source=\\{|recyclingKey|renderItem",
          "message": "A recycled row's image can keep showing the previous item's bitmap without a per-item `recyclingKey`."
        },
        {
          "id": "doc/docs/review/conventions-react-native/untrusted-image-uri",
          "section": "images/untrusted-uri",
          "instructions": "Does `hunk` pass a string from untrusted metadata (Nostr kind-0 `picture`/`banner`, NIP-11 `icon`, mint `icon_url`, a URL parsed from note content, link-preview or BTCMap fields) into `source={{ uri }}` or `Image.prefetch` without restricting it to `http(s):` (or intended `data:image/` raster)?",
          "criteria": {
            "true": "A uri taken from relay-, mint- or content-supplied metadata reaches an image source or prefetch call with no scheme allowlist check in the hunk.",
            "false": "URIs produced on device (image picker, camera, `localUri`, app-written file paths, own upload blobs); URLs already passed through a scheme allowlist (`prefetchImage`'s gate, `RelayCard`'s `safeUri`, a shared sanitizer); bundled `require()` assets; blurhash/thumbhash placeholders."
          },
          "appliesTo": [
            "**/*.tsx",
            "**/*.jsx"
          ],
          "when": "uri|prefetch|<Image|source=\\{",
          "message": "An unchecked remote-metadata URI lets `expo-image` decode `file:`, `data:` or SVG content."
        },
        {
          "id": "doc/docs/review/conventions-react-native/secret-input-secure-text",
          "section": "text/secret-input",
          "instructions": "Does `hunk` add or configure a single-line input for a recovery phrase, nsec, private key, bunker/pairing secret or PIN (`TextInput`, `BottomSheetTextInput`, heroui `Input`, or an `actionMenu`/popup `inputs: [{…}]` descriptor) without `secureTextEntry`?",
          "criteria": {
            "true": "An input whose label, placeholder, state name or handler identifies it as a secret is added without `secureTextEntry`.",
            "false": "Inputs for public values (npub, mint URL, Lightning address, amounts, invoices, search); secret inputs with `secureTextEntry` and a reveal toggle; read-only `editable={false}` fields; design-system catalogue screens under `features/settings`; multiline secret inputs (covered separately)."
          },
          "appliesTo": [
            "**/*.tsx",
            "**/*.jsx"
          ],
          "when": "TextInput|secureTextEntry|<Input|inputs:|password|Password|mnemonic|nsec|seed",
          "message": "A secret typed into a plain input is learned by the keyboard and shown in clear."
        },
        {
          "id": "doc/docs/review/conventions-react-native/secret-multiline-autofill",
          "section": "text/secret-input",
          "instructions": "Does `hunk` add a multiline input for a recovery phrase or other secret (where `secureTextEntry` cannot work) without all of `autoCorrect={false}`, `spellCheck={false}`, `autoCapitalize=\"none\"` and `autoComplete=\"off\"` (plus `importantForAutofill=\"no\"` on Android)?",
          "criteria": {
            "true": "A `multiline` input receiving a seed phrase or other secret is missing one or more of those opt-out props.",
            "false": "All of the opt-out props are present; the input is single-line with `secureTextEntry`; the input takes a public value; design-system catalogue screens under `features/settings`."
          },
          "appliesTo": [
            "**/*.tsx",
            "**/*.jsx"
          ],
          "when": "multiline|autoCorrect|autoComplete|textContentType|TextInput",
          "message": "A multiline secret input without autocorrect/autofill opt-outs leaks the phrase to the keyboard."
        },
        {
          "id": "doc/docs/review/conventions-react-native/shadow-clipped-by-overflow",
          "section": "layout/shadow-clip",
          "instructions": "Does `hunk` put legacy shadow props (`shadowColor`, `shadowOffset`, `shadowOpacity`, `shadowRadius`) on the same view that also sets `overflow: 'hidden'` or `overflow-hidden`, directly or through a merged style/className?",
          "criteria": {
            "true": "One view's style or className carries both a legacy shadow prop and an overflow-hidden clip.",
            "false": "Shadow on an outer wrapper with the clip on an inner child; `boxShadow` instead of legacy props; Android-only `elevation`; clipping views with no shadow."
          },
          "appliesTo": [
            "**/*.tsx",
            "**/*.jsx"
          ],
          "when": "shadow|overflow|elevation",
          "message": "An iOS legacy shadow on a view that also clips with `overflow: hidden` is cut off at its bounds."
        },
        {
          "id": "doc/docs/review/conventions-react-native/back-handler-scope",
          "section": "android/back-handler-scope",
          "instructions": "Does `hunk` register `BackHandler.addEventListener('hardwareBackPress', …)` with a handler that returns `true` while the registration is not gated on the overlay/step/blocking state it serves, or without `subscription.remove()` in the effect cleanup?",
          "criteria": {
            "true": "The listener is registered unconditionally in a `useEffect` of a screen that stays mounted, or its cleanup does not remove the subscription, while its handler can return `true`.",
            "false": "Registration gated on the active state and removed in cleanup (`if (!open) return; const sub = …; return () => sub.remove()`); registration inside `useFocusEffect`; handlers that always return `false`; a blocking CTA that must swallow back while shown."
          },
          "appliesTo": [],
          "when": "BackHandler|hardwareBackPress|useBackHandler",
          "message": "A `hardwareBackPress` listener that outlives its purpose swallows the Android back button."
        },
        {
          "id": "doc/docs/review/conventions-react-native/webview-scheme-escape",
          "section": "links/webview-scheme-escape",
          "instructions": "Does `hunk` render a `WebView` loading remote or untrusted content with an `originWhitelist` narrower than `['*']` (including relying on the default) instead of `originWhitelist={['*']}` plus an `onShouldStartLoadWithRequest` that returns `false` for non-`http(s):` URLs?",
          "criteria": {
            "true": "A remote-loading `WebView` sets `originWhitelist` to http/https-only (or omits it) and has no `onShouldStartLoadWithRequest` rejecting non-http(s) schemes.",
            "false": "A `WebView` whose `source` is bundled/static HTML with no remote navigation; `originWhitelist={['*']}` combined with an `onShouldStartLoadWithRequest` that rejects non-http(s) requests; a comment recording that opening external schemes is intended."
          },
          "appliesTo": [
            "**/*.tsx",
            "**/*.jsx"
          ],
          "when": "WebView|webview|originWhitelist|Linking\\.openURL|onShouldStartLoad",
          "message": "A narrow `originWhitelist` lets a remote page launch arbitrary app schemes via `Linking.openURL`."
        },
        {
          "id": "doc/docs/review/conventions-react-native/webview-bridge-props",
          "section": "links/webview-bridge",
          "instructions": "Does `hunk` add `onMessage`, `injectedJavaScript`, `injectedJavaScriptBeforeContentLoaded`, `injectedJavaScriptObject`, a `ref.injectJavaScript(…)` call, `allowFileAccess`, `allowUniversalAccessFromFileURLs`, `allowFileAccessFromFileURLs`, `sharedCookiesEnabled` or `setSupportMultipleWindows={true}` to a `WebView` that can load remote or user/relay-supplied URLs?",
          "criteria": {
            "true": "One of those props or calls is added to a WebView whose source is remote or derived from user/relay input.",
            "false": "The WebView only ever loads a bundled first-party document; injected scripts are constant strings with no interpolated app data on first-party content; hardening values such as `allowFileAccess={false}`, `setSupportMultipleWindows={false}` (the `LinkEmbedView` pattern)."
          },
          "appliesTo": [
            "**/*.tsx",
            "**/*.jsx"
          ],
          "when": "WebView|webview|injectedJavaScript|injectJavaScript|allowFileAccess|sharedCookiesEnabled|setSupportMultipleWindows",
          "message": "Bridge or file-access props give an untrusted WebView page a channel into the app."
        },
        {
          "id": "doc/docs/review/conventions-react-native/webview-message-unvalidated",
          "section": "links/webview-bridge",
          "instructions": "Does `hunk` act on a WebView `onMessage` payload — navigating, paying, signing, or reading keys — without validating the payload as untrusted input (schema parse or explicit shape/value checks)?",
          "criteria": {
            "true": "An `onMessage` handler passes `event.nativeEvent.data` (or a raw `JSON.parse` of it) into navigation, payment, signing or key access with no schema or field validation.",
            "false": "The payload is parsed with a schema before use; the WebView only loads a bundled first-party document; the handler only logs or updates local UI state."
          },
          "appliesTo": [
            "**/*.tsx",
            "**/*.jsx"
          ],
          "when": "WebView|webview|onMessage|postMessage",
          "message": "Acting on an unvalidated `onMessage` payload lets a page drive navigation, payment or signing."
        },
        {
          "id": "doc/docs/review/conventions-react-native/back-without-history",
          "section": "routes/back-without-history",
          "instructions": "Does `hunk` use `router.back()`, `router.dismiss()` or `navigation.goBack()` as the only exit from a screen that can be the first route in its stack — a deep-link target, a screen reached via `router.replace`/`<Redirect>`, or a flow completion handler — with no `router.canGoBack()`/`canDismiss()` check and replace fallback?",
          "criteria": {
            "true": "A back/dismiss call is the sole exit in a screen or handler that the hunk shows can be entered by deep link, redirect or replace, and there is no `canGoBack`/`canDismiss` guard with a `replace` fallback.",
            "false": "`if (router.canGoBack()) router.back(); else router.replace('/')`; `router.dismissTo(href)`; screens only ever pushed from inside the app; header back buttons supplied by the navigator."
          },
          "appliesTo": [],
          "when": "router\\.back|router\\.dismiss|goBack|canGoBack|navigation\\.pop",
          "message": "`router.back()` on a first route is dropped in production, leaving a dead Close button."
        },
        {
          "id": "doc/docs/review/conventions-react-native/route-params-seam",
          "section": "routes/params-seam",
          "instructions": "Does `hunk` read params via `useLocalSearchParams<{…}>()` or `useGlobalSearchParams<{…}>()` and then let an unchecked value flow onward as a single string, number, boolean or enum (`Number(id)`, `parseInt`, a template string, a store key, a prop, `as SomeUnion`) instead of `useRouteParams(ParamsSchema, { where })`?",
          "criteria": {
            "true": "A typed `useLocalSearchParams`/`useGlobalSearchParams` result is coerced, cast, interpolated or passed on as a scalar without narrowing.",
            "false": "`useRouteParams` with a module-level Zod schema; the param is narrowed in the hunk (`typeof x === 'string'`, `Array.isArray`) before use; a strict `===` comparison against one literal whose false branch is the same default state as the param being absent (`flag === '1'`), since an array or any other string simply compares false; params only forwarded untouched to another route."
          },
          "appliesTo": [],
          "when": "useLocalSearchParams|useGlobalSearchParams|useRouteParams|SearchParams|RouteParams",
          "message": "Route params can arrive as arrays or strings, so the generic on `useLocalSearchParams` is an unchecked cast."
        },
        {
          "id": "doc/docs/review/conventions-react-native/sheet-dynamic-detent",
          "section": "sheets/dynamic-detent",
          "instructions": "Does `hunk` render a `BottomSheet`/`BottomSheetModal` with `snapPoints` and index-based control (`index=`, `snapToIndex(n)`, `onChange` comparing an index) without setting `enableDynamicSizing` explicitly?",
          "criteria": {
            "true": "A sheet with `snapPoints` is driven by indices and no `enableDynamicSizing` prop appears on it.",
            "false": "`enableDynamicSizing={false}` with fixed `snapPoints`; dynamic sizing on with no `snapPoints` and only `expand()`/`close()`/`snapToPosition`; the popup hosts' computed `enableDynamicSizing={…}` expressions."
          },
          "appliesTo": [],
          "when": "snapPoints|enableDynamicSizing|detent|[Bb]ottomSheet|presentation",
          "message": "Default `enableDynamicSizing` inserts an extra detent, shifting what each snap index means."
        },
        {
          "id": "doc/docs/review/conventions-react-native/live-region-ios",
          "section": "a11y/live-region-ios",
          "instructions": "Does `hunk` rely on `accessibilityLiveRegion` or `aria-live` alone to convey a critical result (payment sent/failed/pending, token claimed, backup verification, a blocking error) with no `AccessibilityInfo.announceForAccessibility` or accessibility-focus move for iOS?",
          "criteria": {
            "true": "A live-region prop is added to a node showing a critical outcome and the hunk contains no iOS announcement or focus move for that state change.",
            "false": "A live region paired with an iOS announcement guarded by `Platform.OS === 'ios'`; ambient non-critical updates (loading captions, refresh notes, character counters); a result on a newly focused screen whose title already states it."
          },
          "appliesTo": [
            "**/*.tsx",
            "**/*.jsx"
          ],
          "when": "accessibilityLiveRegion|aria-live|announceForAccessibility|AccessibilityInfo",
          "message": "`accessibilityLiveRegion` is Android-only, so VoiceOver never speaks the result."
        },
        {
          "id": "doc/docs/review/conventions-react-native/hide-both-platforms",
          "section": "a11y/hide-both-platforms",
          "instructions": "Does `hunk` hide decorative, duplicated or inactive content from screen readers using only one of `accessibilityElementsHidden` (iOS) or `importantForAccessibility=\"no-hide-descendants\"` (Android)?",
          "criteria": {
            "true": "Exactly one of the two platform props appears on the hidden subtree.",
            "false": "Both props together; `aria-hidden`; `accessible={false}` on a single leaf with no accessible descendants; platform-specific files (`.ios.tsx`, `.android.tsx`)."
          },
          "appliesTo": [
            "**/*.tsx",
            "**/*.jsx"
          ],
          "when": "accessibilityElementsHidden|importantForAccessibility|aria-hidden|accessible=",
          "message": "Hiding a subtree with only one platform's prop leaves it exposed on the other platform."
        },
        {
          "id": "doc/docs/review/conventions-react-native/overlay-not-modal",
          "section": "a11y/overlay-modal",
          "instructions": "Does `hunk` add a custom screen-covering overlay (absolutely-filled backdrop plus a card, a popup host, a full-screen viewer, content in a `transparent` `Modal`) without `accessibilityViewIsModal` on its content and without hiding the covered content or backdrop from the Android accessibility tree?",
          "criteria": {
            "true": "A full-screen custom overlay is added with neither `accessibilityViewIsModal` nor `importantForAccessibility=\"no-hide-descendants\"`/`\"no\"` on the covered content or backdrop.",
            "false": "Routes presented with `presentation: 'modal' | 'formSheet'`; the `PostComposer` alt-text dialog pattern; decorative non-interactive overlays (`pointerEvents=\"none\"`, hidden from accessibility); toasts and banners that do not block the screen."
          },
          "appliesTo": [
            "**/*.tsx",
            "**/*.jsx"
          ],
          "when": "Modal|backdrop|Backdrop|[Oo]verlay|absolute|[Ss]heet|[Pp]opover",
          "message": "A hand-built overlay leaves the screen beneath reachable by VoiceOver and TalkBack."
        },
        {
          "id": "doc/docs/review/conventions-react-native/small-touch-target",
          "section": "a11y/touch-target",
          "instructions": "Does `hunk` add an icon-only or otherwise small pressable whose laid-out size is visibly under 44×44 (`size-6`, `w-8 h-8`, `width: 28`, a bare `Icon` with no padding) with no `hitSlop`?",
          "criteria": {
            "true": "A `Pressable`/`Touchable*`/pressable wrapper is added with an explicit size or icon child clearly smaller than 44pt in a dimension and no `hitSlop` prop.",
            "false": "Controls reaching at least 44pt through size, padding or `min-h`/`min-w`; `hitSlop` present; shared components that own their target size (`Button`, `CircleActionButton`, `HeaderGlassCircle`, `ScreenHeaderAction`, `ListItem`); dense inline text links inside a paragraph."
          },
          "appliesTo": [
            "**/*.tsx",
            "**/*.jsx"
          ],
          "when": "Pressable|Touchable|onPress|hitSlop|<Button|<Icon",
          "message": "An icon-only pressable under 44×44 with no `hitSlop` is hard to hit."
        },
        {
          "id": "doc/docs/review/conventions-react-native/hitslop-clipped-parent",
          "section": "a11y/touch-target",
          "instructions": "Does `hunk` add `hitSlop` to a control smaller than the 44pt target whose visible parent is the same size as the control or clips it (`overflow: 'hidden'`, a tight row), so the slop the control relies on cannot extend past the parent's bounds?",
          "criteria": {
            "true": "A `hitSlop` is added to a control the hunk shows to be under 44pt, inside a wrapper the hunk shows to be exactly the control's size or to clip overflow.",
            "false": "`hitSlop` on a control whose parent has room around it; no clipping or tight-fitting parent visible; the control already meets the 44pt target, so the inert slop does no harm; the control's size is not visible in `hunk` (it comes from a prop or an imported constant), which is insufficient evidence."
          },
          "appliesTo": [
            "**/*.tsx",
            "**/*.jsx"
          ],
          "when": "hitSlop|overflow|Pressable|Touchable",
          "message": "`hitSlop` has no effect when the parent is the same size as the control or clips it."
        },
        {
          "id": "doc/docs/review/conventions-react-native/secure-store-key-charset",
          "section": "native/secure-store-key-charset",
          "instructions": "Does `hunk` build a SecureStore key from a value that can contain other characters — a mint or relay URL, an `npub`/`nprofile`, an email or Lightning address, a path, a user-entered label, or a key joined with `:` or `/` — without hex/base64url-encoding or hashing that part first?",
          "criteria": {
            "true": "A SecureStore key string is composed with an interpolated value of unrestricted charset or with `:`/`/` separators, with no encoding or hashing applied.",
            "false": "Keys of constants plus validated hex pubkeys, integers (`accountIndex`) or values the hunk shows restricted to `[\\w.-]`; keys produced by the helpers in `shared/lib/nostr/secureStorage.ts` or `features/nostrSigner/lib/bunkerSecrets.ts`."
          },
          "appliesTo": [],
          "when": "SecureStore|setItemAsync|getItemAsync|deleteItemAsync|secure-store",
          "message": "expo-secure-store throws at runtime on keys outside `[A-Za-z0-9._-]`."
        },
        {
          "id": "doc/docs/review/conventions-react-native/sync-module-function",
          "section": "native/sync-module-function",
          "instructions": "Does `hunk` define an Expo module method with `Function(\"…\")` whose body does I/O or unbounded work — database/file reads, keychain or keystore access, BLE/NFC, network, crypto over caller-sized input, waiting on a lock/semaphore/queue, or building a collection that grows with user data — instead of `AsyncFunction`?",
          "criteria": {
            "true": "A `Function(\"…\")` definition's body performs blocking I/O, waiting, or work proportional to user data.",
            "false": "Constant-time getters of in-memory state, availability checks, version strings; `AsyncFunction`; `Property`/`Constants` definitions."
          },
          "appliesTo": [
            "app/modules/**",
            "**/*.swift",
            "**/*.kt",
            "**/*.java",
            "**/*.mm"
          ],
          "message": "`Function` runs on the JS thread, so blocking work in it freezes the UI."
        },
        {
          "id": "doc/docs/review/conventions-react-native/nfc-session-release",
          "section": "native/nfc-session-release",
          "instructions": "Does `hunk` call `acquireSession()` or `NfcManager.requestTechnology(…)` on a path where a throw, early return, unmount or cancel can skip the matching `releaseSession()`/`cancelTechnologyRequest()` — release not in a `finally`, not in effect/focus cleanup, and not via `withSession(fn)`?",
          "criteria": {
            "true": "A session is acquired and the release call sits on the happy path only (no `finally`, no cleanup function), or no release appears at all.",
            "false": "`withSession(fn)`; release in `finally` or at every exit of a multi-step adapter; cleanup in `useFocusEffect`/effect teardown (`useAmbientNfcArm`)."
          },
          "appliesTo": [],
          "when": "acquireSession|requestTechnology|[Nn][Ff][Cc]|cancelTechnologyRequest|NfcManager",
          "message": "An NFC session not released on every exit keeps the iOS scan sheet up and blocks later taps."
        },
        {
          "id": "doc/docs/review/conventions-react-native/hermes-missing-builtins",
          "section": "hermes/missing-builtins",
          "instructions": "Does `hunk` call `structuredClone`, `Array.prototype.toSorted`, `Object.groupBy`/`Map.groupBy`, `Promise.withResolvers`, `Array.fromAsync`, `new FinalizationRegistry`, or construct `Intl.RelativeTimeFormat`, `Intl.PluralRules`, `Intl.ListFormat`, `Intl.Segmenter`, `Intl.DisplayNames` or `Intl.Locale`, in app code with no feature check or `try/catch` fallback?",
          "criteria": {
            "true": "One of those APIs is used directly in code that runs in the app, unguarded.",
            "false": "A guarded use with a fallback (the `shared/lib/date.ts` `try/catch` pattern); built-ins that are present (`Intl.NumberFormat`, `Intl.DateTimeFormat`, `Intl.Collator`, `toReversed`, `toSpliced`, `with`, `findLast`, `at`, `Object.hasOwn`, `replaceAll`, `Promise.allSettled`, `WeakRef`, BigInt, lookbehind/named groups); Node-only code (`scripts/`, `codereview/`, `e2e/`, tests, config files); a polyfill installed in `shim.js`/`polyfills.js`."
          },
          "appliesTo": [],
          "when": "structuredClone|toSorted|toReversed|toSpliced|groupBy|withResolvers|fromAsync|FinalizationRegistry|WeakRef|Intl\\.|at\\(|findLast|replaceAll|hasOwn",
          "message": "This built-in is absent from the shipped Hermes build and only fails on a device."
        },
        {
          "id": "doc/docs/review/conventions-react-native/focus-not-foreground",
          "section": "routes/focus-not-foreground",
          "instructions": "Does `hunk` use `useFocusEffect` or `useIsFocused` as the only trigger for refreshing or re-arming something that goes stale while backgrounded — quote or invoice status, balance, a pending payment poll, NFC/BLE arming, a relay subscription — with no `AppState` `'active'` handling?",
          "criteria": {
            "true": "A focus effect starts a refresh, poll, subscription or hardware arming and the hunk shows no `AppState` listener or shared foreground hook alongside it.",
            "false": "The effect also subscribes to `AppState` (or a foreground hook) and tears it down; the data owner already refreshes on foreground; work that only matters on navigation (scroll reset, header options, analytics, one-shot animation)."
          },
          "appliesTo": [],
          "when": "useFocusEffect|useIsFocused|AppState|addEventListener\\(.change",
          "message": "`useFocusEffect` does not re-run when the app returns from the background, so the data stays stale."
        }
      ],
      "notChecked": [
        {
          "section": "React Native and Expo runtime (preamble)",
          "reason": "Maintenance process: reproducing rules against installed package versions and re-checking after dependency upgrades is not decidable from a code chunk."
        },
        {
          "section": "lists/unique-keys — de-duplication of merged sources",
          "reason": "Whether ids actually collide across relays or merged sources usually depends on data-fetching code in other files; only the visible keyExtractor pattern is checked."
        },
        {
          "section": "lists/nested-same-axis — bounded parent height",
          "reason": "The parent container is often in another component/file; the rule fires only when the nesting or unbounded parent is visible in the chunk."
        },
        {
          "section": "a11y/touch-target — exact laid-out size",
          "reason": "Precise pixel measurement requires resolving style composition and theme scales; only explicitly small literals/classes are checked."
        }
      ]
    },
    {
      "id": "doc/docs/review/conventions-state",
      "kind": "doc",
      "origin": "./docs/review/conventions-state.md",
      "path": "docs/review/conventions-state.md",
      "scope": "",
      "hash": "95948500406701f2fedeb312a2346f230a5738fbd14e2d7befc3af36208817ef",
      "rules": [
        {
          "id": "doc/docs/review/conventions-state/persist-hydration-gate",
          "section": "persist/hydration-gate",
          "instructions": "Does `hunk` take an irreversible or user-visible action — a redirect or `router.*` call, showing a terms/onboarding/backup/CTA prompt, starting a network request, or publishing — based on a value read from a persisted Zustand store inside an effect or at mount, with no visible check of that store's `persist.hasHydrated()` / `onFinishHydration` / a `_hasHydrated` field and no ancestor hydration gate shown in the hunk?",
          "criteria": {
            "true": "A mount effect or render-time branch reads a persisted store value and immediately navigates, shows a one-shot prompt, fires a request or publishes, with no hydration check anywhere in the hunk.",
            "false": "The hunk shows the hydration check or the house pattern `useState(() => store.persist.hasHydrated())` + `onFinishHydration` + re-check; the component is rendered below a gate the hunk shows (`AppGate`, `ThemeProvider`, `CtaHost`, `useWalletLifecycleHydrated`); the read is purely presentational (theme, sort order, toggles) where a default frame is harmless; the store is a non-persisted runtime store; a `createQueryCacheStore` read whose `hydrate(key)` is awaited."
          },
          "appliesTo": [],
          "when": "use[A-Z][A-Za-z]*Store|persist|hydrat|Hydrat",
          "message": "A decision taken at mount from a persisted store may act on the in-code default instead of the user's data."
        },
        {
          "id": "doc/docs/review/conventions-state/persist-early-write",
          "section": "persist/early-write",
          "instructions": "Does `hunk` call an action or `setState` of a persisted Zustand store from module scope, a store initialiser, app bootstrap, a migration, or a mount effect, with nothing in the hunk showing hydration has finished (`persist.hasHydrated()`, `onFinishHydration`, `afterHydrate`, an awaited hydration helper)?",
          "criteria": {
            "true": "A persisted store's setter/action is invoked at module evaluation, during bootstrap, in a migration, or in a `useEffect(..., [])` at mount, with no hydration check or await visible.",
            "false": "The write responds to a user action on a screen below the hydration gate; the write is inside `afterHydrate` / `onFinishHydration`; it is wrapped in `withSkippedPersistWrites`; the store has no `persist` middleware; the code awaits a hydration helper first (`whenHydrated`, `refreshVertex`)."
          },
          "appliesTo": [],
          "when": "setState\\(|use[A-Z][A-Za-z]*Store|persist|hydrat|Hydrat",
          "message": "A write before hydration finishes is clobbered by the rehydrate merge, leaving memory and storage divergent."
        },
        {
          "id": "doc/docs/review/conventions-state/after-hydrate-mutates-state",
          "section": "persist/after-hydrate",
          "instructions": "Does `hunk` add or change an `afterHydrate` / `onRehydrateStorage` callback that assigns to a property of its `state` argument (`state.x = …`, `state.list.push(…)`, `Object.assign(state, …)`) instead of calling the store's `setState`?",
          "criteria": {
            "true": "Inside the hydration callback the `state` parameter is written in place — property assignment, `push`, `delete`, `Object.assign` onto it.",
            "false": "The callback updates via `useXStore.setState({ … })`, only logs, only sets a hydration flag, or only reads `state`; derived indexes are rebuilt with `setState`."
          },
          "appliesTo": [],
          "when": "afterHydrate|onRehydrateStorage|rehydrate|hasHydrated|hydrat",
          "message": "Mutating the `state` argument in a hydration callback leaves synchronous subscribers unnotified."
        },
        {
          "id": "doc/docs/review/conventions-state/after-hydrate-throwing-work",
          "section": "persist/after-hydrate",
          "instructions": "Does `hunk` add or change an `afterHydrate` / `onRehydrateStorage` callback that performs work which can throw — parsing, decoding, indexing untrusted persisted data, calling another store or a native module — outside a try/catch?",
          "criteria": {
            "true": "The hydration callback body calls `JSON.parse`, a decoder, a native module or another store synchronously with no surrounding try/catch.",
            "false": "The throwing work is wrapped in try/catch that logs and continues; the callback only logs, only sets a hydration flag via `setState`, or starts a promise that carries its own `.catch`."
          },
          "appliesTo": [],
          "when": "afterHydrate|onRehydrateStorage|rehydrate|hasHydrated|hydrat",
          "message": "A throw in the hydration callback keeps `hasHydrated()` false forever and hangs every gate waiting on it."
        },
        {
          "id": "doc/docs/review/conventions-state/persist-nested-default-missing",
          "section": "persist/nested-defaults",
          "instructions": "Does `hunk` add a new key inside a nested object (or to the element shape of a persisted array or record) belonging to a persisted store's state, without a `.default(…)` / `.catch(…)` (or `.optional()` with `undefined` handled) in the schema passed to `persistConfig` and without a `version` bump plus `migrate` that fills it?",
          "criteria": {
            "true": "A nested field is added to persisted state or its schema with a plain required type, no default/catch, and no version bump plus migrate visible in the hunk.",
            "false": "The added field is TOP-LEVEL persisted state with an optional or defaulted schema entry; the nested key is declared with `.default()` / `.catch()` or a tolerant helper; the store uses a deep-merging `merge`; the field is left out of `partialize`."
          },
          "appliesTo": [],
          "when": "persist|partialize|persistConfig|merge|migrate",
          "message": "A new key inside a persisted nested object never reaches existing users, because the persist merge is shallow."
        },
        {
          "id": "doc/docs/review/conventions-state/persist-json-roundtrip",
          "section": "persist/json-roundtrip",
          "instructions": "Does `hunk` add to the state returned by a persisted store's `partialize` (or to a `createQueryCacheStore` entry) a field whose type is or contains `Map`, `Set`, `Date`, `bigint`, a typed array or `ArrayBuffer`, or a number that can be `NaN`/`Infinity`, or rely on a persisted key being present with the value `undefined`?",
          "criteria": {
            "true": "A persisted field is typed or initialised as `Map`, `Set`, `Date`, `bigint`, `Uint8Array`/`ArrayBuffer`, or holds a value that can be `NaN`/`Infinity`, with no conversion on write.",
            "false": "The field is stored JSON-natively (`Record`, array, epoch-ms number, decimal/hex string) and converted at the edge; the schema transforms on parse AND `partialize` serialises on write; the field is excluded from `partialize`; the store is runtime-only and not persisted."
          },
          "appliesTo": [],
          "when": "persist|partialize|new Map\\(|new Set\\(|Map<|Set<|bigint|Uint8Array|ArrayBuffer|new Date\\(|serialize",
          "message": "A non-JSON-safe value in persisted state comes back mangled, or a bigint makes every `set` throw."
        },
        {
          "id": "doc/docs/review/conventions-state/migrate-missing-return",
          "section": "persist/migrate-total",
          "instructions": "Does `hunk` add or change a `migrate` function in which some incoming version can reach the end of the function without hitting a `return` (for example only `if (version === N) return …` branches, or an `if`/`switch` with no final fallthrough return)?",
          "criteria": {
            "true": "The migrate body's returns are all inside conditionals and there is no unconditional final `return` covering other versions.",
            "false": "A cumulative `if (version < N) s = stepN(s)` chain ending in `return s`, a `switch` with a `default` return, or any unconditional trailing return of the state."
          },
          "appliesTo": [],
          "when": "migrate|version|persistConfig",
          "message": "A migrate path with no `return` turns that user's persisted data into defaults permanently."
        },
        {
          "id": "doc/docs/review/conventions-state/migrate-drops-state",
          "section": "persist/migrate-total",
          "instructions": "Does `hunk` add or change a `migrate` branch that returns an object built from scratch or from a subset of the incoming state (`return { theme: old.theme }`) instead of spreading the incoming persisted state?",
          "criteria": {
            "true": "A migrate return value is an object literal listing only some fields of the incoming state, with no `...persisted` spread.",
            "false": "The branch spreads the incoming state and overrides fields (`{ ...persisted, mockMode: false }`); a field is dropped deliberately with a comment saying so; the input is returned unchanged."
          },
          "appliesTo": [],
          "when": "migrate|version|persistConfig",
          "message": "A migrate branch that rebuilds state from a subset silently deletes every field it omits."
        },
        {
          "id": "doc/docs/review/conventions-state/migrate-version-equality",
          "section": "persist/migrate-total",
          "instructions": "Does `hunk` add or change a `migrate` whose steps select on the version with `===` / `==` or a `switch` on the exact version, rather than cumulative `if (version < N)` checks applied in order?",
          "criteria": {
            "true": "Migration steps are gated by `version === N` or `case N:` with a `return` per case, so a user two versions behind runs only one step.",
            "false": "Cumulative `if (version < N) s = stepN(s)` chains; a fallthrough `switch` that applies every later step; a single-version migrate where only one step exists and it ends with an unconditional return."
          },
          "appliesTo": [],
          "when": "migrate|version|persistConfig",
          "message": "Comparing the stored version with `===` skips steps for users more than one version behind."
        },
        {
          "id": "doc/docs/review/conventions-state/rehydrate-without-reset",
          "section": "persist/rehydrate-reset",
          "instructions": "Does `hunk` call `persist.rehydrate()` on a store after a profile switch, account change, storage swap (`persist.setOptions({ storage })`) or `clearStorage()` — i.e. where the storage key or contents can differ from what is in memory — without first resetting with `setState(store.getInitialState(), true)`?",
          "criteria": {
            "true": "`rehydrate()` follows a storage/key/profile change in the same hunk with no `getInitialState()` reset before it.",
            "false": "`rehydrate()` only retries or awaits the first hydration of the same key (`if (!store.persist.hasHydrated()) await store.persist.rehydrate()`); a `getInitialState()` reset precedes it; tests building a fresh store; flows that restart the JS runtime."
          },
          "appliesTo": [],
          "when": "rehydrate|hydrat|persist|setItem|storage|profile|Profile",
          "message": "Rehydrating after a key change can keep the previous profile's data in memory and save it under the new key."
        },
        {
          "id": "doc/docs/review/conventions-state/partialize-denylist",
          "section": "persist/partialize-allowlist",
          "instructions": "Does `hunk` write a `partialize` that returns the state minus some fields — rest destructuring (`({ isLoading, ...rest }) => rest`), `omit(state, […])`, `Object.fromEntries(Object.entries(state).filter(…))`, or `(state) => state` — instead of an object literal listing each persisted field?",
          "criteria": {
            "true": "The `partialize` return value is derived by exclusion or is the whole state object.",
            "false": "`partialize` returns an object literal naming every persisted field, or a nested pick built the same way."
          },
          "appliesTo": [],
          "when": "partialize|persist|omit|delete\\s",
          "message": "A deny-list `partialize` will persist any field added later, including tokens and controllers."
        },
        {
          "id": "doc/docs/review/conventions-state/persist-fast-field",
          "section": "persist/write-amplification",
          "instructions": "Does `hunk` add to a store wrapped in `persist` a field updated at high frequency — download/upload progress, scroll or drag position, a timer tick, typing drafts, streaming tokens, per-event counters?",
          "criteria": {
            "true": "A persisted store gains a progress/position/tick/draft/streaming field, or an action that sets one on every event or frame.",
            "false": "The fast field lives in a separate non-persisted store (e.g. under `stores/runtime`); the store has no `persist`; the field changes only on explicit user actions."
          },
          "appliesTo": [],
          "when": "persist|partialize|setState|set\\(",
          "message": "A fast-changing field in a persisted store costs a full serialise and storage write per update."
        },
        {
          "id": "doc/docs/review/conventions-state/persist-unbounded-collection",
          "section": "persist/write-amplification",
          "instructions": "Does `hunk` add to a store wrapped in `persist` an action that appends to a persisted array or record with no cap, TTL or eviction visible?",
          "criteria": {
            "true": "An action does `set(s => ({ list: [...s.list, item] }))` or `{ ...s.byId, [k]: v }` on persisted state with no slice, prune or eviction in the same action.",
            "false": "The collection is bounded by a constant cap, TTL prune or LRU in the same action; the store is not persisted; the collection is owned by `createQueryCacheStore`, which handles eviction."
          },
          "appliesTo": [],
          "when": "persist|partialize|push\\(|concat\\(|\\.\\.\\.",
          "message": "An unbounded persisted collection grows the blob rewritten on every store update."
        },
        {
          "id": "doc/docs/review/conventions-state/subscriber-before-hydration",
          "section": "persist/subscriber-hydration",
          "instructions": "Does `hunk` subscribe to a persisted store (`useXStore.subscribe(…)`) with a listener that performs an outward side effect — publishing a Nostr event, a network write, a wallet or mint call, writing another storage key, showing a notification — without ignoring changes that arrive before `persist.hasHydrated()` is true?",
          "criteria": {
            "true": "The listener body calls out (publish, fetch, mint/melt, storage write, notification) with no `hasHydrated()` guard and the subscription is not created inside a hydration callback.",
            "false": "The listener returns early while `!store.persist.hasHydrated()`; the subscription is created inside `onFinishHydration` / `afterHydrate`; the listener only mirrors state into an in-memory adapter or notifies React; the store is not persisted."
          },
          "appliesTo": [],
          "when": "\\.subscribe\\(|subscribeWithSelector|hydrat",
          "message": "A store subscriber can fire on hydration and perform an outward side effect for data merely loaded from disk."
        },
        {
          "id": "doc/docs/review/conventions-state/set-after-await",
          "section": "async/set-after-await",
          "instructions": "Does `hunk` read store state into a local (`const { items } = get()`, `const s = useXStore.getState()`, a captured selector value) BEFORE an `await`, and AFTER that `await` write a value derived from that local (`set({ items: [...items, x] })`, `count: count + 1`)?",
          "criteria": {
            "true": "A pre-await local holding store state is spread or incremented inside a post-await `set`/`setState` object form.",
            "false": "The post-await write uses the updater form `set((s) => …)` or re-reads `get()` after the last await; the pre-await local is used only to build the request, to compare afterwards (owner/generation check) or for logging; the write is a keyed overwrite not depending on the old value; the `set` is synchronous with no await between read and write."
          },
          "appliesTo": [],
          "when": "await|\\.then\\(",
          "message": "Writing state derived from a value read before an `await` discards updates that landed in between."
        },
        {
          "id": "doc/docs/review/conventions-state/subscribe-no-prev-compare",
          "section": "state/subscribe-listener",
          "instructions": "Does `hunk` add a plain `store.subscribe((state, prev) => …)` whose listener does work without first comparing the slice it cares about (`state.x !== prev.x`)?",
          "criteria": {
            "true": "The listener body acts unconditionally, or ignores `prev` entirely, on every state change.",
            "false": "The listener compares against `prev` before acting; a selector overload `subscribe(selector, listener)` is used; the listener is idempotent and cheap by design (e.g. forwarding to a `useSyncExternalStore` callback)."
          },
          "appliesTo": [],
          "when": "\\.subscribe\\(|subscribeWithSelector",
          "message": "A plain `subscribe` listener runs on every `set`, including sets of identical values."
        },
        {
          "id": "doc/docs/review/conventions-state/subscribe-selector-new-object",
          "section": "state/subscribe-listener",
          "instructions": "Does `hunk` add a `store.subscribe(selector, listener)` whose selector returns a newly created object, array or function (`s => ({ a: s.a })`, `s => s.list.filter(…)`) with no `equalityFn` such as `shallow`?",
          "criteria": {
            "true": "The selector builds an object/array literal, `.filter`/`.map` result or closure, and no equality function is passed in the options.",
            "false": "The selector returns a primitive or an existing reference from state; `{ equalityFn: shallow }` is passed for a multi-field pick."
          },
          "appliesTo": [],
          "when": "\\.subscribe\\(|subscribeWithSelector",
          "message": "A selector subscription returning a fresh object fires on every unrelated store change."
        },
        {
          "id": "doc/docs/review/conventions-state/useshallow-new-member",
          "section": "state/useshallow-depth",
          "instructions": "Does `hunk` wrap in `useShallow` a selector whose result, once any spreads are applied, has at least one own member that is itself created inside the selector — a nested object or array literal, an inline function, a `.map` that builds new objects, `Object.entries`/`Object.values` of nested records, or a `?? []` / `?? {}` fallback inside the literal?",
          "criteria": {
            "true": "Inside `useShallow(s => …)` at least one member of the returned object/array is a freshly constructed object, array or function.",
            "false": "Members are primitives or existing references from state; `.map` to primitives; `.filter` over existing element references; `new Map`/`new Set` of primitives; module-level constant fallbacks; a helper result spread into the returned object when the fields it contributes are primitives (`...counts(s.legs)` contributing `settled` and `total` numbers); `useShallow` around a primitive selector."
          },
          "appliesTo": [],
          "when": "useShallow|shallow|useStore",
          "message": "A `useShallow` selector whose members are created inside it can loop until \"Maximum update depth exceeded\"."
        },
        {
          "id": "doc/docs/review/conventions-state/impure-selector",
          "section": "state/pure-selectors",
          "instructions": "Does `hunk` pass to a Zustand hook a selector that calls `Date.now()`, `new Date()`, `Math.random()` or an id generator, calls an in-place array method on state (`s.list.sort(…)`, `.reverse()`, `.splice(…)`), or performs a side effect (a `set`, a log, a fetch)?",
          "criteria": {
            "true": "The selector body reads the clock or randomness, mutates a state array in place, or performs a side effect.",
            "false": "The selector is a pure function of `state` and closed-over props; a timestamp is selected and combined with a `nowMs` provided outside the selector; sorting happens on a copy (`[...list].sort(…)`) outside the selector."
          },
          "appliesTo": [],
          "when": "use[A-Z][A-Za-z]*Store\\(|useStore\\(|useShallow|getState\\(",
          "message": "An impure selector returns a value that never updates, loops forever, or mutates store state."
        },
        {
          "id": "doc/docs/review/conventions-state/getter-called-in-render",
          "section": "state/getter-in-render",
          "instructions": "Does `hunk` select a store function that reads state (`getTotal`, `isStale`, `has…`, `get…`, `find…`, `can…`) with a Zustand hook and call it during render in a component or hook body — directly, in JSX, or inside `useMemo` — to produce a displayed or branching value?",
          "criteria": {
            "true": "A function is selected (`const getTotal = useXStore(s => s.getTotal)`) and invoked in the render path or a `useMemo`.",
            "false": "The selected function is called only inside an event handler, effect or async callback; the VALUE is selected instead (`useStore(s => s.getTotal())` returning a primitive, or the underlying fields); the function is a true action that only `set`s; a non-React module using `getState()`."
          },
          "appliesTo": [],
          "when": "use[A-Z][A-Za-z]*Store\\(|useStore\\(|useShallow|getState\\(",
          "message": "A store getter selected and called during render subscribes to its identity, so its value is frozen."
        },
        {
          "id": "doc/docs/review/conventions-state/store-created-in-render",
          "section": "state/store-in-component",
          "instructions": "Does `hunk` call `create(`, `createStore(` or a store factory such as `createQueryCacheStore(` inside a component or hook body without holding the instance in `useState(() => …)` or a lazily-initialised ref?",
          "criteria": {
            "true": "A store constructor call appears inside a function component or custom hook body, assigned to a plain `const`.",
            "false": "The store is created at module scope, held via `const [store] = useState(() => createStore(…))` or a lazy ref, created in a provider and passed through context, or created in a test."
          },
          "appliesTo": [],
          "when": "createStore\\(|createQueryCacheStore\\(|\\bcreate\\(|useState\\(|useRef\\(",
          "message": "A store created in a component or hook body is rebuilt each render, losing its state."
        },
        {
          "id": "doc/docs/review/conventions-state/init-reads-other-store",
          "section": "state/init-cross-store",
          "instructions": "Does `hunk` read another store (`useOtherStore.getState()`, a value exported from another store module) inside the object returned by a `create` / `createStore` initialiser, or in code that runs at module scope, rather than inside an action, selector or subscription?",
          "criteria": {
            "true": "A field's initial value in the initialiser object, or a module-scope statement in a store file, calls another store's `getState()` or reads its exported state.",
            "false": "The cross-store read happens inside an action or other function invoked later; a subscription set up after `onFinishHydration`; constants imported from non-store modules; the store reading its own `get()`."
          },
          "appliesTo": [],
          "when": "createStore\\(|\\bcreate\\(|getState\\(|persist",
          "message": "A cross-store read in a store initialiser freezes the other store's default and can crash on an import cycle."
        },
        {
          "id": "doc/docs/review/conventions-state/record-key-untrusted",
          "section": "state/record-keys",
          "instructions": "Does `hunk` key a plain-object `Record` by a string coming from outside the app unvalidated — relay tags, hashtags, emoji shortcodes, NIP-05 names, memo text, URL path or query parts, QR or deep-link fields — and test membership with `key in record` or a truthy `record[key]`, or write with direct assignment `record[key] = value`?",
          "criteria": {
            "true": "An externally sourced string indexes a plain object for membership tests or direct assignment, with no validation and no `Object.hasOwn`/`Map`/`Object.create(null)`.",
            "false": "Keys are validated to a fixed alphabet first (64-hex pubkeys/event ids, schema-parsed mint URLs, app-controlled prefixes like `quote:`); reads use `Object.hasOwn(record, key)`; the container is a `Map` or `Object.create(null)`; writes are immutable spreads with a computed key and reads use `Object.hasOwn`."
          },
          "appliesTo": [],
          "when": "Record<|\\[[A-Za-z_$][\\w.$]*\\]|hasOwnProperty|__proto__",
          "message": "Keying a plain object by outside-controlled strings exposes prototype keys and `__proto__` writes."
        },
        {
          "id": "doc/docs/review/conventions-state/inflight-delete-success-only",
          "section": "async/inflight-map",
          "instructions": "Does `hunk` store a promise in a module-level or store-level `Map`/record for request dedupe and delete the entry only on the success path — inside `.then(…)` or after an `await` — with no `finally` or `catch` removal?",
          "criteria": {
            "true": "The dedupe entry's `delete` appears only in the resolved path, so a rejection leaves the stale promise in the map.",
            "false": "Cleanup happens in `finally` (optionally with an identity or generation check); a `.catch` also deletes the entry; the cached value is a settled value with its own TTL rather than a promise."
          },
          "appliesTo": [],
          "when": "new Map\\(|Map<|inFlight|inflight|dedupe|pending|Pending",
          "message": "A dedupe entry removed only on success serves a failed request from the map forever."
        },
        {
          "id": "doc/docs/review/conventions-state/inflight-key-missing-input",
          "section": "async/inflight-map",
          "instructions": "Does `hunk` dedupe requests through a promise map or single slot whose key leaves out an input that changes the result — arguments, profile, mint or unit — so a caller with different inputs joins the running call?",
          "criteria": {
            "true": "The function takes parameters that affect the result but the in-flight key is a constant or omits one of them.",
            "false": "The key includes every result-affecting input; the work takes no arguments; joined callers re-evaluate their own inputs after it settles (`mintTestnutRefresh`); state is held per manager or profile (`WeakMap<Manager, …>`)."
          },
          "appliesTo": [],
          "when": "new Map\\(|Map<|inFlight|inflight|dedupe|pending|Pending",
          "message": "A dedupe key that omits a distinguishing input lets a caller join a call made for different arguments."
        },
        {
          "id": "doc/docs/review/conventions-state/derived-state-effect",
          "section": "react/derived-state-effect",
          "instructions": "Does `hunk` add a `useEffect` / `useLayoutEffect` whose body does nothing but call state setters with values computed from its dependencies or constants, with no subscription, async work, imperative call or cleanup?",
          "criteria": {
            "true": "The effect body is only `setX(...)` calls derived from deps or literals (`useEffect(() => { setFull(a + b) }, [a, b])`, `useEffect(() => { setAmount('0'); setError(null) }, [contactId])`).",
            "false": "The value is derived during render; the component is reset via `key`; the effect subscribes, starts async work, calls an imperative/native API, drives an animation, or sets state from an external callback; the guarded set-state-during-render previous-prop pattern; a media load status reset documented with a comment."
          },
          "appliesTo": [],
          "when": "useEffect\\(|useLayoutEffect\\(|useInsertionEffect\\(",
          "message": "Deriving state in an effect commits a frame pairing new input with the old derived value."
        },
        {
          "id": "doc/docs/review/conventions-state/state-mirrors-prop",
          "section": "react/state-mirrors-prop",
          "instructions": "Does `hunk` initialise `useState` from a prop, a `useLocalSearchParams` / `useGlobalSearchParams` value or a store-selected value and then display or act on that state as if it tracked the source, with no `key` tying the component to the source and no handler that owns all further changes?",
          "criteria": {
            "true": "`useState(props.x)` / `useState(param)` / `useState(storeValue)` whose state is rendered or branched on as the current value of that source.",
            "false": "An editable draft deliberately seeded once (names starting with `initial` / `default`) that the user then owns; the component is remounted per identity via `key` or a separate route; the `state ?? prop` fallback pattern; the source cannot change for the lifetime of the mount."
          },
          "appliesTo": [],
          "when": "useState\\(|useReducer\\(",
          "message": "State initialised from a prop or param keeps showing the first value when the source changes."
        },
        {
          "id": "doc/docs/review/conventions-state/effect-as-handler",
          "section": "react/effect-as-handler",
          "instructions": "Does `hunk` perform a payment, send, publish, mint or melt call, navigation, toast or other one-shot side effect inside a `useEffect` triggered by a state flag that a handler sets (`submitted`, `shouldSend`, `confirmed`, `pending…`), where the dependency list contains anything besides that flag?",
          "criteria": {
            "true": "The effect fires the one-shot action when a handler-set flag is true and its deps array also lists other values.",
            "false": "The side effect is called directly from the handler; the effect reacts to something the user did not trigger (store/machine state, deep link, subscription event); a single-flight ref or a state-machine phase is shown being consumed before the call."
          },
          "appliesTo": [],
          "when": "useEffect\\(|useLayoutEffect\\(",
          "message": "A user-triggered side effect routed through a flag and an effect can run again on any other dependency change."
        },
        {
          "id": "doc/docs/review/conventions-state/subscribe-recheck",
          "section": "react/subscribe-recheck",
          "instructions": "Does `hunk` seed `useState` from an external source (a store's `persist.hasHydrated()`, `AppState.currentState`, a module emitter's `get()`, NetInfo, a native value) and subscribe to it in an effect that only sets state from the change callback, without re-reading the current value inside the effect after subscribing?",
          "criteria": {
            "true": "The effect attaches the listener and returns the unsubscribe, with no post-subscription re-read or state sync.",
            "false": "`useSyncExternalStore(subscribe, getSnapshot)` is used; the effect re-checks after subscribing (`const un = store.persist.onFinishHydration(() => setHydrated(true)); if (store.persist.hasHydrated()) setHydrated(true);`); a Zustand hook; a source that replays its current value to new subscribers."
          },
          "appliesTo": [],
          "when": "useState\\(|useSyncExternalStore|\\.subscribe\\(|useEffect\\(",
          "message": "A change landing between the render-time read and the subscription is missed forever."
        },
        {
          "id": "doc/docs/review/conventions-state/render-mutation",
          "section": "react/render-mutation",
          "instructions": "Does `hunk` call an in-place mutator during render — `.sort(`, `.reverse(`, `.splice(`, `.push(`, `.pop(`, `.shift(`, `.unshift(`, `.fill(`, `delete obj.k`, `obj.k = v`, `Object.assign(target, …)` — on a prop, a value returned by a Zustand or context hook, a route param, or anything reached through one of them?",
          "criteria": {
            "true": "A render-path statement mutates an array or object that came from props, a store hook, context or a route param.",
            "false": "The mutated value was created in the same render (`[...items].sort()`, `items.filter(…).sort(…)`, `Object.values(rec).sort(…)`, an array literal); non-mutating `toSorted`/`toReversed`; mutation inside handlers or effects of values the component owns; Reanimated shared values via `.set()`."
