      "id": "doc/docs/review/conventions-typescript",
      "kind": "doc",
      "origin": "./docs/review/conventions-typescript.md",
      "path": "docs/review/conventions-typescript.md",
      "scope": "",
      "hash": "9a127a19da3c4ef16f1c78bfebaa66646e6ccad9224b8a3cf3e72b4ae4036236",
      "rules": [
        {
          "id": "doc/docs/review/conventions-typescript/unused-result",
          "section": "errors/unused-result",
          "message": "A neverthrow Result computed here is dropped, so its error is silently lost.",
          "instructions": "Does `hunk` call, as a bare statement (`save(x);`, `await publish(x);`, `void respond(x);`, or inside an `await Promise.all(` over such calls), a function that the hunk itself shows returns a neverthrow `Result`/`ResultAsync` — via its signature, an `ResultAsync.from*`/`ok(`/`err(` body, or a sibling call site using `.isErr()`/`.match(` — so the returned Result is never read?",
          "criteria": {
            "true": "The returned Result value is discarded: the call is a statement on its own, or prefixed only with `await`/`void`, with no assignment, no `return`, and no `.match(`/`.isErr()`/`.isOk()`/`.mapErr(`/`.orElse(`/`._unsafeUnwrap()` consuming it.",
            "false": "The Result is returned, assigned and then checked, or consumed by `.match(`, `.isErr()`/`.isOk()`, a `.mapErr(` that logs or reports, `.orElse(`, or `._unsafeUnwrap()` in a test; `void` on a chain ending in a `.mapErr(`/`.orElse(` handler that logs or surfaces the error; a documented best-effort path (telemetry, cleanup, cache warm-up) with a comment saying the failure is deliberately ignored; the callee's return type is not visible in the hunk."
          },
          "appliesTo": [
            "**/*.ts",
            "**/*.tsx"
          ],
          "when": "Result|\\bok\\(|\\berr\\("
        },
        {
          "id": "doc/docs/review/conventions-typescript/safe-promise-can-reject",
          "section": "errors/safe-promise-can-reject",
          "message": "A promise that can reject is wrapped in `fromSafePromise`, so the rejection bypasses every handler and becomes unhandled.",
          "instructions": "Does `hunk` pass to `ResultAsync.fromSafePromise(` a promise that can visibly reject — a `fetch`, SDK, storage, crypto or native-module call, an `async` function whose body the hunk shows containing `throw` or an un-caught `await`, or a `.then(` chain with no `.catch(`?",
          "criteria": {
            "true": "The argument to `ResultAsync.fromSafePromise(` is a call or async body the hunk shows can throw or reject and that has no internal try/catch or `.catch(`.",
            "false": "The wrapped promise cannot reject by construction — a function documented or typed as returning `Promise<Result<…>>` that catches internally, `Promise.resolve(value)`, a timer promise, or a promise already ending in `.catch(`; or `ResultAsync.fromPromise(p, mapError)` / `ResultAsync.fromThrowable(fn, mapError)` is used instead."
          },
          "appliesTo": [
            "**/*.ts",
            "**/*.tsx"
          ],
          "when": "fromSafePromise"
        },
        {
          "id": "doc/docs/review/conventions-typescript/result-callback-throws",
          "section": "errors/result-callback-throws",
          "message": "A throw inside a neverthrow combinator callback escapes a function that promises a Result.",
          "instructions": "Does `hunk` put a `throw`, or a call that visibly throws on bad input (`JSON.parse(`, `new URL(`, `BigInt(`, `decodeURIComponent(`, a cashu-ts or nostr-tools decoder, a zod `.parse(`), inside the callback of `.map(`, `.mapErr(`, `.andThen(`, `.orElse(`, `.andThrough(` or `.match(` on a neverthrow `Result`/`ResultAsync`, with no try/catch inside that callback?",
          "criteria": {
            "true": "A combinator callback on a neverthrow value contains an unguarded `throw` or a known-throwing call, and the callback has no try/catch around it.",
            "false": "The throwing call is wrapped with `Result.fromThrowable(fn, mapError)()` or `ResultAsync.fromThrowable` and chained with `.andThen(`; the callback returns `err(…)` instead of throwing; the callback is `async` and passed to `ResultAsync.fromPromise(…, mapError)`; the combinator is `.andTee(`; `.map(`/`.match(` on arrays, zod or other non-neverthrow values; test files."
          },
          "appliesTo": [
            "**/*.ts",
            "**/*.tsx"
          ],
          "when": "\\.(map|mapErr|andThen|orElse|andThrough|match)\\("
        },
        {
          "id": "doc/docs/review/conventions-typescript/spread-undefined-clobbers-default",
          "section": "types/spread-undefined-clobbers-default",
          "message": "An explicit `undefined` in the override object can overwrite a default while the merged type still claims the field is defined.",
          "instructions": "Does `hunk` build a config, policy or options object by spreading a caller-supplied object with optional properties over defaults (`{ ...DEFAULTS, ...opts }`, `Object.assign({}, defaults, opts)`) and then read the merged fields as always defined, or build such an argument from possibly-undefined values (`fn({ timeoutMs: props.timeoutMs })`) for a callee the hunk shows merging that way?",
          "criteria": {
            "true": "A defaults object is merged with a caller-supplied optional-property object by spread or `Object.assign`, and the merged fields are subsequently used without any `undefined` handling.",
            "false": "Each field is merged with `??` (`timeoutMs: opts.timeoutMs ?? DEFAULTS.timeoutMs`); the override is validated or stripped of `undefined` first (zod schema with defaults, a `definedOnly`/`omitUndefined` helper); the override's fields are all required in its type; the merged fields are typed `T | undefined` and readers handle `undefined`; React style or props spreads where `undefined` means \"unset\"."
          },
          "appliesTo": [
            "**/*.ts",
            "**/*.tsx"
          ],
          "when": "\\.\\.\\.|Object\\.assign"
        },
        {
          "id": "doc/docs/review/conventions-typescript/stale-after-await",
          "section": "narrowing/stale-after-await",
          "message": "A narrowed mutable path is dereferenced after an await, where the owner may have been reset.",
          "instructions": "Does `hunk` null-check a mutable property path (`ref.current`, `this.x`, a static field, `session.quote`, `useStore.getState().x`, a module-level `let`) and then, after an `await` in the same function, dereference that same path again without re-checking it and without having captured it in a `const` before the `await`?",
          "criteria": {
            "true": "The same mutable path is guarded before an `await` and dereferenced directly after that `await` with no fresh check and no `const` capture.",
            "false": "The value is captured in a local `const` before the `await` and used through that local; the path is re-checked or accessed with `?.` after the `await`; the owner is visibly immutable for the function's lifetime (a `const` local, a `readonly` field assigned only in the constructor, a parameter object nothing else holds); no `await`, `yield` or callback boundary sits between the check and the use."
          },
          "appliesTo": [
            "**/*.ts",
            "**/*.tsx"
          ],
          "when": "await"
        },
        {
          "id": "doc/docs/review/conventions-typescript/prototype-key-lookup",
          "section": "input/prototype-key-lookup",
          "message": "Indexing a plain-object table with an external string can return an inherited member like `constructor` or `toString`.",
          "instructions": "Does `hunk` index a plain-object lookup table (object literal or `Record<string, …>` constant) with a string authored by someone outside this project — a mint-supplied unit, method, NUT number or state, a relay or event field, a route or deep-link param, a field of a remote JSON document, user text — and trust the result through `TABLE[key] ?? fallback`, `TABLE[key] || fallback`, `if (TABLE[key])`, `key in TABLE`, or by rendering or calling it?",
          "criteria": {
            "true": "A string that a user, mint, relay, other app or remote document controls indexes a plain object table and the result is used via `??`, `||`, truthiness, `in`, rendering or invocation, with no own-property or type check.",
            "false": "Membership checked with `Object.hasOwn(TABLE, key)` or `Object.prototype.hasOwnProperty.call` before the read; the table is a `Map`, `Set`, or null-prototype object (`Object.create(null)`); the key was already validated against a closed union (zod enum, a registry guard such as `isFiatUnit`, a `switch` over literals); the key is a protocol identifier whose format cannot equal an inherited member name — a hex pubkey or event id, a digits-only string, a URL, a single character — validated or produced as such; the key is produced by this app's own code (enum-like constant, `Object.keys` of the same table), or read from a file or artefact this project's own tooling wrote — origin is judged by who authors the value, not by whether it travelled as JSON; a `typeof value === 'string'` or other exact type check on the result before use."
          },
          "appliesTo": [
            "**/*.ts",
            "**/*.tsx"
          ]
        },
        {
          "id": "doc/docs/review/conventions-typescript/all-with-side-effects",
          "section": "async/all-with-side-effects",
          "message": "`Promise.all` over side-effecting writes loses every outcome but the first rejection.",
          "instructions": "Does `hunk` pass to `Promise.all(` operations with side effects that may already have happened when one rejects — payments, melts, mints, swaps, sends, publishes, deletes, storage or database writes — where each outcome matters to what the caller records, retries or shows?",
          "criteria": {
            "true": "`Promise.all(` wraps mutating operations whose individual success or failure the caller needs, and the mapped callbacks do not catch their own failures.",
            "false": "`Promise.allSettled(` with every result inspected; each mapped operation catches its own failure inside the callback and returns a typed outcome (per-item try/catch, a neverthrow `Result`), so `Promise.all` cannot reject; `Promise.all` over reads only (fetches, queries, cache or storage reads, dynamic imports); operations that are all-or-nothing by design and rolled back together; test files."
          },
          "appliesTo": [
            "**/*.ts",
            "**/*.tsx"
          ],
          "when": "Promise\\.all\\("
        },
        {
          "id": "doc/docs/review/conventions-typescript/shared-in-place",
          "section": "mutation/shared-in-place",
          "message": "An in-place mutation on a value the function does not own changes the caller's, store's or cache's data.",
          "instructions": "Does `hunk` call `.sort(`, `.reverse(`, `.splice(`, `.fill(`, `.copyWithin(`, `.push(`, `.pop(`, `.shift(` or `.unshift(` on — or assign to or `delete` a property of — a value the enclosing function did not create and was not handed in order to mutate: a function parameter, a component prop, a hook, selector, query or `getState()` result, an imported or module-level constant, or a property of one of those?",
          "criteria": {
            "true": "A mutating array method, property assignment or `delete` targets a parameter, prop, hook/selector/store result, or imported/module-level value that the enclosing function did not construct — most clearly an imported constant, or one mutated through an `as` cast that widens its literal or readonly type.",
            "false": "The receiver is a fresh copy or freshly built value in the same function (`[...items].sort(…)`, `items.slice().reverse()`, `items.map(…).sort(…)`, `.filter(…)`, `Array.from(…)`, `Object.keys(…)`, a local `const out = []` pushed to); `toSorted`/`toReversed`/`toSpliced`/`with`; an Immer draft, or the argument of an updater or producer callback passed to the owning store's `update`/`set`/`produce`, whatever it is named; a parameter whose documented purpose — in its name (`out`, `acc`, `draft`, `result`), its JSDoc or the file header — is to be mutated in place; a module's own mutable context, session or cursor object threaded through its private helpers so that they can maintain it (`ctx.stack.push(…)`); a class mutating its own private field; store files; mutation during render."
          },
          "appliesTo": [
            "**/*.ts",
            "**/*.tsx"
          ],
          "when": "\\.(sort|reverse|splice|fill|copyWithin|push|pop|shift|unshift)\\(|\\bdelete\\s"
        },
        {
          "id": "doc/docs/review/conventions-typescript/empty-aggregate",
          "section": "math/empty-aggregate",
          "message": "An aggregate over a possibly-empty list yields `Infinity` or throws at runtime.",
          "instructions": "Does `hunk` call `Math.max(...list)` or `Math.min(...list)` with only a spread argument, or `.reduce(fn)` with no initial value, on an array that can be empty at runtime when the call executes — a filtered or mapped list, a store or query result, wire data, a function parameter — with no length check shown before it?",
          "criteria": {
            "true": "A spread-only `Math.max`/`Math.min`, or a `reduce` without an initial value, runs on a list the hunk does not show to be non-empty and does not guard for emptiness.",
            "false": "A preceding `if (list.length === 0) return …` or `list.length ? … : …` ternary in the same function; a literal non-spread operand that bounds the result (`Math.max(0, ...list)`, `Math.min(cap, ...list)`); `reduce` with an initial value; a non-empty tuple type (`[T, ...T[]]`); a list the hunk shows being built with at least one element; a call that sits inside a `for…of`, `.map` or `.forEach` body iterating that same list, so it cannot run when the list is empty."
          },
          "appliesTo": [
            "**/*.ts",
            "**/*.tsx"
          ],
          "when": "Math\\.(max|min)\\(|\\.reduce\\("
        },
        {
          "id": "doc/docs/review/conventions-typescript/invalid-date",
          "section": "time/invalid-date",
          "message": "A Date built from external input may be Invalid, making every expiry comparison false and formatting throw.",
          "instructions": "Does `hunk` construct a `Date` (or call `Date.parse`) from a value that comes from outside the app — a relay or mint field, an API response, a deep link, persisted or user-entered text — and then compare, subtract, store, `.toISOString()` or format it, without first checking `Number.isNaN(date.getTime())` or validating the input with a schema or finite-number check?",
          "criteria": {
            "true": "An externally-sourced value is passed to `new Date(` / `Date.parse(` and the result is used in a comparison, arithmetic, storage or formatting with no validity check and no prior schema/finite-number validation.",
            "false": "The input is a finite number the hunk shows being validated (`Number.isFinite`, `z.number().int()`); `new Date()` / `Date.now()` / a timestamp produced by this app; the result goes straight into the shared `formatDate`/`formatRelative` helpers; an explicit validity check before use; tests and fixtures."
          },
          "appliesTo": [
            "**/*.ts",
            "**/*.tsx"
          ],
          "when": "new Date\\(|Date\\.parse\\("
        },
        {
          "id": "doc/docs/review/conventions-typescript/nan-passes-guard",
          "section": "money/nan-passes-guard",
          "message": "An amount guard written only as rejecting comparisons lets `NaN`, `Infinity` or fractions through as valid.",
          "instructions": "Does `hunk` take an amount, fee, limit or balance that arrives from outside the function's own arithmetic — an event or machine-context field, a route or deep-link param, a parsed payload, user input, a store field — and let it continue into a quote, send, melt, mint or other payment step when the only checks on it are a bare `typeof x === 'number'` or comparisons written in the rejecting direction (`if (amount <= 0) return …`, `if (amount > max) return …`, `amount < min || amount > max`), which are all false for `NaN`, with no `Number.isSafeInteger`, `Number.isInteger`, `Number.isFinite` or schema check (`z.number().int().positive()`, `z.int()`) on that value anywhere in the hunk?",
          "criteria": {
            "true": "A money-deciding value that enters from outside is admitted into a payment step by rejecting comparisons or a bare `typeof === 'number'` check, and no finite/integer/schema validation of that value appears in the hunk.",
            "false": "The value was already parsed by a zod number schema or came from an SDK amount type (cashu-ts amounts, `amountToNumber` of a validated amount); the guard is an acceptance test that `NaN` fails (`if (!(amount > 0 && amount <= max)) return …`, `if (amount != null && amount > 0) { … }`), including rejecting range checks nested inside such a test, or is preceded by `Number.isSafeInteger`/`Number.isFinite`; a later exact-match or set-membership acceptance that `NaN` and fractions fail; values the function computed itself from validated inputs or module constants (deltas, remainders, suggestion targets) and loop or bookkeeping conditions on them; a helper that only labels, filters or ranks candidates for display and sends nothing; a `typeof` check on a value that is only displayed; range checks on non-money values that cannot be `NaN` (array indices, lengths, enum ordinals); display-only code."
          },
          "appliesTo": [
            "wallet/**/*.ts",
            "wallet/**/*.tsx",
            "**/{cashu,wallet,payment,payments,mint,mints,send,receive,transactions,nfc,nearPay,melt,swap,balance,proofs}/**/*.ts",
            "**/{cashu,wallet,payment,payments,mint,mints,send,receive,transactions,nfc,nearPay,melt,swap,balance,proofs}/**/*.tsx",
            "**/*{Wallet,Payment,Mint,Melt,Send,Receive,Proof,Token,Invoice,Amount,Balance,Cashu,Lightning,Onchain}*.ts",
            "**/*{Wallet,Payment,Mint,Melt,Send,Receive,Proof,Token,Invoice,Amount,Balance,Cashu,Lightning,Onchain}*.tsx"
          ]
        },
        {
          "id": "doc/docs/review/conventions-typescript/exhaustive-else",
          "section": "types/exhaustive-else",
          "message": "A final `else` standing for one union member will silently absorb members added later.",
          "instructions": "Does `hunk` map ONE variable that ranges over a closed set of three or more literal values (a `kind`, `type`, `status`, `state`, `phase`, `mode` or unit compared with `===` against string literals) to results arm by arm — with an `if`/`else if` chain, a run of early returns or a nested ternary — so that the final `else`, fall-through or last arm produces the result that belongs to one specific unnamed member (a label, a colour, a state, a verdict such as `'finalized'` or `'deny'`, `true` for refund) rather than a genuinely neutral fallback?",
          "criteria": {
            "true": "An if/else-if chain, run of early returns or nested ternary over the string-literal members of one variable ends in a branch whose result is specific to one remaining member (the colour for success, the text for the last status) instead of a neutral value, so a member added later silently receives it.",
            "false": "A `switch`, or a lookup table typed `Record<Union, …>` / `satisfies Record<Union, …>`, over the union; a final branch that assigns to `never`, calls `assertNever`, throws, or returns a neutral value correct for future members (`null`, `undefined`, the input unchanged or echoed, \"unknown\"); a two-member union or boolean; a comparison against ONE literal whose `else` really means \"everything else\" (`unit === 'sat' ? … : …`); values that are open strings from the wire rather than a closed union; a ladder of guards over several different variables or conditions whose fall-through is the default or least-privileged outcome (`'ask'`, deny, not allowed); guards that skip an action for certain states and otherwise perform the same generic action for every remaining state; a final arm that handles absence (`undefined` or `null`) rather than a literal member; a discriminator the same function computes a few lines earlier with its own ternary or if-chain, so the set of values and the mapping are edited together."
          },
          "appliesTo": [
            "**/*.ts",
            "**/*.tsx"
          ],
          "when": "\\belse\\b|\\?"
        },
        {
          "id": "doc/docs/review/conventions-typescript/shared-empty-readonly",
          "section": "types/shared-empty-readonly",
          "message": "A shared module-level empty fallback with a mutable type can be corrupted for every consumer.",
          "instructions": "Does `hunk` declare a module-level constant array, object, `Map` or `Set` that serves as a shared empty or default value — returned from a selector, hook or function, or used after `??` — with a mutable type (`const EMPTY: string[] = []`, `const EMPTY_AMOUNTS: Record<string, number[]> = {}`, `new Map<…>()`) rather than a read-only one?",
          "criteria": {
            "true": "A module-level empty/default collection constant handed out to consumers is declared with a mutable type and is not frozen or `as const`.",
            "false": "The constant is typed `readonly T[]`, `ReadonlyArray<T>`, `Readonly<Record<…>>`, `ReadonlyMap`/`ReadonlySet`, declared `as const`, or wrapped in `Object.freeze(`; a module-level collection that is deliberately mutable state owned by that module (a cache, registry, listener set) and is not handed out as a fallback; constants inside tests and fixtures."
          },
          "appliesTo": [
            "**/*.ts",
            "**/*.tsx"
          ],
          "when": "=\\s*\\[\\]|=\\s*\\{\\}|new (Map|Set)"
        },
        {
          "id": "doc/docs/review/conventions-typescript/optional-call-noop",
          "section": "async/optional-call-noop",
          "message": "An optionally-chained operation may never run, yet the code after it reports success.",
          "instructions": "Does `hunk` invoke a wallet, payment, persistence or publish operation through optional chaining (`await machine?.startReceive(…)`, `manager?.wallet.send(…)`, `void store?.save(…)`) and then continue as if it ran — advancing a flow, returning success, clearing state or navigating — with no branch for the owner being `undefined`?",
          "criteria": {
            "true": "A state-changing operation is called with `?.` and the following code proceeds unconditionally, with no prior guard on the owner and no check of the call's result for `undefined`.",
            "false": "The missing owner is handled first (`if (!machine) return err(notReady)`) or the optional call's result is checked for `undefined`; optional calls to callbacks and UI affordances where absence means \"nothing to do\" (`onClose?.()`, `ref.current?.focus()`, `sheetRef.current?.dismiss()`, `controller?.abort()`, `subscription?.remove()`); teardown and cleanup paths."
          },
          "appliesTo": [
            "wallet/**/*.ts",
            "wallet/**/*.tsx",
            "**/{cashu,wallet,payment,payments,mint,mints,send,receive,transactions,nfc,nearPay,melt,swap,balance,proofs}/**/*.ts",
            "**/{cashu,wallet,payment,payments,mint,mints,send,receive,transactions,nfc,nearPay,melt,swap,balance,proofs}/**/*.tsx",
            "**/*{Wallet,Payment,Mint,Melt,Send,Receive,Proof,Token,Invoice,Amount,Balance,Cashu,Lightning,Onchain}*.ts",
            "**/*{Wallet,Payment,Mint,Melt,Send,Receive,Proof,Token,Invoice,Amount,Balance,Cashu,Lightning,Onchain}*.tsx"
          ],
          "when": "\\?\\."
        },
        {
          "id": "doc/docs/review/conventions-typescript/global-test",
          "section": "regex/global-test",
          "message": "`.test`/`.exec` on a shared `g`-flagged regex is stateful and alternates results for the same input.",
          "instructions": "Does `hunk` call `.test(` or `.exec(` on a regular expression carrying the `g` or `y` flag that outlives the call — a module-level or imported constant, a class field, a `useRef`/`useMemo` value — or add the `g` flag to a shared pattern the hunk shows being used with `.test(`?",
          "criteria": {
            "true": "A persistent `g`- or `y`-flagged regex is used with `.test(`/`.exec(`, or the `g` flag is added to a shared pattern that the hunk shows `.test(` being called on.",
            "false": "The pattern used with `.test(` has no `g`/`y` flag; the regex literal is created inline at the call site each time; `g`-flagged patterns used only with `replace`, `replaceAll`, `matchAll` or `split`; an `exec` loop that deliberately iterates matches and resets `lastIndex = 0` (or runs to `null`) before reuse."
          },
          "appliesTo": [
            "**/*.ts",
            "**/*.tsx"
          ],
          "when": "\\.test\\(|\\.exec\\("
        },
        {
          "id": "doc/docs/review/conventions-typescript/replace-first-only",
          "section": "strings/replace-first-only",
          "message": "`.replace` with a string pattern changes only the first occurrence, leaving the rest in place.",
          "instructions": "Does `hunk` call `.replace(` with a string (not regex) first argument in a case where every occurrence is meant to change — removing or swapping separators, whitespace, commas, dashes, slashes, zero-width or control characters, or normalising an amount, identifier, URL, testID or key?",
          "criteria": {
            "true": "`.replace('x', …)` is given a string pattern that can occur more than once in the input and the intent is to strip or normalise all of them.",
            "false": "`.replaceAll(` or a regex with the `g` flag is used; a single prefix, suffix or sigil that can occur only once or only matters at the start (`hex.replace('#', '')`, `handle.replace('@', '')`, `uri.replace('nostr:', '')`, a scheme or file extension); replacing a unique placeholder in a template the code owns."
          },
          "appliesTo": [
            "**/*.ts",
            "**/*.tsx"
          ],
          "when": "\\.replace\\("
        }
      ],
      "notChecked": [
        {
          "section": "Preamble — \"Anything a lint rule can decide is deliberately absent\"",
          "reason": "Framing prose about scope and tooling (tsc --strict, enabled lint rules, TS 5.9/neverthrow 8 versions); states no reviewable code condition."
        },
        {
          "section": "Cross-references to state/shape and react/render-mutation",
