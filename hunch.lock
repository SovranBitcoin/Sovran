          "appliesTo": [],
          "when": "useSyncExternalStore|getSnapshot|subscribe",
          "message": "A `getSnapshot` that builds a new value each call crashes the component with an update-depth loop."
        },
        {
          "id": "doc/docs/review/conventions-state/use-promise-in-render",
          "section": "react/use-promise-in-render",
          "instructions": "Does `hunk` call `use(` with a promise created in the same component render — a direct call such as `use(fetchThing(id))`, an `async` function invocation, `new Promise(…)`, or a `.then(…)` chain built in the body?",
          "criteria": {
            "true": "The argument to `use(` is an expression that constructs or invokes a promise in the render body.",
            "false": "The promise is created outside render and passed in as a prop or read from a cache keyed by the inputs (module-level map, `createQueryCacheStore`, a loader); `use(Context)`; a promise held in a parent's `useState(() => …)`."
          },
          "appliesTo": [],
          "when": "\\buse\\(|Suspense|[Pp]romise",
          "message": "A promise created during render makes `use()` restart the request on every retry and never resolve."
        },
        {
          "id": "doc/docs/review/conventions-state/context-churn",
          "section": "react/context-churn",
          "instructions": "Does `hunk` add a frequently-changing value — scroll or drag position, progress, a timer tick, text-input contents, a per-frame or per-event counter, streaming text — to the `value` of a context that also carries slow-changing data or is consumed broadly?",
          "criteria": {
            "true": "The context provider's `value` gains a field updated per frame, per keystroke or per event alongside slower data.",
