  "sources": [
    {
      "id": "skill/codebase-design",
      "kind": "skill",
      "origin": "./.agents/skills/codebase-design",
      "path": ".agents/skills/codebase-design/SKILL.md",
      "scope": "",
      "hash": "ed4a1837af02ce111aa6613e9a04e3bbcc07e7732fe0c613cda2b6035404b8d6",
      "rules": [
        {
          "id": "skill/codebase-design/inject-external-service-dependencies",
          "section": "Codebase Design > Designing for testability",
          "message": "Constructing a service dependency inside business logic prevents tests from substituting it.",
          "instructions": "Does `hunk` introduce business logic that constructs its own external service client instead of accepting that dependency as an argument or constructor parameter?",
          "criteria": {
            "true": "A business operation directly constructs a dependency such as StripeGateway or a third-party service client for its own use.",
            "false": "The dependency is injected. Construction occurs in application wiring, an adapter implementation, or test setup. The constructed object is an ordinary data value rather than a service dependency."
          },
          "appliesTo": []
        },
        {
          "id": "skill/codebase-design/return-computed-results",
          "section": "Codebase Design > Designing for testability",
          "message": "A calculation communicates its result by mutating caller-owned input, making it harder to test independently.",
          "instructions": "Does `hunk` introduce a calculation that communicates its result by mutating caller-owned input instead of returning the computed result?",
          "criteria": {
            "true": "A calculation writes its computed value into an argument, such as assigning a discount-adjusted total to cart.total, without returning the computed result.",
            "false": "The calculation returns its result without mutating caller-owned input, or only mutates local working data. The operation implements an explicit state-changing or I/O responsibility rather than a calculation."
          },
          "appliesTo": []
        },
        {
          "id": "skill/codebase-design/keep-test-seams-internal",
          "section": "Deepening > Seam discipline",
          "message": "Exposing an internal seam solely for tests expands the interface callers must understand.",
          "instructions": "Does `hunk` expose an implementation detail through the module's caller-facing interface explicitly so tests can access it?",
          "criteria": {
            "true": "A change makes an internal helper, dependency hook, or implementation state public or exported, with a comment or other explicit evidence that test access is the reason.",
            "false": "The seam remains private to the implementation, including internal seams used by the module's own tests. The exposed operation serves callers as part of the module's intended interface."
          },
          "appliesTo": []
        },
        {
          "id": "skill/codebase-design/assert-observable-outcomes",
          "section": "Deepening > Testing strategy: replace, don't layer",
          "message": "Assertions on private implementation state couple tests to internal refactors.",
          "instructions": "Does `hunk` add a test assertion that bypasses encapsulation to inspect private implementation state?",
          "criteria": {
            "true": "A test asserts on a private field or internal state obtained through a visibility bypass, reflection, or a cast used to circumvent private access.",
            "false": "Tests assert returned values, public observable state, or effects observed through an adapter. Tests exercise permitted internal seams through their interfaces without bypassing encapsulation."
          },
          "appliesTo": []
        }
      ],
      "notChecked": [
        {
          "section": "Codebase Design > Glossary; Relationships; Rejected framings",
          "reason": "These define architectural vocabulary and conceptual distinctions rather than concrete code defects; literal terminology bans are better handled by text checks."
        },
        {
          "section": "Codebase Design > Deep vs shallow; Principles > Depth; The deletion test",
          "reason": "Depth, leverage, locality, and pass-through value require subjective design assessment and knowledge of callers beyond one chunk."
        },
        {
          "section": "Codebase Design > Principles > One adapter means a hypothetical seam; Deepening > Seam discipline",
          "reason": "Determining whether a seam has enough justified adapters requires counting and repository-wide context."
        },
        {
          "section": "Codebase Design > Designing for testability > Small surface area",
          "reason": "Method and parameter reduction requires comparative interface assessment and counts, with no concrete prohibited construct."
        },
        {
          "section": "Deepening > Dependency categories",
          "reason": "Dependency ownership, stand-in availability, and production-versus-test adapter architecture generally require cross-file evidence; directly constructed external dependencies are covered by the injection rule."
        },
        {
          "section": "Deepening > Testing strategy: replace, don't layer",
          "reason": "Deleting superseded tests and verifying replacement interface coverage require comparing multiple files. Survival under future internal refactors cannot be established from a chunk."
        },
        {
          "section": "Codebase Design > Going deeper; Design It Twice > Process",
          "reason": "These prescribe design exploration, user communication, sub-agent work, and presentation steps rather than locally reviewable code conditions."
        }
      ]
    },
    {
      "id": "skill/expo-router",
      "kind": "skill",
      "origin": "./.agents/skills/expo-router",
      "path": ".agents/skills/expo-router/SKILL.md",
      "scope": "",
      "hash": "266033e294f0a324cce200b5ffcbe057ce67d0b91c284c4a854f11692cc63f09",
      "rules": [
        {
          "id": "skill/expo-router/keep-support-modules-outside-app",
          "section": "Route Structure > File Conventions",
          "message": "A support module in app may be treated as a route.",
          "instructions": "Within Sovran, app/app is the Expo Router route directory; app/shared and app/features are outside it. Does `hunk` implement a standalone reusable component, type module, or utility module in the route directory?",
          "criteria": {
            "true": "A file under app is clearly implemented as a support module rather than a route screen or layout.",
            "false": "The file implements a route or layout, including route-local helpers; support modules live outside app. A component extracted for platform-specific tab layouts outside app is allowed."
          },
          "appliesTo": [
            "app/app/**/*.{ts,tsx,js,jsx}"
          ]
        },
        {
          "id": "skill/expo-router/keep-tab-membership-static",
          "section": "Native Tabs > Rules",
          "message": "Changing tab membership at runtime can remount the navigator and lose navigation state.",
          "instructions": "Does `hunk` make the set of NativeTabs.Trigger elements change after the initial render?",
          "criteria": {
            "true": "Runtime state, an event, or an asynchronous update visibly adds or removes NativeTabs.Trigger elements.",
            "false": "Trigger membership is fixed, including a configuration chosen only at initialization. Changing labels, badges, or the entire tab bar's hidden prop does not change membership."
          },
          "appliesTo": [
            "**/*.tsx",
            "**/*.jsx"
          ]
        },
        {
          "id": "skill/expo-router/keep-trigger-visibility-static",
          "section": "Native Tabs > Conditional Tabs",
          "message": "Toggling an individual tab's visibility can remount the navigator and lose state.",
          "instructions": "Does `hunk` change a NativeTabs.Trigger hidden value after the initial render?",
          "criteria": {
            "true": "The trigger's hidden prop depends on state that is visibly updated after initialization.",
            "false": "Trigger visibility is chosen only on the initial render. Dynamically hiding the entire NativeTabs bar using its hidden prop is explicitly allowed."
          },
          "appliesTo": [
            "**/*.tsx",
            "**/*.jsx"
          ]
        },
        {
          "id": "skill/expo-router/externalize-bottom-accessory-state",
          "section": "Native Tabs > Bottom Accessory (SDK 55+)",
          "message": "State inside a bottom accessory can diverge between its simultaneously rendered instances.",
          "instructions": "Does `hunk` store mutable UI state inside a component rendered as NativeTabs.BottomAccessory content?",
          "criteria": {
            "true": "A component visibly used as bottom accessory content owns mutable state, such as playback state managed with useState or useReducer.",
            "false": "State lives in a parent, context, or external store and is supplied to accessory content. Calling usePlacement to choose an inline or regular presentation is allowed."
          },
          "appliesTo": [
            "**/*.tsx",
            "**/*.jsx"
          ]
        },
        {
          "id": "skill/expo-router/avoid-nested-native-tabs",
          "section": "Native Tabs > Limitations",
          "message": "Nested native tab navigators are unsupported.",
          "instructions": "Does `hunk` render a NativeTabs navigator inside another NativeTabs navigator?",
          "criteria": {
            "true": "The JSX or locally defined component composition nests a native tab navigator beneath another native tab navigator.",
            "false": "NativeTabs contains triggers, bottom accessories, or stacks rather than another native tab navigator."
          },
          "appliesTo": [
            "**/*.tsx",
            "**/*.jsx"
          ]
        },
        {
          "id": "skill/expo-router/prefer-native-tab-navigator",
          "section": "Native Tabs",
          "message": "A JavaScript tab navigator bypasses the preferred native tab experience.",
          "instructions": "Does `hunk` implement native app tabs with a JavaScript tab navigator instead of NativeTabs?",
          "criteria": {
            "true": "An iOS or Android layout uses Expo Router Tabs or a JavaScript bottom-tab navigator when SDK 54 or later support is established.",
            "false": "The layout uses NativeTabs, targets an older SDK, or is a separate web layout, for which headless tabs from expo-router/ui are explicitly allowed."
          },
          "appliesTo": [
            "**/*.tsx",
            "**/*.jsx"
          ]
        },
        {
          "id": "skill/expo-router/use-router-modal-presentation",
          "section": "Navigation > Modal",
          "message": "A custom modal screen bypasses the preferred Stack modal presentation.",
          "instructions": "Does `hunk` implement a route screen's modal presentation with a custom modal component instead of Stack.Screen presentation=\"modal\"?",
          "criteria": {
            "true": "A route screen is visibly presented through a hand-built modal overlay or React Native Modal instead of the Stack modal presentation option.",
            "false": "Stack.Screen configures modal presentation. An inline dialog or other overlay that does not present a route screen is unrelated. Stack formSheet presentation is also sanctioned."
          },
          "appliesTo": [
            "**/*.tsx",
            "**/*.jsx"
          ]
        },
        {
          "id": "skill/expo-router/show-search-empty-results",
          "section": "Search > Empty States",
          "message": "A search with no matches may leave users looking at a blank results area.",
          "instructions": "Does `hunk` render search results with no empty-state UI for a query that has no matches?",
          "criteria": {
            "true": "A complete search-results rendering branch shows that an empty filtered collection produces only a blank list or empty container.",
            "false": "A no-results message, ListEmptyComponent, or another explicit empty-state UI handles unmatched searches."
          },
          "appliesTo": [
            "**/*.tsx",
            "**/*.jsx"
          ]
        },
        {
          "id": "skill/expo-router/toolbar-view-explicit-dimensions",
          "section": "Components > View",
          "message": "A custom toolbar view may lack the explicit dimensions required for layout.",
          "instructions": "Does `hunk` add or modify custom content inside `Stack.Toolbar.View` whose root native element lacks explicit width or height?",
          "criteria": {
            "true": "The custom content's root native element has visible styling that omits width or height, including replacing either dimension with flex or aspectRatio alone.",
            "false": "The root has explicit width and height. A custom component is allowed when its root supplies those dimensions. Styling or a custom component whose implementation is not shown does not establish a violation."
          },
          "appliesTo": [
            "**/*.tsx",
            "**/*.jsx"
          ]
        },
        {
          "id": "skill/expo-router/keep-toolbar-wrapper-with-extracted-items",
          "section": "Recommendations",
          "message": "Toolbar items extracted without their toolbar wrapper may not render correctly.",
          "instructions": "Does `hunk` define a component that returns `Stack.Toolbar.*` items outside a `Stack.Toolbar` wrapper and render that component as a child of `Stack.Toolbar`?",
          "criteria": {
            "true": "An extracted component returns toolbar buttons or other toolbar items in a fragment or another non-toolbar root, and a shown usage places that component inside Stack.Toolbar.",
            "false": "The extracted component returns Stack.Toolbar enclosing its items, or toolbar items are declared directly within Stack.Toolbar. Custom content components inside Stack.Toolbar.View are allowed."
          },
          "appliesTo": [
            "**/*.tsx",
            "**/*.jsx"
          ]
        },
        {
          "id": "skill/expo-router/bottom-toolbar-only-in-screens",
          "section": "Limitations",
          "message": "A bottom toolbar declared in a layout file is unsupported.",
          "instructions": "Does `hunk` declare a bottom `Stack.Toolbar` in an Expo Router layout file?",
          "criteria": {
            "true": "A layout file adds or changes a Stack.Toolbar with placement=\"bottom\" or omitted placement, which defaults to bottom.",
            "false": "The toolbar is declared in a screen component, or the layout toolbar explicitly uses placement=\"left\" or placement=\"right\"."
          },
          "appliesTo": [
            "**/_layout.tsx",
            "**/_layout.jsx",
            "**/_layout.js"
          ]
        },
        {
          "id": "skill/expo-router/badge-requires-header-toolbar",
          "section": "Limitations",
          "message": "Toolbar badges do not work in bottom toolbars.",
          "instructions": "Does `hunk` place `Stack.Toolbar.Badge` in a bottom `Stack.Toolbar`?",
          "criteria": {
            "true": "An added or modified badge is enclosed by a toolbar with placement=\"bottom\" or omitted placement.",
            "false": "The enclosing toolbar uses placement=\"left\" or placement=\"right\", or its placement cannot be determined."
          },
          "appliesTo": [
            "**/*.tsx",
            "**/*.jsx"
          ]
        }
      ],
      "notChecked": [
        {
          "section": "Expo Router Navigation > References; Submitting Feedback",
          "reason": "Consulting skills, loading references, and submitting feedback are agent workflow requirements."
        },
        {
          "section": "Code Style",
          "reason": "Filename conventions are deterministic checks; route syntax explicitly sanctions special characters. Removing old routes and configuring aliases require cross-file inspection, while identifying refactor imports requires broader context."
        },
        {
          "section": "Routes; Route Structure > File Conventions",
          "reason": "Route placement, dynamic filename syntax, forbidden group filenames, default exports, and stack layout filenames are structural lint checks. Ensuring a root route exists requires the route tree."
        },
        {
          "section": "Library Preferences; Navigation > Stack",
          "reason": "PlatformColor and Stack import-source restrictions are deterministic lint checks. Direct @react-navigation imports additionally require SDK information."
        },
        {
          "section": "Behavior; Navigation > Page Title; Search > Header Search Bar",
          "reason": "The source also sanctions headerSearchBarOptions and options.title in examples, so a blanket prohibition on alternatives to Stack.SearchBar or Stack.Title would flag permitted code."
        },
        {
          "section": "Navigation > Link; Context Menus; Link Previews",
          "reason": "Preview and context-menu frequency is discretionary. A blanket Link-only rule would overreach because the source also uses imperative router navigation."
        },
        {
          "section": "Navigation > Sheet; Form Sheets in Expo Router",
          "reason": "Presentation options are primarily examples and configuration documentation. Detent ranges require numeric checks; footer sizing and background fixes can depend on styles outside the chunk and observed layout behavior."
        },
        {
          "section": "Route Structure > Query Parameters; Pathname; Group Routes; Array Routes for Multiple Stacks; Route Settings; Not Found Routes",
          "reason": "Hook and option-name checks are lintable; parameter names, shared-route anchors, and route coverage require route-tree context. Group organization is discretionary."
        },
        {
          "section": "Route Structure > Stacks and Tabs Structure; Native Tabs > Structure with Stacks",
          "reason": "Verifying stacks inside each tab and header ownership generally requires multiple layout files. Explicit tab headerShown settings are lintable."
        },
        {
          "section": "Search > useSearch Hook; Filtering Patterns; Search with Native Tabs; Search Suggestions",
          "reason": "These sections provide implementation patterns rather than unconditional requirements. Filtering cost and debounce suitability are not decidable from a single chunk."
        },
        {
          "section": "Native Tabs > SDK Compatibility; Icon Component; Label & Badge; Role Prop; Using Vector Icons",
          "reason": "Version-specific APIs, badge placement, icon props, and semantic role attributes are structural lint checks. Custom images, asset catalogs, hidden labels, and vector icons are expressly permitted."
        },
        {
          "section": "Native Tabs > Rules; iOS 26 Features",
          "reason": "Trigger coverage and exact route-name matching require the route tree. Search-tab ordering is a deterministic structural check."
        },
        {
          "section": "Native Tabs > Platform Features; Customization; Behavior Options; Safe Area Handling; Custom Web Layout; Migration from JS Tabs",
          "reason": "These sections largely describe options and examples. Manual inset handling requires screen context; separate web layouts and dynamic whole-bar hiding are sanctioned alternatives."
        },
        {
          "section": "Native Tabs > Limitations; Keyboard Handling (Android); Common Issues",
          "reason": "The Android tab limit requires counting. Keyboard configuration is lintable. Transparency, scroll-to-top, icon failures, and header flicker require platform or runtime context, often across files; ThemeProvider coverage is cross-file."
        },
        {
          "section": "Common route structure",
          "reason": "The structure is illustrative. The headerLargeTitleEnabled rename is a version-dependent API lint check."
        },
        {
          "section": "Toolbars and headers",
          "reason": "Platform and SDK availability require environment information. The example's ScrollView ordering is a deterministic JSX structural check."
        },
        {
          "section": "Mail inbox example; Placement; Components > Button; Components > Menu",
          "reason": "Examples and API descriptions do not establish additional review requirements; literal prop and enum validation belongs in static tooling."
        },
        {
          "section": "Components > Menu",
          "reason": "The palette-divider recommendation depends on intended divider behavior, which palette props alone do not establish."
        },
        {
          "section": "Components > Spacer; Limitations > Header Spacers",
          "reason": "Explicit width on a header spacer is a structural check suitable for a linter."
        },
        {
          "section": "Components > View; Apple Zoom Transitions > Targeted Zoom with Link.AppleZoom",
          "reason": "Single-child requirements need child counting and are better enforced by static tooling."
        },
        {
          "section": "Recommendations > Extract complex headers",
          "reason": "Header complexity is subjective."
        },
        {
          "section": "Limitations > iOS only; Apple Zoom Transitions",
          "reason": "Platform, OS, SDK, and navigator compatibility generally require configuration or navigation context outside the chunk."
        },
        {
          "section": "Apple Zoom Transitions > Basic Zoom; Destination Target; Controlling Dismissal; Combining with Link.Preview",
          "reason": "These sections primarily describe optional APIs and behavior rather than mandatory code constraints."
        },
        {
          "section": "Apple Zoom Transitions > Custom Alignment Rectangle",
          "reason": "Determining whether a destination target is available as a React component, or whether coordinates use its coordinate space, requires destination context."
        },
        {
          "section": "Apple Zoom Transitions > Best Practices > Good use cases; Avoid",
          "reason": "Source shape and visual similarity are subjective or require dimensions and cross-screen comparison; sheet, popover, and navigation-bar interactions require navigation context."
        },
        {
          "section": "Apple Zoom Transitions > Best Practices > Tips",
          "reason": "Verifying destination back controls and dismissal bounds requires the complete destination and its navigation or scroll behavior; remaining tips describe behavior."
        },
        {
          "section": "Reference; Apple Zoom Transitions > References",
          "reason": "Reading linked documentation is a process instruction, not a code condition."
        }
      ]
    },
    {
      "id": "agents-md/root",
      "kind": "agents-md",
      "origin": "./AGENTS.md",
      "path": "AGENTS.md",
      "scope": "",
      "hash": "2c2a814a1e3bcf152b1daa236be82ac9cce8ec63cb7729cbe0c72d3a5496c95a",
      "rules": [
        {
          "id": "agents-md/root/actionable-control-accessible-label",
          "section": "Native testability",
          "message": "An actionable control may lack an accessible name.",
          "instructions": "Does `hunk` introduce or change an actionable native control without an accessible label?",
          "criteria": {
            "true": "An actionable control has neither an explicit accessible label nor visible text that supplies its accessible name, such as an icon-only button without accessibilityLabel.",
            "false": "The control has an accessible label through an explicit accessibility property or accessible text content, or the element is not actionable. Shared controls that supply an accessible name internally are allowed; a missing implementation is not proof that the label is absent."
          },
          "appliesTo": [
            "app/**/*.tsx",
            "app/**/*.jsx"
          ]
        },
        {
          "id": "agents-md/root/probe-inside-active-surface",
          "section": "Native testability",
          "message": "A state probe outside the active surface may be unavailable to the native harness.",
          "instructions": "Does `hunk` mount `E2EAccessibilityProbe` outside the active screen or sheet whose state it exposes?",
          "criteria": {
            "true": "The probe is mounted outside the screen or sheet containing the state it represents, such as beside a modal instead of inside its content.",
            "false": "The probe is mounted inside the active screen or sheet whose state it exposes."
          },
          "appliesTo": [
            "app/**/*.tsx",
            "app/**/*.jsx"
          ]
        },
        {
          "id": "agents-md/root/native-scenario-state-waits",
          "section": "Native testability",
          "message": "A fixed delay may let a native scenario proceed before the required state is ready.",
          "instructions": "Does `hunk` add a fixed-duration delay as the readiness check before a native scenario proceeds?",
          "criteria": {
            "true": "A native harness scenario sleeps or waits for an elapsed duration to assume that navigation, loading, or another state transition has completed.",
            "false": "The scenario waits for an observable state condition; a timeout only bounds that state-based wait."
          },
          "appliesTo": [
            "app/**/*.json"
          ]
        },
        {
          "id": "agents-md/root/native-scenario-no-side-effect-retries",
          "section": "Native testability",
          "message": "A native scenario retry may repeat a send, publish, or delete.",
          "instructions": "Does `hunk` configure a native scenario to retry a send, publish, or delete action?",
          "criteria": {
            "true": "A retry or repeated-attempt construct re-executes an action that sends, publishes, or deletes.",
            "false": "The scenario executes the action once, or retries only observation of its resulting state without repeating the action."
          },
          "appliesTo": [
            "app/**/*.json"
          ]
        }
      ],
      "notChecked": [
        {
          "section": "Guidance from AGENTS.md",
          "reason": "Instruction precedence, authorization, and clarification requirements govern agent workflow rather than code hunks."
        },
        {
          "section": "Code rules",
          "reason": "Reading linked guidance, verifying findings, running checks, recording ADRs, and maintaining claims evidence are process or cross-file requirements; linked documents were not supplied."
        },
        {
          "section": "Layout and ownership",
          "reason": "Module ownership and Coco/schema ownership require architectural context across files. Explicit import direction, alias, and source-path restrictions are suitable for deterministic lint rules."
        },
        {
          "section": "Working in the repo",
          "reason": "Git operations, installation, command execution, bundle builds, and real-wallet E2E safety are process requirements. Dependency declarations and budget justification require cross-file or external evidence."
        },
        {
          "section": "Native testability",
          "reason": "Complete page and alias registration, harness coverage, scenario existence, hidden-state probe coverage, and verification on both platforms cannot be established from one chunk."
        },
        {
          "section": "Patches and vendored code",
          "reason": "Patch creation commands are workflow requirements; patch documentation and adjacent vendored provenance require other files."
        },
        {
          "section": "Skills",
          "reason": "Skill selection and installation commands are process requirements. Upstream snapshot integrity, links, provenance, and placement of conventions require cross-file or upstream comparison."
        },
        {
          "section": "Native testability > testID presence",
          "reason": "Literal testID prop presence belongs in deterministic tooling with shared-control and forwarding exceptions. Semantic stability of test identities remains in the contributor conventions rule."
        }
      ]
    },
    {
      "id": "doc/docs/review/contributor-conventions",
      "kind": "doc",
      "origin": "./docs/review/contributor-conventions.md",
      "path": "docs/review/contributor-conventions.md",
      "scope": "",
      "hash": "fac81607856c1f4f6ee2b64e436b1400d87b31c75593a6c3b80b5a56c65ef584",
      "rules": [
        {
          "id": "doc/docs/review/contributor-conventions/preserve-structured-errors",
          "section": "errors/structured",
          "message": "Failure details may be lost before non-UI code can react to them.",
          "instructions": "Does `hunk` propagate a received error to non-UI code as a string, boolean, null, undefined, or generic Error without cause?",
          "criteria": {
            "true": "A caught or received error is replaced with a lossy value in a return, store write, or call used to communicate failure.",
            "false": "Errors are rethrown, wrapped with cause, preserved in typed errors or Results, or logged as objects; strings are display-only; a documented best-effort path deliberately ignores failure and its result decides nothing."
          },
          "appliesTo": []
        },
        {
          "id": "doc/docs/review/contributor-conventions/no-payment-decisions-from-messages",
          "section": "errors/not-for-decisions",
          "message": "Payment recovery may depend on unstable human-readable text.",
          "instructions": "Does `hunk` decide retry, refund, balance, proof state, spent status, or payment recovery by matching human-readable text outside a sanctioned error classifier?",
          "criteria": {
            "true": "Message comparisons, includes calls, or regex matches directly decide one of these outcomes.",
            "false": "Decisions use typed data; a named classifier checks codes first and falls back to messages for libraries without codes, returning typed results; matching only selects display or log text."
          },
          "appliesTo": []
        },
        {
          "id": "doc/docs/review/contributor-conventions/uncertain-outcomes-stay-uncertain",
          "section": "payments/uncertain-outcomes",
          "message": "An uncertain outcome may be recorded as a definitive payment or delivery result.",
          "instructions": "Does `hunk` treat a timeout, abort, cancellation, lost connection, or relay or mint acceptance as proof of definite payment failure, success, or message delivery?",
          "criteria": {
            "true": "Such an event directly marks an operation failed, refunded, paid, or delivered, or releases its proofs.",
            "false": "The outcome remains pending or unknown; a definitive protocol answer determines state; relay acceptance is recorded as sent or accepted."
          },
          "appliesTo": []
        },
        {
          "id": "doc/docs/review/contributor-conventions/guard-async-result-ownership",
          "section": "async/owner-scope",
          "message": "A stale async result may update a different request or profile.",
          "instructions": "Does `hunk` write an async result into state without an ownership guard where its starting profile, request, generation, or mounted component can visibly change in flight?",
          "criteria": {
            "true": "A fetch, await chain, subscription, or timer writes mutable shared or component state despite a visible opportunity for its owner to change.",
            "false": "Writes use cancellation, generation, request, mounted, or profile guards; writes are keyed by the starting input; state is identity-independent with harmless last-writer-wins behavior; work runs once for the app lifetime."
          },
          "appliesTo": []
        },
        {
          "id": "doc/docs/review/contributor-conventions/async-cleanup",
          "section": "async/cleanup",
