    {
      "id": "doc/docs/review/contributor-conventions",
      "kind": "doc",
      "origin": "./docs/review/contributor-conventions.md",
      "path": "docs/review/contributor-conventions.md",
      "scope": "",
      "hash": "dd89f9b61b907c666763c3bc464db173bd3b6498b4b3ee01f782b85d93e73b15",
      "rules": [
        {
          "id": "doc/docs/review/contributor-conventions/error-passed-on-lossily",
          "section": "errors/structured",
          "instructions": "Does `hunk` catch or receive an error that carries information a program could act on — a status or code, an error subclass or `name` such as `AbortError`, a typed `kind`, or an upstream cause — and hand it to other code only as something that information cannot be recovered from (`String(err)`, `err.message`, a template string, a boolean, `null`/`undefined`, or a `new Error(...)` without `{ cause }`), where that code or a later caller branches, retries, classifies or reports on the failure?",
          "criteria": {
            "true": "A caught Error value is in scope, and a catch block (or error callback) returns, stores, resolves or throws only a stringified/boolean/null stand-in for it, or constructs a new generic Error without passing `{ cause }`, and that value is consumed by non-UI logic.",
            "false": "The error is rethrown as-is, wrapped with `{ cause }`, returned as a typed error / Result / discriminated union, or logged with the error object; an unknown thrown value is normalised while keeping the original when it already is an Error (`err instanceof Error ? err : new Error(String(err))`); no caught Error exists to preserve (a socket or DOM `error` event, a timer, a rejected payload, an invariant `throw new Error` outside any catch); a typed status, `kind` or Result derived from the live error travels alongside the string; the string is the program's final human-readable output — screen error text, toast, status label, CLI output, a test or run report; the original is withheld on purpose because it may contain secret material (tokens, invoices, seeds, keys) and a fixed or redacted message is thrown instead; the catch only detects that a pure parser or validator rejected its input (`new URL`, `JSON.parse`, a key decode); the error is being serialised onto a wire, IPC or file format, or into a failure shape a third party defines; the catch is a documented best-effort path (optional enrichment, cache read, feature detection, cleanup, telemetry) whose result decides nothing."
          },
          "appliesTo": [],
          "when": "catch\\s*[({]|\\.message|String\\(|new Error\\(|throw\\s|\\bcause\\b",
          "message": "A caught error may reach non-UI code as a string, boolean or bare Error, losing its cause, code and status."
        },
        {
          "id": "doc/docs/review/contributor-conventions/decide-from-error-text",
          "section": "errors/not-for-decisions",
          "instructions": "Does `hunk` decide retry, refund, balance, proof state, spent status or payment recovery by matching an error message or other human-readable text (`err.message.includes(...)`, a regex over a message, comparing display copy), outside a single named error-classifier function?",
          "criteria": {
            "true": "Control flow that retries, refunds, marks proofs spent/unspent, adjusts balance or recovers a payment branches on `includes`/`match`/`===` against an error message or display string.",
            "false": "Branching on typed data (`instanceof`, `err.code`, HTTP `status`, NUT error codes, a discriminated `kind`); a single named classifier (e.g. `classifyRedeemError`, `classifyMeltError`) that checks codes first and falls back to message patterns only for code-less libraries, with callers branching on its typed result; message matching used only to choose display text or log detail."
          },
          "appliesTo": [],
          "when": "\\.message|includes\\(|\\.match\\(|\\.test\\(|startsWith\\(|indexOf\\(",
          "message": "Retry, refund, balance or proof-state decisions may be driven by matching human-readable error text."
        },
        {
          "id": "doc/docs/review/contributor-conventions/timeout-treated-as-outcome",
          "section": "payments/uncertain-outcomes",
          "instructions": "Does `hunk` treat a timeout, abort, cancellation, lost connection, or relay/mint acceptance as proof that a payment or message definitely failed, succeeded or was delivered — marking it failed, refunded, paid or delivered, or releasing its proofs?",
          "criteria": {
            "true": "A timeout/abort/cancel/network-error branch (or a relay `ok` acknowledgement) sets a terminal state such as failed, paid, refunded, delivered, or returns proofs to the spendable pool.",
            "false": "Unknown outcomes stay pending/unknown and are reconciled later by checking quote or proof state; the terminal state comes from a definitive mint or protocol answer (paid quote, spent-proof check, explicit error code); relay acceptance is recorded as sent/accepted rather than delivered."
          },
          "appliesTo": [],
          "when": "timeout|Timeout|abort|Abort|cancel|Cancel|disconnect|relay|deadline|elapsed",
          "message": "A timeout, cancellation or relay acceptance may be recorded as a definite payment or delivery outcome."
        },
        {
          "id": "doc/docs/review/contributor-conventions/stale-async-write",
          "section": "async/owner-scope",
          "instructions": "Does `hunk` start async work (fetch, await chain, subscription or timer) and then write its result into shared, profile or component state with no check that the profile, request id, generation or mounted component that started it is still current?",
          "criteria": {
            "true": "An `await`/`.then` result is assigned into store, context or component state without an AbortSignal check, request/generation id comparison, `cancelled` flag, mounted check or profile-id check, in code where the input can change while the work is in flight.",
            "false": "The write is guarded by an AbortSignal, request/generation id, a `cancelled` flag from effect cleanup, or a profile-id check; the result is keyed by the input that started it (`cache[pubkey] = result`); the state is identity-independent and last-writer-wins is harmless; the work runs once for the app lifetime."
          },
          "appliesTo": [],
          "when": "await|\\.then\\(|useEffect|subscribe|setState|set\\(",
          "message": "A late async result may be written into state that belongs to a newer request or another profile."
        },
        {
          "id": "doc/docs/review/contributor-conventions/subscription-without-teardown",
          "section": "async/cleanup",
          "instructions": "Does `hunk` attach a listener or subscription to something that outlives the attaching code (`window`, `document`, `AppState`, a store, an emitter, a native module, a socket), or start a `setInterval`, inside a component, hook, effect or other owner with a shorter life, with no matching teardown (cleanup return, `unsubscribe`, `clearInterval`, `removeEventListener`) when that owner goes away — or start a one-shot `setTimeout` whose callback sets state, navigates or performs I/O after the owner may be gone?",
          "criteria": {
            "true": "An effect or component body calls `subscribe`, `addEventListener`, `setInterval` or such a `setTimeout` on a longer-lived target and the hunk shows no cleanup function or disposal for it.",
            "false": "The effect returns cleanup that unsubscribes/clears/removes the listener; the handle is stored and disposed elsewhere in the visible code; the listener is added to an element the same code just created and that is discarded with it, so their lifetimes are equal; a one-shot timer that only writes a ref, a local flag or a label; module-level singletons meant to live for the app lifetime."
          },
          "appliesTo": [],
          "when": "setInterval|setTimeout|addEventListener|\\.subscribe\\(|useEffect|\\.on\\(|watch|listen",
          "message": "A subscription, listener or timer may keep running with no owner to tear it down."
        },
        {
          "id": "doc/docs/review/contributor-conventions/swallowed-async-failure",
          "section": "async/cleanup",
          "instructions": "Does `hunk` discard (`void`, or leave un-awaited) a promise that can reject — the called function, as far as `hunk` shows, neither catches internally nor returns a Result or status — while it performs network, storage or wallet work, with no `.catch`; or add an empty `catch {}` with no comment explaining why ignoring the failure is safe?",
          "criteria": {
            "true": "`void somePromise()` where the called work is a fetch, persistence or wallet operation and `hunk` shows the callee can reject — for example it re-throws after logging — and no `.catch` is attached; or `catch {}` / `catch (e) {}` with no explanatory comment.",
            "false": "The promise has `.catch(...)`, `.then(onOk, onErr)` or a try/catch inside its async body; the callee returns a `Result`, `ResultAsync` or a tagged status object and so cannot reject; the callee is defined outside `hunk` and nothing visible shows it can reject; `void` on calls that cannot reject or handle their own errors (haptics, loggers, navigation, share sheet, clipboard, `preventAutoHideAsync`, functions the hunk shows catching internally); a catch that returns the function's documented failure value (`catch { return null }` in a parser); an empty catch carrying a comment explaining why the failure is expected and harmless."
          },
          "appliesTo": [],
          "when": "void\\s|catch|\\.finally\\(|\\.then\\(|noop|ignore",
          "message": "A background promise or empty catch may hide a real network, storage or wallet failure."
        },
        {
          "id": "doc/docs/review/contributor-conventions/direct-network-call-outside-transport",
          "section": "net/transport",
          "instructions": "In code that has a domain transport module available to it (the app and its feature modules), does `hunk` call `fetch(`, `axios`, `XMLHttpRequest` or `new WebSocket(` directly from a screen, component, hook or feature module rather than going through that transport (apiClient, safeFetch, the Nostr facade)?",
          "criteria": {
            "true": "A raw `fetch`/`axios`/`XMLHttpRequest`/`new WebSocket` call appears in an app UI screen, component, hook or feature module.",
            "false": "The file is itself the transport or client module for one service (apiClient, safeFetch, a `*Client.ts` or `api.ts` owning one external API), or a small function that is the single client for one endpoint; the request goes through such a module; code outside the app runtime — a build or command-line script, a standalone website or developer tool page — where no such transport exists; e2e or test-harness code; `fetch` of a local `file://` or bundled asset."
          },
          "appliesTo": [],
          "when": "fetch\\(|axios|XMLHttpRequest|new WebSocket|\\.request\\(|apiClient",
          "message": "A screen-local network call bypasses the domain transport that owns cancellation and deadlines."
        },
        {
          "id": "doc/docs/review/contributor-conventions/request-without-deadline",
          "section": "net/transport",
          "instructions": "In code that ships to users or runs unattended (the app, its packages, release or CI automation), does `hunk` start a request to a remote service (`fetch`, `axios`, a client call) that has neither caller cancellation (an AbortSignal) nor a bounded timeout?",
          "criteria": {
            "true": "A request call site to a remote service passes no `signal`, no `AbortController`, and no timeout/deadline option, and `hunk` is the place that could set one.",
            "false": "A `signal` or `AbortController` is threaded through, or a timeout/deadline option is set; the call delegates to a transport module that the hunk shows threading a signal or timeout; the call goes through an interface that cannot take a signal and `hunk` is not that interface's implementation; the peer is a loopback or same-origin server that the same test or developer tool started, so the runner's own timeout is the deadline; the code only ever runs under a test runner or a developer-run tool (tests, e2e harness, a local tooling page); `fetch` is mocked; local asset reads."
          },
          "appliesTo": [],
          "when": "fetch\\(|axios|\\.request\\(|new WebSocket|signal|timeout",
          "message": "A request with no AbortSignal or timeout can hang indefinitely."
        },
        {
          "id": "doc/docs/review/contributor-conventions/retry-side-effecting-operation",
          "section": "net/retries",
          "instructions": "Does `hunk` retry — via a loop, backoff helper or re-invocation after failure — an operation whose repeat could duplicate an effect (payment, melt, mint, swap, send, publish or other non-idempotent write), or retry anything with no bound on attempts in either the loop header or its body?",
          "criteria": {
            "true": "A retry loop, recursive re-invocation or backoff wrapper around a call that spends, melts, mints, swaps, sends or publishes and may already have happened; or any retry construct with no maximum attempt count anywhere in its header or body.",
            "false": "Bounded retries of idempotent reads (GETs, quote or proof-state checks, metadata fetches) with backoff; bounded re-preparation of an operation that has not yet executed; reconciling a failed side effect by checking persisted or mint state; a bounded new attempt — a new quote or a smaller amount — made only after persisted or mint state shows the previous attempt did not execute; resending the same already-signed Nostr event; a bounded retry of an idempotent write whose repeat cannot duplicate anything (a content-addressed upload, a PUT of the same resource); a `for (;;)` or `while (true)` whose body enforces a maximum attempt count."
          },
          "appliesTo": [],
          "when": "retry|Retry|backoff|Backoff|attempt|Attempt|again|resend|republish",
          "message": "Retrying a payment or other write may repeat an operation that already happened."
        },
        {
          "id": "doc/docs/review/contributor-conventions/untrusted-input-cast-not-parsed",
          "section": "input/parse-at-boundary",
          "instructions": "Does `hunk` contain the point where data an outside party controls — a network, relay or mint response, `JSON.parse` of such text, a storage read an older app version may have written, QR, clipboard, NFC or deep-link data, another app, or a native callback payload — first becomes a typed value, and give it a type that asserts unverified facts (`as T`, `as unknown as T`, a declared type with concrete required fields, or a generic `JSON.parse(x) as T` helper), and then rely on a field whose runtime type was never checked, instead of validating it with a Zod schema, a protocol decoder or a per-field guard?",
          "criteria": {
            "true": "A value coming from the network, `JSON.parse`, storage, QR/clipboard/NFC or a native callback is cast with `as` to a type with concrete required fields, or has such fields read directly, and the code then dereferences, persists, builds a filesystem path or storage key from, or passes to native code a field that no `.parse`/`.safeParse`, decoder or guard in the hunk checked. A raw wire type that declares a field as a concrete primitive (`kind: number`) counts as trusting that field.",
            "false": "Validated by a Zod schema (`.parse`/`.safeParse`) or a protocol decoder with typed output (`getDecodedToken`, `nip19.decode`, a bolt11 decoder), in `hunk` or in a helper or injected validator it calls; the value comes from an SDK that already decoded it, and the cast only bridges two typings; casts of trusted in-process values or this app's own typed stores; data this project itself produced in the same process or tool run (its own committed files, its own dev server, output of a tool the code just invoked, a value it serialised a moment earlier); a widening cast to `unknown`, `Record<string, unknown>` or an all-optional/all-`unknown` shape where every field read is then checked — by `typeof`, `Array.isArray`, strict equality with a literal, a regex, a numeric range check, a fail-closed assertion or coercion; a cast that follows a narrowing of the same value; route params used as plain string identifiers; `as` on something that is not data (`require(addon) as T`); a test parsing its subject's own output or a fixture in order to assert on it."
          },
          "appliesTo": [],
          "when": "JSON\\.parse|\\bas\\s+[A-Za-z_$]|getItem|Clipboard|response|\\.json\\(\\)|payload|params|scan|Scan|decode",
          "message": "Untrusted input may be cast to a type instead of validated at the boundary."
        },
        {
          "id": "doc/docs/review/contributor-conventions/parse-treated-as-verification",
          "section": "input/structure-not-trust",
          "instructions": "Does `hunk` treat a successful schema parse or shape check as proof that a Nostr event signature is valid, that an action is authorized, or that Cashu proofs are spendable — skipping signature verification, permission or mint-state checks because the data parsed?",
          "criteria": {
            "true": "Code accepts a parsed event/permission/proof as verified, authorized or spendable with no separate `verifyEvent`/signature check, permission check or proof-state check.",
            "false": "Signatures, permissions or proof states are checked separately; parsed data is only displayed or stored as unverified."
          },
          "appliesTo": [],
          "when": "safeParse|\\.parse\\(|schema|Schema|verif|Verif|\\bsig\\b|proof|Proof|valid|Valid",
          "message": "A successful schema parse may be treated as a valid signature, authorization or spendable proof."
        },
        {
          "id": "doc/docs/review/contributor-conventions/float-math-for-payment-amount",
          "section": "money/exact",
          "instructions": "Does `hunk` compute an amount that decides what is paid, sent, minted or received (sats, msats, proof amounts, fees, invoice amounts) using floating-point BTC math, a fractional fee or percentage factor applied to integer sats, `toFixed`, `parseFloat`, or `Math.round`/`floor`/`ceil` on fractional values, or silently coerce invalid, negative, NaN or fractional input into a valid amount?",
          "criteria": {
            "true": "A value passed to a pay/send/mint/melt/proof-selection path is produced by float arithmetic (`amount * 0.02`, `balance / 1.02`, BTC decimals), `toFixed`, `parseFloat`, rounding of a fractional value, or a fallback that turns NaN/negative/fractional input into a usable amount.",
            "false": "Integer arithmetic on sat or msat integers, including fees in basis points with integer division; conversions used only for display (fiat labels, formatted strings, charts); rounding inside a fiat estimate that never decides what is paid; a single explicit rounding where an amount crosses currencies through an exchange rate (a fiat entry or fiat minor units converted to sats), provided a missing or invalid rate is rejected and the integer result is the amount then shown and confirmed; input validation that rejects invalid values; `Math.ceil` of an integer division for fee reserves in integer sats."
          },
          "appliesTo": [],
          "when": "toFixed|parseFloat|Math\\.(round|floor|ceil)|1e8|100000000|100_000_000|amount|Amount|\\bsats\\b|\\/|\\*",
          "message": "An amount that decides a payment may be computed with floating-point math or coerced from invalid input."
        },
        {
          "id": "doc/docs/review/contributor-conventions/time-value-without-unit",
          "section": "time/units",
          "instructions": "Does `hunk` declare a variable, constant, field or parameter that holds a numeric duration under a name that does not state its unit (`timeout`, `delay`, `ttl`, `interval`), or that holds a timestamp counted in seconds under a name that does not say so (`createdAt = event.created_at`, `expiresAt = Math.floor(Date.now() / 1000) + ttl`)?",
          "criteria": {
            "true": "A numeric duration is declared under a name with no unit such as `Ms`, `Sec`, `Seconds` or `Minutes`, or `hunk` visibly assigns a seconds-valued timestamp to a name that carries no `Sec` or `Seconds`, or documents an in-memory field as seconds (`/** unix seconds */`) under an `…At` name.",
            "false": "Names carry the unit (`timeoutMs`, `createdAtSec`, `ttlSeconds`, `STALE_MS`); a timestamp named `…At` or `timestamp` that holds epoch milliseconds or whose unit `hunk` does not show (`createdAt: number`, `createdAt: Date.now()`, `updatedAt`, `expiresAt`) — milliseconds is the default for those names; Nostr protocol field names (`created_at`, `since`, `until`); a field that keeps the name its mint, Coco or wire-format owner gave it (`expiry` on a quote); a field of a persisted schema (a zod schema or type behind a store's `persist`) that holds seconds and says so in a comment on its declaration — renaming stored data needs a migration, so there the comment carries the unit; `Date` objects; option names fixed by a library (the delay argument of `setTimeout`, `{ timeout }` or `{ duration }` passed to an external API, React Query `staleTime`); a timer handle or a function that is merely named `timeout`, `interval` or `delay` and holds no number; a fixture or call that only fills a field whose name is declared elsewhere (an imported type, a wire or library option); a test or fixture that only fills in such fields."
          },
          "appliesTo": [],
          "when": "timeout|createdAt|expiry|expires|delay|ttl|TTL|staleTime|interval|duration|elapsed|[Ss]econds|[Mm]illis|\\bMs\\b|_ms\\b",
          "message": "A duration without a unit in its name, or a seconds timestamp under a millisecond-style name, invites seconds/milliseconds mix-ups."
        },
        {
          "id": "doc/docs/review/contributor-conventions/secret-outside-secure-storage",
          "section": "secrets/storage",
          "instructions": "Does `hunk` put a mnemonic, seed, private key, nsec or other signing secret that a real user or deployment could hold anywhere other than secure storage — a Zustand store, AsyncStorage or MMKV, route params, a URL, a `testID`, a fixture or a log?",
          "criteria": {
            "true": "A secret value is assigned into store state, written via AsyncStorage/MMKV, embedded in a route param, URL or testID, or a real or realistic private secret (not a published specification vector) is committed as fixture data.",
            "false": "Only public keys, npubs, key ids, pairing metadata without secrets or opaque references are stored; the secret stays in memory and is passed to signing or into expo-secure-store / the key vault module; a deliberately public test vector (a published BIP-39 or NIP-06 mnemonic and the keys derived from it) or an obviously synthetic placeholder (`'fixture-nsec'`, a zeroed byte array) used as test, mock or known-answer input, which no wallet holds; a value held only in a local variable or constant, with no storage, route, URL or log involved."
          },
          "appliesTo": [],
          "when": "mnemonic|Mnemonic|seed|Seed|privateKey|privkey|nsec|secretKey|signingKey|setItem|AsyncStorage|SecureStore",
          "message": "A mnemonic, private key or nsec may be stored outside secure storage."
        },
        {
          "id": "doc/docs/review/contributor-conventions/sensitive-value-logged",
          "section": "secrets/logs",
          "instructions": "Does application or library code in `hunk` emit a diagnostic log, analytics event or error report (via `log.*`, `console.*`, a logger, analytics or an error reporter) with a value that is or contains seed words, a private key, Cashu proofs or an encoded token, a Lightning invoice, DM plaintext, a PIN, raw NFC bytes, or a URL carrying credentials?",
          "criteria": {
            "true": "A logging or telemetry call passes such a value, or an object/whole payload that visibly contains one.",
            "false": "Logs record only counts, amounts, ids, hashes, short fingerprints, mint URLs, states or error codes; a test passing a synthetic secret-shaped value to the logger under test in order to assert that it is redacted; a command-line tool writing the result its operator asked for (a generated key, derived test vectors) to its own stdout, which is the program's output rather than diagnostic logging or telemetry; published test vectors that are not secrets."
          },
          "appliesTo": [],
          "when": "console\\.|log\\.|logger|captureException|analytics|track\\(|Sentry|report",
          "message": "A log may leak seed words, keys, proofs, tokens, invoices, DM contents or credentials."
        },
        {
          "id": "doc/docs/review/contributor-conventions/insecure-randomness",
          "section": "secrets/randomness",
          "instructions": "Does `hunk` use `Math.random`, a time-based value or hand-rolled cryptography to produce a security-relevant value (keys, secrets, nonces, blinding factors, proof secrets, auth tokens, pairing codes)?",
          "criteria": {
            "true": "`Math.random()`, `Date.now()`-derived entropy or a custom crypto routine produces a key, secret, nonce, blinding factor, proof secret, token or pairing code.",
            "false": "`Math.random` used for jitter, animation, UI keys, sampling or placeholders; randomness from expo-crypto, `crypto.getRandomValues`, or @noble/@scure libraries."
          },
          "appliesTo": [],
          "when": "Math\\.random|[Rr]andom|nonce|Nonce|\\buuid\\b|UUID|generateKey|entropy",
          "message": "A security-relevant value may be generated with Math.random or hand-rolled crypto."
        },
        {
          "id": "doc/docs/review/contributor-conventions/mock-data-leaks",
          "section": "mock/isolation",
          "instructions": "Does `hunk` let Mock Mode, demo or fake data flow into Coco, transaction stores, Nostr or query caches, or persisted storage, or let it trigger a real publish, zap or payment?",
          "criteria": {
            "true": "Mock/demo/fake values are written into a real store, query cache or persisted storage, or are passed into a publish/zap/pay call path.",
            "false": "Mock data stays in presentation-only memory gated by the mock flag; test fixtures and e2e harness code."
          },
          "appliesTo": [],
          "when": "mock|Mock|demo|Demo|fake|Fake|stub|Stub|sample|placeholder|dummy",
          "message": "Mock or demo data may enter real stores, caches or persistence, or trigger a real publish or payment."
        },
        {
          "id": "doc/docs/review/contributor-conventions/payment-logic-in-app-layer",
          "section": "arch/owner",
          "instructions": "Does a file under `app/` in `hunk` itself perform the computation of a payment — decide the order of mint, melt, swap or receive operations (prepare, verify, execute, recover), choose proofs or amounts to spend, poll wallet history to reconcile an operation, expand a route into executed legs, or loop or retry a payment call automatically — rather than calling a wallet API?",
          "criteria": {
            "true": "An `app/` file contains proof selection, melt/mint/swap/receive ordering, change handling, history reconciliation or automatic payment retry logic written out in its own code rather than calling a wallet API.",
            "false": "The `app/` code only calls a wallet API and renders or navigates on the result; constructing a wallet-package engine or machine with injected ports or callbacks and mirroring its outcome into UI state; a user-tapped retry that calls the same wallet API again; busy or re-entrancy guards; a sheet or menu that displays wallet-computed options and forwards the choice; payment vocabulary that appears only in names (a proof selector sheet, an orchestrator hook) while the work is delegated; device I/O, native bridges and screen glue; the file lives under `wallet/`."
          },
          "appliesTo": [
            "app/**"
          ],
          "when": "melt|Melt|mintQuote|swap|Swap|selectProofs|proof|Proof|\\bmint\\b|Mint|counter|keyset",
          "message": "Payment sequencing or proof handling may be living in the app layer instead of wallet/."
        },
        {
          "id": "doc/docs/review/contributor-conventions/domain-imports-app",
          "section": "arch/owner",
          "instructions": "Does `hunk` add an import of an app module, Expo navigation (`expo-router`, `@react-navigation/*`) or an app store into a file under `wallet/` or `nostr/`?",
          "criteria": {
            "true": "A new import in `wallet/**` or `nostr/**` resolves to `app/...`, `expo-router`, `@react-navigation/*` or an app-level store.",
            "false": "Imports are limited to domain, shared protocol or third-party libraries; the file is not under `wallet/` or `nostr/`."
          },
          "appliesTo": [
            "wallet/**",
            "nostr/**",
            "copy/**"
          ],
          "when": "\\bimport\\b|\\brequire\\(|\\bfrom\\b",
          "message": "A wallet/ or nostr/ module importing app modules couples the domain to the UI layer."
        },
        {
          "id": "doc/docs/review/contributor-conventions/verb-contradicts-body",
          "section": "naming/verbs",
          "instructions": "Does `hunk` define a function whose leading verb contradicts its visible body: `get*` that is async or does network/storage I/O, `fetch*` that performs no network read, `load*` that reads the network instead of local persistence, `build*`/`compute*` with side effects its caller can observe (state or store mutation, persistence, network, navigation, mutating an argument), `format*` returning something other than display text, or `parse*` that decodes nothing?",
          "criteria": {
            "true": "A function definition in the hunk has a leading verb whose body visibly does something else, as listed above.",
            "false": "The body matches the verb; `get*` returning a cached or in-memory value synchronously; a diagnostic log or metric call inside an otherwise pure `build*`/`compute*`; React hooks (`use*`); names imposed by an interface, library or protocol; the function body is not visible in the hunk."
          },
          "appliesTo": [],
          "when": "\\b(get|fetch|load|build|compute|format|parse|is|has|to)[A-Z]\\w*\\s*[=(]",
          "message": "A function's leading verb may not match what its body does (e.g. `get*` doing network I/O)."
        },
        {
          "id": "doc/docs/review/contributor-conventions/bare-protocol-name",
          "section": "naming/protocol",
          "instructions": "Does `hunk` declare a new variable, field, parameter or prop holding a protocol value under a bare generic name — `token`, `secret`, `pubkey`, `quote`, `invoice` — where nothing nearby (enclosing type, function or module name, or the value's own initialiser) makes its kind and encoding clear?",
          "criteria": {
            "true": "A new declaration uses one of those bare names for a Cashu, Nostr or Lightning value with no disambiguating container, type name or initialiser visible.",
            "false": "Names state meaning (`cashuTokenEncoded`, `nostrPubkeyHex`, `mintQuoteId`, `lnInvoiceBolt11`); the name is scoped by its container (`quote.id` on a `MintQuote`, `event.pubkey`, `pubkey` inside `NostrProfile`); field names fixed by a protocol, SDK or wire format; destructured SDK fields; a short-lived local whose initialiser on the same line shows its kind and encoding (a `cashuB…` or `lnbc…` literal), or that is named to match the shorthand property of an existing API (`{ token, amount }`)."
          },
          "appliesTo": [],
          "when": "\\b(token|secret|pubkey|quote|invoice|key|id|hash|address)\\b",
          "message": "A protocol value named `token`, `secret`, `pubkey`, `quote` or `invoice` hides its kind and encoding."
        },
        {
          "id": "doc/docs/review/contributor-conventions/new-identifier-regex",
          "section": "naming/protocol",
          "instructions": "Does `hunk` introduce a regular expression that validates or classifies a value as a Nostr, Cashu or Lightning identifier (npub, nsec, note, nevent, cashu token, lnbc invoice, hex pubkey or event id), or redacts one, when an equivalent shared matcher already exists in this codebase — `protocolIds` for 64-hex ids and Cashu P2PK keys, the logger's secret patterns for redaction — instead of reusing it?",
          "criteria": {
            "true": "A regex literal or `new RegExp` targeting one of those identifier formats is introduced in the hunk and duplicates a matcher the codebase already shares, so the two copies can drift.",
            "false": "The code reuses `protocolIds` or an existing shared matcher; no equivalent shared matcher exists for that format; the regex matches something unrelated to protocol identifiers, or classifies only a family (is this string lower-case bech32?); the hunk is the `protocolIds` module itself or the module that owns the shared redaction patterns."
          },
          "appliesTo": [],
          "when": "npub|nsec|note1|nevent|naddr|lnbc|lnurl|cashu|new RegExp|/\\^|\\.test\\(|\\.match\\(",
          "message": "A new regex for Nostr, Cashu or Lightning identifiers duplicates the shared protocolIds patterns."
        },
        {
          "id": "doc/docs/review/contributor-conventions/native-tabs-dynamic-triggers",
          "section": "skill/expo-router/native-tabs-static-triggers",
          "instructions": "Does `hunk` render `NativeTabs.Trigger` elements whose set can change at runtime — conditional rendering (`cond && <NativeTabs.Trigger>`, a ternary) or mapping over an array derived from state, props or runtime data?",
          "criteria": {
            "true": "A `NativeTabs.Trigger` is wrapped in a runtime condition, or produced by `.map` over a value derived from state, props, a query or a feature flag.",
            "false": "A literal list of triggers; triggers hidden with the `hidden` prop; `.map` over a module-level constant array of tab definitions."
          },
          "appliesTo": [
            "**/*.tsx",
            "**/*.jsx"
          ],
          "when": "NativeTabs|\\.Trigger\\b|tabBar|Tabs",
          "message": "Tab triggers whose set changes at runtime remount the navigator and lose state."
        },
        {
          "id": "doc/docs/review/contributor-conventions/native-tab-icon-missing-android",
          "section": "skill/expo-router/native-tab-icon-md-prop",
          "instructions": "Does `hunk` add a NativeTabs trigger icon that has an `sf` prop but no `md`, `src`, `drawable` or `xcasset` alternative?",
          "criteria": {
            "true": "An `<Icon sf=...>` (or equivalent NativeTabs icon) is added with no Android-capable source prop alongside it.",
            "false": "The icon also supplies `md`, `src`, `drawable` or `xcasset`; the NativeTabs branch sits behind an iOS-only capability check with another tab bar serving Android."
          },
          "appliesTo": [
            "**/*.tsx",
            "**/*.jsx"
          ],
          "when": "NativeTabs|\\bsf=|\\bsf:|tabBarIcon|VectorIcon|\\bIcon\\b",
          "message": "A NativeTabs icon with only an SF Symbol may not render on Android."
        },
        {
          "id": "doc/docs/review/contributor-conventions/modal-instead-of-route",
          "section": "skill/expo-router/prefer-native-modal-presentation",
          "instructions": "Does `hunk` add a React Native `<Modal>` (from 'react-native') to present screen-like content — a page the user navigates to with its own data, deep link or back-stack entry — instead of a route with `presentation: \"modal\"` or `\"formSheet\"`?",
          "criteria": {
            "true": "A `<Modal>` from react-native wraps a full screen with its own data loading, navigation or multi-step flow.",
            "false": "A route with `presentation: \"modal\"` or `\"formSheet\"` is used; the Modal is a transient dialog or prompt (one short field with Cancel/Save, a confirmation) over the current screen editing unsaved in-memory draft state; no Modal is added."
          },
          "appliesTo": [
            "**/*.tsx",
            "**/*.jsx"
          ],
          "when": "Modal|presentation|formSheet|[Ss]heet|[Oo]verlay",
          "message": "Screen-like content presented in a React Native Modal loses deep links and back-stack behaviour."
        },
        {
          "id": "doc/docs/review/contributor-conventions/stack-outside-layout",
          "section": "skill/expo-router/stacks-defined-in-layout-files",
          "instructions": "Does `hunk` show a route or screen component — one rendered as a page — mounting its own `<Stack>` navigator element (with children, `screenOptions`, or bare) in a file that is not a `_layout` file?",
          "criteria": {
            "true": "A `<Stack>` navigator element itself (not `<Stack.Screen>` or another `Stack.` sub-component) is rendered by a page component in a non-`_layout` file, and nothing in the hunk shows the component is a shared layout used by `_layout` files.",
            "false": "The file is a `_layout` file; the component is documented as a shared layout rendered by `_layout` files; a reusable navigator wrapper that takes `children` (the `Stack.Screen` declarations its importers supply) and is not itself a route; the file only uses `Stack.Screen`, `Stack.Toolbar`, `Stack.SearchBar` or similar sub-components to configure itself — `<Stack.` followed by a sub-component name is never a navigator."
          },
          "appliesTo": [
            "**/*.tsx",
            "**/*.jsx"
          ],
          "when": "<Stack\\b|Stack\\.Screen|screenOptions|createNativeStackNavigator",
          "message": "A Stack navigator outside a `_layout` file won't be wired into file-based routing correctly."
        },
        {
          "id": "doc/docs/review/contributor-conventions/js-tabs-instead-of-native",
          "section": "skill/expo-router/prefer-native-tabs",
          "instructions": "Does `hunk` add a JS tab navigator (`Tabs` from `expo-router` or `@react-navigation/bottom-tabs`) as the only tab bar?",
          "criteria": {
            "true": "`<Tabs>` from expo-router or bottom-tabs is rendered as the app's tab bar with no NativeTabs branch present.",
            "false": "The layout renders NativeTabs where supported and uses JS `Tabs` only as a fallback for platforms or OS versions without them; headless tabs from `expo-router/ui` in a `.web.tsx` file."
          },
          "appliesTo": [
            "**/*.tsx",
            "**/*.jsx"
          ],
          "when": "Tabs|tabBar|NativeTabs|createBottomTabNavigator",
          "message": "A JS tab navigator is used where NativeTabs would give a native tab bar."
        },
        {
          "id": "doc/docs/review/contributor-conventions/failed-read-rendered-as-empty",
          "section": "ui/read-states",
          "instructions": "Does `hunk` render an async-loaded list or value so that, when the read fails or is unavailable, the user is shown the same explicit empty state (`Nothing here yet`, `No results`, an empty list) as for a successful empty result, with no distinct error branch?",
          "criteria": {
            "true": "The render branches only on emptiness/loading, so a failed read ends in the empty or none state — a catch that only logs, or a recorded `failed` flag the render never consults — with no separate error branch.",
            "false": "Separate error, empty and loading branches exist; the data is static or synchronous; a failed background refresh that keeps showing last-known or derived data, with no empty state involved; optional enrichment (a name, avatar or metadata lookup) that falls back to the un-enriched value while the primary content and action still work."
          },
          "appliesTo": [
            "**/*.tsx",
            "**/*.jsx"
          ],
          "when": "isError|error|isLoading|isPending|empty|Empty|data\\?|undefined|null",
          "message": "A failed or unavailable read may be shown as a genuinely empty result."
        },
        {
          "id": "doc/docs/review/contributor-conventions/rows-replaced-while-refreshing",
          "section": "ui/read-states",
          "instructions": "Does `hunk` replace already-rendered rows with a spinner, skeleton or empty state while a refresh of the same query is in flight or after that refresh fails?",
          "criteria": {
            "true": "A refetch/refresh flag (`isFetching`, `isRefetching`, a local `refreshing`) gates the whole list so existing rows unmount while the same data is re-fetched, or an error after a successful load clears the rows.",
            "false": "Cached rows stay visible during refetch with an inline refresh indicator; only the first load shows a skeleton; rows cleared because the query's inputs changed (a different account, unit, filter or profile), so the old rows would be wrong data; static or synchronous data."
          },
          "appliesTo": [
            "**/*.tsx",
            "**/*.jsx"
          ],
          "when": "isFetching|isRefetching|refreshing|Skeleton|Spinner|isLoading|isPending",
          "message": "Rows already on screen may be replaced by a spinner or empty state while refreshing."
        },
        {
          "id": "doc/docs/review/contributor-conventions/unknown-count-rendered-as-zero",
          "section": "ui/unknown-values",
          "instructions": "Does `hunk` display a count, total or amount whose source can be unknown or not yet loaded (a pending query, a remote count, a store still hydrating) as `0` — a `?? 0` or `|| 0` whose result feeds rendered text?",
          "criteria": {
            "true": "A possibly-undefined count/total/amount from a source that can still be loading or unknown is defaulted to 0 and that value is rendered in the UI.",
            "false": "Unknown values stay `undefined` and render a placeholder, skeleton or dash; `?? 0` used in arithmetic that is not displayed, or for values that are zero by definition when absent (length of a local list, a missing key in a locally computed tally, histogram or per-item balance map); a default that cannot be reached because the enclosing render branch is already guarded on the value being defined."
          },
          "appliesTo": [
            "**/*.tsx",
            "**/*.jsx"
          ],
          "when": "\\?\\?|\\|\\||count|Count|length|total|Total",
          "message": "A not-yet-loaded count may be displayed as 0 instead of a placeholder."
        },
        {
          "id": "doc/docs/review/contributor-conventions/premature-image-fallback",
          "section": "ui/unknown-values",
          "instructions": "Does `hunk` show an image fallback that asserts there is no image (initials, a silhouette, a generic or seeded avatar) whenever the source is merely not loaded yet, rather than once it is known to be missing or to have failed?",
          "criteria": {
            "true": "The fallback renders on a falsy/undefined source or during loading, without an error, loading-flag or resolved-missing state check.",
            "false": "The fallback is driven by `avatarStateFor` or an equivalent load-state check (`onError`, resolved-missing, a ternary that tests a loading flag before choosing the fallback: `isLoading ? 'loading' : url ? 'image' : 'fallback'`), or a neutral placeholder is shown while loading; progressive enhancement where the interim visual is the same content at lower fidelity (a static glyph before its animated version, a blurhash or thumbnail before the full image)."
          },
          "appliesTo": [
            "**/*.tsx",
            "**/*.jsx"
          ],
          "when": "avatar|Avatar|initials|fallback|Fallback|<Image|placeholder|onError",
          "message": "An avatar or image fallback may show before the source is known to be missing or failed."
        },
        {
          "id": "doc/docs/review/contributor-conventions/dishonest-loading-ui",
          "section": "ui/honest-loading",
          "instructions": "Does `hunk` keep loading UI up for a minimum time after data is ready, mount a second list only to crossfade from a placeholder list, or keep a loading animation running after the operation has failed?",
          "criteria": {
            "true": "A timer or minimum-duration delay gates the skeleton/spinner, a duplicate list is mounted purely to crossfade, or an animation continues in the error branch.",
            "false": "Loading UI is tied directly to the real pending state and stops on error; design-system catalogue or stress screens under `features/settings`."
          },
          "appliesTo": [
            "**/*.tsx",
            "**/*.jsx"
          ],
          "when": "Skeleton|skeleton|setTimeout|crossfade|fade|isLoading|Spinner|isPending|shimmer",
          "message": "Loading UI may stay up past the real pending state or keep animating after a failure."
        },
        {
          "id": "doc/docs/review/contributor-conventions/hardcoded-chrome-height",
          "section": "ui/insets",
          "instructions": "Does `hunk` hard-code a tab-bar, footer, header or home-indicator height as a numeric padding, margin or offset (e.g. `paddingBottom: 83`, `+ 49`) standing in for that chrome?",
          "criteria": {
            "true": "A numeric literal representing system or app chrome height is used in layout spacing.",
            "false": "Insets come from `useScreenInsets` or `Screen`; the component itself owns that chrome (the tab bar, a root overlay, a sheet host) and applies the inset once; ordinary layout spacing unrelated to system chrome."
          },
          "appliesTo": [
            "**/*.tsx",
            "**/*.jsx"
          ],
          "when": "padding|margin|bottom:|top:|height:|tabBar|footer|Footer|header|Header|insets",
          "message": "A hard-coded tab, footer, header or home-indicator height will drift from real device chrome."
        },
        {
          "id": "doc/docs/review/contributor-conventions/duplicate-safe-area-padding",
          "section": "ui/insets",
          "instructions": "Does `hunk` apply `useSafeAreaInsets()` padding inside a screen component that is already wrapped by `Screen` or uses `useScreenInsets`?",
          "criteria": {
            "true": "A screen body reads `useSafeAreaInsets()` and adds it as padding or margin while `Screen`/`useScreenInsets` is also present in the hunk.",
            "false": "Insets come only from `useScreenInsets` or `Screen`; the component is itself the chrome owner (tab bar, root overlay, sheet host) applying the inset once."
          },
          "appliesTo": [
            "**/*.tsx",
            "**/*.jsx"
          ],
          "when": "useSafeAreaInsets|SafeArea|insets|paddingTop|paddingBottom",
          "message": "Safe-area padding may be applied twice inside a screen that Screen already pads."
        },
        {
          "id": "doc/docs/review/contributor-conventions/local-replacement-for-shared-ui",
          "section": "ui/shared-parts",
          "instructions": "Does `hunk` introduce a local replacement for a shared UI part — a third-party or inline SVG icon instead of the `Icon` registry, `ActivityIndicator` or a hand-rolled spinner instead of `Spinner`, a custom checkmark instead of `SelectableCheck`, a hard-coded `fontFamily` string instead of `Text` weight props, or a hard-coded hex/rgb UI color where a semantic theme token exists?",
          "criteria": {
            "true": "One of those local substitutes appears in the added code.",
            "false": "Uses `Icon`, `Spinner`, `SelectableCheck`, `Button`, `Text`, `useThemeColor` or semantic tokens; colors that are data or artwork (wallpapers, brand marks, colors from images, chart palettes, QR codes); black/white scrims, shadows and overlays over media; `transparent`; the shared primitive implementations themselves; design-system catalogue and stress screens under `features/settings`."
          },
          "appliesTo": [
            "**/*.tsx",
            "**/*.jsx"
          ],
          "when": "ActivityIndicator|fontFamily|#[0-9a-fA-F]{3,8}|rgba?\\(|lucide|vector-icons|<Svg|<Path|color:",
          "message": "A local icon, spinner, checkmark, font or color replaces a shared UI primitive or theme token."
        },
        {
          "id": "doc/docs/review/contributor-conventions/block-sets-own-vertical-margin",
          "section": "ui/block-margins",
          "instructions": "Does `hunk` define a self-contained block component for screens to stack (card, notice, banner, QR block, selector, copy row) whose outermost element sets its own top or bottom margin (`mt-*`, `mb-*`, `my-*`, `marginTop`, `marginBottom`, `marginVertical`)?",
          "criteria": {
            "true": "The root element of such a block component carries a vertical margin class or style, including a margin computed from a prop that exists only to describe its neighbour (`hasText`, `isFirst`).",
            "false": "The root sets only horizontal insets (`mx-4`) or takes outer spacing from a `className`/`style` prop; margins only on inner elements; a component that is the row of a virtualized list (rendered from `renderItem`), since the list cannot supply a gap between rows; a screen or page component laying out its own sections; design-system catalogue screens under `features/settings`."
          },
          "appliesTo": [
            "**/*.tsx",
            "**/*.jsx"
          ],
          "when": "m[tby]-\\d|marginTop|marginBottom|marginVertical|gap-|paddingVertical",
          "message": "A stackable block setting its own top/bottom margin fixes its spacing regardless of parent."
        },
        {
          "id": "doc/docs/review/contributor-conventions/platform-check-for-glass",
          "section": "ui/platform",
          "instructions": "Does `hunk` decide whether to render a glass, blur, frosted or liquid-glass layer, style or component rather than a flat fallback by comparing `Platform.OS`, `Platform.select` or an iOS version, instead of using the capability hook or `defineVariants`?",
          "criteria": {
            "true": "A `Platform.OS`/`Platform.select`/version comparison selects a glass, blur or liquid-glass style or component in code that consumes it.",
            "false": "A capability hook or `defineVariants` chooses the variant; `.ios.tsx`/`.android.tsx` splits; code that itself defines or exports an availability or capability check, or guards the `require` of a platform-only native module (`isSupported` derived from the platform and OS version); `Platform` checks for genuine non-glass behaviour differences (keyboard, haptics, permissions, map providers, native APIs, font metrics, shadow vs elevation, status bar)."
          },
          "appliesTo": [
            "**/*.tsx",
            "**/*.jsx"
          ],
          "when": "Platform\\.(OS|select)|[Gg]lass|[Bb]lur",
          "message": "Glass or blur variants chosen by Platform.OS bypass the capability hook."
        },
        {
          "id": "doc/docs/review/contributor-conventions/ios-only-static-import",
          "section": "ui/platform",
          "instructions": "Does `hunk` add a top-level value import (not `import type`) of a package whose JavaScript entry unconditionally requires an iOS-only native module or SwiftUI view (`@expo/ui/swift-ui`, `@expo/ui/swift-ui/modifiers`, `expo-glass-effect`) in a cross-platform module that Android also loads?",
          "criteria": {
            "true": "A top-level value `import` of an iOS-only native package appears in a file that exports cross-platform code — no `.ios` extension, no platform or capability variant suffix, and no guarded lazy require.",
            "false": "The file is `.ios.tsx`, or is itself a platform or capability variant that only an `.ios` entry registers (`X.liquid.tsx` reached from `index.ios.ts`); the import is `import type`; the imported module is a wrapper that guards its native require with a platform check and provides a fallback; the module is loaded through a guarded lazy `require`; `hunk` shows usage of such a component but no import statement; the import is cross-platform."
          },
          "appliesTo": [
            "**/*.tsx",
            "**/*.jsx"
          ],
          "when": "@expo/ui|swift-ui|SwiftUI|liquid|Glass|Platform\\.OS|\\bimport\\b",
          "message": "An iOS-only native import at module top level can crash Android loads of that module."
        },
        {
          "id": "doc/docs/review/contributor-conventions/action-can-double-submit",
          "section": "ui/single-submit",
          "instructions": "Does `hunk` add a pay, send, confirm, submit or publish action whose handler commits the side effect and has no re-entry protection — no single-flight guard, no busy/disabled state from the owner, no state-machine phase check — or relies only on a debounce or timer?",
          "criteria": {
            "true": "A handler that itself pays, sends, publishes or submits is attached with nothing in the hunk preventing a second invocation while the first is in flight, or only a debounce/throttle guards it.",
            "false": "The shared `Pressable` or `Button` with an async handler (their single-flight guard drops re-entry); `disabled={busy}` driven by the owning state; a state-machine guard, including a dispatch into a machine that ignores or supersedes a repeated event; `useSingleFlight`; a handler that only opens or seeds a flow that still requires confirmation before anything is paid or sent, whatever its label says; actions without side effects (navigation, toggles, opening sheets, copying)."
          },
          "appliesTo": [
            "**/*.tsx",
            "**/*.jsx"
          ],
          "when": "onPress|onSubmit|handlePay|handleSend|handleSubmit|publish|onValueChange",
          "message": "A pay, send or submit handler may run twice on a fast double tap."
        },
        {
          "id": "doc/docs/review/contributor-conventions/permission-requested-at-startup",
          "section": "ui/permissions",
          "instructions": "Does `hunk` request a camera, NFC, location, contacts, notifications, Bluetooth or clipboard permission on mount or at startup rather than in the handler for the related user action, or ignore the denied/unavailable result?",
          "criteria": {
            "true": "A `request*Permission` call runs in a mount effect or module init, or its result is not branched on for denied/unavailable states.",
            "false": "The request runs in the handler for the user action, or on a screen whose whole purpose the user just chose (scanner, map, nearby-payments) with denied and unavailable UI; checking permission status without requesting it."
          },
          "appliesTo": [
            "**/*.tsx",
            "**/*.jsx"
          ],
          "when": "[Pp]ermission|useEffect|request[A-Z]",
          "message": "A permission may be requested on mount instead of when the user starts the related action."
        },
        {
          "id": "doc/docs/review/contributor-conventions/concatenated-ui-copy",
          "section": "copy/sentences",
          "instructions": "Does `hunk` build user-visible text by appending an English plural ending (`\"reply\" + (n === 1 ? \"\" : \"s\")`) or by concatenating separately written fragments of one sentence with `+` or across adjacent text nodes?",
          "criteria": {
            "true": "Displayed text is assembled from sentence fragments joined with `+`, or a plural `\"s\"` is appended conditionally.",
            "false": "One template or string per sentence with interpolated values; choosing between whole words or whole sentences by count (`n === 1 ? \"1 reply\" : ...`); a value and its caption laid out as separate UI elements; non-user-visible strings (logs, testIDs, keys)."
          },
          "appliesTo": [
            "**/*.tsx",
            "**/*.jsx"
          ],
          "when": "\\+\\s*['\"]|['\"]\\s*\\+|\\$\\{|\\bplural|\\bs['\"]|join\\(",
          "message": "UI text built by concatenating fragments or appending plural endings breaks for real copy."
        },
        {
          "id": "doc/docs/review/contributor-conventions/value-shortened-by-slicing",
          "section": "copy/truncation",
          "instructions": "Does `hunk` shorten an amount, fee, recipient, npub/pubkey, mint URL or host, invoice, token or recovery step with string slicing (`slice`, `substring`, a character-cutting truncate helper), disable font scaling or use `adjustsFontSizeToFit` to fit such a value, or copy/sign/submit/compare a shortened value?",
          "criteria": {
            "true": "One of those values is cut with string slicing or squeezed with `adjustsFontSizeToFit`/`allowFontScaling={false}`, or a sliced value is passed to copy, sign, submit or comparison.",
            "false": "Display shortening with `numberOfLines` and `ellipsizeMode` (including `\"middle\"`) on the full value; an authored short label; slicing text that is not one of those values (post previews, display names, search snippets, event-id fingerprints used as keys or logs); copy/sign/compare actions using the full value."
          },
          "appliesTo": [
            "**/*.tsx",
            "**/*.jsx"
          ],
          "when": "\\.slice\\(|\\.substring\\(|substr\\(|truncate|ellipsi|numberOfLines|adjustsFontSizeToFit|allowFontScaling",
          "message": "Slicing an amount, address, invoice or recovery step can cut a value users must read or copy in full."
        },
        {
          "id": "doc/docs/review/contributor-conventions/copy-overclaims-state",
          "section": "copy/honest",
          "instructions": "Does `hunk` show UI text claiming more security, privacy, delivery or settlement than the visible state establishes — \"Delivered\", \"Private\", \"Encrypted\", \"Paid\" for a pending, accepted-only or unknown state?",
          "criteria": {
            "true": "A label asserting a terminal or protective property is rendered for a state the hunk shows as pending, accepted, sent or unknown.",
            "false": "Copy matches the state (\"Sent\", \"Pending\", \"Unconfirmed\"); the claim is guarded by a verified/settled state check; developer and debug screens."
          },
          "appliesTo": [
            "**/*.tsx",
            "**/*.jsx"
          ],
          "when": "Delivered|Private|Encrypted|Paid|Secure|Confirmed|Protected|Sent|Complete",
          "message": "UI text may claim delivery, settlement, privacy or security the visible state doesn't establish."
        },
        {
          "id": "doc/docs/review/contributor-conventions/raw-error-shown-to-user",
          "section": "copy/honest",
          "instructions": "Does `hunk` put a raw `error.message`, stack trace, Zod issue list or server response body into rendered UI text?",
          "criteria": {
            "true": "A caught error's message/stack, `.issues`, or a response body string is rendered directly in a Text element, toast or alert.",
            "false": "Errors go through a user-message formatter or error catalog before display; the message is only logged; developer and debug screens."
          },
          "appliesTo": [
            "**/*.tsx",
            "**/*.jsx"
          ],
          "when": "\\.message|\\.issues|stack|responseBody|String\\(|error|Error",
          "message": "A raw error message, stack trace, Zod issue or server response may be rendered on screen."
        },
        {
          "id": "doc/docs/review/contributor-conventions/control-without-accessible-name",
          "section": "a11y/controls",
          "instructions": "Does `hunk` render an interactive control (`onPress`, `onLongPress`, `onValueChange`, `onChangeText`) with no accessible name — no `accessibilityLabel` and no visible text inside it?",
          "criteria": {
            "true": "A pressable/icon-only control is added with a handler but no `accessibilityLabel` and no child text.",
            "false": "The control has `accessibilityLabel` or visible text; a shared component (`Button`, `ListItem`, `SelectableCheck`, `CircleActionButton`) whose props carry the label; a wrapper forwarding accessibility props from its own props; non-interactive views; gesture-only surfaces with an accessible alternative."
          },
          "appliesTo": [
            "**/*.tsx",
            "**/*.jsx"
          ],
          "when": "onPress|onLongPress|onValueChange|onChangeText|accessibilityLabel|aria-label",
          "message": "An interactive control may have no accessible name for VoiceOver."
        },
        {
          "id": "doc/docs/review/contributor-conventions/testid-from-index-or-text",
          "section": "a11y/controls",
          "instructions": "Does `hunk` pass to a component's `testID` prop a value that interpolates the index of a data-driven list whose items have their own id, or free or remote display copy — a title, display name, translated label or a slugified label — rather than entity identity?",
          "criteria": {
            "true": "A `testID` being assigned interpolates a map index or array position of items that carry an id, or a user-visible label/title string, when a stable id exists or could be declared.",
            "false": "The testID derives from entity identity (`mint-row-${mintUrl}`); the interpolated value is the item's own key — a member of a closed literal union, `as const` list or enum that the code compares against for selection, even if it is also rendered; the ordinal of a fixed-geometry part (segment, slot, step, page, keypad digit), or a positional slot (`backup-choice-${index}`) where the only other identity is secret material such as recovery-phrase words; a testID forwarded from props; a React `key`; test code that looks a testID up rather than assigning one; the testID is a fixed literal."
          },
          "appliesTo": [
            "**/*.tsx",
            "**/*.jsx"
          ],
          "when": "testID|accessibilityLabel",
          "message": "A testID built from a list index or display text is not stable across data or copy changes."
        },
        {
          "id": "doc/docs/review/contributor-conventions/nested-interactive-control",
          "section": "a11y/nested-controls",
          "instructions": "Does `hunk` place an element with `onPress`/`onLongPress` (or a nested `Pressable`, `PressableFeedback`, `Button`, `Switch`) inside another accessible `Pressable`/touchable, or inside a container `View` marked `accessible`, so that one of the two controls cannot be activated?",
          "criteria": {
            "true": "The JSX shows a pressable or switch rendered as a descendant of another pressable or of an `accessible` container — including an `accessible` wrapper with a button or image role around a native or hosted button when nothing forwards activation to its handler.",
            "false": "The controls are siblings; the outer element sets `accessible={false}`; the inner element is purely visual with no press handler; the outer element is a plain `View` without `accessible` or a gesture detector; an `accessible` container wrapping only static text; a container that is itself the single control and forwards activation inward to the same handler (`onAccessibilityTap`, `onAccessibilityAction` or its own `onPress`)."
          },
          "appliesTo": [
            "**/*.tsx",
            "**/*.jsx"
          ],
          "when": "Pressable|Touchable|accessible|<Switch|onPress|<Button",
          "message": "An interactive control nested inside another accessible control becomes unreachable on iOS."
        },
        {
          "id": "doc/docs/review/contributor-conventions/timer-runs-offscreen",
          "section": "perf/offscreen",
          "instructions": "Does `hunk` start a repeating timer, polling loop or infinite animation (`withRepeat(…, -1)`, `Animated.loop`, `setInterval`, a `requestAnimationFrame` loop) in a screen or list row that can keep firing indefinitely — it has no deadline, or its stop condition may never occur — because nothing pauses it when the screen loses focus, the app is backgrounded or the row leaves view?",
          "criteria": {
            "true": "Such a loop is started with no `useIsFocused`, `useFocusEffect`, `useVisualActivityEffect`, AppState or visibility-prop gating visible, and it runs for as long as the component stays mounted or a remote state stays unchanged (a countdown on a quote that may never be paid).",
            "false": "Focus, visibility or AppState gating is present; animations have a finite repeat count; loops run only while an operation is pending and stop on completion or failure; a loop that clears itself at a known, finite deadline a short time ahead (a cooldown or rate-limit countdown); design-system catalogue or demo screens that exist to cycle or animate examples, whatever kind of loop they use (`setInterval` included)."
          },
          "appliesTo": [
            "**/*.tsx",
            "**/*.jsx"
          ],
          "when": "setInterval|withRepeat|Animated\\.loop|requestAnimationFrame|useEffect|poll",
          "message": "A repeating timer, poll or infinite animation may keep running when the screen or row is not visible."
        },
        {
          "id": "doc/docs/review/contributor-conventions/unstable-zustand-selector",
          "section": "state/selectors",
          "instructions": "Does `hunk` subscribe to a Zustand store with no selector (`useStore()`) or with a selector whose RETURN value is a new object, array or function on every call (`s => ({ a: s.a })`, `s => s.items.filter(...)`, `s => s.list ?? []`) without `useShallow`?",
          "criteria": {
            "true": "A store hook is called with no argument, or with a selector that returns a value constructed inline and is not wrapped in `useShallow`.",
            "false": "Selectors return a primitive or an existing reference (`s => s.items`), including one that builds intermediate arrays but returns a primitive (`.filter(…).map(…).join(',')`, `.length`, `.some(…)`) or an existing element (`.find(…)`); `useShallow` wraps multi-field picks; fallbacks go to a module-level constant (`s => s.list ?? EMPTY`); the hook is not a Zustand store."
          },
          "appliesTo": [],
          "when": "use\\w*Store\\(|useStore\\(|useShallow|getState\\(",
          "message": "Subscribing to the whole store or a newly-built object re-renders on every store change."
        },
        {
          "id": "doc/docs/review/contributor-conventions/getstate-during-render",
          "section": "state/selectors",
          "instructions": "Is a `useStore.getState()` call in `hunk` evaluated every time a component or hook body runs — as a top-level statement of that body or an expression in its JSX or props — rather than inside a function that runs later?",
          "criteria": {
            "true": "A `getState()` call executes at the top level of a component or hook body on each render, outside any function declared in that body.",
            "false": "`getState()` inside event handlers, effects, callbacks, async functions, or non-React modules; inside any function declared in the body that runs later (a menu builder, a helper called from a handler) — lexical position inside the hook is not render time; a `useState(() => …)` or `useRef` initialiser that deliberately snapshots the store once at mount (seeding a form draft that must not reset)."
          },
          "appliesTo": [],
          "when": "getState\\(|\\.getState",
          "message": "Reading `getState()` during render skips the subscription and renders stale data."
        },
        {
          "id": "doc/docs/review/contributor-conventions/work-in-render-or-row",
          "section": "perf/render",
          "instructions": "Does `hunk` fetch, decrypt, `JSON.parse`, sort or serialize data directly in a component render body or once per list row (inside `renderItem` or a row component) instead of in a data owner, hook or memoized derivation?",
          "criteria": {
            "true": "Such work appears unmemoized in a render body or inside `renderItem`/a row component.",
            "false": "The work lives in a hook, store, selector or memoized derivation; small bounded lists; cheap derivations."
          },
          "appliesTo": [],
          "when": "renderItem|JSON\\.parse|JSON\\.stringify|\\.sort\\(|decrypt|\\.filter\\(|\\.map\\(",
          "message": "Fetching, decrypting, parsing, sorting or serializing during render or per list row costs frames."
        },
        {
          "id": "doc/docs/review/contributor-conventions/unbounded-scrollview-list",
          "section": "perf/render",
          "instructions": "Does `hunk` render with a `ScrollView` plus `.map`, instead of the shared virtualized `List`, a data-driven list whose length can grow without a cap — a feed, a history, transaction or message log, a full contact or follow list, search results with no limit?",
          "criteria": {
            "true": "A `ScrollView` (or a screen scroll wrapper) maps over an array that grows with use or with remote data and that nothing caps.",
            "false": "The shared virtualized `List`/FlashList is used; the list is small and bounded (a few fixed items, a settings section, tabs, a handful of mints); a top-N or recents list capped by its source (a `limit`, `slice` or maximum); a user-curated configuration list (relays, mints, accounts); a scroll container with no `.map` over data in `hunk`."
          },
          "appliesTo": [],
          "when": "ScrollView|\\.map\\(|FlatList|FlashList",
          "message": "An unbounded list rendered with ScrollView and .map mounts every row at once."
        },
        {
          "id": "doc/docs/review/contributor-conventions/speculative-memoization",
          "section": "perf/memo",
          "instructions": "Does `hunk` add `useMemo`, `useCallback` or `memo` purely as a speculative render optimisation — over a cheap value or a plain event handler — with no comment giving a measured need and no correctness reason for a stable identity?",
          "criteria": {
            "true": "New memoization wraps a trivial computation or handler, with no explanatory comment and no dependency/identity requirement visible.",
            "false": "A comment states the measured need or reason; stable identity is required for correctness (effect or subscription dependency, context value, Reanimated worklet or gesture, native/third-party prop compared by identity, FlashList `renderItem`/`keyExtractor`); expensive derivations over collections; files that opt out of React Compiler."
          },
          "appliesTo": [],
          "when": "useMemo|useCallback|\\bmemo\\(",
          "message": "useMemo/useCallback/memo added without a measured need duplicates what React Compiler does."
        },
        {
          "id": "doc/docs/review/contributor-conventions/route-param-not-identifier",
          "section": "routes/thin",
          "instructions": "Does `hunk` pass or expect a route param that is an object, JSON blob, secret or large payload rather than a small serializable identifier?",
          "criteria": {
            "true": "A navigation call or param read moves a stringified object, serialized entity, secret or large data through route params.",
            "false": "Params are ids, enums or short strings; the payload is passed through a store or query cache instead."
          },
          "appliesTo": [
            "app/app/**",
            "**/_layout.tsx",
            "**/_layout.jsx"
          ],
          "when": "params|router\\.(push|replace|navigate)|useLocalSearchParams|useGlobalSearchParams|href",
          "message": "Route params carrying objects, JSON blobs, secrets or large data don't survive serialization."
        },
        {
          "id": "doc/docs/review/contributor-conventions/route-file-does-work",
          "section": "routes/thin",
          "instructions": "Does this route file itself define work beyond reading/validating params, choosing a feature screen, redirecting or guarding, composing providers and gates, and configuring navigation — data fetching, a store subscription or effect with its logic written inline, business logic, a state machine, or visual UI of its own such as rows, menus, custom drawer or tab content or a screen layout?",
          "criteria": {
            "true": "The route file declares queries, mutations, wallet/Nostr logic, a reducer/state machine, an effect or store subscription whose logic is written inline, a payment or wallet machine instantiated with callbacks built around it, or visual components and a multi-element screen layout of its own (not a provider or navigator tree).",
            "false": "A `_layout` file configuring navigators, providers, gates and screen options, including a font or splash gate and theme, dimension or single `useState` reads that only feed `screenOptions`; mounting headless components or calling one feature hook whose body lives elsewhere, for instance to obtain a handler for navigation chrome; a route that reads params, validates them and renders one feature screen with those identifiers."
          },
          "appliesTo": [
            "app/app/**",
            "**/_layout.tsx",
            "**/_layout.jsx"
          ],
          "message": "A route file may hold data fetching or business logic that belongs in a feature screen."
        },
        {
          "id": "doc/docs/review/contributor-conventions/persisted-shape-change-without-migration",
          "section": "persist/migrations",
          "instructions": "Does `hunk` rename, remove, or change the type or allowed values of a field in persisted state (for example a zustand `persist` store) without also bumping its `version` and handling the old shape in `migrate`?",
          "criteria": {
            "true": "A persisted field is renamed, deleted or retyped while `version` stays the same or no `migrate` handling for the old shape appears in the hunk.",
            "false": "The `version` is bumped and `migrate` handles the old shape; the field is new and additive with a safe default; the state is runtime-only (no `persist`) or excluded by `partialize`."
          },
          "appliesTo": [],
          "when": "persist|version|migrate|partialize|z\\.object|storage",
          "message": "Changing persisted state without a version bump and migration breaks existing users' data."
        },
        {
          "id": "doc/docs/review/contributor-conventions/non-data-persisted",
          "section": "persist/data-only",
          "instructions": "Does `hunk` persist — through a `persist` store's state or `partialize`, or a direct storage write — class instances, managers, promises, transient loading/pending/error flags, or decrypted private messages?",
          "criteria": {
            "true": "Such a value is included in persisted state or `partialize`, or written directly to storage.",
            "false": "Persisted state is plain JSON-serializable data and `partialize` leaves out transient fields; store actions (zustand persist never serializes functions); runtime-only stores without `persist`."
          },
          "appliesTo": [],
          "when": "persist|partialize|setItem|new [A-Z]\\w+\\(|isLoading|pending|error|storage",
          "message": "Persisting instances, promises, transient flags or decrypted messages puts non-data into storage."
        },
        {
          "id": "doc/docs/review/contributor-conventions/default-fabricates-trust",
          "section": "persist/fallbacks",
          "instructions": "Does `hunk` use a schema `.default()`/`.catch()`, a migration fallback, or a `??`/`||` default that turns missing or invalid money amounts, credentials, consent or terms acceptance, backup-verified status, or trust (trusted mints, allowed signers, granted permissions) into a value that grants something — funds, access, identity, consent or trust — or make an unknown enum value fall back to a privileged member?",
          "criteria": {
            "true": "A fallback supplies a balance/amount, `true` for consent, verified or trusted status, a populated allow-list, or a privileged enum member when the stored value is missing or invalid.",
            "false": "Fallbacks go to neutral or least-privileged values (`false`, `\"ask\"`, empty lists, `undefined`, not-accepted), including the enum member that fails closed — the one that demands a credential or errors visibly rather than deriving or granting anything; fallbacks for presentational preferences (theme, sort order, UI toggles, display units)."
          },
          "appliesTo": [],
          "when": "\\.default\\(|\\.catch\\(|\\?\\?|\\|\\||migrate|fallback",
          "message": "A default or .catch may turn missing or invalid money, consent or trust into valid-looking state."
        },
        {
          "id": "doc/docs/review/contributor-conventions/identity-data-in-global-store",
          "section": "persist/scope",
          "instructions": "Does `hunk` keep identity-dependent data (derived from the active profile's keys, wallet, contacts, DMs, follows or viewer-specific feeds) in a global, unscoped store or cache?",
          "criteria": {
            "true": "A module-level store or cache holding profile-specific data is created without profile scoping or a pubkey key.",
            "false": "Profile-scoped stores (under `stores/profile`, or created per profile/pubkey); global stores holding identity-independent data (mint metadata, relay info, public profiles, theme, app settings)."
          },
          "appliesTo": [],
          "when": "create\\(|persist|[Cc]ache|profile|Profile|pubkey|npub|identity",
          "message": "Identity-dependent data in a global store can leak across profile switches."
        },
        {
          "id": "doc/docs/review/contributor-conventions/data-mirrored-between-owners",
          "section": "state/one-authority",
          "instructions": "Does `hunk` copy data from one store, cache or query into another store via an effect or mirroring subscription, or keep a separate copy of balances, proofs or Nostr entities alongside their owner?",
          "criteria": {
            "true": "An effect or subscription reads one store/query and writes the same data into another store, or a second field duplicates balances/proofs/Nostr entities.",
            "false": "Values derived on read (selectors, memoized derivations); a store that is the single owner; caches filled by their own fetcher; drafts intentionally initialised once from a store value; e2e state mirrors exposing state to the test harness."
          },
          "appliesTo": [],
          "when": "useEffect|subscribe|set\\(|setState|[Cc]ache|copy|sync",
          "message": "Copying data between stores or caches creates a second copy that can drift from its owner."
        },
        {
          "id": "doc/docs/review/contributor-conventions/store-state-mutated-in-place",
          "section": "state/shape",
          "instructions": "Does `hunk` mutate store state in place (`state.items.push(x)`, `s.byId[k] = v`, `.splice`, in-place `.sort`) outside an Immer producer?",
          "criteria": {
            "true": "A store action writes into existing state objects or arrays directly with no Immer `produce`/`immer` middleware visible.",
            "false": "Immutable updates (spread, new arrays) or Immer producers; local non-store objects built before being set."
          },
          "appliesTo": [],
          "when": "\\.push\\(|\\.splice\\(|\\.sort\\(|\\.reverse\\(|state\\.\\w+\\[|s\\.\\w+\\[|Object\\.assign",
          "message": "Mutating store state in place skips change detection and can miss re-renders."
        },
        {
          "id": "doc/docs/review/contributor-conventions/truthy-default-drops-zero",
          "section": "state/shape",
          "instructions": "Does `hunk` drop a meaningful `0`, `false` or `\"\"` through a truthy check or `||` default on a value where those are valid (amounts, counts, flags, balances)?",
          "criteria": {
            "true": "`value || fallback` or `if (value)` guards a numeric amount/count or boolean flag whose zero/false state is meaningful.",
            "false": "`??` or explicit `=== undefined`/`=== null` checks; truthy checks on values where 0, false or \"\" are genuinely invalid (ids, URLs, keys)."
          },
          "appliesTo": [],
          "when": "\\|\\||\\?\\?|\\?\\s|if\\s*\\(|Boolean\\(",
          "message": "A truthy check or `||` default can discard a meaningful 0, false or empty string."
        },
        {
          "id": "doc/docs/review/contributor-conventions/clock-read-inside-freshness-helper",
          "section": "state/clock",
          "instructions": "Does `hunk` contain a reusable freshness predicate — a helper that returns whether something is stale, expired or still valid (`isStale`, `isExpired`, `peekX`) — that reads `Date.now()` or `new Date()` itself instead of taking a `nowMs` parameter, or does one action read the clock two or more times for values that are then compared with each other?",
          "criteria": {
            "true": "A helper that compares timestamps or TTLs calls `Date.now()` itself, or one action calls `Date.now()` several times for comparisons that must agree.",
            "false": "Freshness helpers take `nowMs`; the clock is read once at the top of an entry-point action or effect (prune, fetch, set) into a local and reused or passed down; separate actions in the same file each read the clock once; timestamps recorded for bookkeeping and not compared in the same action (`updatedAt: Date.now()`)."
          },
          "appliesTo": [],
          "when": "Date\\.now\\(|new Date\\(|stale|Stale|expir|fresh|Fresh|ttl|TTL",
          "message": "Reading Date.now() inside freshness logic makes expiry untestable and lets checks disagree."
        },
        {
          "id": "doc/docs/review/contributor-conventions/nostr-reads-bypass-facade",
          "section": "nostr/facade",
          "instructions": "Does `hunk`, in a screen, hook or feature module outside `nostr/`, build its own chain of Nostr read sources (Nagg, then Primal, then relays), open relay connections or pools directly, or call Nagg/Primal/relay clients directly for reads the facade provides?",
          "criteria": {
            "true": "Code outside `nostr/` instantiates a relay pool/connection or sequences Nagg → Primal → relay fallbacks for a read.",
            "false": "Reads go through the Nostr facade; the file is part of `nostr/` or its tier implementations; publishing through the app publish module."
          },
          "appliesTo": [],
          "when": "Nagg|Primal|SimplePool|relayPool|new Relay|\\brelays?\\b|nostr|Nostr",
          "message": "A feature module building its own relay or Nagg/Primal fallback chain bypasses the Nostr facade."
        },
        {
          "id": "doc/docs/review/contributor-conventions/signed-event-mutation",
          "section": "nostr/signed-events",
          "instructions": "Does `hunk` change a signed Nostr event's `content`, `tags`, `created_at`, `pubkey` or `id` and still store or pass it on as the verified signed event?",
          "criteria": {
            "true": "Code mutates or rebuilds fields of an already-signed event object (in place or by spreading into a copy that keeps the original `sig`/`id`) and then stores, publishes or treats that object as the signed/verified event.",
            "false": "The raw signed event is kept untouched and display or derived data is built into a separate object; a brand-new event is being constructed and then signed; only unsigned draft data is edited."
          },
          "appliesTo": [],
          "when": "signEvent|signedEvent|finalizeEvent|verifyEvent|\\bsigned\\b|\\.sig\\b|created_at|\\bevent\\b",
          "message": "A signed Nostr event is altered but still treated as the verified event, so its signature no longer matches."
        },
        {
          "id": "doc/docs/review/contributor-conventions/publish-retry-resigns",
          "section": "nostr/signed-events",
          "instructions": "Does `hunk` retry a failed Nostr publish by rebuilding or re-signing the event rather than resending the stored signed event?",
          "criteria": {
            "true": "A retry path calls the event builder, `signEvent`/`finalizeEvent`, or regenerates `created_at`/`id` before republishing.",
            "false": "The retry resends the same stored signed event object; the code signs an event for the first time."
          },
          "appliesTo": [],
          "when": "retry|retries|republish|resend|publish|Publish",
          "message": "A publish retry rebuilds or re-signs the event instead of resending the same signed event."
        },
        {
          "id": "doc/docs/review/contributor-conventions/delivery-state-collapse",
          "section": "nostr/delivery",
          "instructions": "Does `hunk` mark a message `delivered`/`sent: true` because a relay answered OK, or mark it failed because relays timed out, instead of keeping optimistic, signed, relay-accepted, delivered and failed as separate states?",
          "criteria": {
            "true": "On a relay OK/ack the code sets a delivered or sent flag or status; or a relay timeout sets a failed/undelivered terminal state; or a state type merges accepted and delivered into one value.",
            "false": "A relay OK is recorded as an `accepted` state distinct from `delivered`; the separate states are preserved."
          },
          "appliesTo": [],
          "when": "deliver|\\bsent\\b|accepted|\\bOK\\b|failed|status|timeout|publish",
          "message": "Relay acceptance is being reported as delivery, collapsing distinct message states."
        },
        {
          "id": "doc/docs/review/contributor-conventions/live-subscription-alone",
          "section": "nostr/live",
          "instructions": "Does `hunk` open a live Nostr subscription with no `since`/cursor catch-up on reconnect or resume, and no dedupe of incoming events by event id?",
          "criteria": {
            "true": "A long-lived subscription (REQ/`subscribe`) is opened and its handler stores events without any id-based dedupe, and there is no `since`/cursor catch-up query on reconnect or app resume.",
            "false": "The subscription is paired with a `since`/cursor catch-up fetch, or incoming events are deduped by event id; the code performs a one-shot query rather than a live subscription."
          },
          "appliesTo": [],
          "when": "subscribe|subscription|onevent|onEvent|\\bREQ\\b|\\bsince\\b|\\beose\\b|EOSE",
          "message": "A live relay subscription is used alone, so events are missed after a reconnect or arrive twice."
        },
        {
          "id": "doc/docs/review/contributor-conventions/dm-plaintext-leaves-device",
          "section": "nostr/private-dms",
          "instructions": "Does `hunk` send a private key or decrypted DM plaintext to Nagg or any server, decrypt DMs off-device, or write decrypted DM content to storage without encryption?",
          "criteria": {
            "true": "Decrypted message text or a secret/private key is placed in a request body, query, header, analytics or log call, or written to AsyncStorage/SQLite/a persisted store without encryption; decryption is delegated to a remote endpoint.",
            "false": "Only ciphertext and metadata leave the device; decryption happens locally and plaintext stays in memory or in encrypted storage (SecureStore, encrypted cache)."
          },
          "appliesTo": [],
          "when": "decrypt|plaintext|privateKey|private_key|nsec|seckey|secretKey|nip44|nip04|\\bdm\\b|DM",
          "message": "A private key or decrypted DM plaintext may leave the device or be persisted unencrypted."
        },
        {
          "id": "doc/docs/review/contributor-conventions/wallet-logic-in-app",
          "section": "wallet/engine-owns",
          "instructions": "Does this shipped app runtime file under `app/` (a screen, hook, store or feature lib bundled into the app) implement wallet engine logic itself — selecting proofs, sequencing mint/melt/swap steps, overriding or re-implementing a `wallet/` machine operation, retrying payments, or reconciling history — rather than triggering a `wallet/` action or machine event?",
          "criteria": {
            "true": "App-layer runtime code picks or splits proofs, chains multiple mint/melt/swap calls, loops or re-invokes a payment on failure, or recomputes/reconciles transaction history locally.",
            "false": "App code dispatches one wallet or Coco API call or machine event per user action and renders the resulting state; the file only displays wallet state; the code is a test harness, fixture or tool that drives or audits the wallet from outside the app runtime (an E2E custody, recovery or accounting script), even though it lives under `app/`; the wallet vocabulary appears only in names (a proof selector sheet, an orchestrator hook) while the work is delegated."
          },
          "appliesTo": [
            "app/**"
          ],
          "when": "proof|Proof|melt|\\bmint\\b|Mint|swap|retry|reconcil|quote|keyset|counter",
          "message": "Wallet engine logic is implemented in app code instead of behind a wallet/ action."
        },
        {
          "id": "doc/docs/review/contributor-conventions/cancel-implies-rollback",
          "section": "wallet/cancel",
          "instructions": "Does `hunk` mark a payment cancelled or refunded, release its proofs, or clear its pending record in response to unmount, back navigation, a cancel button or an AbortSignal, without a wallet API confirming the rollback?",
          "criteria": {
            "true": "An unmount/cleanup, back handler, cancel press or abort path sets a cancelled/refunded status, frees or unreserves proofs, or deletes the pending payment record with no confirmed wallet rollback call.",
            "false": "Cancelling only stops UI updates, unsubscribes or aborts a poll; the rollback goes through a wallet API whose confirmed result drives the state change; a prepared, unexecuted operation is discarded."
          },
          "appliesTo": [],
          "when": "cancel|abort|Abort|unmount|onBack|router\\.back|cleanup|dismiss|rollback",
          "message": "Leaving or cancelling a payment screen is treated as if the payment itself stopped or was refunded."
        },
        {
          "id": "doc/docs/review/contributor-conventions/locked-transfer-bearer-fallback",
          "section": "wallet/locks",
          "instructions": "Does `hunk` send or create an unlocked bearer token when a P2PK/NUT-10 lock was requested or when locking failed?",
          "criteria": {
            "true": "A catch, fallback branch or default path produces an unlocked token after a lock was requested or lock creation failed.",
            "false": "A lock failure aborts the send or surfaces an error; the token is created with the requested lock."
          },
          "appliesTo": [],
          "when": "p2pk|P2PK|NUT-?10|nut10|\\block\\b|Lock|pubkey|bearer",
          "message": "A requested recipient lock may fall back to an unlocked bearer token."
        },
        {
          "id": "doc/docs/review/contributor-conventions/payment-request-constraints-dropped",
          "section": "wallet/locks",
          "instructions": "Does `hunk` build a payment from a payment request while omitting that request's lock, allowed-mint list or unit constraint?",
          "criteria": {
            "true": "The send/melt payload is assembled from a parsed payment request but leaves out its `p2pk`/lock, `mints` list or `unit`, or substitutes a default mint or unit instead.",
            "false": "Lock, mint list and unit from the request are passed through or validated before sending."
