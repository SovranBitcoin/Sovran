          "appliesTo": [],
          "when": "\\.sort\\(|\\.reverse\\(|\\.splice\\(|\\.push\\(|\\.pop\\(|\\.shift\\(|\\.unshift\\(|\\.fill\\(|Object\\.assign\\(|delete\\s",
          "message": "Mutating a prop or store value during render reorders the owner's data with no subscriber notified."
        },
        {
          "id": "doc/docs/review/conventions-state/render-clock",
          "section": "react/render-clock",
          "instructions": "Does `hunk` read `Date.now()`, `new Date()`, `performance.now()` or `Math.random()` directly in a component or hook body during render — outside any handler, effect, `useState` initialiser or callback — and use the result for displayed or branching output such as expiry, staleness, relative time, a countdown or a generated id?",
          "criteria": {
            "true": "A render-path `const now = Date.now()` (or `Math.random()`) feeds a rendered value or a conditional about time.",
            "false": "The read is inside a handler, effect, callback or lazy `useState(() => …)`; a `nowMs` state advanced by a timer is used instead; the value feeds a one-off computation whose staleness cannot be observed (a chart's current month, a log timestamp)."
          },
          "appliesTo": [],
          "when": "Date\\.now\\(|new Date\\(|performance\\.now\\(|Math\\.random\\(|Date\\.parse",
          "message": "A clock or random read during render can be cached by the compiler and never updates."
        },
        {
          "id": "doc/docs/review/conventions-state/getsnapshot-new-object",
          "section": "react/external-store-snapshot",
          "instructions": "Does `hunk` pass to `useSyncExternalStore` a `getSnapshot` that returns a newly created object, array or function on each call — an object literal, a spread, `.filter` / `.map` / `.slice` / `Object.values(…)`, or a `?? []` / `?? {}` fallback?",
          "criteria": {
            "true": "The `getSnapshot` argument constructs its return value inline rather than returning a stored reference or primitive.",
            "false": "The snapshot returns a primitive or the same stored reference until the source changes (the module caches the derived value and replaces it in its own setter); a module-level constant fallback."
