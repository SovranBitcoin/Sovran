          "criteria": {
            "true": "The effect attaches the listener and returns the unsubscribe, with no post-subscription re-read or state sync.",
            "false": "`useSyncExternalStore(subscribe, getSnapshot)` is used; the effect re-checks after subscribing (`const un = store.persist.onFinishHydration(() => setHydrated(true)); if (store.persist.hasHydrated()) setHydrated(true);`); a Zustand hook; a source that replays its current value to new subscribers."
          },
          "appliesTo": [
            "**/*.tsx",
            "**/hooks/**/*.ts",
            "**/use*.ts"
          ],
          "when": "useState\\("
        },
        {
          "id": "doc/docs/review/conventions-state/render-mutation",
          "section": "react/render-mutation",
          "message": "Mutating a prop or store value during render reorders the owner's data with no subscriber notified.",
          "instructions": "Does `hunk` call an in-place mutator during render — `.sort(`, `.reverse(`, `.splice(`, `.push(`, `.pop(`, `.shift(`, `.unshift(`, `.fill(`, `delete obj.k`, `obj.k = v`, `Object.assign(target, …)` — on a prop, a value returned by a Zustand or context hook, a route param, or anything reached through one of them?",
          "criteria": {
            "true": "A render-path statement mutates an array or object that came from props, a store hook, context or a route param.",
            "false": "The mutated value was created in the same render (`[...items].sort()`, `items.filter(…).sort(…)`, `Object.values(rec).sort(…)`, an array literal); non-mutating `toSorted`/`toReversed`; mutation inside handlers or effects of values the component owns; Reanimated shared values via `.set()`."
          },
          "appliesTo": [
            "**/*.tsx",
            "**/hooks/**/*.ts",
            "**/use*.ts"
          ],
          "when": "\\.sort\\(|\\.reverse\\(|\\.splice\\(|\\.push\\(|\\.pop\\(|\\.shift\\(|\\.unshift\\(|\\.fill\\(|Object\\.assign\\(|delete "
        },
        {
          "id": "doc/docs/review/conventions-state/render-clock",
          "section": "react/render-clock",
          "message": "A clock or random read during render can be cached by the compiler and never updates.",
          "instructions": "Does `hunk` read `Date.now()`, `new Date()`, `performance.now()` or `Math.random()` directly in a component or hook body during render — outside any handler, effect, `useState` initialiser or callback — and use the result for displayed or branching output such as expiry, staleness, relative time, a countdown or a generated id?",
          "criteria": {
            "true": "A render-path `const now = Date.now()` (or `Math.random()`) feeds a rendered value or a conditional about time.",
            "false": "The read is inside a handler, effect, callback or lazy `useState(() => …)`; a `nowMs` state advanced by a timer is used instead; the value feeds a one-off computation whose staleness cannot be observed (a chart's current month, a log timestamp)."
          },
          "appliesTo": [
            "**/*.tsx",
            "**/hooks/**/*.ts",
            "**/use*.ts"
          ],
          "when": "Date\\.now\\(|new Date\\(|performance\\.now\\(|Math\\.random\\("
        },
        {
          "id": "doc/docs/review/conventions-state/getsnapshot-new-object",
          "section": "react/external-store-snapshot",
          "message": "A `getSnapshot` that builds a new value each call crashes the component with an update-depth loop.",
          "instructions": "Does `hunk` pass to `useSyncExternalStore` a `getSnapshot` that returns a newly created object, array or function on each call — an object literal, a spread, `.filter` / `.map` / `.slice` / `Object.values(…)`, or a `?? []` / `?? {}` fallback?",
          "criteria": {
            "true": "The `getSnapshot` argument constructs its return value inline rather than returning a stored reference or primitive.",
            "false": "The snapshot returns a primitive or the same stored reference until the source changes (the module caches the derived value and replaces it in its own setter); a module-level constant fallback."
          },
          "appliesTo": [
            "**/*.tsx",
            "**/hooks/**/*.ts",
            "**/use*.ts"
          ],
          "when": "useSyncExternalStore"
        },
        {
          "id": "doc/docs/review/conventions-state/use-promise-in-render",
          "section": "react/use-promise-in-render",
          "message": "A promise created during render makes `use()` restart the request on every retry and never resolve.",
          "instructions": "Does `hunk` call `use(` with a promise created in the same component render — a direct call such as `use(fetchThing(id))`, an `async` function invocation, `new Promise(…)`, or a `.then(…)` chain built in the body?",
          "criteria": {
            "true": "The argument to `use(` is an expression that constructs or invokes a promise in the render body.",
            "false": "The promise is created outside render and passed in as a prop or read from a cache keyed by the inputs (module-level map, `createQueryCacheStore`, a loader); `use(Context)`; a promise held in a parent's `useState(() => …)`."
          },
          "appliesTo": [
            "**/*.tsx",
            "**/hooks/**/*.ts",
            "**/use*.ts"
          ],
          "when": "\\buse\\("
        },
        {
          "id": "doc/docs/review/conventions-state/context-churn",
          "section": "react/context-churn",
          "message": "A fast-changing field in a shared context value re-renders every consumer at that rate.",
          "instructions": "Does `hunk` add a frequently-changing value — scroll or drag position, progress, a timer tick, text-input contents, a per-frame or per-event counter, streaming text — to the `value` of a context that also carries slow-changing data or is consumed broadly?",
          "criteria": {
            "true": "The context provider's `value` gains a field updated per frame, per keystroke or per event alongside slower data.",
            "false": "The fast value lives in a Zustand store read through a selector, a Reanimated shared value, or its own narrowly-consumed context; the context's whole value changes together and rarely; the context carries only stable functions and refs."
          },
          "appliesTo": [
            "**/*.tsx"
          ],
          "when": "createContext|\\.Provider"
        }
      ],
      "notChecked": [
        {
          "section": "Intro — \"Every rule here was reproduced against the installed package versions … when a dependency is upgraded, re-check the rules\"",
          "reason": "Process guidance for maintainers of the doc, not a property of any code chunk."
        },
        {
          "section": "persist/migrate-total (d) — migrate \"can throw on malformed input\"",
          "reason": "Whether a migrate step can throw on arbitrary stored input needs knowledge of the parsers it calls; overlaps the defensive-parsing exception and would fire on most migrates."
        },
        {
          "section": "state/subscribe-listener (c) — missing `fireImmediately: true` or an explicit initial call",
          "reason": "Requires judging whether the listener \"must also run for the value already in the store\", which is intent the chunk does not state."
        },
        {
          "section": "async/inflight-map (b) — `finally` delete without an identity check `if (map.get(k) === p)`",
          "reason": "Conditioned on the map also being cleared, invalidated or overwritten elsewhere, which is usually outside the reviewed chunk."
        },
        {
          "section": "persist/partialize-allowlist — \"all 56 existing `partialize` calls do this\"",
          "reason": "Repository-wide count; the classifier cannot verify totals across files."
        },
        {
          "section": "react/render-mutation — `toSorted` / `toReversed` \"only once Hermes support is confirmed — the app has 0 uses today\"",
          "reason": "Depends on runtime support status and a repo-wide usage count, not on the chunk."
        },
        {
          "section": "react/render-clock — \"files listed in `react-compiler-bailouts.json` are not exempt\"",
          "reason": "Cross-file lookup into a config listing; the classifier cannot read that file."
        }
