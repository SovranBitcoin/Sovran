          "when": "(header|Header|navigation|headerTitle|stickyContent|useIdentityHeader)"
        },
        {
          "id": "doc/docs/review/contributor-conventions/unit-vocabulary-handwritten",
          "section": "units/registry",
          "message": "A hand-written unit vocabulary drifts from the unit registry when a unit is added or changed.",
          "instructions": "Does `hunk` hand-write a currency/unit vocabulary — a `'sat' | 'usd' | …` union, a `['SAT','USD',…]` list, a `{ usd: '$', … }` label/symbol/name/flag/decimals map keyed by unit, a run of `unit === 'usd' || unit === 'eur' || …` comparisons, a cast to such a union, or an inline `unit === 'sat' ? 'BTC' : unit.toUpperCase()` label — instead of importing or deriving it from the unit registry (`SWITCHABLE_UNITS`, `FIAT_UNITS`, `ACCOUNT_UNITS`, `SwitchableUnit`, `FiatUnit`, `AccountUnit`, `unitDefinition`, `unitSymbol`, `unitMinorDecimals`, `isFiatUnit`, `accountUnitLabel`)?",
          "criteria": {
            "true": "A new union, array, map or comparison chain enumerates two or more unit codes, or builds a unit's label/symbol/decimals locally.",
            "false": "The registry file itself or `app/shared/lib/cashu/unitPresentation.ts` with `Record<SwitchableUnit | FiatUnit, …>` tables; a comparison against ONE specific unit for behaviour genuinely specific to it; protocol unit strings passed through untouched; test fixtures and e2e scenarios; upper-case rate codes derived from `FIAT_UNITS`."
          },
          "appliesTo": [
            "**/*.{ts,tsx}"
          ],
          "when": "(sat|usd|eur|btc|SAT|USD|EUR|BTC|unit|Unit|currency)"
        },
        {
          "id": "doc/docs/review/contributor-conventions/restated-type-not-derived",
          "section": "types/derive",
          "message": "A restated union or lookup can drift from the declaration that owns the values.",
          "instructions": "Does `hunk` declare a literal union, interface, array or lookup table that restates values already owned by an `as const` object/array, a zod schema or a library type instead of deriving it (`typeof X[number]`, `keyof typeof X`, `z.infer`, `Pick`, `Omit`, `Parameters`, `ReturnType`), or key a lookup by a known union while typing it `Record<string, …>` or casting the key, so a new member compiles with no entry?",
          "criteria": {
            "true": "A hand-written union/array duplicates members of a nearby `as const` or schema; a map keyed by a known union is typed `Record<string, …>` or indexed with a cast like `unit as 'usd' | 'eur'`.",
            "false": "The declaration is the owner of the values; the table is typed `Record<Union, …>` or uses `satisfies Record<Union, …>`; a deliberately partial `Partial<Record<Union, …>>` with a handled miss; wire types generated from or validated by a schema; test fixtures."
          },
          "appliesTo": [
            "**/*.{ts,tsx}"
          ],
          "when": "(as const|Record<|type\\s+\\w+\\s*=|interface\\s+\\w+)"
        },
        {
          "id": "doc/docs/review/contributor-conventions/illegal-states-representable",
          "section": "types/illegal-states",
          "message": "A boolean-plus-optional-field shape lets contradictory states be represented.",
          "instructions": "Does `hunk` add or extend a type that models mutually exclusive states as a boolean plus optional fields, or as several booleans that must stay in sync (`{ loading; data?; error? }`, `completed` plus `completedAt?`, `isPaid` and `isFailed`), where a discriminated union would make the contradictory combinations unrepresentable?",
          "criteria": {
            "true": "A new/extended type pairs a status boolean with optional payload fields, or declares multiple mutually exclusive boolean flags side by side.",
            "false": "Independent flags that can each be true or false in any combination; props of a presentational component; wire or persisted shapes owned by another system; a boolean derived from a single source rather than stored beside it."
          },
          "appliesTo": [
            "**/*.{ts,tsx}"
          ],
          "when": "(interface\\s+\\w+|type\\s+\\w+\\s*=)"
        },
        {
          "id": "doc/docs/review/contributor-conventions/zod-callback-throws",
          "section": "zod/callbacks-dont-throw",
          "message": "A throw inside a zod refinement or transform escapes `safeParse` and the persist merge.",
          "instructions": "Does `hunk` contain a `throw` inside a `.refine`, `.superRefine`, `.check`, `.transform` or `z.preprocess` callback, or call something there that throws on bad input (`JSON.parse`, `new URL`, `BigInt(…)`, a decoder) without a try/catch that reports an issue instead?",
          "criteria": {
            "true": "A zod callback body throws, or calls `JSON.parse`, `new URL`, `BigInt`, `decode…` on the parsed input with no surrounding try/catch.",
            "false": "The callback returns `false`, adds an issue via `ctx.addIssue`, or returns `z.NEVER`; the throwing call is wrapped in try/catch that reports an issue."
          },
          "appliesTo": [
            "**/*.{ts,tsx}"
          ],
          "when": "(\\.refine|\\.superRefine|\\.check\\(|\\.transform|z\\.preprocess)"
        },
        {
          "id": "doc/docs/review/contributor-conventions/zod-v3-api-usage",
          "section": "zod/v4-api",
          "message": "A Zod 3 parameter or shape that Zod 4 ignores or rejects can silently change validation.",
          "instructions": "Does `hunk` pass `required_error`, `invalid_type_error` or `errorMap` to a zod schema, spread a `z.looseObject`/`z.strictObject` shape into `z.object({ ...X.shape })`, call `.pick`, `.omit` or `.partial` on a refined object, use `z.record(EnumSchema, …)` where some keys may be absent, or add an async refinement/transform to a schema parsed with synchronous `parse`/`safeParse`?",
          "criteria": {
            "true": "Any of those Zod 3 parameters, spreads of a loose/strict `.shape`, `.pick`/`.omit`/`.partial` applied after `.refine`, `z.record` over an enum with optional keys, or an `async` refine/transform on a synchronously parsed schema appears in added code.",
            "false": "`message` (deprecated but working); `.extend` on a loose or strict object; a spread whose strip-mode result is intended and commented; `z.partialRecord`; schemas parsed with `safeParseAsync`."
          },
          "appliesTo": [
            "**/*.{ts,tsx}"
          ],
          "when": "(required_error|invalid_type_error|errorMap|\\.shape|\\.pick\\(|\\.omit\\(|\\.partial\\(|z\\.record|async)"
        },
        {
          "id": "doc/docs/review/contributor-conventions/zod-default-or-coercion-manufactures-value",
          "section": "zod/defaults-and-coercion",
          "message": "A coercion or default can manufacture a valid-looking value from missing or malformed input.",
          "instructions": "Does `hunk` apply `z.coerce.number()` or `z.coerce.boolean()` to input that can be a string, or attach `.default(v)` to a schema with a `.transform`, `.pipe` or checks where `v` is an input-side value rather than an output-type value?",
          "criteria": {
            "true": "`z.coerce.number()`/`z.coerce.boolean()` wraps a string-valued field (so `''` becomes `0`, `'false'` becomes `true`), or `.default(...)` follows a `.transform`/`.pipe`/checked schema with a pre-transform-shaped value.",
            "false": "`z.stringbool()` or an explicit string-to-boolean mapping; a coercion preceded by a non-empty check or applied to an already-numeric value; `.default` whose value is of the output type; `.prefault` for input-side defaults."
          },
          "appliesTo": [
            "**/*.{ts,tsx}"
          ],
          "when": "(z\\.coerce|\\.default\\(|\\.prefault\\()"
        },
        {
          "id": "doc/docs/review/contributor-conventions/zod-boundary-parse",
          "section": "zod/boundary-parse",
          "message": "A per-render schema or a throwing `.parse` on untrusted data can crash or churn at a boundary.",
          "instructions": "Does `hunk` construct a `z.*` schema inside a component, hook, store action, request handler or loop rather than at module scope, or call throwing `.parse(` on network, storage, relay, deep-link or native-module data instead of `safeParse` or a hoisted `parseWith(Schema, where)`?",
          "criteria": {
            "true": "A `z.object(...)`/`z.array(...)` literal is built inside a function body that runs per render or per request, or `.parse(` is applied to a response body, stored blob, relay event, deep-link param or native-module result.",
            "false": "A schema that genuinely depends on a runtime value and is memoized or built once per call site by design; `.parse` on a constant the module owns; tests."
          },
          "appliesTo": [
            "**/*.{ts,tsx}"
          ],
          "when": "(z\\.(object|array|string|number|enum|union|record)|\\.parse\\()"
        },
        {
          "id": "doc/docs/review/contributor-conventions/zod-issue-text-leak",
          "section": "zod/issue-values",
          "message": "Zod issue text embeds the offending value and can leak secrets into logs or UI.",
          "instructions": "Does `hunk` log, persist, send or display zod issue text — `error.message`, `z.prettifyError`, `z.flattenError`, `z.treeifyError`, `issue.message`, `issue.input`, or a schema built with `reportInput` — for data that can hold secrets, tokens, invoices, mint URLs or private message content?",
          "criteria": {
            "true": "A ZodError message, prettified/flattened/treeified error, `issue.message` or `issue.input` is passed to a logger, analytics call, persisted record or rendered string.",
            "false": "`loggableIssues(error)` or an equivalent keeping only `path` and `code`; fixed author-written messages with no interpolated input; development-only assertions in tests."
          },
          "appliesTo": [
            "**/*.{ts,tsx}"
          ],
          "when": "(prettifyError|flattenError|treeifyError|issue\\.|ZodError|error\\.message|reportInput)"
        },
        {
          "id": "doc/docs/review/contributor-conventions/persist-without-persist-config",
          "section": "persist/config-seam",
          "message": "A persisted store bypassing `persistConfig` loses the shared merge and schema seam.",
          "instructions": "Does `hunk` call zustand's `persist(` with options not built by `persistConfig(...)`?",
          "criteria": {
            "true": "`persist(fn, { name: …, storage: … })` or similar inline options object is passed without `persistConfig(...)`.",
            "false": "The options argument is `persistConfig({...})`; `createQueryCacheStore`, which owns its own envelope; the e2e runtime."
          },
          "appliesTo": [
            "**/stores/**/*.{ts,tsx}",
            "**/*[Ss]tore.{ts,tsx}",
            "**/persist/**/*.ts",
            "**/{cache,caches}/**/*.ts",
            "**/*[Cc]ache.ts"
          ],
          "when": "persist\\("
        },
        {
          "id": "doc/docs/review/contributor-conventions/persisted-enum-not-tolerant",
          "section": "persist/config-seam",
          "message": "An intolerant persisted enum makes the whole stored blob fail to merge.",
          "instructions": "Does `hunk` add an enum, union or literal field to a schema passed to `persistConfig({ schema })` without `.default(X).catch(X)` (or the tolerant collection helpers in `app/shared/lib/persist/tolerant.ts`)?",
          "criteria": {
            "true": "A `z.enum(...)`, `z.union(...)` or `z.literal(...)` field is added to a persisted schema with no `.catch(...)`/`.default(...)` pair and no tolerant helper.",
            "false": "The field carries `.default(X).catch(X)` or uses a tolerant helper; a field whose invalid value must reject the blob and is covered by a `version` bump plus `migrate`; non-persisted schemas."
          },
          "appliesTo": [
            "**/stores/**/*.{ts,tsx}",
            "**/*[Ss]tore.{ts,tsx}",
            "**/persist/**/*.ts",
            "**/{cache,caches}/**/*.ts",
            "**/*[Cc]ache.ts"
          ],
          "when": "(persistConfig|z\\.enum|z\\.literal|z\\.union)"
        },
        {
          "id": "doc/docs/review/contributor-conventions/zustand-v4-api",
          "section": "state/zustand-v5",
          "message": "Zustand 4 APIs removed in v5 fail at runtime in this repo.",
          "instructions": "Does `hunk` pass a second (equality) argument to a hook created by `create`, import `zustand/traditional`, `createWithEqualityFn` or a default export from `zustand`, or call `store.subscribe(selector, listener)` on a store not wrapped in `subscribeWithSelector`?",
          "criteria": {
            "true": "A selector hook call has a second comparator argument, an import pulls `zustand/traditional`/`createWithEqualityFn`/a zustand default export, or `subscribe` is called with two arguments on a store created without `subscribeWithSelector`.",
            "false": "`useShallow` wrapping the selector; `subscribe(listener)` with a single argument; stores created with `subscribeWithSelector`."
          },
          "appliesTo": [
            "**/*.{ts,tsx}"
          ],
          "when": "(zustand|createWithEqualityFn|subscribeWithSelector|\\.subscribe\\()"
        },
        {
          "id": "doc/docs/review/contributor-conventions/worklet-calls-js-directly",
          "section": "motion/thread-hop",
          "message": "Calling a JS function straight from a worklet crashes or silently no-ops on the UI thread.",
          "instructions": "Does a worklet in `hunk` (gesture callback, `useAnimatedStyle`, `useDerivedValue`, `useAnimatedReaction`, `useAnimatedScrollHandler`, `useFrameCallback`, animation completion callback) call a plain JS function directly — a state setter, `router.*`, a store action, haptics, an imported helper with no `'worklet'` directive — or pass `scheduleOnRN` a function created inside the worklet?",
          "criteria": {
            "true": "A worklet body invokes `setState`, `router.push`, a store action, a haptics call or an imported helper that is not marked `'worklet'`, or hands `scheduleOnRN` an inline arrow defined inside the worklet.",
            "false": "`scheduleOnRN`/`scheduleOnUI` with a function defined at component or module scope; functions marked `'worklet'`; the Gesture Handler builder option `.runOnJS(true)`."
          },
          "appliesTo": [
            "**/*.tsx",
            "**/hooks/**/*.ts",
            "**/use*.ts"
          ],
          "when": "(worklet|useAnimatedStyle|useDerivedValue|useAnimatedReaction|useAnimatedScrollHandler|useFrameCallback|Gesture\\.|scheduleOnRN)"
        },
        {
          "id": "doc/docs/review/contributor-conventions/runonjs-deprecated",
          "section": "motion/thread-hop",
          "message": "`runOnJS`/`runOnUI` are deprecated in Reanimated 4 in favour of `scheduleOnRN`/`scheduleOnUI`.",
          "instructions": "Does `hunk` ADD a new `runOnJS(fn)(…)` or `runOnUI(fn)(…)` call instead of `scheduleOnRN(fn, …args)` / `scheduleOnUI(fn, …args)`?",
          "criteria": {
            "true": "An added line introduces a `runOnJS(` or `runOnUI(` invocation.",
            "false": "Existing `runOnJS`/`runOnUI` calls the hunk only moves or leaves in context; `scheduleOnRN`/`scheduleOnUI`; the Gesture Handler builder option `.runOnJS(true)`."
          },
          "appliesTo": [
            "**/*.tsx",
            "**/hooks/**/*.ts",
            "**/use*.ts"
          ],
          "when": "(runOnJS|runOnUI)"
        },
        {
          "id": "doc/docs/review/contributor-conventions/per-frame-js-hop",
          "section": "motion/per-frame-js",
          "message": "Crossing to JS or re-rendering React every frame drops animation frames.",
          "instructions": "Does `hunk` call `scheduleOnRN`, `runOnJS` or a React state setter on every frame — inside `.onUpdate`, `.onChange`, `useAnimatedScrollHandler`, `useFrameCallback` or `useAnimatedStyle` — with no threshold or change guard, or keep a per-frame value (scroll offset, drag translation) in `useState` instead of a shared value?",
          "criteria": {
            "true": "An unguarded thread hop or `setState` sits directly in a per-frame callback, or a scroll offset / drag translation is stored via `useState` and updated during movement.",
            "false": "The hop happens in `.onEnd`/`.onFinalize`; a `useAnimatedReaction` whose prepare returns a boolean or bucket and whose react runs only when `current !== previous`; a guard firing once per threshold crossing; list or media offset bookkeeping the header contract names."
          },
          "appliesTo": [
            "**/*.tsx",
            "**/hooks/**/*.ts",
            "**/use*.ts"
          ],
          "when": "(onUpdate|onChange|useAnimatedScrollHandler|useFrameCallback|useAnimatedStyle|scheduleOnRN|runOnJS)"
        },
        {
          "id": "doc/docs/review/contributor-conventions/shared-value-dot-value",
          "section": "motion/shared-value-access",
          "message": "`.value` access on a shared value breaks the React Compiler requirement to use `.get()`/`.set()`.",
          "instructions": "Does `hunk` add a read or write of a Reanimated shared value through `.value` (including `+=` or assignment) rather than `.get()` / `.set()`?",
          "criteria": {
            "true": "Added code reads or assigns `someSharedValue.value`, including compound assignment.",
            "false": "`.value` on things that are not shared values (events, refs, form state, query results); `.get()`/`.set()` usage; files listed in `react-compiler-bailouts.json`; existing `.value` access the hunk does not add."
          },
          "appliesTo": [
            "**/*.tsx",
            "**/hooks/**/*.ts",
            "**/use*.ts"
          ],
          "when": "\\.value"
        },
        {
          "id": "doc/docs/review/contributor-conventions/shared-value-during-render",
          "section": "motion/shared-value-access",
          "message": "Reading or writing a shared value during render produces stale or inconsistent UI.",
          "instructions": "Does `hunk` read or write a Reanimated shared value in a component or hook body during render, rather than inside a worklet, effect, handler or animation callback?",
          "criteria": {
            "true": "A `.get()`/`.set()` (or equivalent shared-value access) appears at the top level of a component/hook body or in JSX evaluated during render.",
            "false": "Shared-value access inside worklets, `useEffect`, event handlers, gesture callbacks or animation callbacks; values passed to `useAnimatedStyle`."
          },
          "appliesTo": [
            "**/*.tsx",
            "**/hooks/**/*.ts",
            "**/use*.ts"
          ],
          "when": "(useSharedValue|\\.get\\(\\)|\\.set\\()"
        },
        {
          "id": "doc/docs/review/contributor-conventions/reanimated-4-config",
          "section": "motion/reanimated-4-config",
          "message": "A Reanimated 3 configuration shape can throw or be ignored in Reanimated 4.",
          "instructions": "Does `hunk` pass a raw `'cubic-bezier(…)'`/`'steps(…)'` string or an `Easing.*` value to `transitionTimingFunction`/`animationTimingFunction`, give `withSpring` both the physics form (`stiffness`, `damping`, `mass`) and the duration form (`duration`, `dampingRatio`), use `restDisplacementThreshold`/`restSpeedThreshold`, or use `useAnimatedGestureHandler`, `useWorkletCallback`, the `Layout` transition, `useAnimatedKeyboard`, `useScrollViewOffset` or `sharedTransitionTag`?",
          "criteria": {
            "true": "Any of those removed or rejected APIs, mixed spring forms, or raw easing strings/`Easing.*` passed to a timing-function prop appears in added code.",
            "false": "Named timing-function strings like `'ease-in-out'`; `cubicBezier()`, `steps()`, `linear()` from Reanimated; one spring form at a time; `energyThreshold`; `LinearTransition` and other named layout transitions; `react-native-keyboard-controller` for keyboard tracking."
          },
          "appliesTo": [
            "**/*.tsx",
            "**/hooks/**/*.ts",
            "**/use*.ts"
          ],
          "when": "(cubic-bezier|steps\\(|Easing\\.|TimingFunction|withSpring|restDisplacementThreshold|restSpeedThreshold|useAnimatedGestureHandler|useWorkletCallback|useAnimatedKeyboard|useScrollViewOffset|sharedTransitionTag|Layout)"
        },
        {
          "id": "doc/docs/review/contributor-conventions/gesture-handoff",
          "section": "motion/gesture-handoff",
          "message": "A pan may fight the scroller beneath it or drop the gesture's velocity at release.",
          "instructions": "Does `hunk` add a `Gesture.Pan()` inside a scrollable or list with no `activeOffsetX`/`activeOffsetY`, `failOffset*` or relation to the scroll gesture, write `translationX`/`translationY` without adding the offset captured at `.onStart`/`.onBegin`, decide dismiss or commit on distance alone when the event's velocity is available, or start the release `withSpring` without `velocity`?",
          "criteria": {
            "true": "A pan inside a ScrollView/FlatList/FlashList lacks activation offsets or a gesture relation; translation is assigned without the start offset; an end handler branches only on translation distance; a release `withSpring` omits `velocity`.",
            "false": "A pan owning the whole screen with no scroller beneath it; a release snapping with `withTiming` by design and saying so; gestures whose end state does not depend on the fling, such as sliders that stop where released."
          },
          "appliesTo": [
            "**/*.tsx",
            "**/hooks/**/*.ts",
            "**/use*.ts"
          ],
          "when": "(Gesture\\.Pan|translationX|translationY|velocityX|velocityY|withSpring)"
        },
        {
          "id": "doc/docs/review/contributor-conventions/list-row-animations",
          "section": "motion/list-rows",
          "message": "Recycled rows replay entering animations or lose their layout type while scrolling.",
          "instructions": "Does `hunk` put `entering=` or `exiting=` on a row rendered by FlashList, FlatList or the shared `List`, or render visibly different row layouts from one `renderItem` without `getItemType`?",
          "criteria": {
            "true": "A `renderItem` returns an `Animated.*` element with `entering`/`exiting` props, or branches between structurally different row components while the list has no `getItemType`.",
            "false": "An entering animation gated to the first mount of a newly inserted item; rows of a small non-virtualized list; lists whose rows share one layout; `getItemType` is supplied."
          },
          "appliesTo": [
            "**/*.tsx"
          ],
          "when": "(FlashList|FlatList|renderItem|getItemType|entering=|exiting=)"
        },
        {
          "id": "doc/docs/review/contributor-conventions/jsx-numeric-and",
          "section": "rn/numeric-and",
          "message": "`{count && <View/>}` renders a bare `0` and crashes outside `<Text>` on native.",
          "instructions": "Does `hunk` add JSX of the form `{x && <Component … />}` where `x` is or can be a number (`count`, `length`, `amount`, `balance`, `index`, a `?.length`)?",
          "criteria": {
            "true": "A JSX expression guards an element with a bare numeric value or `.length` on the left of `&&`.",
            "false": "The guard is a boolean, string, object or `null`/`undefined`; the condition is a comparison (`count > 0 &&`), `!!x`, `Boolean(x)` or a ternary."
          },
          "appliesTo": [
            "**/*.tsx"
          ],
          "when": "&&\\s*[<(]"
        },
        {
          "id": "doc/docs/review/contributor-conventions/glass-surface-constraints",
          "section": "ui/glass-surfaces",
          "message": "Glass effects fail silently when clipped, opacity-animated, or rendered without a fallback.",
          "instructions": "Does `hunk` set `overflow: 'hidden'` on a `GlassView` or an ancestor that clips it, animate the opacity of a glass view, set `isInteractive` on glass that is not itself a control, or render glass with no availability check and Reduce Transparency fallback?",
          "criteria": {
            "true": "A GlassView or its clipping ancestor gets `overflow: 'hidden'`, a glass view's `opacity` is animated, `isInteractive` is set on a non-control surface, or glass renders unconditionally with no fallback branch.",
            "false": "The capability hook or `defineVariants` selected the glass variant and supplies the fallback; opacity animated on a sibling or child rather than the glass view; clipping applied to content inside the glass."
          },
          "appliesTo": [
            "**/*.tsx"
          ],
          "when": "(GlassView|glass|Glass|isInteractive|Transparency)"
        },
        {
          "id": "doc/docs/review/contributor-conventions/keyboard-tracking",
          "section": "ui/keyboard-tracking",
          "message": "Hand-rolled keyboard animation desyncs, and taps can be swallowed while an input is focused.",
          "instructions": "Does `hunk` track keyboard position with `Keyboard.addListener` plus a timing animation or `LayoutAnimation`, or add a scrollable form or search-results list whose rows are tappable while an input is focused without `keyboardShouldPersistTaps=\"handled\"`?",
          "criteria": {
            "true": "A keyboard show/hide listener drives an animated height/offset or `LayoutAnimation`, or a ScrollView/FlatList holding tappable rows below a focused input omits `keyboardShouldPersistTaps`.",
            "false": "`react-native-keyboard-controller` hooks and views; `Keyboard.dismiss()`; listeners used for non-layout behaviour such as analytics or focus bookkeeping; scrollers with no focusable input above them."
          },
          "appliesTo": [
            "**/*.tsx",
            "**/hooks/**/*.ts",
            "**/use*.ts"
          ],
          "when": "(Keyboard|keyboardShouldPersistTaps|LayoutAnimation|keyboardWill|keyboardDid)"
        },
        {
          "id": "doc/docs/review/contributor-conventions/test-weak-assertions",
          "section": "tests/assert-outcomes",
          "message": "A test that only checks a call or truthiness does not pin the expected outcome.",
          "instructions": "Does a new or changed test in `hunk` assert only that something was called, defined or truthy (`toHaveBeenCalled*`, `toBeDefined`, `toBeTruthy`) with no assertion on an observable result value?",
          "criteria": {
            "true": "The test's only expectations are call/defined/truthy checks, with no literal expected value compared against a returned or rendered result.",
            "false": "The test also asserts a literal expected result; the call assertion IS the contract (an adapter must call the native module once, a guard must not call the network)."
          },
          "appliesTo": [
            "**/__tests__/**/*.{ts,tsx}",
            "**/*.test.{ts,tsx}"
          ],
          "when": "(toHaveBeenCalled|toBeDefined|toBeTruthy)"
        },
        {
          "id": "doc/docs/review/contributor-conventions/test-expected-value-recomputed",
          "section": "tests/assert-outcomes",
          "message": "An expectation computed the same way as the code under test cannot fail on a wrong result.",
          "instructions": "Does a new or changed test in `hunk` compute its expected value using the same function, helper or formula as the code under test, instead of stating the expected outcome as a literal?",
          "criteria": {
            "true": "The `expect(...)` right-hand side calls the code under test or reimplements its formula to build the expected value.",
            "false": "The expected value is a literal or fixture constant; only inputs are constructed by helpers."
          },
          "appliesTo": [
            "**/__tests__/**/*.{ts,tsx}",
            "**/*.test.{ts,tsx}"
          ],
          "when": "expect\\("
        },
        {
          "id": "doc/docs/review/contributor-conventions/test-mocks-owned-module",
          "section": "tests/assert-outcomes",
          "message": "Mocking a module this repo owns tests the mock rather than the real interface.",
          "instructions": "Does a new or changed test in `hunk` `jest.mock` / `vi.mock` a module this repository owns (`@/…`, `wallet`, `nostr`) when the module under test could be exercised through its public interface with only system boundaries mocked?",
          "criteria": {
            "true": "An added `jest.mock('@/…')`, `vi.mock('wallet…')` or similar replaces a first-party module with a stub.",
            "false": "Mocks of system boundaries (network, native modules, SecureStore, AsyncStorage, time, randomness, the logger); mocks of heavy UI primitives in a render test of something else; existing mocks the hunk does not add."
          },
          "appliesTo": [
            "**/__tests__/**/*.{ts,tsx}",
            "**/*.test.{ts,tsx}"
          ],
          "when": "(jest\\.mock|vi\\.mock)"
        }
      ],
      "notChecked": [
        {
          "section": "Preamble",
          "reason": "Precedence of repository instructions, ADRs and user decisions is process guidance, not a per-hunk code condition."
        },
        {
          "section": "Preamble (links to hunch.config.ts, contracts.md)",
          "reason": "Cross-file references; the classifier cannot follow indirection to other documents."
        },
        {
          "section": "arch/owner (b) Nostr transport outside nostr/",
          "reason": "Duplicates the nostr/facade rule, which asks the same question with better scoping."
        },
        {
          "section": "a11y/controls — accessibilityRole",
          "reason": "Overlaps the accessible-name rule and is nearly always supplied by shared components; low added signal."
        },
        {
          "section": "state/shape — fields updated through separate interleaving set calls",
          "reason": "Requires reasoning about call ordering and consistency invariants across the store, not visible in one chunk."
        },
