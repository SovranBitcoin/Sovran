          "appliesTo": [],
          "when": "\\.pick\\(|\\.omit\\(|\\.partial\\(|\\.required\\(|\\.extend\\(|refine",
          "message": "`.pick`/`.omit`/`.partial` on a refined object throws in Zod 4."
        },
        {
          "id": "doc/docs/review/contributor-conventions/zod-async-refinement-sync-parse",
          "section": "zod/v4-api",
