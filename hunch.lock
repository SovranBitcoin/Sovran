      "hash": "a002fbced5c1c442db22ae9538b921ae04e90e62e3f147d2e41e8c1ab4837d0b",
      "rules": [
        {
          "id": "doc/docs/review/conventions-async-tests/race-loser-unhandled",
          "section": "async/race-loser",
          "message": "The losing side of a `Promise.race` may keep running and write state or fire timers after the race is decided.",
          "instructions": "Does `hunk` add a `Promise.race([` between real work and a timeout/fallback where the timer is never cleared once the work wins, or the losing work is neither cancelled nor prevented from writing state, storing a result or resolving a flow after the race is decided?",
          "criteria": {
            "true": "A new `Promise.race([...])` pairs an operation with a `setTimeout`-based deadline, and the timeout id is never cleared, or the slower side still calls a setter/persist/resolve when it eventually settles.",
            "false": "The timer is cleared in `finally`; the loser is cancelled via `AbortController` or `task.cancelAsync()`; its late result is dropped by a generation / `isStaleGeneration` / `cancelled` check; the deadline comes from `timeoutSignal` / `combineSignals` passed into `fetchJson` or `safeFetch`; a `setTimeout(resolve, 0)` yield with no deadline meaning; a payment whose late result is reconciled rather than ignored."
          },
          "appliesTo": [],
          "when": "Promise\\.race"
        },
        {
          "id": "doc/docs/review/conventions-async-tests/signal-not-forwarded",
          "section": "async/signal-dropped",
          "message": "A cancellation signal the function accepts is not passed to the calls it awaits, so callers cannot actually cancel the work.",
          "instructions": "Does `hunk` define or change a function that accepts `signal`, `AbortSignal` or `RequestControls` and then call `fetchJson`, `safeFetch`, a facade method or another signal-accepting function without forwarding that signal?",
          "criteria": {
            "true": "The function signature or options object takes `signal` / `AbortSignal` / `RequestControls`, and an awaited call inside it that has a signal parameter is invoked without it.",
            "false": "The signal is forwarded to every awaited call that accepts one; the inner call cannot take a signal (a native module, a Coco manager call) and its result is checked against the signal before use; the function takes no signal at all."
          },
          "appliesTo": [],
          "when": "signal|AbortSignal|RequestControls"
        },
        {
          "id": "doc/docs/review/conventions-async-tests/signal-unchecked-after-await",
          "section": "async/signal-dropped",
          "message": "State is written or the next network step starts after an await without re-checking whether the signal was aborted.",
          "instructions": "Does `hunk` add code in a signal-accepting function that, after an `await`, writes state or starts the next network step without checking `signal.aborted` / `throwIfAborted()` or an equivalent guard?",
          "criteria": {
            "true": "After an `await` inside a function that received `signal`/`AbortSignal`, the added code calls a setter, persists, or issues the next request with no abort/generation/cancelled check in between.",
            "false": "The post-await write is guarded by `signal.aborted`, `throwIfAborted()`, `isAbortError`, a generation id or a `cancelled` flag; a payment effect that must run to completion once started, with only its UI updates gated."
          },
          "appliesTo": [],
          "when": "signal|AbortSignal|RequestControls"
        },
        {
          "id": "doc/docs/review/conventions-async-tests/guard-before-await",
          "section": "async/guard-before-await",
          "message": "A re-entrancy guard taken after the first await or held in React state does not block the second concurrent invocation.",
          "instructions": "Does `hunk` guard an async action against re-entry with a flag that is set only after the first `await`, or that lives in React state (`if (busy) return; setBusy(true)`) or a Zustand field read from a render closure rather than in storage that updates immediately?",
          "criteria": {
            "true": "An async handler checks a guard and sets it via `setState`/`setBusy`/a store setter read from a render closure, or sets the guard only after an `await` has already happened.",
            "false": "A `useRef`, module variable or machine field checked and set in the same synchronous block before any `await`; `useSingleFlight` / `useKeyedSingleFlight` or the shared `Pressable` / `Button`; React state used only to render the disabled/busy look while a ref or state machine is the actual guard."
          },
          "appliesTo": [],
          "when": "(busy|Busy|inFlight|isRunning|loading|Loading|submitting|Submitting|locked|Locked|posting|Posting|sending|Sending|pending|Pending)"
        },
        {
          "id": "doc/docs/review/conventions-async-tests/guard-released-on-every-path",
          "section": "async/guard-released-on-every-path",
          "message": "A busy flag cleared only on the happy path can stay set forever after a throw or early return.",
          "instructions": "Does `hunk` set a busy, in-flight, locked or posting flag before awaited work and clear it with plain statements after the `await` (or in only some branches), so a thrown error or an early `return` between set and clear leaves the flag set?",
          "criteria": {
            "true": "The flag is set to true before an `await`, and the corresponding reset happens in ordinary trailing statements or inside only some branches, with no `finally`, while an early `return` or a potentially throwing call sits between.",
            "false": "The release is in a `finally` block; every exit path visibly clears the flag and the awaited calls return `Result` values and cannot throw; a stale-generation path that deliberately leaves the newer generation's flag untouched; a flag owned by a state machine whose transitions release it."
          },
          "appliesTo": [],
          "when": "(busy|Busy|inFlight|InFlight|locked|Locked|posting|Posting|isRunning|submitting|Submitting|loading|Loading)"
        },
        {
          "id": "doc/docs/review/conventions-async-tests/guard-covers-effect",
          "section": "async/guard-covers-effect",
          "message": "The single-flight guard is released while the detached effect it was meant to protect is still running.",
          "instructions": "Does `hunk` pass a handler to `useSingleFlight`, `useKeyedSingleFlight`, the shared `Pressable` / `Button`, or a hand-written busy guard, where the handler starts a pay, send, melt, mint, publish or other side effect with `void …`, an un-awaited call or a `.then(` chain it does not return, or releases the guard before the operation's pending record is durably written?",
          "criteria": {
            "true": "Inside a guarded handler, the main side effect is launched with `void fn()`, a bare un-awaited call or a `.then(...)` chain that is not returned, so the handler resolves first.",
            "false": "The handler awaits or returns the effect's promise; the effect is handed to an owner with its own re-entry guard (a payment machine event, `publishEvent`'s in-flight map); the detached work is not the guarded effect (haptics, logging, navigation, analytics)."
          },
          "appliesTo": [],
          "when": "useSingleFlight|useKeyedSingleFlight|onPress|onSubmit|void "
        },
        {
          "id": "doc/docs/review/conventions-async-tests/coco-listener-async",
          "section": "async/coco-listeners",
          "message": "An async Coco listener stalls the wallet operation that emitted the event, and a throw from it is silently swallowed.",
          "instructions": "Does `hunk` register a Coco manager listener (`manager.on(`, `manager.once(`, an `on('proofs:saved' | 'history:updated' | 'mint-op:…' | 'melt-op:…' | 'send:…' | 'receive-op:…' | 'mint:…')` handler) whose callback is an `async` function awaiting network, storage, database or Nostr work, or that can throw without catching and logging the failure itself?",
          "criteria": {
            "true": "The registered handler is declared `async` and awaits I/O inside, or returns a promise of such work, or performs a call that can throw with no internal `try/catch` that logs.",
            "false": "A synchronous handler that updates in-memory state; a handler that detaches its async work and handles its failure (`void load()`, `void (async () => { try … catch … })()`, a `.catch(` that logs through the logger); work that must finish before the operation continues and is documented as such."
          },
          "appliesTo": [
            "app/**/*.ts",
            "app/**/*.tsx",
            "wallet/**/*.ts",
            "wallet/**/*.tsx"
          ],
          "when": "\\.(on|once)\\("
        },
        {
          "id": "doc/docs/review/conventions-async-tests/unbounded-fanout",
          "section": "async/unbounded-fanout",
          "message": "One request per element of a user- or network-sized list opens as many concurrent sockets as the list is long.",
          "instructions": "Does `hunk` start one network, relay, mint or database request per element of a list whose size the user or the network controls (contacts, follows, relays, events, proofs, history entries, discovered mints) with `list.map(async …)` / `Promise.all` / `allSettled` and no chunking, slicing or concurrency limit?",
          "criteria": {
            "true": "A `Promise.all`/`allSettled` over `someList.map(async …)` issues a request per element, where the list comes from user data or a network response and there is no `slice`, chunk loop or concurrency pool visible.",
            "false": "Lists bounded by design (the user's trusted mints, a fixed relay set, a page capped by a schema `.max()` or a `slice(0, N)`); chunked loops; a bulk endpoint taking the whole list in one request; work behind a queue or pool that limits concurrency; no per-element request."
          },
          "appliesTo": [],
          "when": "Promise\\.all|allSettled|\\.map\\(async"
        },
        {
          "id": "doc/docs/review/conventions-async-tests/sleep-ignores-cancel",
          "section": "async/sleep-ignores-cancel",
          "message": "A poll or backoff loop can keep doing work after its owner cancelled, because cancellation is never re-checked after the wait.",
          "instructions": "Does `hunk` add a polling, retry or backoff loop that waits with `await new Promise((r) => setTimeout(r, …))` or a `sleep`/`delay` helper and then performs network, wallet or state work without re-checking an `AbortSignal`, generation id, `isActive()` callback or mounted/focused flag after each wake-up?",
          "criteria": {
            "true": "A loop awaits a bare timer promise or `sleep(...)`/`delay(...)` and, on the next iteration, fetches, writes state or calls the wallet with no cancellation/generation/mounted check after the wait.",
            "false": "The loop checks cancellation after every wait and before every effect; a bounded loop inside a wallet operation that must finish regardless of the screen and writes only to its own operation's record; test code; tooling under `app/codereview` and `app/scripts`."
          },
          "appliesTo": [],
          "when": "setTimeout|sleep\\(|delay\\("
        },
        {
          "id": "doc/docs/review/conventions-async-tests/check-then-act",
          "section": "async/check-then-act",
          "message": "A balance, proof set or quote read before an await may be stale when it is spent or persisted afterwards.",
          "instructions": "Does `hunk` read a balance, proof list, quote or operation state, active mint, unit or profile into a local, `await` something, and then spend, select, send, persist or decide using the pre-await value with no re-read, no lock or single-flight held across both steps, and no generation check?",
          "criteria": {
            "true": "A value read before an `await` is used after that `await` to spend, select proofs, send, persist or branch, and the chunk shows no re-read, lock, or staleness check in between.",
            "false": "The check and act happen inside one Coco or wallet operation that owns the lock (proof reservation, `sendLocked`, a prepared operation); the value is re-read or re-validated after the `await`; the snapshot is the deliberate identity of the flow, compared by `isStaleGeneration` or a profile-id check; display-only values."
          },
          "appliesTo": [
            "wallet/**/*.ts",
            "wallet/**/*.tsx",
            "**/{cashu,wallet,payment,payments,mint,mints,send,receive,melt,swap,balance,proofs}/**/*.ts",
            "**/{cashu,wallet,payment,payments,mint,mints,send,receive,melt,swap,balance,proofs}/**/*.tsx",
            "**/stores/**/*.ts",
            "**/stores/**/*.tsx"
          ],
          "when": "await"
        },
        {
          "id": "doc/docs/review/conventions-async-tests/intent-before-effect",
          "section": "async/intent-before-effect",
          "message": "An irreversible payment effect recorded only afterwards cannot be reconciled if the app dies mid-flight.",
          "instructions": "Does `hunk` perform an irreversible effect (melt, swap, send, token hand-off over NFC/BLE/Nostr, mint-quote payment) and only afterwards create the persisted record that identifies the operation, or create that record with a fire-and-forget write that is not awaited before the effect starts?",
          "criteria": {
            "true": "The irreversible call happens first and the `await`ed persist/insert of the operation record follows it, or the record write before the effect is un-awaited (`void save(...)`, a floating promise).",
            "false": "A pending or prepared record is awaited before the effect and updated after it; the effect runs inside a Coco operation that journals itself; records that are pure presentation (toasts, optimistic rows) whose loss costs nothing; idempotent reads."
          },
          "appliesTo": [
            "wallet/**/*.ts",
            "wallet/**/*.tsx",
            "**/{cashu,wallet,payment,payments,mint,mints,send,receive,melt,swap,nfc,nearPay}/**/*.ts",
            "**/{cashu,wallet,payment,payments,mint,mints,send,receive,melt,swap,nfc,nearPay}/**/*.tsx"
          ]
        },
        {
          "id": "doc/docs/review/conventions-async-tests/catch-cannot-catch-result",
          "section": "errors/catch-cannot-catch-result",
          "message": "Failure handling placed in a `catch` around a Result-returning call is dead code and the failure flows on down the happy path.",
          "instructions": "Does `hunk` wrap a call that returns `Result`, `ResultAsync` or `Promise<Result>` (`fetchJson`, facade reads, `openExternalUrl`, effects built with `ResultAsync.fromThrowable`) in `try/catch` and put the user-visible or state-changing failure handling only in the `catch`, with no `isErr()` / `match` branch on the returned value?",
          "criteria": {
            "true": "A Result-returning call sits inside `try`, the `catch` shows the error toast / sets error state, and the returned value is used without an `isErr()`, `isOk()` or `match` check.",
            "false": "The result is checked with `isErr`/`match` and the `try/catch` exists for other throwing statements in the same block; a `catch` that only guards programmer errors and rethrows; the wrapped calls genuinely reject (Coco manager calls, cashu-ts, native modules)."
          },
          "appliesTo": [],
          "when": "try\\s*\\{|catch\\s*\\("
        },
        {
          "id": "doc/docs/review/conventions-async-tests/one-error-channel",
          "section": "errors/one-error-channel",
          "message": "A function declared to return a `Result` can still throw, so callers written against its signature miss that failure.",
          "instructions": "Does `hunk` add or change a function whose declared return type is `Result<…>`, `ResultAsync<…>` or `Promise<Result<…>>` whose body can still throw or reject — a `throw` statement, or a throwing call (`JSON.parse`, `new URL`, `BigInt(`, a decoder, an awaited SDK or native call) not inside `try/catch` or a `fromThrowable` / `fromPromise` wrapper?",
          "criteria": {
            "true": "A function annotated `Result`/`ResultAsync`/`Promise<Result<…>>` contains an unguarded `throw`, or calls `JSON.parse`, `new URL`, `BigInt(`, a decoder or an awaited SDK/native call outside any `try`/`fromThrowable`/`fromPromise`.",
            "false": "The whole body is inside `try/catch` returning `err(…)`; every throwing call is wrapped; throws that signal programmer error only (`assertNever`, invariant checks on in-process values); functions that do not declare a `Result` return type."
          },
          "appliesTo": [],
          "when": "Result|ResultAsync"
        },
        {
          "id": "doc/docs/review/conventions-async-tests/default-hides-failure",
          "section": "errors/default-hides-failure",
          "message": "Collapsing an `Err` into 0, `[]` or `false` makes \"could not read\" indistinguishable from \"empty\".",
          "instructions": "Does `hunk` turn the failure of a read of a balance, amount, proof or transaction list, trust or permission flag, or backup/consent status into an ordinary value with `.unwrapOr(0 | [] | false | '' | {})`, `.orElse(() => ok(default))`, `.match(v => v, () => default)` or `isErr() ? default : value`, where that value is then shown, persisted or used for a decision?",
          "criteria": {
            "true": "A Result from such a read is collapsed to a neutral-looking default that is then rendered, stored or branched on, with no distinct unavailable state.",
            "false": "The default is a distinct \"unavailable\" state, `undefined` or `null` the UI renders as a placeholder; presentational fallbacks (an npub falling back to hex, an optional icon, a display label); the error is logged and the caller still receives a failure signal by another field."
          },
          "appliesTo": [],
          "when": "unwrapOr|orElse|\\.match\\(|isErr\\(\\)"
        },
        {
          "id": "doc/docs/review/conventions-async-tests/non-error-throwables",
          "section": "errors/non-error-throwables",
          "message": "A caught value that is not an `Error` is dropped or flattened to `\"[object Object]\"`, losing its fields.",
          "instructions": "Does `hunk` handle a caught value or rejected promise so that a non-`Error` throwable is dropped or flattened by accident — `if (e instanceof Error) { … }` with no `else`, `(e as Error).message`, `e.message` on `unknown`, or `e instanceof Error ? e.message : String(e)` feeding a value that code (not just display) relies on?",
          "criteria": {
            "true": "The catch path narrows to `Error` with no non-Error branch, casts the caught value to `Error` to read `.message`, or `String(e)`s it into a value used for logic, classification or storage.",
            "false": "The value goes through a house normaliser that keeps object fields (`errField`, `redactError`, `toError`, a named `classify*` reading `code`/`status`/`type`); the non-Error branch is handled explicitly (`typeof e === 'object' && e !== null && 'type' in e`); the string is only for display or as a log message alongside the error object; abort detection through `isAbortError`; a catch that discards detail on purpose for secrecy (a provider error may disclose credentials) and sends every value it does not recognise to a fixed, safe output."
          },
          "appliesTo": [],
          "when": "catch\\s*\\(|instanceof Error|unknown"
        },
        {
          "id": "doc/docs/review/conventions-async-tests/serialized-error",
          "section": "errors/serialized-error",
          "message": "A serialised or cloned `Error` loses its message, name, cause and prototype.",
          "instructions": "Does `hunk` serialise, persist or clone an `Error` (or an object holding a caught error under `error`, `cause`, `lastError`) with `JSON.stringify`, object spread, `structuredClone`, a Zustand `persist` field, AsyncStorage/SQLite text or a Nostr/HTTP payload, and later rely on its `message`, `name`, `cause`, `status` or `instanceof`?",
          "criteria": {
            "true": "A caught error or error-bearing object is passed through `JSON.stringify`, spread, `structuredClone` or written to persisted/transport storage, and the same code reads `message`/`name`/`cause`/`status` or checks `instanceof` on the round-tripped value.",
            "false": "The error is first mapped to a plain typed record (`{ kind, code, status, message }`) or through `errField` / `redactError`; the error object is passed to the logger itself; a fixed string code is stored instead of the error."
          },
          "appliesTo": [],
          "when": "JSON\\.stringify|structuredClone|persist|lastError"
        },
        {
          "id": "doc/docs/review/conventions-async-tests/error-subclass-name",
          "section": "errors/subclass-name",
          "message": "An `Error` subclass that never sets `name` reports `\"Error\"`, so name-based classifiers miss it.",
