          "message": "Payment sequencing or proof handling may be living in the app layer instead of wallet/.",
          "instructions": "Does a file under `app/` in `hunk` itself perform the computation of a payment — decide the order of mint, melt, swap or receive operations (prepare, verify, execute, recover), choose proofs or amounts to spend, poll wallet history to reconcile an operation, expand a route into executed legs, or loop or retry a payment call automatically — rather than calling a wallet API?",
